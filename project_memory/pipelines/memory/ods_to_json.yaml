# Reimport the review workbook into the staging review area.
#
# Staging is never authoritative: `make memory-diff-reimport` compares it with
# canonical JSON, and promotion into canonical remains an explicit, separate
# step.
io:
  input:
    kind: ods
    path: ./project_memory.ods
  output:
    kind: json_dir
    path: ./project_memory/staging
