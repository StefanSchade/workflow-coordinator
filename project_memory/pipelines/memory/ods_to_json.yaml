# Convert the Project Memory workbook back into flat JSON tables.
#
# This pipeline deliberately declares no output path. `make memory-import`
# always supplies a throwaway directory with `--out-path`, validates the
# complete result, and only then replaces canonical JSON as ordinary
# working-tree changes; nothing here may write canonical directly.
io:
  input:
    kind: ods
    path: ./project_memory.ods
  output:
    kind: json_dir
