# Render the canonical Project Memory tables into the editable workbook.
#
# Canonical JSON stays authoritative; the workbook is an alternate editable
# representation. Each canonical table becomes one sheet. No projection,
# matrix, or plugin step is used, so the reverse pipeline is an exact inverse.
# `make memory-roundtrip-check` overrides the output path to verify that
# without touching the maintainer's workbook.
io:
  input:
    kind: json_dir
    path: ./project_memory/canonical
  output:
    kind: ods
    path: ./project_memory.ods
