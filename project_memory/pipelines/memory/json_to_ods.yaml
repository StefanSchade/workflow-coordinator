# Render the canonical Project Memory tables into the review workbook.
#
# Canonical JSON stays authoritative; the workbook is an inspection and edit
# surface. Each canonical table becomes one sheet. No projection, matrix, or
# plugin step is used, so the reverse pipeline is an exact inverse.
io:
  input:
    kind: json_dir
    path: ./project_memory/canonical
  output:
    kind: ods
    path: ./project_memory.ods
