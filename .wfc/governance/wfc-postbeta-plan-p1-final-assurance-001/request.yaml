task:
  title: 'Post-Beta planning P1: final assurance of the plan'
  body: 'FINAL ASSURANCE of the accepted-in-parts post-Beta planning candidate docs/backlog/postbeta_plan_p1_adr_and_hardening.adoc
    (Run RUN-b49d10084a5e4a999461a3bcacdd91df, stopped awaiting_human_budget at 10 of 10 Hops after the last whole-plan broad
    review H008 and a later correction H009 that only the focused review H010 checked). Maintainer decision (2026-11-21):
    a fresh, independent whole-plan verification before the plan is adopted as the basis of the post-Beta programme. You get
    NO acceptance credit from any earlier review; re-derive everything from the repository. Read the plan completely, then
    docs/backlog/ROADMAP-POST-BETA-TO-RELEASE-BRIEF.adoc, docs/backlog/_open.adoc and the records the plan cites. Staged read-only
    material is under build/wfc/postbeta-inputs/ (verify digests; read PROVENANCE.txt for what is actually present). As Worker,
    (1) verify the plan against the repository at the current HEAD: every cited path, line range, symbol, count, commit and
    Run id; the done / partly done / obsolete / open classification of all backlog leaves (recount them); the dependency table
    and critical path (no cycles, no missing blocker, no parallelism claim that contradicts a dependency); that every proposed
    Commission has scope paths that exist or are new by design, a Hop budget with reasoning consistent with the plan''s own
    evidence, and acceptance expressed as a checkable command, test, file check or review verdict; that each AD record has
    question, options, evidence, consequences, recommendation, decider and blocked package; and that no authority, tag, release
    or decision is granted. (2) Correct the plan in place only where you prove a defect (minimal edits, each justified in
    the verification record); never restructure it and never change a recommendation. (3) Add one bounded note to the plan''s
    limits or risk section stating which Hop budgets and sequencing statements depend on the CURRENT caps (the Coordinator
    hard maximum of 20 in src/workflow_coordinator/model.py and the repository ceiling max_autonomous_hops: 10 in .wfc/config.yaml),
    because the maintainer intends to raise them (proposed 64 and 32) before the planned Commissions run; do not change any
    budget, only mark the dependency and say that budgets are to be re-derived after the caps change. (4) Write the verification
    record docs/warm_storage/concepts/wfc_postbeta_plan_p1_final_assurance_verification.adoc: method, what was checked and
    how, results, discrepancies found and corrected, and what you could not check (for example the agent sandbox cannot run
    pytest). The independent reviewer then re-verifies the whole final plan from scratch. A Worker never reports any Finding
    operation (resolve, residual or any other delta); only the independent reviewer opens and resolves Findings. The CommitIntent
    names every changed leaf individually, never directories; no agent Git writes.'
  acceptance: The verification record exists and honestly states method, results, corrections and limits; the plan renders
    with Asciidoctor, every cited path, symbol, count, commit and Run id has been verified, and defects found are corrected
    in place; the plan carries the cap-dependence note; no authority, tag or release decision is granted and no recommendation
    changed; an independent whole-plan broad review of the final text finds no blocking Finding; Coordinator task-check passed.
  withheld_authority: No edit of any existing record, the brief, src/, tests/ or governance/; the only files you may change
    are the plan, the verification record and the two review artifacts; no change of any recommendation or budget; no tag,
    release, push, merge, rebase or Runtime promotion; no decision taken on the maintainer's behalf.
  escalation_default: Escalate a real scope or authority conflict, or a question only the maintainer can decide; incomplete
    work alone is not blocked.
