task:
  title: 'Rework C: honest N12 tests and the sandbox-root qualification record'
  body: "GOAL. Close finding F4 of the independent Opus implementation review (`docs/warm_storage/post-beta-planning/wfc_execution_boundary_slice_a_opus_implementation_review.adoc`, finding F4 and its table\
    \ row) of the Execution Boundary Slice A: make two qualification tests honest and record the empirical sandbox-root measurement. Contract: `docs/backlog/FTR-WFC-EXECUTION-BOUNDARY-DISPATCH-INTEGRATION.adoc`\
    \ (exit criteria near its end: Layer 1 \"with the sandbox-root measurement N12 requires recorded either way\", and \"a qualification record exists that states, per claim, which layer established it\"\
    ).\n\nTHE DEFECT (re-verify by reading the two tests). Two \"measure rather than assume\" assertions cannot fail and record nothing: (1) `tests/integration/test_execution_boundary_bwrap.py::test_sandbox_root_remount_ro_does_not_disturb_writable_grants`\
    \ ends with `assert b'no_host_backing=0' in result.stdout or b'no_host_backing=1' in result.stdout`, i.e. it asserts that its own probe output is one of the only two values it can print; (2) `tests/integration/test_nested_claude_bwrap_qualification.py`\
    \ (the rewritten nested-bubblewrap case, `test_outer_boundary_reports_the_missing_proc_precondition_before_nested_bwrap`) asserts `result.returncode != 0` inside the `else` of `if result.returncode\
    \ == 0`. The docstrings and comments describe a measurement that nothing records.\n\nMAINTAINER DISPOSITION (binding; 2026-11-26).\n- Name tests and word comments and docstrings so that they claim nothing\
    \ that is not actually established (no suggested property the test does not prove).\n- Remove the tautological assertions. Keep the remaining meaningful assertions of the affected tests unchanged (the\
    \ writable-grant checks, the external-scratch check, the `overflowuid` diagnostic must never reappear, the outer marker checks, the nested marker check where the nested namespace is available, the final\
    \ not-in-host-scratch check).\n- The N12b measurement (\"with versus without `--remount-ro /`\") is a ONE-TIME QUALIFICATION MEASUREMENT under the current contract semantics, NOT a recurring regression\
    \ test. It was performed by the Level-1 operator outside any Worker sandbox on the development host and its actual result, including the relevant technical conditions, is documented in the qualification\
    \ record you write (below). Do NOT add a test that re-measures it as a regression test, and do NOT add infrastructure to persist measurement results and do NOT extend the productive WFC evidence mechanism\
    \ for this purpose. A re-qualification is required on relevant changes of the technical conditions (kernel, `bwrap` version) or of the mount model; say so in the record.\n- Keep the whole change narrow.\
    \ F4 justifies no new architecture component.\n\nTHE MEASUREMENTS (performed by the operator on 2026-11-26 on the development host `agent-vm`; real `bwrap`, unprivileged user namespaces; you cannot\
    \ repeat them in your Hop sandbox, so copy them faithfully and do not embellish).\nPlatform: Linux kernel `6.12.86+deb13-amd64`, `bubblewrap 0.11.0` (`bwrap --version`), `python3.13`, `/proc/sys/kernel/unprivileged_userns_clone\
    \ = 1`, user uid 1000. Method: the validated boundary of the N12 test (a repository with a writable grant `<repository>/writable`, a scratch mount at `/tmp`, an external scratch directory), run through\
    \ `execution_boundary.run` with the production `build_argv` (\"with\") and with the single line `args += ['--remount-ro', '/']` in `build_argv` neutralised in a throwaway checkout of the same commit\
    \ (\"without\"); the throwaway checkouts were deleted, production code was not changed. Probe script inside the view:\n  write to the writable grant, to `/tmp`, to `/tmp/s`; `mkdir /no-host-backing-here`\
    \ (the sandbox root); `mkdir /tmp/newdir`; `mkdir /usr/newdir`; write `/etc/hosts`.\nResults (identical in all rows except the one marked):\n  - write to the writable repository grant: ok with and without\n\
    \  - write to `/tmp` and to `/tmp/s` (external scratch): ok with and without\n  - `mkdir /tmp/newdir`: ok with and without\n  - `mkdir /usr/newdir`: refused with and without\n  - write `/etc/hosts`:\
    \ refused with and without\n  - `mkdir /no-host-backing-here` in the sandbox root: REFUSED WITH `--remount-ro /`, WRITABLE WITHOUT IT.\nConclusion to record: on this kernel and `bwrap` version `--remount-ro\
    \ /` is NOT recursive (the writable grants, the private `/tmp` and `/tmp/s` survive it) and it does close the sandbox root's base tmpfs, which would otherwise be writable (the stated residual of the\
    \ contract's sandbox-root row; writes there would not reach the host either way). The test `test_sandbox_root_remount_ro_does_not_disturb_writable_grants` establishes by assertion only that the grants\
    \ and scratch stay writable; whether the root is closed is established by this measurement, not by the test.\nSecond measurement (nested bubblewrap, the case of the rewritten nested test): on the same\
    \ host, with the repository located OUTSIDE `/tmp` (an operator home-directory temporary path), the inner `bwrap` of the fixture completed: return code 0, the nested marker was written (`nested-marker`\
    \ exists in the re-granted external scratch), no stderr. So on this host the \"available\" branch of the nested test is the one that runs; the \"not available\" branch has NOT been observed on any host\
    \ in this measurement. Replace the tautological `else` assertion by something that is true and checkable (for example assert the observed inner `bwrap` refusal diagnostic is non-empty and does not contain\
    \ `overflowuid`, or, if you cannot make a sound assertion for a branch nobody has observed, remove the `else` assertion and state in the comment and the record that this branch is unobserved) rather\
    \ than by anything vacuous. Note for the record: a repository located under `/tmp` is shadowed by the private `/tmp` in the view (the review's finding F8, out of scope here); the measurements above\
    \ used locations outside `/tmp`.\n\nTHE QUALIFICATION RECORD. Create `docs/warm_storage/post-beta-planning/wfc_execution_boundary_slice_a_layer1_qualification_record.adoc` as a short AsciiDoc document\
    \ (strict render clean, `link:` references that resolve): maturity and authority lines in the repository's style (informative record, not an authorization, not a maintainer acceptance, not Layer 2);\
    \ the platform data; the method; the measurement table above; the conclusion; the nested measurement; an explicit statement of what these Layer-1 measurements do NOT establish (no live provider qualification,\
    \ Layer 2 is not performed, no preventive-isolation claim); and the re-qualification trigger (kernel or `bwrap` change, or a mount-model change). It states per claim which layer established it for exactly\
    \ these two claims (sandbox-root closure: measured, not asserted by a test; nested availability: measured on this host only). In `docs/backlog/FTR-WFC-EXECUTION-BOUNDARY-DISPATCH-INTEGRATION.adoc` add\
    \ the minimum: a pointer to the record at the exit criterion that asks for it and for the N12 measurement, and a status note that the N12 sandbox-root measurement is now recorded (not that the exit\
    \ criteria are met: Layer 2 and the remaining criteria stay open). Do not touch other parts of the contract.\n\nOUT OF SCOPE (binding): findings F1, F2, F3, F5 (already reworked and integrated), F6\
    \ to F15 (kept open for a later explicit disposition), any change to `src`, any other test, any new test infrastructure, any change to the boundary behaviour, no `.wfc/config.yaml` change, no live provider\
    \ invocation, no push/tag/release/Runtime promotion.\n\nCHECKS (the Coordinator's task-check runs `ruff check .` and then `python -m pytest -q` with real `bwrap` after your Hop; run `python -m ruff\
    \ check .` yourself too and keep it clean: unused imports are the kind of residue that a rename or removal leaves behind). Strict render for every changed .adoc (`asciidoctor --safe-mode=safe -a assembled\
    \ -o /dev/null --failure-level=WARN <file>` prints nothing); `python3 scripts/wfc_doc_catalog.py generate` then `check` must not report more unresolved links or Project Memory misses than before (note\
    \ the baseline first); generated catalog output must not be left as a stray file. Your Hop sandbox cannot start `bwrap`, has a read-only `/tmp` and no network: you cannot run the two integration tests;\
    \ reason carefully and keep the change minimal. Apply the Front Door docs-sync convention only if a Front Door behaviour changed (none does here; say so in one sentence in your result).\n\nCOMMIT AND\
    \ INDEX DISCIPLINE (binding, mechanical). Use NO git command that writes: never `git add`, `git commit`, `git stash`, `git reset`, `git mv`, `git rm`, `git checkout -- <path>` or any other index or\
    \ history mutation; the index must remain untouched, so `git status --short` shows only unstaged working-tree changes when you finish. Your result's CommitIntent `subject` MUST contain the WorkItem\
    \ id and the current Hop id, for example `test(execution-boundary): remove tautological assertions and record the N12 sandbox-root measurement (WI-WFC-EXEC-BOUNDARY-REWORK-C-001, H001)` (use the real\
    \ Hop id). `commit_intent.paths` is a JSON array with exactly one plain repository-relative path per element: the changed or new leaves (expected: `tests/integration/test_execution_boundary_bwrap.py`,\
    \ `tests/integration/test_nested_claude_bwrap_qualification.py`, `docs/warm_storage/post-beta-planning/wfc_execution_boundary_slice_a_layer1_qualification_record.adoc`, `docs/backlog/FTR-WFC-EXECUTION-BOUNDARY-DISPATCH-INTEGRATION.adoc`);\
    \ derive it from `git status --short -uall` and compare the counts. Leave no stray file behind."
  acceptance: The two tautological assertions are removed, the affected tests and comments claim only what they establish, all other assertions of those tests are unchanged, no test is deleted or skipped;
    the qualification record exists with platform data, method, measurement table, conclusion, nested measurement, the explicit non-claims and the re-qualification trigger; the contract carries the pointer
    and the status note and nothing else changed there; nothing in `src` changed; `ruff check .` clean; strict render prints nothing; the doc catalog check shows no additional unresolved links; the full
    required suite passes; CommitIntent array has one plain path per element; Coordinator task-check passed.
  withheld_authority: No `src` change; no other test change; no new test, infrastructure or persistence of measurements; no productive evidence-mechanism change; no `.wfc/config.yaml`, governance/, `.github/`,
    Makefile, pyproject, scripts or examples change; no F1/F2/F3/F5/F6-F15 work; no claim of Layer 2, live qualification or preventive isolation; no push, tag, release, publication or Runtime promotion;
    no self-acceptance; no repetition or embellishment of the measurements beyond what is stated.
  escalation_default: Escalate a needed file outside the scope or a measurement that contradicts what is stated. Do not silently substitute models. Incomplete work alone is not blocked.
