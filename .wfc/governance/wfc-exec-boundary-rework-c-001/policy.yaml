schema_version: 3
policy_id: consumer-standard
revision: v1
scope:
- workflow-coordinator
governance_paths:
- .wfc/governance
work_item_scope_ceiling:
- src
- tests
- scripts
- docs
- README.md
- pyproject.toml
- Makefile
- examples/consumer-demo
max_autonomous_hops: 32
actions:
- edit
- commit
- review
evidence_commands:
  task-check:
    argv:
    - sh
    - -c
    - python -m ruff check . && python -m pytest -q
    timeout_seconds: 900
