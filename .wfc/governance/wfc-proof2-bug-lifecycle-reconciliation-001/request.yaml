program:
  id: robust
  revision: v1
task:
  title: Reconcile stale Lifecycle text in four accepted BUG records
  body: 'Four BUG records in docs/backlog carry an ''Execution and acceptance reconciliation (2026-11-10)'' section that records
    implementation and independent acceptance, but their final ''== Lifecycle'' section (and, where present, an ''Authorized
    correction'' or ''Not yet done'' style passage) still states the pre-implementation situation, for example ''This BUG
    is open ... No implementation has been made and no Run has been launched''. Reconcile only that stale text, for exactly
    these records: BUG-WFC-FINDING-DELTA-COMPATIBILITY-SHIM, BUG-WFC-OPERATOR-DIAGNOSTIC-PROPAGATION, BUG-WFC-EVIDENCE-FAILURE-DIAGNOSTICS,
    BUG-WFC-IMMUTABLE-FINDING-ECHO. For each, read the record, its own reconciliation section and the cited commits (git log/show
    are read-only evidence; verify every hash, Run id and path you cite actually exists) and rewrite the stale Lifecycle statements
    into a short factual present-state paragraph that points to the existing reconciliation section and states what remains
    open (the maintainer''s product lifecycle disposition and any Runtime promotion). Do not change the Status line, do not
    mark any record resolved/closed/accepted-by-maintainer, do not invent dates, hashes or outcomes, do not edit historical
    sections that are explicitly labelled as describing the state when written, and do not change any other file. A Worker
    never reports any Finding operation (resolve, residual or any other delta); only the independent reviewer opens and resolves
    Findings. The CommitIntent names every changed leaf individually, never directories; no agent Git writes.'
  acceptance: In each of the four records the Lifecycle section no longer contradicts the record's own reconciliation section;
    every cited hash/Run id/path is verified to exist; Status lines and all other sections are unchanged; no record is marked
    resolved or closed; independently accepted with no blocking Findings and Coordinator task-check passed.
  withheld_authority: No change to any Status line, no closure or maintainer-disposition claim, no edit outside the four BUG
    records and the two review artifacts, no source or test change, no push, merge, rebase, Runtime promotion or tag.
  escalation_default: Escalate only a real scope or authority conflict; incomplete work alone is not blocked.
