task:
  title: One scripted release-preparation commit and two version-consistency guards (slice R1)
  body: 'GOAL. Implement slice R1 of the accepted Beta-2 release-streamlining plan: one scripted release-preparation command plus two consistency guards, as specified by `docs/backlog/FTR-WFC-RELEASE-PREPARATION.adoc`.
    The FTR is the specification (problem, chosen direction, file-exact scope, the three chapter-4 line groups this slice owns, design: the surface list, refusals, idempotence, the two guards; acceptance
    criteria; required tests; risks; execution notes; withheld authority). Read it completely, and read `docs/backlog/beta2_release_streamlining_plan.adoc` sections R1, `ch04-ownership` and `decisions-taken`.
    Where this task text and the FTR differ, the FTR governs and you report the difference.


    DECISIONS ALREADY TAKEN (do not reopen). FTR decision D2 (= plan decision D4, maintainer 2026-11-25): the chapter 9 "What was verified" literals are records and stay; relax `tests/architecture/test_consumer_tutorial_pages.py`
    to assert that a version is named, not that it is the current one, and leave the five tutorial lines untouched; that test file is in scope. FTR decision D1: keep C1''s deliberate test literal in `tests/architecture/test_bp1_identity.py:41`;
    the tool owns it as a `version_literal` site. FTR decision D3: the target is `make release-prepare`, beside `release-check` and `dist-audit`. Chapter 4 has already been reduced to its steady state by
    slice R2 (integrated): it states the preparation command as PLANNED; this slice retires exactly the three line groups the FTR names (the runbook''s prepare step, the G1 row and its step-1 enumeration,
    the runbook''s preflight sentence) and nothing else in the chapter. NOTE for the gate list: slice R5 will later add gate G9; do not anticipate it.


    DO. Everything the FTR''s acceptance criteria and required tests demand, in particular: `scripts/wfc_release_prepare.py` (new) with the enumerated surface list (every version-bearing site found by YOUR
    OWN fresh grep of the repository, including the Agent Skill sources `SKILL.md` and `references/*.md`, README links, chapter 9 quickstart pins and install pins, release-notes heading, `pyproject.toml`,
    `implementation_identity.py`, the test literals the FTR lists; the FTR''s list is a starting point and must be re-verified against HEAD, report any site it misses or wrongly includes), explicit refusals,
    idempotence, and a single explicit invocation that touches only enumerated files; `scripts/wfc_release_check.py` extended so a `blob/v<x>/` link into this repository must name the version being released
    and nothing else about it changes; the `Makefile` target; the unit tests for the tool on synthetic trees; `tests/unit/test_release_version_surface.py` (new) with the two guards against this checkout
    (pyproject version equals `implementation_identity.VERSION`; every tag-pinned README link names that version) which must FAIL before the slice and pass after; the relaxed tutorial-pages assertion. The
    slice itself changes NO version literal and adds no dependency. Apply the Front Door docs-sync convention (`docs/developer_guide/ch03_engineering_conventions.adoc`, `frontdoor-docs-sync`): no Front
    Door behavior changes; the Agent Skill texts are subjects of the surface list; record the check and its answer. Record what you did, the surface-list verification (grep evidence), each guard''s before/after
    proof, and the checks you ran in a compact `docs/warm_storage/post-beta-planning/wfc_release_preparation_verification.adoc`.


    WITHHELD FOR EVERY HOP: no change to `.github/`, `.wfc/`, `governance/`, `pyproject.toml`, `src/workflow_coordinator/` or any version literal; no new dependency; no weakened or deleted test (the one
    relaxation named above is the only assertion change in the tutorial-pages test, say so); no edit to a historical record; no push, tag, release, publication, TestPyPI/PyPI action, GitHub setting or credential;
    no Runtime promotion; no self-acceptance. A file outside the declared scope that proves necessary is a scope question for the maintainer (stop and name the file and why), not a reason to widen. The
    tool writes the tree only when explicitly invoked; `release-check` stays read-only.


    ENVIRONMENT: the Coordinator''s task-check runs the full required suite (`python -m pytest -q`) after your Hop with verified offline inputs; your sandbox may lack them, so do not claim full-suite counts
    you did not measure. Run targeted files with `--wfc-partial` plus explicit paths and say exactly what you ran. `python -m ruff check .` and the format check are the lint gate (`make lint`, `make format-check`).
    Strict render `asciidoctor --safe-mode=safe -a assembled -o /dev/null --failure-level=WARN <file>` must print nothing for each changed .adoc; `python3 scripts/wfc_doc_catalog.py generate` then `check`
    must not report more unresolved links or Project Memory misses than before your change (note the baseline before the first edit; today 83 and 4). Try the tool on a SCRATCH COPY of the tree, never on
    the working tree you commit from, and leave no stray file, generated catalog or `__pycache__` behind.


    COMMIT MECHANICS (binding): no git command that writes (no add, mv, rm, reset, stash, commit); the index stays untouched; `commit_intent.paths` is a JSON array with exactly one plain repository-relative
    path per element (every new, modified or deleted leaf individually; no sentence, count, glob or directory); derive it from `git status --short -uall` and compare the counts before you finish. Never
    put untracked /dev/null-like wrapper entries into the CommitIntent. A Worker never reports any Finding operation; only the independent reviewer opens and resolves Findings.


    REVIEW FOCUS (independent reviewer, whole candidate, by your own execution): the surface list is complete and exact (re-derive it yourself from the repository, find the site the Worker missed); running
    the tool on a scratch copy sets the version in every enumerated site and nowhere else and is idempotent; the refusals really refuse; `release-check` stays read-only and passes on today''s tree for the
    tag-pinned assertion; both guards fail before the slice and pass after (verify by execution against the pre-slice tree); the tutorial-pages relaxation weakens nothing else; only the three chapter-4
    line groups changed; no version literal changed; every statement about current behavior is verified against the files.'
  acceptance: All acceptance criteria and required tests of FTR-WFC-RELEASE-PREPARATION are met and evidenced; the surface list is verified against a fresh grep of the repository; the tool is idempotent,
    refuses as specified, writes only enumerated files and was exercised on a scratch copy; release-check gains only the tag-pinned README assertion and stays read-only; the two guards fail before and pass
    after; the tutorial-pages assertion is relaxed as decided and nothing else is weakened; only the three chapter-4 line groups changed; no version literal, .github, .wfc, governance, pyproject or src
    change; strict render prints nothing; doc catalog shows no additional unresolved links; the full required suite and quality gates pass; the independent whole-candidate review accepted with no blocking
    Finding; CommitIntent array has one plain path per element; Coordinator task-check passed.
  withheld_authority: No change to .github/, .wfc/, governance/, pyproject.toml, src/workflow_coordinator/ or any version literal; no new dependency; no weakening or deletion of tests beyond the single
    decided relaxation; no edit of historical records; no push, tag, release, publication, TestPyPI/PyPI action, GitHub setting or credential; no Runtime promotion; no self-acceptance.
  escalation_default: Escalate a needed file outside the scope, a version-bearing site that cannot be handled mechanically, and missing required evidence. Do not silently substitute models. Incomplete work
    alone is not blocked.
