schema_version: 1
commission_id: wfc-postbeta-plan-p1-001
work_item_id: WI-WFC-POSTBETA-PLAN-P1-001
authority_source: Maintainer authorizes planning Run P1 (reconciliation, ADR plan, hardening matrix) after Variant 1 of 2026-11-21,
  through the product Front Door, up to ten Hops; planning only; no push, no Runtime promotion, no tag.
program:
  id: robust
  revision: v1
task:
  title: 'Post-Beta planning P1: reconciliation, ADR plan and hardening matrix'
  body: 'This is a PLANNING Commission: it produces a plan document and changes nothing else. Read docs/backlog/ROADMAP-POST-BETA-TO-RELEASE-BRIEF.adoc
    completely first (it is a dated, non-authorizing input), then docs/backlog/_open.adoc, docs/backlog/beta1_productization.adoc,
    docs/backlog/beta1_execution_plan.adoc and the records you cite. Reconcile the brief with the current repository: label
    each obsolete, contradicted or unverifiable statement instead of silently rewriting it, and never edit the brief or any
    existing record. Shift-left rule: spend the effort here so that the later Commissions can run fast; every proposed Commission
    needs scope paths, a Hop budget with reasoning, dependencies, testable acceptance, non-goals and an authorization boundary,
    verified against actual files (cite paths and line ranges; verify every count and symbol before you state it, as the BP7
    planning reviews found misattributed functions and unfulfillable acceptance criteria). Staged read-only reference material
    is under build/wfc/postbeta-inputs/ (see its PROVENANCE.txt and MANIFEST.sha256; verify the digests before use; it is
    ignored by Git and must not be edited or committed). beta_runs_facts.json lists the archived Beta Runs (status, Hops,
    phases, stop reasons). Facts you may rely on without re-deriving: Beta-1 packages BP1-BP9 are independently accepted at
    Run level; the legacy Harness is retired; the Runtime is promoted to 4af5927; DG-4 stands (cutover before the tag); the
    0.1.0b1 tag is NOT set by this plan and no Operator or Commission may set it; the maintainer-owned live per-adapter qualification,
    the Claude record reconciliation, DG-6, product-closure records and the push are outside every Commission; the product
    name stays WFC. Maintainer direction for this planning work (2026-11-21), binding on the plan''s structure: (1) DEPENDENCIES:
    give an explicit dependency table or graph over every proposed Commission and gate (what blocks what, what may run in
    parallel, the critical path, and which dependency is a maintainer decision or a human-only action), each dependency verified
    against real files or records; (2) CONCRETE ACCEPTANCE: every proposed Commission states acceptance as checkable criteria
    (a command with its expected result, a file or navigation check, a named test, or a named review verdict), never as prose
    such as ''documentation is improved''; (3) ALREADY-DONE WORK: before proposing anything, classify every item the brief
    or the backlog mentions as done, partly done, open or obsolete, with the evidence (commit, Run id, Evidence archive, accepted
    record); for example much of Beta closure, the Harness retirement, the consumer quickstart, the lifecycle-rotation item
    and parts of the documentation curation are already done or recorded, and the plan must not re-plan them; (4) REMAINING
    ARCHITECTURE DECISIONS: work out each remaining architecture decision as a short decision record (question, options, evidence
    in the repository, consequences, your recommendation, who decides, and which package it blocks), separate from operational
    or release decisions, so the maintainer can decide them one by one. Present decisions the maintainer must take as a short
    numbered list with a recommendation each; do not treat them as settled. A Worker never reports any Finding operation (resolve,
    residual or any other delta); only the independent reviewer opens and resolves Findings. The CommitIntent names every
    changed leaf individually, never directories; no agent Git writes. Produce docs/backlog/postbeta_plan_p1_adr_and_hardening.adoc
    covering brief sections 3, 4 and the first three planning outputs of section 8: (A) a reconciliation table of the brief
    against current HEAD and accepted Run evidence; (B) the ADR plan on workflow generality versus closed, versioned workflow
    programs: the exact decision questions, alternatives, evaluation criteria, the evidence in the repository that bears on
    each (for example the closed programs in the consumer compiler, the withheld direct@v1, the phase-scoped result-schema
    record, and the Finding-authority stops visible in beta_runs_facts.json), what the ADR Commission must produce, how it
    is independently reviewed, and the maintainer decision point before any hardening change; (C) a hardening traceability
    matrix over ALL open BUG, FTR and TECH-DEBT records in docs/backlog (finding or pain point, severity and recurrence with
    evidence, candidate solution, dependencies, testable acceptance, scope, non-goals, and what the ADR outcome would change),
    a justified shortlist for 2-4 hardening Commissions with Hop budgets and an explicit rejected or deferred list; (D) the
    open maintainer decisions for these areas with recommendations. Keep the document precise rather than long.'
  acceptance: The plan exists, renders with Asciidoctor, and every path, symbol, count and commit it cites was verified against
    the repository; the reconciliation labels obsolete or contradicted brief statements; the matrix covers every open BUG,
    FTR and TECH-DEBT record; each proposed Commission has scope, Hop budget with reasoning, dependencies, testable acceptance,
    non-goals and an authorization boundary; no authority, tag or release decision is granted; independently accepted with
    no blocking Findings and Coordinator task-check passed. The plan contains the dependency table, checkable acceptance for
    every proposed Commission, the done/partly/open/obsolete classification with evidence, and one decision record per remaining
    architecture decision.
  withheld_authority: No edit of any existing record, the brief, src/, tests/ or governance/; no implementation; no ADR text
    beyond the plan for it; no tag, release, push, merge, rebase or Runtime promotion; no decision taken on the maintainer's
    behalf.
  escalation_default: Escalate a real scope or authority conflict, or a question only the maintainer can decide; incomplete
    work alone is not blocked.
scope:
- docs/backlog/postbeta_plan_p1_adr_and_hardening.adoc
- docs/warm_storage/concepts/wfc_postbeta_plan_p1_broad_review.adoc
- docs/warm_storage/concepts/wfc_postbeta_plan_p1_focused_review.adoc
personas:
  worker: 'Careful planning engineer: ground every claim in the repository, label obsolete or contradicted statements instead
    of rewriting them, and write a plan an independent Worker can execute without guessing.'
  independent_reviewer: 'Fresh adversarial reviewer: verify every cited path, commit, count and claim against the repository,
    find missing dependencies, unfulfillable acceptance criteria and hidden scope, and check that no authority is granted;
    report material defects only.'
