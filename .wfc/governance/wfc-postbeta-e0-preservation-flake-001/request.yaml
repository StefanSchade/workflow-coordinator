authority_source: 'Maintainer order of 2026-11-22 (P3 release engineering, MD-5: a deterministic complete required suite is
  a prerequisite of any CI release gate); package E0 of the P3 plan; not a G0 declaration, no release, tag or push; Sonnet
  worker and Opus reviewer through the product Front Door, up to eight Hops.'
program:
