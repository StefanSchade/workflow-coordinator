authority_source: 'Maintainer authorization of 2026-11-23 (post-Beta implementation of the consumer surface and the Agent
  Skill): Consumer Tutorials slices S2 and S3 (combined), as specified by the named FTR; bounded robust@v1 Commission with
  Claude Sonnet worker and independent Claude Opus (high) reviewer; no push, tag, release, publication or Runtime promotion.'
program:
  id: robust
  revision: v1
task:
  title: 'C: Consumer Tutorials S2 and S3 -- overview, three tutorials, quote and wording guards, pointers'
  body: 'Implement slices S2 ("Overview, Tutorial 1 and Tutorial 2") and S3 ("Tutorial 3 and closing checks") of docs/backlog/FTR-WFC-CONSUMER-TUTORIALS.adoc
    in one bounded Commission (the maintainer allowed combining them because they share the same chapter files and tests).
    Slice S1 of that FTR (link rule, eleven repairs, link guard, README lead-ins) and both slices of the demo kit (examples/consumer-demo/
    with make_workspace.py, rehearse.py, scripted_provider.py, seed/, requests/, scenarios/) are integrated, as are the Agent
    Skill slices S1 and S2 (the `wfc skill` command and the quickstart''s "install the agent skill" step). READ FIRST and
    treat as the specification: that FTR in full, especially `Chapter 9 after the change`, `00_overview.adoc`, `The tutorial
    page contract`, the three tutorial sections, `Quote guard`, the invariants SI-1 to SI-6, acceptance criteria AC-2 to AC-9,
    `Practical tests` and `Implementation sequence` S2 and S3. The maintainer accepted the recommended decisions: chapter
    9 is the tutorial home (D1), no mandatory live-provider tutorial gate (D2: no live Run is performed in this Commission
    and none is claimed), the chapter title becomes "Consumer quickstart and tutorials" with directory name and anchors kept
    (D3), the link guard covers the Operator Manual (D4). THE KIT IS THE SOURCE OF TRUTH: read examples/consumer-demo/ completely
    (README.md, make_workspace.py, rehearse.py, the seed, the request templates, the scenario files) and tests/integration/test_consumer_demo_kit.py
    before writing; every file name, command, option, layout and output in the pages must be what the kit and the real `wfc`
    of this tree actually do. Where the FTR text and the implemented kit differ in a detail (for example an output line),
    the page shows what is real and you say so in your summary.


    DO: (1) docs/operator_manual/ch09_consumer_quickstart/00_overview.adoc (new, anchor `consumer-overview`) with the content
    and order the FTR prescribes: what a Run is with a link to the orientation chapter; the two commands; the workspace map
    as a literal block and the six-row table, each row linking to the owning manual section; the section on rehearsal versus
    live Run; the tutorial table. (2) 02_first_run_example.adoc revised as Tutorial 1 (file name and every existing anchor
    kept, the explanatory sections `Plan, authorization, run, and archived evidence` and `Why the check must pass before and
    after` kept with their anchors; the repository described becomes the kit''s `greeter`; task and request are `t1-hello-page`;
    a rehearsal section with real output). (3) 03_tutorial_program_change.adoc (new, anchor `tutorial-program-change`, scenario
    and request `t2-farewell`) with the four additions the FTR lists, the boxed warning about a check that leaves files Git
    does not ignore, the `What to look at` items and the plain `What may differ` statement. (4) 04_tutorial_stops.adoc (new,
    anchor `tutorial-stops`) with the two rehearsals `t3-probe-refusal` and `t3-scope-stop`, the section `What the human decides`
    without inventing procedure, and the live note for the scope stop. (5) Every tutorial has the seven sections of the page
    contract in the prescribed order and headings; the live pattern is shown WITHOUT `--yes`, inside the demo workspace, in
    a fresh worktree, the Codex variant given once in Tutorial 1, the three overrides repeated for `independent_reviewer`
    under `robust@v1`; each `What was verified` section names the WFC version, which commands were executed for the page and
    which were not, and states that no live Run was performed for it. (6) _chapter.adoc: title "Consumer quickstart and tutorials",
    the anchor `consumer-quickstart-chapter` kept, introduction and include list in the order 00, 01, 02, 03, 04; 01_quickstart.adoc:
    exactly one pointer to the overview and nothing else. Every new leaf follows the manual''s leaf pattern (guarded standalone
    title block with `:operator-docs: ../..` and the Maturity/Authority(informative)/Updated/Owns lines, one top-level `==`
    section with an explicit anchor) and the link rule (cross-file references use `link:`). (7) Quote guard: a page quotes
    a kit file only in a listing block immediately preceded by `// kit: <path relative to examples/consumer-demo>`; tests/architecture/test_tutorial_kit_quotes.py
    finds each such block under the chapter and asserts byte equality with the named file apart from one trailing newline,
    fails on a missing file, and requires at least the three task documents and the three request templates to be quoted this
    way (AC-5). (8) tests/architecture/test_consumer_tutorial_pages.py with the wording checks of AC-8 (`--yes` occurs in
    no shell block of the chapter; every block containing `REHEARSAL` lies in a section whose heading contains "Rehearse"),
    the seven-section contract per tutorial (AC-7 as far as it is mechanical) and the anchor inventory of AC-9 as a fixed
    list (every anchor that existed in 01_quickstart.adoc and 02_first_run_example.adoc before this change still exists; take
    the list from `git show HEAD:<file>`). (9) Pointers: the command index in docs/operator_manual/ch08_examples/02_command_flow.adoc,
    the chapter 9 entry in docs/README.adoc, one entry for the kit and the tutorials in the existing `0.1.0b2 -- planned`
    section of docs/release_notes/release_notes.adoc (the released `0.1.0b1` section is frozen and must stay byte-identical;
    no release date, no qualification claim), examples/consumer-demo/README.md''s pointer to the tutorials. (10) README.md,
    `Where to start`: the first lead-in now points to the chapter 9 overview page, the second to the quickstart and the three
    tutorials, the third additionally to the quickstart''s agent-skill install step; every link stays absolute and pinned
    exactly like the existing ones (`https://github.com/StefanSchade/workflow-coordinator/blob/v0.1.0b1/...`; the pages exist
    on main and the pin is re-set with the version at release time); nothing else in the README changes. TRANSCRIPTS (AC-6):
    produce every rehearsal transcript by actually running the kit against this working tree in a temporary directory outside
    the repository (make_workspace.py, then rehearse.py per scenario, with the working-tree `wfc` wrapper tests/fixtures/bp9/wfc_entry.py
    as the integration test does, a temporary HOME and a TMPDIR outside the repository); show real, abridged output; classification,
    exit code, Hop count and commit subjects in the pages must match what you observed; abridge with a visible marker, never
    invent a line; replace machine-specific absolute paths by `~/wfc-demo`-style placeholders and say that you did. If your
    sandbox cannot run a rehearsal, stop and say so rather than writing a transcript from the scenario files. SAFETY OF WORDING:
    no page presents a rehearsal as evidence of what a model does, states or implies that a model, an adapter or a subscription
    is qualified, sufficient or free (cost statements link to the cost section of chapter 10), tells the reader to push, tag,
    edit `.wfc/` state or the Evidence repository, commit inside a Run''s worktree or resolve a stop by editing files in place,
    or states a rule of its own (every "must" is followed by a link to the owning manual section). CHECKS to run and record:
    the new tests and the existing guards (test_manual_standalone_links.py, test_quickstart_commands.py, test_consumer_demo_kit.py)
    targeted with `--wfc-partial`; AC-2 by a throw-away script (not committed) rendering each leaf of chapters 9 and 10 standalone
    and reporting in-page links to ids the page lacks; AC-3, the documentation gate command of .github/workflows/release.yml;
    AC-4, the README result of `python3 scripts/wfc_release_check.py`; the strict render of docs/README.adoc and docs/release_notes/release_notes.adoc;
    the catalog check; `python -m ruff check .`.


    ENVIRONMENT: the Coordinator''s task-check runs the full required suite (`python -m pytest -q`) after your Hop with verified
    offline inputs; your own sandbox may lack them, so do not claim full-suite counts you did not measure. Find a Python that
    has pytest and PyYAML (`python -m pytest --version`, else `python3`); run targeted test files with `--wfc-partial` plus
    explicit paths (the repository''s explicit marker for a partial run) and say exactly what you ran. `python -m ruff check
    .` is the lint gate (`make lint`). The strict documentation render is `asciidoctor --safe-mode=safe -a assembled -o /dev/null
    --failure-level=WARN <file>` and must print nothing. `python3 scripts/wfc_doc_catalog.py generate` then `check` must report
    no additional unresolved link or Project Memory miss (currently 83 and 4).


    WITHHELD FOR EVERY SLICE: no change to adapters, the reducer, admission, the Trusted Commit, existing subcommands'' behaviour
    or output, the release workflow (.github/), the version literals (pyproject.toml version, implementation_identity.VERSION),
    governance/ or archived review records; no new runtime dependency; no push, tag, release, publication, Runtime promotion
    or provider call beyond this Run''s own role sessions; no write to any real agent configuration or to the real HOME. A
    file outside the declared scope that proves necessary is a scope question for the human (stop and say which file and why),
    not a reason to widen or to work around.


    NOTE: `git status --short -uall` in an agent worktree may list about 22 untracked /dev/null-like entries injected by the
    wrapper; they are not your output, never put them in the CommitIntent. A Worker never reports any Finding operation (open,
    resolve, residual or any other delta); only the independent reviewer opens and resolves Findings. COMMIT MECHANICS (binding):
    no git command that writes (no add, mv, rm, reset, stash, commit); the index stays untouched; `commit_intent.paths` is
    a JSON array with exactly one plain repository-relative path per element (every new, modified or deleted leaf individually;
    no sentence, count, glob or directory); derive it from `git status --short -uall` and compare the counts before you finish;
    state counts in the summary, never in the array. Leave no stray file behind (no `__pycache__`, build output or scratch
    inside the repository that Git does not ignore).'
  acceptance: Chapter 9 has the overview leaf, the revised Tutorial 1, Tutorial 2 and Tutorial 3, the renamed chapter file
    with the include list in order and the one pointer in the quickstart; every tutorial has the seven contract sections and
    a truthful `What was verified` section naming the WFC version and what was and was not executed, with no live Run claimed
    (AC-7); every rehearsal transcript was produced by running the kit against this tree and matches in classification, exit
    code, Hop count and commit subjects (AC-6); the quote guard passes over at least six kit quotes and fails on a missing
    or diverging file (AC-5); the wording checks pass and SI-1 to SI-6 hold (AC-8); every prior anchor of 01_quickstart.adoc
    and 02_first_run_example.adoc still exists (AC-9); each leaf of chapters 9 and 10 renders standalone without a dead in-page
    link (AC-2); the documentation gate exits 0 without output (AC-3); the README carries only absolute, tag-pinned links
    under the three lead-ins (AC-4); the command index, the authority index, the kit README and the planned release-notes
    section carry their pointers and the released 0.1.0b1 section is byte-identical; the standalone-link guard, the quickstart
    command guard and the kit tests stay green; catalog check not worse; the full required suite is green; CommitIntent array
    one plain path per element; independently accepted with no blocking Finding and Coordinator task-check passed.
  withheld_authority: No change to the kit's code, seed, requests or scenarios (only examples/consumer-demo/README.md may
    gain its pointer), to src/, scripts/, pyproject.toml, the Makefile, the release workflow, chapter 10, the quickstart beyond
    the one pointer, any normative section of the manual, or the released 0.1.0b1 release-notes section; no live provider
    Run, no claim of provider or model qualification; no published HTML, slides, screenshots or recordings; no Level-1 or
    Agent Skill tutorial.
  escalation_default: Escalate a conflict between the FTR and the implementation or the CLI (name it; do not resolve it by
    guessing), a needed file outside the scope, or a requirement that would change product semantics or a withheld authority;
    incomplete work alone is not blocked.
