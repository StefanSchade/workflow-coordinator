task:
  title: 'Beta-2 O4: one deterministic Run-checkout preparation command with a declared preparation hook'
  body: 'GOAL. Implement plan slice O4 (decision D4, Option A): ONE deterministic Front Door command that prepares a fresh Run checkout, so the operator no longer creates worktree, scratch directory, virtual
    environment and launch environment by hand. Read the revision section of `docs/backlog/beta2_operator_efficiency_plan.adoc`, the slice `[[o4]]` (its ''Acceptance (verifiable)'' list is BINDING and is
    not repeated here), the record `docs/backlog/FTR-WFC-RUN-CHECKOUT-PREPARATION.adoc` (problem, boundaries, direction), AD-5 in `docs/technical_model/ch04_target_and_alternatives/03_adr_closed_versioned_workflow_programs.adoc`
    (its named remedy is exactly this automation), and friction entries 4, 6, 12, 17, 20 and 21.


    BINDING DECISION D4. Automate the preparation; NO destructive clean-up (no removal of any checkout, branch, worktree or directory by this command). The design must state the RESPONSIBILITY AND TRUST
    BOUNDARIES of any consumer-specific preparation hook explicitly. The one-Run-per-checkout invariant is unchanged: the command refuses, by name, any path whose checkout already carries a journal/lifecycle;
    it makes a fresh checkout cheap and never makes a spent one reusable. No journal, lifecycle, classification or archive behaviour changes; nothing outside the checkout and scratch directory the command
    creates is written; no provider call; no authorization.


    WHAT THE COMMAND MUST ACHIEVE (the exact name, flags and layout are part of your design; choose a clear name consistent with the other `wfc` subcommands). Given a consumer repository and a fresh target
    path, it (1) creates a Git worktree of the repository at a fresh path (a new branch it names, from a base ref the operator gives, default the current HEAD of the repository); refuses an existing path,
    a path whose checkout identity already has a lifecycle, a dirty base, and a path inside the repository''s own tree; (2) creates a sibling scratch directory for `TMPDIR` OUTSIDE the worktree (an untracked
    file inside the repository makes the tree dirty and refuses launch); (3) runs the CONSUMER-SPECIFIC environment preparation from a declared, committed hook instead of hard-coding WFC''s own offline
    bundle (that bundle is WFC''s development tooling and must not become product surface); (4) produces the launch environment the baseline probe and the in-Hop task-check need (they inherit the launching
    process''s environment: `PATH` with the prepared venv first, `TMPDIR` pointing at the scratch directory, and whatever the hook declares such as `WFC_TEST_INPUTS`/`WFC_TEST_PROFILE`), in a form the operator
    can use without retyping it (for example an env file or a printed `export` block that a later `wfc run` invocation sources; choose and justify); (5) prints a short, exact next-step summary (worktree
    path, branch, scratch path, how to launch) and does NOT run `wfc plan`/`wfc run`. The prepared checkout must pass an unmodified baseline probe that an unprepared one fails: write a test that proves
    it with a hook that sets up a toy environment (real `git`, no network).


    THE HOOK (design it explicitly; this is the safety-relevant part). Decide: where it is declared (an optional committed declaration such as an optional key of the Consumer Config and/or a committed hook
    path, AND a way to name a hook on the command line so the command works without editing `.wfc/config.yaml`, which is the maintainer''s file and out of scope); what the hook may be (an executable committed
    in the repository at the BASE ref, never a file from a Run''s candidate or the Worker''s working tree, because the hook runs on the operator''s host with the operator''s privileges before any Worker
    Hop); what it is given (checkout path, scratch path, base commit) and what it must print (the environment it wants exported); how its output is bounded and labelled untrusted; timeouts; what is refused
    (a hook outside the repository, a non-executable hook, a hook path that is a symlink out of the tree); what happens when it fails (named refusal, the checkout and scratch directory it created are left
    in place, reported, never removed); and who is responsible for what (WFC for the safe invocation and the invariants, the consumer for the hook''s content, exactly like the evidence command). State plainly
    that a committed hook is code the maintainer approved by committing it, run with host privileges, and say what the command does NOT protect against. For WFC''s OWN repository add the hook it needs under
    `scripts/` (venv with an editable install `pip install --no-index --find-links <bundle> -e ''.[dev]''` from the verified offline bundle located by an environment variable or a documented default, `WFC_TEST_INPUTS`,
    `WFC_TEST_PROFILE=cp313-linux-x86_64`, and a scratch `TMPDIR`); enabling the declaration in this repository''s `.wfc/config.yaml` is a maintainer act you must NOT perform: ship the hook and document
    the one-line enablement.


    NOTES. Do not remove or touch a `.git/config.lock` or the host sandbox''s placeholder files (friction entries 6, 17): document the observation only. Do not build checkout reuse or cleanup. If the design
    shows that some part cannot be realised safely, end with a blocking Finding or an honest stop with the open decision, not a weaker safeguard.


    DOCUMENTATION. Front Door docs-sync applies in full: retire the statements the O1 slice wrote as *planned* for O4 (the per-checkout environment recipe done by hand, the shared-editable-install hazard)
    in the Agent Skill sources (`src/workflow_coordinator/agent_skill/wfc/`, replace rather than append: the skill is loaded into an agent''s context and has grown past 5600 words), the Operator Manual
    (chapters 3, 9, 10) and the operator-guidance record; document the command and the hook contract where the Front Door commands are described; update the contract tests for the shipped command lists
    minimally and say what changed. Add a dated `Design` section and implementation note to the O4 record BEFORE implementing (the reviewers judge the design first).


    PLAN CONTEXT (binding). This Commission implements slice O4 of the Beta-2 operator-efficiency plan (`docs/backlog/beta2_operator_efficiency_plan.adoc`, section "Revision of 2026-11-26" and the slice''s
    own section; read the revision first, then the slice and the record it names). The maintainer''s decisions D1-D7 of 2026-11-26 and the Beta rule are part of it: contracts, schemas, CLI surfaces and
    programs are provisional in Beta, the existence of an accepted contract is no argument against a change, and what must be preserved are the intended safety and governance properties (independent reviewer''s
    sole Finding authority, trusted-commit boundary, fail-closed admission and recovery, one Run per checkout), not necessarily their present technical realisation. Judge every change on benefit, effort,
    risk and dependencies. Where a design is needed, the FIRST thing you do is write the design down (what you decide, the alternatives you reject and why, which safety property each decision preserves)
    as a short dated `Design` section of the record the slice names (never in a review artifact: those belong to the reviewers), so the reviewers judge the design before the code. A slice without a design
    question (a mechanical one) needs no such section.


    FRONT DOOR DOCS-SYNC (binding). Apply `docs/developer_guide/ch03_engineering_conventions.adoc` section `frontdoor-docs-sync`: when Front Door behaviour or the operating surface changes, check the Operator
    Manual, the consumer tutorials and the shipped Agent Skill sources (`src/workflow_coordinator/agent_skill/wfc/`) and edit what became inaccurate, incomplete or misleading in the same slice (retire statements
    an earlier slice wrote as "planned"); if the slice changes no Front Door behaviour, say so in one sentence in your result.


    CHECKS. The Coordinator''s task-check after every Hop is the evidence command of this Commission and is authoritative (real `bwrap`, offline bundle, about six minutes). Your Hop sandbox cannot start
    `bwrap`, has a read-only `/tmp` and no network: run the focused tests you can and `python -m ruff check .`, and reason carefully about the rest. Strict render for every new or changed .adoc (`asciidoctor
    --safe-mode=safe -a assembled -o /dev/null --failure-level=WARN <file>` prints nothing); `python3 scripts/wfc_doc_catalog.py generate` then `check` must not report more unresolved links (baseline 83)
    or Project Memory misses (baseline 4); generated catalog output must not be left as a stray file. Unused imports and similar residue of a removal are the defect class the lint gate exists for: run `python
    -m ruff check .` before you finish.


    COMMIT AND INDEX DISCIPLINE (binding, mechanical). Use NO git command that writes: never `git add`, `git commit`, `git stash`, `git reset`, `git mv`, `git rm`, `git checkout -- <path>` or any other
    index or history mutation; the index must remain untouched, so `git status --short` shows only unstaged working-tree changes when you finish. Your result''s CommitIntent `subject` MUST contain the WorkItem
    id and the current Hop id, for example `feat(frontdoor): <what you did> (WI-WFC-BETA2-O4-001, H001)` (use the real Hop id of this Hop). `commit_intent.paths` is a JSON array with exactly one plain repository-relative
    path per element: every new, modified or deleted leaf individually (no sentence, count, glob or directory); derive it from `git status --short -uall` and compare the counts before you finish. Deliver
    a complete candidate in the first Hop; a late correction costs three Hops. Leave no stray file behind. A Worker never reports any Finding operation; only the independent reviewer opens and resolves
    Findings.'
  acceptance: The command creates a usable worktree, scratch directory and launch environment at a fresh path through a declared committed hook; it refuses, by name, a path whose checkout already has a
    lifecycle, an existing path, a path inside the repository, a dirty base, and an unsafe hook; a prepared checkout passes an unmodified baseline probe that an unprepared one fails (test); nothing outside
    the created checkout and scratch directory is written and nothing is removed; the trust boundary of the hook is stated and tested; WFC's own hook exists under scripts/; the one-Run-per-checkout invariant,
    journal, lifecycle and archive behaviour are untouched; the planned statements for O4 are retired; the Design section exists; the evidence command passes. No existing test is weakened, skipped or deleted;
    strict render prints nothing; the doc catalog check shows no additional unresolved links or Project Memory misses; `ruff check .` is clean; the full evidence command passes; the independent focused
    and whole-candidate broad reviews accepted with no blocking Finding; CommitIntent array has one plain path per element; Coordinator task-check passed.
  withheld_authority: No `.wfc/config.yaml`, governance/, `.github/`, scope-ceiling or release-workflow change; no push, tag, release, publication or Runtime promotion; no `wfc skill install`; no change
    beyond the slice scope; no weakening, skipping or deletion of a test; no change of the independent reviewer's sole Finding authority or of the trusted-commit boundary; no self-acceptance. No destructive
    operation (no removal of any worktree, branch, directory or file by the command); no change to journal, lifecycle, classification, archive or the one-Run-per-checkout invariant; no `.wfc/config.yaml`
    change (ship the hook and document the enablement); no checkout reuse.
  escalation_default: Escalate a needed file outside the scope, a safety or authority property that cannot be preserved by any realisation of the slice (record the open decision with options and a recommendation),
    and a conflict with a recorded maintainer decision. Do not silently substitute models. Incomplete work alone is not blocked.
