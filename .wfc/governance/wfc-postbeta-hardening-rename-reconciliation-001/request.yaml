authority_source: 'Maintainer decisions of 2026-11-21 (hardening H3 authorized; G0 order exception, not a declaration that
  G0 is fulfilled): one robust Commission with Opus worker and Opus reviewer, through the product Front Door, up to eight
  Hops; no release, tag or push; no Runtime promotion by the Commission.'
program:
  id: robust
  revision: v1
task:
  title: 'Hardening H3: exact-leaf reconciliation of rename-shaped commits'
  body: 'Fix the proven false refusal of rename-shaped commits in the trusted-commit boundary (hardening H3, maintainer-authorized
    2026-11-21). PROBLEM (verify it first at the current HEAD): in src/workflow_coordinator/git_facts.py the staged-path projection
    (`_staged_paths`, around lines 498-502) omits `--no-renames` while the module''s other Git invocations of this kind pass
    it (around lines 153, 162, 181, 689 and 1022). A same-content delete plus add is therefore reported as the destination
    only, and `trusted_commit` refuses with `staged paths differ from commit intent` although the CommitIntent names both
    leaves (reproduced in the BP5 archive-completion Run; docs/backlog/BUG-WFC-TRUSTED-COMMIT-RENAME-RECONCILIATION.adoc).
    CHANGE: the simplest correct fix, consistent with the module''s own convention: make the staged-path projection rename-blind
    like the other invocations. Do not invent explicit rename-pair comparison unless you can show the simple fix is wrong;
    the refusal stays fail-closed and the fix removes a false refusal, it admits nothing new. Read git_facts.py (the trusted_commit
    and bounded_path_commit paths, around 817 and 1211), tests/unit/test_slice4b_git_authority.py and tests/unit/test_bounded_path_commit.py
    (including test_refuses_directory_shaped_intent_path_without_expanding_it) and the BUG record. DOCUMENTATION: update docs/operator_manual/ch04_evidence/01_acceptance.adoc
    (the commit-intent admission section) ONLY if it currently describes or implies the refusal; otherwise leave the manual
    alone. Do not touch the directory-shaped CommitIntent record (the leaf-only versus expansion question is undecided and
    stays out of scope). PROPORTION (maintainer principles, 2026-11-21): fix the proven product problem and nothing more;
    add a test only where it detects a meaningful regression; add no guard, state, abstraction or documentation out of habit;
    keep the change materially as small as the problem allows; if you consider a stated acceptance criterion disproportionate
    or unnecessary, say so for the maintainer instead of satisfying it with further mechanism or silently waiving it. A Worker
    never reports any Finding operation (resolve, residual or any other delta); only the independent reviewer opens and resolves
    Findings. The CommitIntent names every changed leaf individually, never directories; no agent Git writes.'
  acceptance: 'A new test in tests/unit/test_slice4b_git_authority.py stages a same-content rename whose source and destination
    are both inside the authorized scope and both named in the CommitIntent and asserts the commit succeeds; it fails with
    `staged paths differ from commit intent` without the product change (the independent reviewer re-runs it against the base
    HEAD); a companion negative shows that a rename whose source lies OUTSIDE the authorized scope is still refused; the existing
    tests in tests/unit/test_slice4b_git_authority.py and tests/unit/test_bounded_path_commit.py pass unmodified; the required-mode
    suite passes, and ruff check and ruff format --check pass for the changed files if ruff is available; the BUG record carries
    a dated paragraph naming the fix and the test with its Status:: line unchanged; independently accepted with no blocking
    Findings and Coordinator task-check passed.'
  withheld_authority: No weakening of any scope, dirty-state, hook-neutralization or identity check; no directory expansion
    of CommitIntent paths; no change to preserve_candidate, to the exact-leaf contract or a redesign of trusted_commit; no
    change under governance/; no Runtime promotion, push, merge, rebase or tag.
  escalation_default: Escalate a real scope or authority conflict, a design that turns out materially more complex than described
    (with a traceable assessment of alternatives), or evidence that contradicts the stated problem; incomplete work alone
    is not blocked.
