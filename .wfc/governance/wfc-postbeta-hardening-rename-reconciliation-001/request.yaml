    it with a test that fails without it, and keep every safety check as it is.'
  independent_reviewer: 'Fresh adversarial reviewer: verify the problem against the real Git behavior and the module convention,
    check that the fix cannot widen what is admitted (including a rename out of scope), that the new test fails without the
    change, and apply the simplicity and maintainability objective; report material defects only and flag a disproportionate
    criterion for the maintainer instead of waiving it.'
