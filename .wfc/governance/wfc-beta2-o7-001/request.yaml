program:
  id: robust
  revision: v1
task:
  title: 'Beta-2 O7: an ordered evidence-command list through request, programs and result-contract selection'
  body: 'GOAL. Implement plan slice O7 (decision D6, IMPLEMENT, not defer): a Commission can declare an ORDERED LIST of named evidence commands instead of exactly one, so lint, format checks and tests are
    separate, ordered, fail-fast gates (friction entry 18: one conflated command let a lint error survive ten Hops). Read the revision section of `docs/backlog/beta2_operator_efficiency_plan.adoc`, the
    slice `[[o7]]` (design questions (a)-(e) and the acceptance there are BINDING), the record `docs/backlog/FTR-WFC-EVIDENCE-COMMAND-SEQUENCE.adoc` (the kernel facts, the `model.py:699` coupling, the interim
    remedy), and friction entries 18 and 19.


    MAINTAINER DECISION D6 (binding). Implement; the required changes to the Consumer Request, to the accepted programs INCLUDING `robust@v1` and to the result contracts are in principle AUTHORIZED. The
    coupling of result-contract selection to the concrete evidence-command list (`model.py:699`, `select_result_contract` at `model.py:715`, `is_closed_terminal_worker_shape`) is to be EXAMINED CRITICALLY:
    first understand which intended property that exact-tuple predicate protects (the closed terminal Worker shape is admitted under the semantic result contract and cannot be confused with another shape),
    then realise that property in the form that does not depend on the literal evidence list (a structural predicate, a versioned contract, or decoupling selection from the evidence list: your design decides
    and justifies it, and states which alternative you rejected and why). Per the Beta rule (contracts, schemas, programs and CLI surfaces are provisional; the existence of an accepted contract is no argument
    against a change; preserve the intended safety and governance properties, not their present technical realisation) you may change program literals, their digests and the request schema, but you must
    preserve: the independent reviewer''s sole Finding authority, the trusted-commit boundary, fail-closed admission, that the same evidence command(s) run as the pre-launch baseline probe and after every
    Worker Hop, and that the Coordinator (not the agent) runs and judges them. D5 stands: the 900-second evidence timeout stays (decide and document whether it applies per command or to the whole list;
    the kernel hard cap `model.py:27` and its enforcement in `frontdoor/request.py:81` are the facts to respect).


    WHAT MUST BE TRUE AT THE END. (1) A Consumer Request can declare an ordered list of named evidence commands (each with argv and timeout, names unique and validated); `wfc plan`, `wfc request` (integrated
    in O5; they share one construction path) and `wfc run` accept and preview them (choose a clear, repeatable flag form that fits the existing `--evidence-argv` / `--evidence-timeout` style, and keep a
    single-command request working as the degenerate list, or replace the old form outright: Beta permits a clean break, but then every shipped example, test and text must be updated and the old form refused
    by name). (2) Every command runs, in order and fail-fast, as the baseline probe before any provider starts and as the task-check after every Worker Hop; the first failing command stops the sequence;
    the failure names the command (and, per the O2 slice already integrated, the bounded untrusted tail of its output). (3) The accepted programs (`simple@v1`, `robust@v1`) and the result-contract selection
    are consistent with the list, with no safeguard of the terminal-Worker admission lost; changes to program literals move Commission digests: state in the design what that means for already archived Evidence
    and for tests that pin digests, and update them deliberately. (4) `wfc report`/status/audit show which command passed or failed where they show Evidence today. (5) This repository''s own recommended
    Commission shape becomes ordered gates (for example lint, then the test suite; the plan''s operator rule ''the single command must be `make check`'' is retired: update the skill, the manual and the
    operator-guidance record accordingly, replace rather than append).


    DESIGN FIRST. Before implementing, write a dated `Design` section in `docs/backlog/FTR-WFC-EVIDENCE-COMMAND-SEQUENCE.adoc` stating the decisions for (a)-(e), the exact data model and refusal rules,
    the migration (what breaks, what is updated), and for each decision which safety property it preserves; the focused reviewer judges the design before the code. If you find that no realisation preserves
    a named property, end with a blocking Finding or an honest stop and the open decision, not a weaker safeguard.


    PLAN CONTEXT (binding). This Commission implements slice O7 of the Beta-2 operator-efficiency plan (`docs/backlog/beta2_operator_efficiency_plan.adoc`, section "Revision of 2026-11-26" and the slice''s
    own section; read the revision first, then the slice and the record it names). The maintainer''s decisions D1-D7 of 2026-11-26 and the Beta rule are part of it: contracts, schemas, CLI surfaces and
    programs are provisional in Beta, the existence of an accepted contract is no argument against a change, and what must be preserved are the intended safety and governance properties (independent reviewer''s
    sole Finding authority, trusted-commit boundary, fail-closed admission and recovery, one Run per checkout), not necessarily their present technical realisation. Judge every change on benefit, effort,
    risk and dependencies. Where a design is needed, the FIRST thing you do is write the design down (what you decide, the alternatives you reject and why, which safety property each decision preserves)
    as a short dated `Design` section of the record the slice names (never in a review artifact: those belong to the reviewers), so the reviewers judge the design before the code. A slice without a design
    question (a mechanical one) needs no such section.


    FRONT DOOR DOCS-SYNC (binding). Apply `docs/developer_guide/ch03_engineering_conventions.adoc` section `frontdoor-docs-sync`: when Front Door behaviour or the operating surface changes, check the Operator
    Manual, the consumer tutorials and the shipped Agent Skill sources (`src/workflow_coordinator/agent_skill/wfc/`) and edit what became inaccurate, incomplete or misleading in the same slice (retire statements
    an earlier slice wrote as "planned"); if the slice changes no Front Door behaviour, say so in one sentence in your result.


    CHECKS. The Coordinator''s task-check after every Hop is the evidence command of this Commission and is authoritative (real `bwrap`, offline bundle, about six minutes). Your Hop sandbox cannot start
    `bwrap`, has a read-only `/tmp` and no network: run the focused tests you can and `python -m ruff check .`, and reason carefully about the rest. Strict render for every new or changed .adoc (`asciidoctor
    --safe-mode=safe -a assembled -o /dev/null --failure-level=WARN <file>` prints nothing); `python3 scripts/wfc_doc_catalog.py generate` then `check` must not report more unresolved links (baseline 83)
    or Project Memory misses (baseline 4); generated catalog output must not be left as a stray file. Unused imports and similar residue of a removal are the defect class the lint gate exists for: run `python
    -m ruff check .` before you finish.


    COMMIT AND INDEX DISCIPLINE (binding, mechanical). Use NO git command that writes: never `git add`, `git commit`, `git stash`, `git reset`, `git mv`, `git rm`, `git checkout -- <path>` or any other
    index or history mutation; the index must remain untouched, so `git status --short` shows only unstaged working-tree changes when you finish. Your result''s CommitIntent `subject` MUST contain the WorkItem
    id and the current Hop id, for example `feat(frontdoor): <what you did> (WI-WFC-BETA2-O7-001, H001)` (use the real Hop id of this Hop). `commit_intent.paths` is a JSON array with exactly one plain repository-relative
    path per element: every new, modified or deleted leaf individually (no sentence, count, glob or directory); derive it from `git status --short -uall` and compare the counts before you finish. Deliver
    a complete candidate in the first Hop; a late correction costs three Hops. Leave no stray file behind. A Worker never reports any Finding operation; only the independent reviewer opens and resolves
    Findings.'
  acceptance: A Commission can declare an ordered list of named evidence commands; plan, request and run accept and preview it; every command runs in order and fail-fast as baseline probe and after every
    Worker Hop, and a failure names the command; the accepted programs and the result-contract selection are consistent with the list and the intended terminal-Worker safeguard is preserved by a form that
    no longer depends on the literal evidence tuple, justified in the Design section; digests, archived-Evidence implications and pinned tests are handled deliberately; report/status show per-command results
    where they show Evidence; the skill, manual and guidance record are updated (the single-command rule retired); the Design section exists; the evidence command passes. No existing test is weakened, skipped
    or deleted; strict render prints nothing; the doc catalog check shows no additional unresolved links or Project Memory misses; `ruff check .` is clean; the full evidence command passes; the independent
    focused and whole-candidate broad reviews accepted with no blocking Finding; CommitIntent array has one plain path per element; Coordinator task-check passed.
  withheld_authority: No `.wfc/config.yaml`, governance/, `.github/`, scope-ceiling or release-workflow change; no push, tag, release, publication or Runtime promotion; no `wfc skill install`; no change
    beyond the slice scope; no weakening, skipping or deletion of a test; no change of the independent reviewer's sole Finding authority or of the trusted-commit boundary; no self-acceptance. No change
    to the independent reviewer's sole Finding authority, the trusted-commit boundary, the admission of Findings or the evidence-timeout hard cap (D5); the Coordinator, not the agent, runs and judges the
    evidence.
  escalation_default: Escalate a needed file outside the scope, a safety or authority property that cannot be preserved by any realisation of the slice (record the open decision with options and a recommendation),
    and a conflict with a recorded maintainer decision. Do not silently substitute models. Incomplete work alone is not blocked.
