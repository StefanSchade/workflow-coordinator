  and sequentially (this is slice SK); robust@v1 with Claude Opus / Claude Sonnet / Claude Opus as worker, focused reviewer and broad reviewer (the owner''s model rule; the focused-review binding differs
  from the committed role default); local integration only; no push, tag, release, publication, Runtime promotion or .wfc/config.yaml change.'
program:
  id: robust
  revision: v1
task:
  title: 'Beta-2: consolidate the WFC Operator Skill (Level 0/1, Runtime/Payload, consumer operator notes)'
  body: 'GOAL. Consolidate the shipped WFC Operator Skill (`src/workflow_coordinator/agent_skill/wfc/SKILL.md` and `references/{commission,setup,stops-and-evidence}.md`) for Beta 2. This is a CONSOLIDATION
    AND STRUCTURING task, not a feature epic. The repository owner''s order (binding) follows; the ''PLAN CONTEXT'' paragraph below refers to the Beta-2 operator-efficiency plan only for background (O1-O10
    are integrated).


    BASELINE (measured by the operator on main `1aa5beb`): words per file SKILL.md 1272, commission.md 1524, setup.md 1377, stops-and-evidence.md 1838, total 6011 (it was about 3900 before slice O1; slices
    O1-O10 each retired ''planned'' statements without shrinking the text). Token occurrences in the skill directory: `WFC_TEST_INPUTS` 1, `WFC_TEST_PROFILE` 1, `egg-info` 1, `PYTHONPATH` 1, `test_self_development`
    1, `wfc_prepare_checkout_env` 1, `make lint` 1, `make check` 1, `make test` 1, `make format-check` 1, `v0.1.0b1` 11 (all manual links pin the tag of the first beta, although the skill now describes
    Beta-2 commands), ''scope ceiling'' 6. Re-measure; do not trust these figures, they are a starting point.


    The problem is NOT the bare word count: it is the mixing of (1) general operator rules, (2) WFC runtime contracts, (3) WFC-self-development experience, (4) historical workarounds and mechanics that
    the new CLI (O1-O10) now automates. The existing structure (a lean entry file plus references loaded on demand) is sound and stays.


    ARCHITECTURAL GUIDELINES (binding).

    1. Separate Level 0 and Level 1 unambiguously. WFC (Level 0, the Runtime) executes exactly one Commission per Run, enforces the authorization, review, evidence and trusted-Git contracts, takes no portfolio
    decisions and orchestrates nothing. The Level-1 operator agent interprets the human''s order and its delegation limits, chooses tasks, order and Commission shapes, authors and monitors Runs, and MAY
    orchestrate several Runs one after the other, and, only if the human''s delegation covers it, in parallel; it decides technical preparation and continuation inside that delegation and leaves undelegated
    decisions to the maintainer. The current SKILL.md section ''When WFC fits'' says that chaining several Commissions automatically does not fit, because WFC runs one Commission per Run: that is right
    for Level 0 and misleading for Level 1; correct it so it describes the autonomous multi-Run operation that is practised, WITHOUT extending any authority boundary.

    2. Distinguish WFC as Runtime from WFC as Payload consistently. The generic skill must be fully stack-agnostic: no assumption about Python, pytest, virtual environments, Makefiles or the layout of the
    WFC repository; project-specific setup and tests come from the consumer''s configuration and its declared preparation hook (`wfc prepare-checkout`, O4) and the consumer''s own gates. WFC developing
    itself is an ORDINARY CONSUMER case, not a special mode of the Runtime. The general rule ''run cheap deterministic gates before expensive ones, and make the evidence commands the consumer''s own gates
    (an ordered list since O7)'' stays; the concrete gates are the consumer''s.

    3. Replace the idea of a built-in `self-development.md` inside the shipped skill by a GENERAL REPOSITORY CONVENTION for optional, consumer-specific OPERATOR NOTES: a plain file a consumer repository
    may commit, which the skill tells the Level-1 operator to read when it exists. The notes must: come from the authoritative COMMITTED starting state of the checkout the Run begins from (not from a Run
    candidate or an uncommitted working tree); be loaded only when needed (a cheap existence check, never a mandatory step for ordinary consumers); contain ONLY Level-1 operator notes; not be confused with
    the Commission''s `guidance.path` for Workers; and confer NO additional authority (they are advice to the operator, never a source of delegation, scope or approval). A simple documented file convention
    suffices: choose the path and name in your design (constraints: it must be creatable by a normal Commission, so it must lie inside this repository''s scope ceiling, which excludes `.wfc/`; for THIS
    Commission''s scope the path must be either the file `docs/operator-notes.md` or a file under the directory `docs/operator-notes/` (both are in your scope; a path elsewhere would be outside it); it
    must be easy to find and to state in one line), document it in the skill and in the Operator Manual''s consumer chapter, and write WFC''s OWN notes file as the first user of the convention (the WFC-specific
    content that today lies in the generic references moves there: the ceiling-entry/test-pin coupling `tests/unit/test_self_development_consumer_config.py`, `scripts/wfc_prepare_checkout_env.sh` and the
    offline bundle with `WFC_TEST_INPUTS`/`WFC_TEST_PROFILE`, the `src/*.egg-info` and `PYTHONPATH` hazard, the WFC-specific gate names, and other self-development findings that are still true). Do NOT
    implement any runtime function for this: no new CLI, config key or code; the convention is text. Do not hard-wire a name check of the repository (''is this WFC?'') into the skill: the repository declares
    its own notes.

    4. BEFORE the rewrite, produce a complete INVENTORY (a new document `docs/warm_storage/post-beta-planning/wfc_skill_consolidation_inventory.adoc`, strict render clean): every WFC-specific content item,
    every outdated workaround now replaced by a deterministic CLI function (map each to the O-slice and the command that replaces it: `wfc request`, `wfc prepare-checkout`, `wfc report --repository`, the
    early pre-launch refusals and the tolerated unused role defaults, the ordered evidence-command list, `wfc extend-budget`, `wfc resume` incl. `--preview` for the quiescent-interruption class, and whatever
    else you find by reading the code and `wfc <command> --help`), every versioned reference, every redundancy or contradiction (the recovery text above all: check `references/stops-and-evidence.md` and
    the manual''s recovery chapter for duplicated or contradictory state descriptions; the recovery SEMANTICS themselves must not change), each with its disposition (keep general / move to the consumer-notes
    convention / delete because automated / move to troubleshooting / unchanged) and the reason.

    5. PRESERVE every existing authority rule semantically. For each relevant authority rule the independent review must find a traceable OLD-TO-NEW MAPPING: put that mapping table in the inventory document
    (rule, old location, new location or deliberate deletion with reason). Rules that must survive unchanged in meaning: `--yes` is an authorization assertion, not a technical check of the human''s decision;
    an existing delegation covers launches within its scope, program and Hop budget across technical execution attempts; no self-initiated widening of scope, Hop budget, program authority or model bindings;
    no Runtime promotion, publication, skill (re)installation or change of the maintainer''s configuration without the maintainer; no self-initiated resolution of reviewer Findings; the boundary between
    authorized technical continuation and human disposition of a stop; an agent never extends a Hop budget on its own (O8); every other rule you find. Add REGRESSION TESTS that make this durable (reference
    structure present and linked, the consumer-notes convention documented, the authority rules still stated, links resolve), but NO fragile tests that merely pin a particular wording.

    6. Consolidate the general references: move consumer-specific details out; remove instructions made obsolete by O1-O10; check the recovery documentation for redundancy and contradiction; keep skill,
    actual CLI behaviour (verify against `wfc <command> --help` and the source, not against the old text) and versioned manual links consistent. VERSIONED DOCUMENTATION REFERENCES: find a consistent strategy
    that distinguishes the installed Runtime version, the current development state and the released documentation; the skill itself is the operator reference for the installed version; manual links are
    supplementary and labelled with the version they describe; never silently claim that an older manual already documents a newer function; make the strategy compatible with the release step that bumps
    tag-pinned links (see `docs/backlog/FTR-WFC-RELEASE-*` and the release plan), and state it in the inventory.

    7. Separate NORMATIVE operator rules from OPERATIVE consumer notes. Historical single cases must not automatically become permanently valid general rules.


    MEASUREMENT (acceptance). Document in the inventory document the words per file before and after, and an assessment of the INITIALLY LOADED context (what the agent loads when the skill is invoked: SKILL.md;
    what is loaded on demand: each reference and the consumer notes) for a typical ordinary-consumer Commission and for a WFC-self-development Commission. No arbitrary reduction quota: maintainability,
    consistency and actual context consumption decide.


    PROGRESSIVE DISCLOSURE. The Markdown references are links the agent follows, not automatically expanded includes: verify that the chosen structure really lets an agent skip what it does not need, and
    that SKILL.md states clearly when to read which reference and when to read the consumer notes.


    BOUNDARIES. Not part of this task: changes to the WFC state machine, new workflow programs, new authorization mechanisms, new self-development modes in the Runtime, a general redesign of the Operator
    Manual, Runtime promotion, `wfc skill install`, push, tag or release. If a desired improvement would need a code change to the Runtime, record it as a separate candidate in the inventory document; do
    not extend this Commission silently. Keep the skill dense and decision-grade: every line added must earn its place and replace rather than append.


    TESTS. The existing skill installation, content, CLI and documentation tests (`tests/unit/test_agent_skill_content.py`, `tests/unit/test_frontdoor_skill.py`, `tests/architecture/test_consumer_tutorial_pages.py`,
    `tests/architecture/test_tutorial_kit_quotes.py` and whatever else reads the skill resources or the manual pages you change) must stay green; update a pinned expectation only where a deliberate change
    requires it and say what changed.


    PLAN CONTEXT (binding). This Commission implements slice SK of the Beta-2 operator-efficiency plan (`docs/backlog/beta2_operator_efficiency_plan.adoc`, section "Revision of 2026-11-26" and the slice''s
    own section; read the revision first, then the slice and the record it names). The maintainer''s decisions D1-D7 of 2026-11-26 and the Beta rule are part of it: contracts, schemas, CLI surfaces and
    programs are provisional in Beta, the existence of an accepted contract is no argument against a change, and what must be preserved are the intended safety and governance properties (independent reviewer''s
    sole Finding authority, trusted-commit boundary, fail-closed admission and recovery, one Run per checkout), not necessarily their present technical realisation. Judge every change on benefit, effort,
    risk and dependencies. Where a design is needed, the FIRST thing you do is write the design down (what you decide, the alternatives you reject and why, which safety property each decision preserves)
    as a short dated `Design` section of the record the slice names (never in a review artifact: those belong to the reviewers), so the reviewers judge the design before the code. A slice without a design
    question (a mechanical one) needs no such section.


    FRONT DOOR DOCS-SYNC (binding). Apply `docs/developer_guide/ch03_engineering_conventions.adoc` section `frontdoor-docs-sync`: when Front Door behaviour or the operating surface changes, check the Operator
    Manual, the consumer tutorials and the shipped Agent Skill sources (`src/workflow_coordinator/agent_skill/wfc/`) and edit what became inaccurate, incomplete or misleading in the same slice (retire statements
    an earlier slice wrote as "planned"); if the slice changes no Front Door behaviour, say so in one sentence in your result.


    CHECKS. The Coordinator''s task-check after every Hop is the evidence command of this Commission and is authoritative (real `bwrap`, offline bundle, about six minutes). Your Hop sandbox cannot start
    `bwrap`, has a read-only `/tmp` and no network: run the focused tests you can and `python -m ruff check .`, and reason carefully about the rest. Strict render for every new or changed .adoc (`asciidoctor
    --safe-mode=safe -a assembled -o /dev/null --failure-level=WARN <file>` prints nothing); `python3 scripts/wfc_doc_catalog.py generate` then `check` must not report more unresolved links (baseline 83)
    or Project Memory misses (baseline 4); generated catalog output must not be left as a stray file. Unused imports and similar residue of a removal are the defect class the lint gate exists for: run `python
    -m ruff check .` before you finish.


    COMMIT AND INDEX DISCIPLINE (binding, mechanical). Use NO git command that writes: never `git add`, `git commit`, `git stash`, `git reset`, `git mv`, `git rm`, `git checkout -- <path>` or any other
    index or history mutation; the index must remain untouched, so `git status --short` shows only unstaged working-tree changes when you finish. Your result''s CommitIntent `subject` MUST contain the WorkItem
    id and the current Hop id, for example `feat(frontdoor): <what you did> (WI-WFC-BETA2-SK-001, H001)` (use the real Hop id of this Hop). `commit_intent.paths` is a JSON array with exactly one plain repository-relative
    path per element: every new, modified or deleted leaf individually (no sentence, count, glob or directory); derive it from `git status --short -uall` and compare the counts before you finish. Deliver
    a complete candidate in the first Hop; a late correction costs three Hops. Leave no stray file behind. A Worker never reports any Finding operation; only the independent reviewer opens and resolves
    Findings.'
  acceptance: A stack-agnostic generic skill; consumer-specific operator notes loaded on demand through a documented file convention with WFC's own notes file as first user; correct Level-0/Level-1 separation
    including autonomous multi-Run operation; no shift of authority, with a complete old-to-new mapping of every authority rule in the inventory; obsolete workarounds (made redundant by O1-O10) removed
    or moved to troubleshooting; versioned documentation references consistent; the recovery text free of redundancy and contradiction without any semantic change; words per file before and after and the
    initially loaded context documented; existing tests green and targeted non-fragile regression tests added; independent broad review accepts the whole result including the general references and the
    consumer-notes mode. No existing test is weakened, skipped or deleted; strict render prints nothing; the doc catalog check shows no additional unresolved links or Project Memory misses; `ruff check
    .` is clean; the full evidence command passes; the independent focused and whole-candidate broad reviews accepted with no blocking Finding; CommitIntent array has one plain path per element; Coordinator
    task-check passed.
  withheld_authority: No `.wfc/config.yaml`, governance/, `.github/`, scope-ceiling or release-workflow change; no push, tag, release, publication or Runtime promotion; no `wfc skill install`; no change
    beyond the slice scope; no weakening, skipping or deletion of a test; no change of the independent reviewer's sole Finding authority or of the trusted-commit boundary; no self-acceptance. No Runtime/code
    change (no `.py` file under `src/` changes; the skill texts are shipped resources); no new CLI, config key or runtime function for the operator-notes convention; no weakening or extension of any authority
    rule; no Runtime promotion or `wfc skill install`.
  escalation_default: Escalate a needed file outside the scope, a safety or authority property that cannot be preserved by any realisation of the slice (record the open decision with options and a recommendation),
    and a conflict with a recorded maintainer decision. Do not silently substitute models. Incomplete work alone is not blocked.
