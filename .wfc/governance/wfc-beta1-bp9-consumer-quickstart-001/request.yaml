schema_version: 1
commission_id: wfc-beta1-bp9-consumer-quickstart-001
work_item_id: WI-WFC-BETA1-BP9-CONSUMER-QUICKSTART-001
authority_source: Maintainer authorizes BP9 part 2 (consumer quickstart with limitations list) per the accepted execution
  plan and the 2026-11-21 BP9 split, through the product Front Door, up to ten Hops; no push, no Runtime promotion, no tag;
  live provider qualification and the unfamiliar-user trial stay maintainer-owned.
program:
  id: robust
  revision: v1
task:
  title: 'BP9: consumer quickstart chapter with an honest limitations list'
  body: 'Write the consumer quickstart of BP9 as specified in docs/backlog/beta1_execution_plan.adoc section ''BP9 -- wfc-beta1-bp9-beta-gate-001''
    (Goal: a two-page quickstart with an honest limitations list for an external user who has not read the Operator Manual)
    and docs/backlog/beta1_productization.adoc section BP9; read both first, then the product behavior you will document (src/workflow_coordinator/frontdoor/,
    docs/operator_manual/ch03_running and ch04_evidence, docs/backlog/FTR-WFC-LIFECYCLE-ROTATION.adoc, tests/integration/test_beta_e2e_fake_provider.py
    which already walks the whole flow on a non-Python consumer). Deliver (1) a new Operator Manual chapter docs/operator_manual/ch09_consumer_quickstart/
    with _chapter.adoc and 01_quickstart.adoc, included from docs/operator_manual/operator_manual.adoc and linked from docs/README.adoc;
    it is written for a user of an unrelated, non-WFC repository (not for WFC developers) and must stay about two printed
    pages: prerequisites, install, `wfc init` and configuration, writing a request, `wfc plan` preview, unattended `wfc run
    --yes`, `wfc status`/`audit`/`report`, where the Evidence lands and how raw retention is chosen, and what to do next (including
    that one fresh checkout is needed per Run until the lifecycle-rotation item is decided); (2) a separate section ''Limitations
    of this Beta'' in the same chapter that is honest and fact-checked against source: crash and surviving-provider behavior
    (DG-3 Variant B: no supervision, an unresolved launch is classified uncertain and never relaunched, `resume` never relaunches
    an engine), one adapter per Run, the single evidence command `task-check` and its timeout ceiling, clean-tree and scope-ceiling
    rules, incomplete recovery conveniences (no `wfc continue`; manual salvage and successor; automatic candidate preservation
    is non-authoritative), one lifecycle per checkout, no token usage reported (`usage_not_reported`, nullable by decision
    DG-1), the qualified platform only as far as the repository records it, and that WFC never pushes. State plainly that
    live qualification of each supported provider adapter from an installed wheel is performed by the maintainer, is not claimed
    by this document and is not replaced by the fake-provider test; (3) a small mutation-sensitive test tests/unit/test_quickstart_commands.py
    that extracts the fenced shell commands of the quickstart and checks every `wfc` subcommand and flag against the real
    argparse parsers of the Front Door, so documentation and CLI cannot drift. Verify every command and flag you document
    against the real CLI help (run the in-repository entry shim tests/fixtures/bp9/wfc_entry.py with --help for each subcommand)
    and every limitation against source or an existing accepted record; do not document behavior you did not verify, do not
    copy Harness-era instructions, and do not mention scripts/wfc_op.py except as retired. Do not edit any other existing
    manual page except the one include line and the README link. A Worker never reports any Finding operation (resolve, residual
    or any other delta); only the independent reviewer opens and resolves Findings. The CommitIntent names every changed leaf
    individually, never directories; no agent Git writes.'
  acceptance: The new chapter exists, renders with Asciidoctor, resolves its cross-references, is included from the manual
    and linked from docs/README.adoc; every documented command and flag exists in the real CLI and the new test fails when
    a documented flag is removed or renamed; the limitations list is fact-checked, complete for the items named above and
    claims no live qualification; the required-mode suite passes; independently accepted with no blocking Findings and Coordinator
    task-check passed.
  withheld_authority: No change to src/, to existing tests or fixtures, or to any manual page other than the single include
    line in operator_manual.adoc; no claim of live provider qualification or of an unfamiliar-user trial (both maintainer-owned);
    no push, merge, rebase, Runtime promotion or tag.
  escalation_default: Escalate a real scope or authority conflict or a documented-behavior question the source cannot answer;
    incomplete work alone is not blocked.
scope:
- docs/operator_manual
