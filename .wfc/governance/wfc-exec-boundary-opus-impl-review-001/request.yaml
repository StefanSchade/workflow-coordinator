authority_source: 'Repository owner instruction 2026-11-26: Claude Opus implementation review of the Execution Boundary Slice A (implemented and reviewed by Sonnet only), deliverable an AsciiDoc report;
  simple@v1 with Claude Opus as the sole Worker (maintainer decision; worker binding differs from the committed role default); read-only review, single report file; local integration only; no push, tag,
  release, publication, Runtime promotion or .wfc/config.yaml change.'
program:
  id: simple
  revision: v1
task:
  title: Opus implementation review of the Execution Boundary Slice A
  body: 'GOAL. Produce ONE AsciiDoc report: an independent, adversarial implementation review of the WFC Execution Boundary Slice A as integrated on this branch. You are the first Opus-class reader of this
    implementation: the contract was written and reviewed by Opus, but the implementation and every one of its reviews (worker, focused review, broad review) were done by Claude Sonnet only. The repository
    owner wants to know whether that Sonnet-only chain left weaknesses, and will decide from your report whether targeted rework is commissioned or the implementation is accepted as it is. This is a REVIEW:
    you change no code, no test and no existing document.


    WHAT TO REVIEW. The contract is `docs/backlog/FTR-WFC-EXECUTION-BOUNDARY-DISPATCH-INTEGRATION.adoc` (sections (a)-(j) and the exit criteria; binding), with `docs/backlog/FTR-WFC-EXECUTION-TRUST-BOUNDARIES.adoc`
    (umbrella, maintainer decisions) and `docs/warm_storage/post-beta-planning/wfc_execution_boundary_planning_record.adoc` (open decisions M1-M8, rejected alternatives). The implementation is the diff
    `git diff c5843d8 6b89880 -- src tests docs/architecture.md docs/technical_model docs/functional_model docs/operator_manual docs/developer_guide` (read-only git commands are fine: `git diff`, `git show`,
    `git log`). Centre: `src/workflow_coordinator/execution_launcher.py` (new), `execution_boundary.py`, `claude_adapter.py`, `codex_adapter.py`, `operator.py`, `slice4.py`, `model.py`, `serialization.py`,
    `frontdoor/{archive,audit,config}.py`, `vertical.py`, the new tests `tests/integration/test_execution_boundary_dispatch.py`, `tests/unit/test_execution_launcher.py`, `tests/unit/test_execution_boundary_dispatch_preflight.py`,
    `tests/unit/test_archive_provider_channel.py`, and the changed existing tests. The earlier reviews `docs/warm_storage/post-beta-planning/wfc_execution_boundary_slice_a_r3_{broad,focused}_review.adoc`
    are context to challenge, not evidence to trust.


    QUESTIONS, in priority order.

    1. Security (highest weight). Can an agent inside the boundary reach `.git`, the gitdir, the common Git directory, the object database, hooks, the Run state directory, `$HOME`, credentials beyond the
    enumerated authentication location, or write outside its authorized grant? Is there ANY route to unisolated execution: preflight failure, exception paths, timeout and kill paths, resume, a mode flag
    that is read in two places, an environment variable or config key that downgrades silently? Are the mounts exactly the contract''s kinds (M7: scratch, provider channel directory, provider authentication
    location, enumerated read-only /etc entries) and nothing more? Symlink, path-normalization, TOCTOU, `..`, bind-over-bind, `/proc`, `/dev`, PID namespace and `--new-session` questions. Provider-relaxed
    settings: are they ever present on a run that is not effectively isolated?

    2. Contract conformance. Section by section: what is specified and not implemented, implemented differently, or implemented beyond the contract. Byte-identity of the unisolated (direct) path for argv,
    cwd, environment and settings, for BOTH adapters.

    3. Test quality. Do the negative cases N1-N16 really attempt the forbidden access through the real dispatch path and assert both the failure and that the host-side target is unchanged, or are some tautological,
    mock the thing they claim to test, assert too little, or silently skip? Which contract claims have no test at all? Were existing tests weakened or changed in meaning?

    4. Honesty of claims. Does any code comment, docstring, document or evidence field claim more than the code and tests establish (preventive isolation, live qualification, scope enforcement)? Is the
    Layer 1 versus Layer 2 distinction kept?

    5. Engineering quality: dead code, duplicated logic between adapters, error classification, fail-closed behaviour of the helpers, cleanup of pre-created targets and channel directories, concurrency,
    anything a maintainer will regret.

    6. Sonnet-specific weakness pattern: if the evidence shows a recurring class of mistake (overclaiming, shallow tests, copy-paste drift between the two adapters, optimistic error handling), name the
    class and give the instances.


    METHOD AND HONESTY. Verify by reading the code and, where possible, by executing tests and small probes. Your Hop sandbox cannot start `bwrap` (no user namespaces), has a read-only `/tmp` and no network,
    so tests that need real `bwrap` cannot be run by you: run everything else you can (unit tests, focused pytest selections; use a scratch directory you are allowed to write), and for every finding state
    its evidence class explicitly: EXECUTED (you ran it and saw it), TRACED (you followed the code path by hand), or SUSPECTED (plausible, not verified; say what would verify it, so that the Level-1 operator
    can probe it with real `bwrap` outside your sandbox). Do not present a suspicion as a finding of fact. Do not pad: a short list of real defects beats a long list of style remarks, and a verified absence
    of defects is a valid and valuable result; say what you checked and found sound.


    REPORT STRUCTURE (the single deliverable `docs/warm_storage/post-beta-planning/wfc_execution_boundary_slice_a_opus_implementation_review.adoc`): (1) verdict in five lines: is the implementation sound
    enough to promote as a Layer-1-qualified, opt-in feature, or is rework needed, and of what kind; (2) findings table ranked by severity (id, severity blocker/major/minor/note, evidence class, location
    as `path:line`, one-sentence defect, concrete failure scenario, recommended fix, proposed owner scope for a rework Commission); (3) per-question sections 1-6 with what was checked and found sound; (4)
    test-coverage matrix: contract requirement, N-case, test, verdict; (5) claims audit; (6) proposed rework Commission scope if any (files, size, program), and what could be left as is; (7) probes for
    the Level-1 operator to run with real `bwrap` and what each would show; (8) what you could not check. Render strictly: `asciidoctor --safe-mode=safe -a assembled -o /dev/null --failure-level=WARN docs/warm_storage/post-beta-planning/wfc_execution_boundary_slice_a_opus_implementation_review.adoc`
    must print nothing. Follow the repository''s AsciiDoc conventions (see `docs/ai_info/_ai_info.adoc` and the neighbouring review documents) and link-check with `python3 scripts/wfc_doc_catalog.py generate`
    then `check` (no more unresolved links than before; do not leave generated catalog output behind).


    COMMIT AND INDEX DISCIPLINE (binding, mechanical). Use NO git command that writes: never `git add`, `git commit`, `git stash`, `git reset`, `git mv`, `git rm`, `git checkout` or any other index or history
    mutation; the index stays untouched. Your result''s CommitIntent `subject` MUST contain the WorkItem id and the current Hop id, for example `docs(review): Opus implementation review of the Execution
    Boundary Slice A (WI-WFC-EXEC-BOUNDARY-OPUS-IMPL-REVIEW-001, H001)`; `commit_intent.paths` is a JSON array with exactly one plain repository-relative path per element: here exactly `docs/warm_storage/post-beta-planning/wfc_execution_boundary_slice_a_opus_implementation_review.adoc`.
    Leave no stray file behind (scratch only outside the repository). The report is the only change.'
  acceptance: The single report file exists at the specified path, follows the specified structure, states an evidence class for every finding, separates verified defects from suspicions, answers all six
    questions including a verdict, renders strictly without output, adds no unresolved catalog link, and is the only change; no code, test or existing document is modified; CommitIntent array has the one
    plain path.
  withheld_authority: No code, test, config, governance, workflow, script or existing-document change; no Finding operation; no attempt to fix what the review finds; no push, tag, release, publication or
    Runtime promotion; no live provider invocation or credential handling; no self-acceptance.
  escalation_default: Escalate only a needed file outside the scope or a conflict with a recorded maintainer decision. A defect found is a report item, not a stop. Do not silently substitute models.
