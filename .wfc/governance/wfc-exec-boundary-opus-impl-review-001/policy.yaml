schema_version: 3
policy_id: consumer-standard
revision: v1
scope:
- workflow-coordinator
governance_paths:
- .wfc/governance
work_item_scope_ceiling:
- src
- tests
- scripts
- docs
- README.md
- pyproject.toml
- Makefile
- examples/consumer-demo
max_autonomous_hops: 32
actions:
- edit
- commit
- review
evidence_commands:
  task-check:
    argv:
    - sh
    - -c
    - '[ ! -e docs/warm_storage/post-beta-planning/wfc_execution_boundary_slice_a_opus_implementation_review.adoc
      ] || asciidoctor --safe-mode=safe -a assembled -o /dev/null --failure-level=WARN
      docs/warm_storage/post-beta-planning/wfc_execution_boundary_slice_a_opus_implementation_review.adoc'
    timeout_seconds: 300
