authority_source: 'Repository owner instruction 2026-11-25 (Beta-2 token accounting, Level-1 operator coordinates alongside the front-door docs-sync Commission): bounded robust@v1 Commission, Claude Sonnet
  worker and Claude Opus independent reviewer per the committed role defaults; local integration into main only after verification; no push, tag, release, publication or Runtime promotion.'
program:
  id: robust
  revision: v1
task:
  title: 'Token usage per Run: capture provider-reported usage, persist per invocation, project into audit and report'
  body: 'GOAL. Make the provider-reported token usage of a WFC Run measurable and visible, as one bounded vertical slice: capture what the Claude and Codex adapters'' provider output actually reports, persist
    it per invocation as Run state, project it into the archive''s audit.json, and show it in `wfc report`. Missing values stay unknown: no estimation, no invented numbers, no zero for "not reported", and
    NO monetary/price calculation (the Claude wrapper''s `total_cost_usd`/`costUSD` fields must NOT be captured or shown in this slice).


    VERIFIED INPUTS (read-only, committed in HEAD under `tests/fixtures/provider_usage_samples/`; captured from the real CLIs on 2026-11-25, session/thread identifiers redacted). Do not edit these two files;
    derive your own fixtures from them under `tests/fixtures/provider_usage/`.

    - `claude_result_wrapper_real_2026-11-25.json`: the final JSON object of `claude -p --output-format json` (what `claude_adapter.py` already parses and from which it takes only `structured_output`).
    Usage lives in `usage` (aggregate: `input_tokens`, `output_tokens`, `cache_read_input_tokens`, `cache_creation_input_tokens`, plus nested detail such as `iterations`) and in `modelUsage` (keyed by model
    id: `inputTokens`, `outputTokens`, `cacheReadInputTokens`, `cacheCreationInputTokens`; also cost and window fields you must ignore).

    - `codex_exec_events_real_2026-11-25.jsonl`: stdout of `codex exec --json`. A `{"type":"turn.completed","usage":{"input_tokens","cached_input_tokens","cache_write_input_tokens","output_tokens","reasoning_output_tokens"}}`
    event carries usage. In Codex, `input_tokens` INCLUDES `cached_input_tokens` (cache read); do not assume the same for Claude, where `input_tokens` excludes cache read/creation. Preserve each provider''s
    semantics faithfully in the stored record and document the difference; do not silently normalise in a way that loses it. Any further provider field you rely on that is not in these samples is unverified:
    treat it as optional and unknown when absent.


    CURRENT STATE (verified by inventory): both adapters discard usage. `AgentExecutionOutcome` (`src/workflow_coordinator/adapter.py`) has no usage field; the Claude adapter keeps only `structured_output`;
    the Codex adapter ignores stdout (it keeps a bounded 16 KiB tail only, so usage events must be parsed from the full stdout stream before bounding). One Hop is exactly one invocation (`INV-...`), although
    the provider may run several internal turns. `frontdoor/audit.py` hard-codes `hops[].usage = None`, seeds `limits` unconditionally with `usage_not_reported`, and `_HOP_KEYS`/`_TOP_KEYS` are frozen allow-lists.
    `frontdoor/archive.py` copies only allow-listed Run files (`CHECKOUT_ALLOW` etc.) into the archive; `archive.py` re-projects `audit.json` from the placed manifest and refuses a mismatch. Decision DG-1
    (`docs/backlog/beta1_productization.adoc`): a nullable `usage` field, a missing value stays unknown, never zero.


    DO (implement; design choices are yours but must satisfy every constraint, and must be recorded with reasons in the verification record).

    1. Capture. Extend the adapter outcome so each invocation can carry a provider-neutral usage record: per-invocation figures (input, output, cache read, cache write, reasoning/thinking output where the
    provider reports it separately), a per-model breakdown where the provider gives one (Claude `modelUsage`), the provider (adapter) name, and a coverage value for that invocation (`complete`: input and
    output both reported; `partial`: some but not both; `none`: nothing reported or unparsable). Each individual figure is either a non-negative integer the provider reported or absent/null. Parse defensively:
    wrong types, negative numbers, booleans, huge values, missing or malformed JSON/events, duplicate or multiple events must yield unknown for the affected figure and never raise into the Hop and never
    alter candidate acceptance, routing or any existing outcome. Define and test how multiple Codex `turn.completed` events in one invocation are handled (sum only if every event is well-formed; otherwise
    coverage `partial`); state the rule. Capture also for failed, blocked and timed-out invocations whenever the provider output is available (the cost occurred); a timeout or crash with no parsable output
    is coverage `none`.

    2. Persist. Store the usage record for every invocation as Run state beside the existing per-checkout records (a new bounded leaf such as `usage.json` or per-invocation records under the checkout; your
    choice), keyed by Run id, Hop id and invocation id, with the Hop''s role and the effective provider/model of the execution binding. It is written with the same crash-safety/ownership discipline as neighbouring
    Run records, adds no new write surface outside the Run''s checkout state, and must not store prompts, outputs, paths or credentials: numbers, enumerations, provider and model identifiers only. Extend
    the archive allow-list so the file is archived additively.

    3. Project. Populate `hops[].usage` in `audit.json` from the archived record (`null` when no record exists for that hop) and add, only when at least one usage record exists, a top-level run `usage`
    summary: totals per run, aggregates per role, per model, and coverage counts (invocations complete/partial/none), each total computed only from reported figures, with an explicit marker when a total
    is a lower bound because some contributing figures were unknown (never present a lower bound as exact). `limits`: keep `usage_not_reported` exactly when no invocation of the Run carried usable usage
    data; when usage is captured but incomplete add a precise new limit code (for example `usage_partially_reported`) instead of pretending completeness. COMPATIBILITY IS A HARD CONSTRAINT: an archive created
    before this change, reprojected by the new code, must produce byte-identical `audit.json` bytes (no new key, no changed limit for it), and `wfc.audit/1`''s allow-lists change only additively. If you
    conclude a `wfc.audit/2` or any breaking change is needed, that is a maintainer decision: stop and escalate instead of doing it. The privacy guards of the projection (no path, private string, remote)
    must pass for the new fields; extend their tests.

    4. Report. `wfc report` (text and `--json`) shows the Run''s usage in a compact, honest form: totals with the lower-bound marker, per-role lines, coverage, and the limit; when no usage was reported
    the current wording and behavior must remain. Keep the existing report/status output stable otherwise. `wfc status` need not change.

    5. Tests (they must fail without the implementation; no network, no real provider): contract tests built on the two real-sample fixtures (and derived edge-case fixtures: missing `usage`, missing `modelUsage`,
    partial fields, wrong types, negative, multiple events, truncated/malformed output, a model with only some fields); adapter conformance tests through the existing fake-provider approach with usage in
    the fake output; persistence and archive round-trip; audit projection (populated, null hop, lower bound, coverage counts, limits transitions, privacy guard, and the old-archive byte-identity guarantee
    using an archive built the old way by the existing fixtures); report rendering; an end-to-end case in the existing fake-provider integration test showing usage from archive to report. Keep all existing
    tests green. Existing assertions that pin the unconditional `usage_not_reported`/`usage None` behavior may be changed ONLY where this change deliberately replaces them, and each such change is listed
    in the verification record. Do not weaken or delete other assertions.

    6. FRONT-DOOR DOCS-SYNC CHECK (mandatory: this applies the engineering convention in `docs/developer_guide/ch03_engineering_conventions.adoc`, section `frontdoor-docs-sync`; read it). The Front Door''s
    observable behavior changes (audit.json, report, limits). Check every owner and edit exactly those whose statements became inaccurate, incomplete or misleading: the Operator Manual (`docs/operator_manual/ch09_consumer_quickstart/01_quickstart.adoc`
    limitations item "No token usage is reported", the sample `not done    limits:` lines in `02_first_run_example.adoc` and `03_tutorial_program_change.adoc`, whose listings are quoted from the demo kit
    and guarded by `tests/architecture/test_tutorial_kit_quotes.py`/`test_consumer_tutorial_pages.py` and `examples/consumer-demo`, `ch10_level1_orchestration/01_operating_pattern.adoc` section `level1-cost`,
    `ch09 00_overview.adoc` cost sentence, and whichever of ch03/ch04/ch06/ch07 describe audit or report output); `docs/release_notes/release_notes.adoc` (planned entry for the next version only, never
    the released text); `docs/developer_guide/ch04_release_management.adoc` (the release smoke-test row that pins `limits` including `usage_not_reported`, and any release check script expectation: check
    `scripts/wfc_release_check.py` and tests, and say so if one needs the same change); the Agent Skill sources `src/workflow_coordinator/agent_skill/wfc/` (the skill currently says nothing about usage;
    decide whether a short accurate statement in `references/stops-and-evidence.md` about reading the report''s usage and limits is warranted, keep the contract tests in `tests/unit/test_agent_skill_content.py`
    and `tests/unit/test_frontdoor_skill.py` green, and do not introduce unverifiable claims); and the DG-1 backlog passages (`docs/backlog/beta1_productization.adoc`, `docs/backlog/_open.adoc`: record
    what is now delivered and what remains, without inventing acceptance). Historical records under `docs/cold_storage/` and `docs/warm_storage/` are immutable provenance: never edit them. Record the outcome
    of the check as a table (owner, statement checked, result: unchanged because still true / edited, why) in the verification record, including every owner you examined and left unchanged.

    7. Verification record: one compact `docs/warm_storage/post-beta-planning/wfc_token_usage_verification.adoc`: the decisions and reasons (record format, location, coverage definition, Codex multi-event
    rule, lower-bound semantics, limit codes, compatibility argument), the provider-semantics difference and its unverified assumptions, changed contracts, the docs-sync table, deliberate assertion replacements,
    measured checks (exact commands and results, what you could not run and why), and the explicit non-goals (no prices, no estimates, no status changes, no adapter behavior change beyond reading usage).


    NON-GOALS AND WITHHELD FOR EVERY HOP: no change of routing, acceptance, review, Finding, admission, trusted-Git, sandbox, scope or lifecycle semantics; no change to the provider invocation command lines,
    prompts, models or reasoning settings; no monetary values; no estimates; no capture of provider output beyond the numeric usage fields and model identifiers; no `wfc.audit/2` or other breaking schema
    change; no change of `robust@v1`/`simple@v1` program records or pinned resource files (`src/workflow_coordinator/resources/**`) unless unavoidable (then update the digest and tests in the same change
    and say so); no change to `.wfc/`, `governance/`, `.github/`, version literals; no new dependency; no push, tag, release, publication, Runtime promotion or installation; no other repository; never read
    or write anything under `~/.local/state` or the Evidence repository. A file outside the declared scope that proves necessary is a scope question for the human (stop and say which file and why), not
    a reason to widen or work around.


    ENVIRONMENT: the Coordinator''s task-check runs the full required suite (`python -m pytest -q`) after your Hop with verified offline inputs; your sandbox may lack them, so do not claim full-suite counts
    you did not measure. Find a Python with pytest and PyYAML; run targeted files with `--wfc-partial` plus explicit paths and say exactly what you ran. `python -m ruff check .` is the lint gate. Strict
    doc render `asciidoctor --safe-mode=safe -a assembled -o /dev/null --failure-level=WARN <file>` must print nothing for each changed .adoc. `python3 scripts/wfc_doc_catalog.py check` must not report
    more unresolved links or Project Memory misses than before your change (note the baseline first).


    COMMIT MECHANICS (binding): no git command that writes (no add, mv, rm, reset, stash, commit); the index stays untouched; `commit_intent.paths` is a JSON array with exactly one plain repository-relative
    path per element (every new, modified or deleted leaf individually; no sentence, count, glob or directory); derive it from `git status --short -uall` and compare the counts before you finish. Leave
    no stray file behind (no `__pycache__`, build output, or a generated `.claude/skills/wfc/` that Git does not ignore). Never put untracked /dev/null-like wrapper entries into the CommitIntent. A Worker
    never reports any Finding operation; only the independent reviewer opens and resolves Findings.


    REVIEW FOCUS (independent reviewer, whole candidate, by your own execution): no number is ever estimated, defaulted to zero or presented as exact when partly unknown; cost/price fields are not captured
    anywhere; usage parsing can never change a Hop outcome, raise, or leak non-numeric provider content into Run state, archive or report; the old-archive byte-identical reprojection holds (run it); the
    audit allow-lists and privacy guard are intact; Claude vs Codex semantics (cache inclusion) are represented faithfully and the aggregation does not mix them incorrectly; coverage and lower-bound logic
    is correct for mixed Runs (some complete, some none); the per-role and per-model aggregates equal the per-invocation records (check by execution); no write surface beyond the Run''s own checkout state
    and the additive archive; the docs-sync table is complete and each unchanged/edited decision is justified against the files; tests fail without the implementation.'
  acceptance: Provider-reported usage is captured for both adapters from the verified sample formats, persisted per invocation with Hop, role and model, archived additively, projected into audit.json (per
    hop, plus run totals, per-role, per-model and coverage when any usage exists) and shown in wfc report; unknown stays unknown with explicit lower-bound and coverage semantics and no estimates, prices
    or zero-fill; pre-change archives reproject byte-identically; usage parsing cannot affect any Hop outcome; the Front Door docs-sync check is performed over all owners with a complete table and every
    inaccurate statement corrected; existing tests pass with only deliberately replaced assertions listed; new tests fail without the implementation; the verification record is complete and honest; the
    full required suite and quality gates pass; the independent whole-candidate review accepted with no blocking Finding; CommitIntent array has one plain path per element; Coordinator task-check passed.
  withheld_authority: No change of routing, acceptance, review, Finding, admission, trusted-Git, sandbox, scope or lifecycle semantics; no provider command-line, prompt or model change; no monetary values
    or estimates; no breaking audit schema change; no weakening or skipping of tests; no edit of historical cold/warm storage records; no Runtime promotion, installation, push, tag, publication, external
    repository change; no operation on ~/.local/state or the Evidence repository; no self-acceptance.
  escalation_default: Escalate a requirement that would need a breaking audit schema change, weaken a safety or authority boundary or the privacy guard, a needed file outside the scope, and missing required
    evidence. Do not silently substitute models. Incomplete work alone is not blocked.
