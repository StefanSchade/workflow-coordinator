program:
  id: robust
  revision: v1
task:
  title: 'Beta-2 O8: an explicit, recorded maintainer extension of a budget-stopped Run''s Hop budget'
  body: 'GOAL. Implement plan slice O8 (decision D7a): an EXPLICIT, TRACEABLY RECORDED Hop-budget extension by the maintainer for a Run that stopped on `awaiting_human_budget`, so continuing it no longer
    needs a full successor Commission with its own review chain (friction entries 15 and 19: a Run stopped one Broad Review short with one open blocking Finding whose whole content was a single unused import).
    Read the revision section of `docs/backlog/beta2_operator_efficiency_plan.adoc`, the slice `[[o8]]` (its design questions and acceptance are BINDING), the record `docs/backlog/FTR-WFC-STOPPED-RUN-CONTINUATION-ECONOMY.adoc`
    (the exact code facts: `RunStatus.AWAITING_HUMAN_BUDGET` at `model.py:132`, set at `reducer.py:1968-1981` and `:2046-2056` with `semantic_stop` untouched; the successor preparation gate that a budget
    stop fails at `operator.py:1688`; mechanical recovery refusing it at `frontdoor/lifecycle.py:887-888`; the manual''s statement at `operator_manual/ch06_recovery/02_successors.adoc:118-119`; the skill''s
    statement at `agent_skill/wfc/references/commission.md`), and the recovery record `docs/backlog/FTR-WFC-ATOMIC-HOP-RECOVERY.adoc` (`WFC-AUTO-05`: used Hops are never reset, resume and recovery require
    explicit maintainer authority).


    MAINTAINER DECISIONS (binding). D7a: IMPLEMENT an explicit, traceably recorded budget extension by the maintainer. An AUTONOMOUS budget raise by an agent stays EXCLUDED. D7b: Worker-only closure of
    Findings is REJECTED and must not be built or enabled by any side effect of this slice: the independent reviewer''s sole Finding authority is untouched; the extension only lets the SAME Run continue
    through its existing reviewed workflow. The Beta rule applies (contracts, schemas, CLI and persistence formats are provisional; preserve the intended safety and governance properties, not necessarily
    their present realisation): you may change how the effective limit is stored and enforced if that is the cleanest way, but you must preserve: used Hops are never reset or refunded (`WFC-AUTO-05`), the
    extension is explicit and recorded with who/what authorised it, when, how much and against which Run state, it cannot apply to a Run in any other state, it is visible in `wfc status`, `wfc report`,
    audit and the archive, and the original admitted Commission and its digest remain verifiable.


    DESIGN FIRST. Before implementing, write a dated `Design` section in the record stating: where the effective limit lives (for example a journaled maintainer-authority event that raises the effective
    ceiling without rewriting the admitted Commission''s governing truth, versus another form; justify), what the command is (a new subcommand or an option of `wfc resume`; one clear surface), what it asks
    of the human (an explicit amount, a recorded authority statement that names the maintainer''s instruction, a visible confirmation that shows Run id, current usage and the new ceiling) and its bounds
    (a maximum extension per call or in total, so an extension cannot silently become unlimited; document the bound and why), what happens at the checkpoint/ownership-lock level, interaction with the one-Run-per-checkout
    lifecycle and with `wfc resume`/reconcile for other stop classes, and, stated HONESTLY, what the command cannot enforce against an agent that supplies the flags itself: the Level-1 operator is an agent
    that already passes `--yes` for launches, so technical prevention of an agent extending its own budget is impossible at the CLI; the controls are the recorded authority statement (which names a human
    instruction that the record makes auditable), the skill rule that an agent never extends a budget without the maintainer''s explicit instruction in the current session and says so in its report, and
    the visibility of every extension. If you can devise a stronger control that does not need a new infrastructure component (for example refusing when the authority statement is empty or when a flag spelled
    like the launch authorisation is the only evidence), evaluate it in the design and adopt it only if it is sound. If no realisation preserves a named property, end with a blocking Finding or an honest
    stop and the open decision, not a weaker safeguard.


    WHAT MUST BE TRUE AT THE END. A Run in `awaiting_human_budget` can be continued with a recorded maintainer extension and then proceeds in its existing phase with its Run-local Findings, pinned governing
    truth and charged-Hop history intact; the extension is refused for every other Run state and for an extension beyond the documented bound or without an authority statement; the Hop charging rules are
    unchanged; status, report, audit and archive show the extension; the `successor` path, `wfc resume` for the mechanical durable-artifact anomaly and every other stop class behave exactly as before; every
    refusal is named; tests cover the accepted path and each refusal, the visibility surfaces and the unchanged behaviours (include a test that used Hops are not reset and one that an extension on a non-budget
    stop is refused).


    DOCUMENTATION. Front Door docs-sync applies in full: retire in the Agent Skill sources (`src/workflow_coordinator/agent_skill/wfc/`, replace rather than append) and the Operator Manual (chapters 3,
    6, 7, 10) and in the operator-guidance record the statements that say there is no in-place budget raise (planned for O8 by the O1 slice), document the command, the bound and the agent rule (an agent
    never extends a budget on its own), update the budget-exhaustion text of the failure-mode tables, and add a dated implementation note to the record.


    PLAN CONTEXT (binding). This Commission implements slice O8 of the Beta-2 operator-efficiency plan (`docs/backlog/beta2_operator_efficiency_plan.adoc`, section "Revision of 2026-11-26" and the slice''s
    own section; read the revision first, then the slice and the record it names). The maintainer''s decisions D1-D7 of 2026-11-26 and the Beta rule are part of it: contracts, schemas, CLI surfaces and
    programs are provisional in Beta, the existence of an accepted contract is no argument against a change, and what must be preserved are the intended safety and governance properties (independent reviewer''s
    sole Finding authority, trusted-commit boundary, fail-closed admission and recovery, one Run per checkout), not necessarily their present technical realisation. Judge every change on benefit, effort,
    risk and dependencies. Where a design is needed, the FIRST thing you do is write the design down (what you decide, the alternatives you reject and why, which safety property each decision preserves)
    as a short dated `Design` section of the record the slice names (never in a review artifact: those belong to the reviewers), so the reviewers judge the design before the code. A slice without a design
    question (a mechanical one) needs no such section.


    FRONT DOOR DOCS-SYNC (binding). Apply `docs/developer_guide/ch03_engineering_conventions.adoc` section `frontdoor-docs-sync`: when Front Door behaviour or the operating surface changes, check the Operator
    Manual, the consumer tutorials and the shipped Agent Skill sources (`src/workflow_coordinator/agent_skill/wfc/`) and edit what became inaccurate, incomplete or misleading in the same slice (retire statements
    an earlier slice wrote as "planned"); if the slice changes no Front Door behaviour, say so in one sentence in your result.


    CHECKS. The Coordinator''s task-check after every Hop is the evidence command of this Commission and is authoritative (real `bwrap`, offline bundle, about six minutes). Your Hop sandbox cannot start
    `bwrap`, has a read-only `/tmp` and no network: run the focused tests you can and `python -m ruff check .`, and reason carefully about the rest. Strict render for every new or changed .adoc (`asciidoctor
    --safe-mode=safe -a assembled -o /dev/null --failure-level=WARN <file>` prints nothing); `python3 scripts/wfc_doc_catalog.py generate` then `check` must not report more unresolved links (baseline 83)
    or Project Memory misses (baseline 4); generated catalog output must not be left as a stray file. Unused imports and similar residue of a removal are the defect class the lint gate exists for: run `python
    -m ruff check .` before you finish.


    COMMIT AND INDEX DISCIPLINE (binding, mechanical). Use NO git command that writes: never `git add`, `git commit`, `git stash`, `git reset`, `git mv`, `git rm`, `git checkout -- <path>` or any other
    index or history mutation; the index must remain untouched, so `git status --short` shows only unstaged working-tree changes when you finish. Your result''s CommitIntent `subject` MUST contain the WorkItem
    id and the current Hop id, for example `feat(frontdoor): <what you did> (WI-WFC-BETA2-O8-001, H001)` (use the real Hop id of this Hop). `commit_intent.paths` is a JSON array with exactly one plain repository-relative
    path per element: every new, modified or deleted leaf individually (no sentence, count, glob or directory); derive it from `git status --short -uall` and compare the counts before you finish. Deliver
    a complete candidate in the first Hop; a late correction costs three Hops. Leave no stray file behind. A Worker never reports any Finding operation; only the independent reviewer opens and resolves
    Findings.'
  acceptance: A Run in awaiting_human_budget can be continued after a recorded maintainer extension (amount, authority statement, time, Run state) within a documented bound, with used Hops still charged,
    Findings, phase and pinned governing truth intact; every other state and every out-of-bound or unauthorised-statement call is refused by name; the extension is visible in status, report, audit and archive;
    the original Commission digest stays verifiable; no other stop class or the successor path changes; D7b is untouched; the limits of CLI-level enforcement are stated honestly and the agent rule is in
    the skill; the Design section exists; the evidence command passes. No existing test is weakened, skipped or deleted; strict render prints nothing; the doc catalog check shows no additional unresolved
    links or Project Memory misses; `ruff check .` is clean; the full evidence command passes; the independent focused and whole-candidate broad reviews accepted with no blocking Finding; CommitIntent array
    has one plain path per element; Coordinator task-check passed.
  withheld_authority: No `.wfc/config.yaml`, governance/, `.github/`, scope-ceiling or release-workflow change; no push, tag, release, publication or Runtime promotion; no `wfc skill install`; no change
    beyond the slice scope; no weakening, skipping or deletion of a test; no change of the independent reviewer's sole Finding authority or of the trusted-commit boundary; no self-acceptance. No change
    to the independent reviewer's sole Finding authority; no Worker-only Finding closure (D7b); used Hops are never reset; no autonomous (agent-initiated) extension path that bypasses the recorded authority
    statement.
  escalation_default: Escalate a needed file outside the scope, a safety or authority property that cannot be preserved by any realisation of the slice (record the open decision with options and a recommendation),
    and a conflict with a recorded maintainer decision. Do not silently substitute models. Incomplete work alone is not blocked.
