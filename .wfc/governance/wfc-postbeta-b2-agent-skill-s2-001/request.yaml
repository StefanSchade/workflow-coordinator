personas:
  worker: 'Careful engineer: implement the explicit, idempotent installer exactly as specified, with safe filesystem handling
    (staging outside the skills root, no symlink following, no overwrite without --force), and test every state for both hosts
    independently.'
  independent_reviewer: 'Fresh adversarial reviewer: attack the installer''s filesystem behaviour (symlinks, partial writes,
    foreign and modified directories, staging), host independence of status, the dispatcher fall-through, the boundary guard
    and the built-wheel path by your own execution; confirm the quickstart guard''s semantics are unchanged; accept on evidence
    only.'
