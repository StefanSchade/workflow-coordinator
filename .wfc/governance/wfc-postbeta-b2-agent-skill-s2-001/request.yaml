commission_id: wfc-postbeta-b2-agent-skill-s2-001
work_item_id: WI-WFC-POSTBETA-B2-AGENT-SKILL-S2-001
authority_source: 'Maintainer authorization of 2026-11-23 (post-Beta implementation of the consumer surface and the Agent
  Skill): Agent Skill slice S2, as specified by the named FTR; bounded robust@v1 Commission with Claude Sonnet worker and
  independent Claude Opus (high) reviewer; no push, tag, release, publication or Runtime promotion. tests/unit/test_quickstart_commands.py
  is in scope by the maintainer''s decision of 2026-11-23, limited to recognising the new skill subcommand with the guard''s
  validation semantics unchanged.'
program:
  id: robust
  revision: v1
task:
  title: 'B2: Agent Skill S2 -- the wfc skill command, installation semantics, tests and documentation'
  body: 'Implement slice S2 ("The wfc skill command") of docs/backlog/FTR-WFC-AGENT-SKILL-DISTRIBUTION.adoc on top of the
    integrated slice S1 (the four packaged skill files, the package-data entries, the extended artifact audit and tests/unit/test_agent_skill_content.py
    with its `PENDING_SUBCOMMANDS = {"skill"}` exemption already exist: read them first). READ FIRST and treat as the specification:
    that FTR in full, especially `Command interface`, `Installed state and install semantics`, `Status semantics`, `The skill''s
    preflight`, the security invariants SI-1 to SI-11, acceptance criteria AC-1 to AC-8, `Required tests` marked S2 and the
    S2 entry of `Implementation sequence` with its notes for commissioning. Read src/workflow_coordinator/frontdoor/cli.py
    (the dispatcher and the legacy fall-through to operator.main), an existing Front Door module such as frontdoor/init.py
    for the output voice (`STATE:`-style lines, `NEXT EXPLICIT ACTION:`, `NOTHING ... WAS ...`), tests/architecture/test_package_boundaries.py
    and the existing build-and-install test in tests/architecture/test_offline_distribution.py.


    DO, exactly S2: (1) src/workflow_coordinator/frontdoor/skill.py (new): `wfc skill install (claude|codex) [--scope user|project]
    [--repository PATH] [--skills-dir DIR] [--dry-run] [--force]`, `wfc skill status (claude|codex) [--scope user|project]
    [--repository PATH] [--skills-dir DIR] [--json]`, `wfc skill show [FILE] [--list]`, with the destination table (CLAUDE_CONFIG_DIR
    honoured for claude user scope; `$HOME/.agents/skills/wfc` for codex user scope; the Git top-level of --repository for
    project scope; `--skills-dir DIR` addressing `DIR/wfc` and excluding `--scope`), the five states `absent`, `current`,
    `stale`, `modified`, `foreign` and their install actions, the marker `.wfc-skill.json` (`schema` 1, `wfc_version`, `files`
    with a SHA-256 per relative path, no timestamp, equal inputs give equal bytes), the symbolic-link refusal (return 2, with
    or without --force, never followed or replaced), the refusal of project scope outside a Git work tree (return 2), staging
    of the new directory in the PARENT of the skills root and rename into place (never a staged copy inside the skills root;
    a failure leaves the old installation, the new one or none, never a partial one), `--dry-run` (prints state and planned
    action, writes nothing, returns what the real call would return), the output lines and return codes 0/2/3 exactly as specified,
    the status text and `--json` shapes, and `show`/`--list`. Standard library only; the module may import implementation_identity.VERSION
    and nothing else from the package; all content comes from the installed package''s own files (importlib.resources or the
    package directory), never from a checkout path. It never starts, resumes or authorizes a Run, never imports the engine,
    never reads or writes `.wfc/`, the journal or Evidence, never commits or stages, never writes CLAUDE.md, AGENTS.md, .gitignore,
    host settings or permission files. (2) src/workflow_coordinator/frontdoor/cli.py: exactly one dispatch branch for `args[:1]
    == [''skill'']`; `--help` on `wfc skill` and on each subcommand prints usage and returns 0; a bare `wfc skill`, a missing
    host and an unknown subcommand print usage and return 2; none falls through to the legacy operator entry point; no other
    subcommand''s behaviour or output changes. (3) Tests: tests/unit/test_frontdoor_skill.py (new) with the state machine
    for both hosts and both scopes (idempotent second install with identical bytes; `stale` replaced; `modified` and `foreign`
    return 3 and change nothing; `--force` replaces; `--dry-run` leaves the file system identical; symbolic-link destination
    returns 2; CLAUDE_CONFIG_DIR and --skills-dir honoured), the status semantics (required host; one block per installation;
    --scope and --skills-dir select exactly one; project omitted outside a Git work tree; return 0 for every state; JSON shape)
    including the independence case in both directions (with one host''s installation `current`, make the other host''s installation
    in turn absent, stale and modified and assert the first host''s `status` output is byte-identical each time), project
    scope (refused outside a Git work tree; afterwards `git status --porcelain` shows only the destination as untracked, index
    and HEAD unchanged, `.wfc/` untouched), and the dispatcher cases; every test that installs uses a temporary HOME and never
    the real one. tests/architecture/test_package_boundaries.py: the AST boundary guard (skill.py imports only the standard
    library and implementation_identity; no module but frontdoor/cli.py imports it). tests/architecture/test_offline_distribution.py:
    extend the existing build-and-install test so that, in the clean environment and from a directory outside the checkout,
    `wfc skill show` prints the packaged SKILL.md and `wfc skill install` works for both hosts into a temporary home (AC-2).
    tests/unit/test_agent_skill_content.py: remove the `PENDING_SUBCOMMANDS` exemption so the drift guard checks the `wfc
    skill ...` lines of the skill text against the real parser. tests/unit/test_quickstart_commands.py (maintainer decision
    of 2026-11-23, in scope for this one purpose): teach the existing guard to recognise the new `skill` subcommand so that
    the documented `wfc skill ...` lines of the quickstart are checked against the real parser; the guard''s existing validation
    semantics stay unchanged, no existing assertion is weakened, removed or re-scoped, and no other subcommand''s handling
    changes. (4) Documentation in this slice: a step "install the agent skill" after the Install section of docs/operator_manual/ch09_consumer_quickstart/01_quickstart.adoc
    naming the explicit invocation (`/wfc` in Claude Code, `$wfc` in Codex) as the supported entry; a pointer in docs/operator_manual/ch10_level1_orchestration/_chapter.adoc
    saying the skill is the packaged distillation of that chapter, which stays the owner; the command index in docs/operator_manual/ch08_examples/02_command_flow.adoc;
    and a `== 0.1.0b2 -- planned` section in docs/release_notes/release_notes.adoc that describes the skill and states that
    it is not yet qualified with fresh agents. The existing `== 0.1.0b1 -- (released)` section is frozen and must not be edited;
    the new planned section is placed as the file''s Standing paragraph and the existing order imply (read the file first)
    and claims no release date and no qualification. Follow the link rule now in docs/ai_info/doc_conventions.adoc (a cross-file
    reference uses `link:`, never `<<anchor>>`); the standalone-link guard tests/architecture/test_manual_standalone_links.py
    must stay green. CHECKS to run and record: the new and changed tests (targeted, `--wfc-partial`), `python -m ruff check
    .`, a real build followed by the audit and a clean-environment install where your sandbox can do it (otherwise rely on
    the distribution test and say so), a manual `wfc skill install claude` and `codex` into a temporary HOME with `status`
    and `show` output shown (never the real HOME), the strict render of docs/operator_manual/operator_manual.adoc and docs/release_notes/release_notes.adoc,
    the catalog check, and `python3 scripts/wfc_release_check.py` to confirm that the release-notes check still finds the
    frozen 0.1.0b1 section (it fails for other, expected reasons in a worktree: report only the notes and README results).


    ENVIRONMENT: the Coordinator''s task-check runs the full required suite (`python -m pytest -q`) after your Hop with verified
    offline inputs; your own sandbox may lack them, so do not claim full-suite counts you did not measure. Find a Python that
    has pytest and PyYAML (`python -m pytest --version`, else `python3`); run targeted test files with `--wfc-partial` plus
    explicit paths (the repository''s explicit marker for a partial run) and say exactly what you ran. `python -m ruff check
    .` is the lint gate (`make lint`). The strict documentation render is `asciidoctor --safe-mode=safe -a assembled -o /dev/null
    --failure-level=WARN <file>` and must print nothing. `python3 scripts/wfc_doc_catalog.py generate` then `check` must report
    no additional unresolved link or Project Memory miss (currently 83 and 4).


    WITHHELD FOR EVERY SLICE: no change to adapters, the reducer, admission, the Trusted Commit, existing subcommands'' behaviour
    or output, the release workflow (.github/), the version literals (pyproject.toml version, implementation_identity.VERSION),
    governance/ or archived review records; no new runtime dependency; no push, tag, release, publication, Runtime promotion
    or provider call beyond this Run''s own role sessions; no write to any real agent configuration or to the real HOME. A
    file outside the declared scope that proves necessary is a scope question for the human (stop and say which file and why),
    not a reason to widen or to work around.


    NOTE: `git status --short -uall` in an agent worktree may list about 22 untracked /dev/null-like entries injected by the
    wrapper; they are not your output, never put them in the CommitIntent. A Worker never reports any Finding operation (open,
    resolve, residual or any other delta); only the independent reviewer opens and resolves Findings. COMMIT MECHANICS (binding):
    no git command that writes (no add, mv, rm, reset, stash, commit); the index stays untouched; `commit_intent.paths` is
    a JSON array with exactly one plain repository-relative path per element (every new, modified or deleted leaf individually;
    no sentence, count, glob or directory); derive it from `git status --short -uall` and compare the counts before you finish;
    state counts in the summary, never in the array. Leave no stray file behind (no `__pycache__`, build output or scratch
    inside the repository that Git does not ignore).'
  acceptance: frontdoor/skill.py implements install, status and show exactly as the FTR specifies and cli.py gained exactly
    one dispatch branch with the specified help and usage behaviour and no fall-through to the legacy entry point; the states
    and install semantics hold for both hosts and both scopes including idempotence, --dry-run, --force and the symbolic-link
    refusal (AC-3); the status semantics hold including host independence in both directions (AC-4, SI-11); project scope
    writes only the destination and never commits or stages (SI-5); nothing is overwritten without --force except an unmodified
    WFC-installed copy (SI-6); skill.py imports only the standard library and implementation_identity and no module but cli.py
    imports it (SI-4, SI-10); from a built wheel in a clean environment outside the checkout `wfc skill show` prints the packaged
    SKILL.md and `wfc skill install` works for both hosts into a temporary home (AC-1, AC-2); the PENDING_SUBCOMMANDS exemption
    is removed and the skill text's commands pass the drift guard (AC-6); tests/unit/test_quickstart_commands.py recognises
    the `skill` subcommand with its existing validation semantics unchanged; the four documentation changes exist, the frozen
    0.1.0b1 release-notes section is byte-identical and the new 0.1.0b2 planned section claims no qualification and no date;
    `make check` passes, no other existing test changed in meaning and no existing subcommand's output changed (AC-8); the
    full required suite is green; CommitIntent array one plain path per element; independently accepted with no blocking Finding
    and Coordinator task-check passed.
  withheld_authority: 'Only slice S2: no change to the four skill files, pyproject.toml, scripts/wfc_dist_audit.py, the adapters,
    the engine, admission, the Trusted Commit or any module under src/ other than frontdoor/skill.py and the one dispatch
    branch in frontdoor/cli.py; no `uninstall`, `update`, host auto-detection or all-hosts status; no agents/openai.yaml;
    no host probe or fresh-context qualification (slice S3 is not authorized); no edit of the released 0.1.0b1 release-notes
    section; no write to the real HOME or any real agent configuration.'
  escalation_default: Escalate a conflict between the FTR and the implementation or the CLI (name it; do not resolve it by
    guessing), a needed file outside the scope, or a requirement that would change product semantics or a withheld authority;
    incomplete work alone is not blocked.
