    docs/backlog/BUG-WFC-SELF-DEVELOPMENT-GATE-FINDING-AUTHORITY.adoc, docs/backlog/FTR-WFC-DOCUMENTATION-CURATION.adoc, docs/backlog/_open.adoc,
