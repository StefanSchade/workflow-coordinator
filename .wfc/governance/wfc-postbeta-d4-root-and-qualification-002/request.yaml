    moved concept edit ONLY the target part of those three relative links so that they resolve from docs/warm_storage/projected-result-contracts/;
    keep every label and every other character; this is the sole body change allowed; V3''s unresolved count must then be
    not above 83. Report the three edits. Everything else of the task is unchanged, the previous attempt is on the local branch
    `salvage/postbeta-d4-001-h001` (you cannot see it; redo the work from the current checkout).'
