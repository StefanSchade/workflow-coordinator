    and the path mention in the table of docs/backlog/FTR-WFC-DOCUMENTATION-CURATION.adoc so that they name the new location;
    add one row for the new group to docs/warm_storage/README.adoc (the README then describes eleven groups; keep it one table).
    Plain-text path mentions in cold storage, archived reviews, governance/ and frozen manifests are historical and stay unedited.
    (2) MOVE docs/qualification/claude-haiku-20261110/ (README.md, fixture.txt, nested/results.txt: three files) to docs/cold_storage/sources/pre-0.1.0b1/qualification/claude-haiku-20261110/
    and make the directory docs/qualification/ disappear; it is reachable from the cold sources group README (add one line
    there) and from no active index; the manual''s `docs/qualification/<new-commission-id>` sample scope in ch08_examples/03_commission_to_archive.adoc
    names a pattern, not these leaves, and stays unedited. (3) UPDATE docs/README.adoc (its document table and the ''Other
    sources'' bullet must describe the new warm groups including projected-result-contracts and must no longer name warm_storage/concepts/;
    the docs root then holds exactly README.adoc, architecture.md and project_memory.adoc) and docs/ai_info/_ai_info.adoc
    (the router; correct ''all eight chapters'' at line 68 to nine, matching operator_manual.adoc and docs/README.adoc; update
    any other warm-path statement that D3 made false). PROJECT MEMORY (maintainer decision of 2026-11-21, option 1, temporary
    file-exact scope exception): update ONLY the `source_path` of DEC-WFC-011 in `project_memory/canonical/decisions.json`
    to the new concept path and nothing else in it. MAINTAINER PRINCIPLES (binding): create NO redirect, stub, shim, tombstone,
    forwarding README or parallel tree; archived Run evidence and governance/ are not changed; no basename renamed, no document
    body edited, summarized, merged or retired (sole exception: the three link targets of the moved concept); no new header,
    field, index or lifecycle state beyond the rows named. Report the abandoned paths. COMMIT MECHANICS (lessons of the five
    D3 attempts, all binding): move files with the plain filesystem, NOT git mv, and run no git command that writes (no add,
    rm, mv, reset, stash, commit); the index must stay untouched. `commit_intent.paths` is a JSON array with exactly one element
    per path: the old path and the new path of every move individually plus every modified leaf, each element one plain repository-relative
    path, nothing else (no sentence, count, glob, directory or abbreviation, not even for few paths); derive it from `git
    status --short -uall` and compare the counts of deleted, new and modified paths with the array before you finish; state
    the counts in your summary, never in the array. VERIFY with the plan''s checks with measured before and after values:
    V1 (strict Asciidoctor render of the listed books and entry points), V2 (python3 scripts/wfc_doc_catalog.py generate:
    report the count change; the move of two files and one README row must not change the count except by what the moves of
    the qualification leaves into the catalog scope change, which you must explain), V3 (python3 scripts/wfc_doc_catalog.py
    check: exit 0, unresolved links and source_path misses not above the recomputed baselines) and V4 (no live link, xref
    or include to the old concept path or to docs/qualification/ except the named historical exclusions). Add no new script,
    make target or report. PROPORTION (maintainer principle): move, repoint, correct the index; nothing else. A Worker never
    reports any Finding operation (resolve, residual or any other delta); only the independent reviewer opens and resolves
    Findings. SUCCESSOR NOTE AND OPERATOR DECISION: the predecessor Run (RUN-00a48354) did all of this correctly (plain mv,
    no Git write, 22 one-per-element paths with matching counts, V1 clean) and stopped on ONE semantic question: the moved
    concept''s own unedited body holds relative links at lines 11, 32 and 733 (`backlog/_open.adoc` and `cold_storage/backlog/pre-0.1.0b1/operator-harness-v0/wfc_operator_harness_v0_concept_2026-10-06.adoc`,
    resolving only while the file sat at docs/) that no longer resolve one or two directories deeper, raising V3 from 83 to
