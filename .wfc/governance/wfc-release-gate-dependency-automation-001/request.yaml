authority_source: 'Repository owner delegation 2026-11-25 (Beta-2 release streamlining: Level-1 implements the accepted plan slice by slice, one at a time), maintainer decisions D6 = Option A (python-compat
  as gate G9) and D3 (Dependabot, automerge only for check-job actions) of 2026-11-25, and the maintainer''s grant of temporary, file-exact scope-ceiling entries for .github/workflows/release.yml and .github/dependabot.yml:
  slice R5, robust@v1, Claude Sonnet worker, Claude Opus independent broad review and Claude Sonnet focused review (phase execution binding, maintainer decision of 2026-11-25), all reasoning high; local
  integration only; no push, tag, release, publication, GitHub setting or Runtime promotion.'
program:
  id: robust
  revision: v1
task:
  title: python-compat as gate G9 and Dependabot for the workflow actions (slice R5)
  body: 'GOAL. Implement slice R5 of the accepted Beta-2 release-streamlining plan: make the existing `python-compat` job a numbered release gate G9 (maintainer decision D6 = Option A, 2026-11-25) and add
    Dependabot for the workflow actions (maintainer decision D3, 2026-11-25), with automerge-eligible actions kept separable from publish-path actions. The specification is `docs/backlog/FTR-WFC-RELEASE-GATE-AND-DEPENDENCY-AUTOMATION.adoc`
    (decisions it implements, file-exact scope, acceptance, test strategy). Read it completely, plus `docs/backlog/beta2_release_streamlining_plan.adoc` sections `decisions-taken`, R5, D3 and D6 (the options
    text states the accepted risk), and `docs/developer_guide/ch04_release_management.adoc` (the CI section, the gate list and the sentence scoping the gate class, the runbook, the recovery table). Where
    this task text and the FTR differ, the FTR governs and you report the difference. R2, R1 and R3 are integrated; the chapter already describes the pipeline as R3 left it.


    DO.

    1. `.github/workflows/release.yml`: add `python-compat` to the `needs:` of `publish-testpypi` (the only job-graph edit), and bring the workflow comment that says no job waits for `python-compat` up
    to date. Change nothing else: no job added or removed, no `permissions:`, `environment:`, `if:` or trigger change, no action added, removed or re-pinned.

    2. `.github/dependabot.yml` (new): version 2, ecosystem `github-actions` only, directory `/`, a schedule, a cooldown for new versions, and grouping/labels that let the maintainer''s repository rules
    separate (a) actions that run ONLY in the unprivileged `check` and `python-compat` jobs (today `actions/checkout`, `actions/setup-python`, `actions/upload-artifact`; re-derive this set from the workflow
    yourself) from (b) every action that runs in `publish-testpypi`, `publish-pypi` or `release` (today `actions/download-artifact`, `pypa/gh-action-pypi-publish`; re-derive). Automerge is a GitHub repository
    setting and is NOT configured by any file in this slice; the file must only make the eligible set identifiable (state the mechanism and its limit). Verify every key you use against Dependabot''s documented
    configuration options if you can read them (web access may be unavailable: then mark every key and behaviour as an external assumption in the verification record and keep to the minimal, widely documented
    subset); validate the file parses as YAML.

    3. `docs/developer_guide/ch04_release_management.adoc`: bring every statement the change makes false or incomplete up to date and nothing else: the CI section''s `python-compat` description (it becomes
    a prerequisite of `publish-testpypi`; keep the facts about matrix and permissions), the "informational `python-compat` matrix" mention, the sentence scoping the gate class to G1-G8, the gate list (add
    G9 with its recovery response: a red `python-compat` that is not caused by this repository is re-run, never re-tagged, nothing having been uploaded yet; the recovery table already gives that rule for
    a failure before any upload, reference it), the accepted risk (the 3.10-3.12 jobs install from the ordinary index, not from the offline bundle, so an upstream or index change can turn a release red;
    dropping 3.10 later is a maintainer change), and a runbook/CI line on Dependabot: what it does, that automerge, if the maintainer enables it, applies only to the eligible set, that publish-path action
    updates are reviewed by hand, and the residual risk stated in the FTR (an action in `check` still influences the bytes later published). Keep every decision other than D6 and D3 exactly as it is.

    4. Apply the Front Door docs-sync convention (`docs/developer_guide/ch03_engineering_conventions.adoc`, `frontdoor-docs-sync`): this is CI configuration, no Front Door behavior changes; record the check
    and its answer. Record what you did, the before/after job-graph, permissions and action-pin comparison (programmatic), the Dependabot keys with their verification status, the hosted-run steps you could
    NOT execute and why (nothing may be claimed as having run on GitHub), and the checks you ran in `docs/warm_storage/post-beta-planning/wfc_release_gate_dependency_automation_verification.adoc`.


    STANDING. Scope-ceiling: the maintainer granted temporary, file-exact ceiling entries for `.github/workflows/release.yml` and `.github/dependabot.yml` on 2026-11-25; they exist only in this worktree''s
    `.wfc/config.yaml`. No other `.github/` file. Maintainer decisions D1 (smoke before the tag), D2 (keep TestPyPI), D4, D5 are not touched by this slice. A later, separate maintenance step will update
    the Node-runtime pins of the artifact actions; do NOT touch any pinned SHA here.


    WITHHELD FOR EVERY HOP: no change outside `.github/workflows/release.yml`, `.github/dependabot.yml`, the named chapter-4 statements and the verification record (plus the review artifacts the reviewer
    writes); no product code, test, script, Makefile, pyproject or version change; no `.wfc/` or `governance/` change; no new action, secret, permission or network access in the workflow; no push, tag,
    release, publication, workflow dispatch, GitHub setting (including auto-merge and branch protection) or credential; no Runtime promotion; no weakened or deleted test; no self-acceptance. A file outside
    the declared scope that proves necessary is a scope question for the maintainer (stop and name the file and why), not a reason to widen.


    ENVIRONMENT: the Coordinator''s task-check runs the full required suite (`python -m pytest -q`) after your Hop with verified offline inputs; your sandbox may lack them, so do not claim full-suite counts
    you did not measure. Strict render `asciidoctor --safe-mode=safe -a assembled -o /dev/null --failure-level=WARN <file>` must print nothing for each changed .adoc; `python3 scripts/wfc_doc_catalog.py
    generate` then `check` must not report more unresolved links or Project Memory misses than before your change (note the baseline first; today 83 and 4). Parse both YAML files with a Python YAML loader.
    Leave no stray file, generated catalog or `__pycache__` behind.


    COMMIT MECHANICS (binding): no git command that writes (no add, mv, rm, reset, stash, commit); the index stays untouched; `commit_intent.paths` is a JSON array with exactly one plain repository-relative
    path per element (every new, modified or deleted leaf individually; no sentence, count, glob or directory); derive it from `git status --short -uall` and compare the counts before you finish. Never
    put untracked /dev/null-like wrapper entries into the CommitIntent. A Worker never reports any Finding operation; only the independent reviewer opens and resolves Findings.


    REVIEW FOCUS (independent reviewer, whole candidate, by your own execution): the only job-graph edit is the one `needs:` entry and it creates no cycle (compare the full graph, permissions, environments,
    `if:` and triggers programmatically before and after); no action added or re-pinned; the Dependabot file contains only keys the reviewer can justify, parses, and genuinely separates the check-only actions
    from the publish-path actions (re-derive both sets from the workflow); no document claims that automerge is enabled or that anything ran on GitHub; every chapter-4 statement that the change makes false
    is corrected, none of the other decisions moved, and G9 with its recovery response is consistent with the recovery table; the accepted risk and the residual risk are stated honestly; nothing authorizes
    a push, tag, publication or a GitHub setting.'
  acceptance: 'All acceptance criteria of FTR-WFC-RELEASE-GATE-AND-DEPENDENCY-AUTOMATION are met and evidenced: python-compat is in the needs of publish-testpypi and nothing else in the job graph, permissions,
    environments, triggers or action pins changed (programmatic before/after comparison recorded); .github/dependabot.yml is valid, covers only github-actions, sets a cooldown and makes the check-only action
    set identifiable separately from publish-path actions, with every key''s verification status recorded; chapter 4 contains no statement false for the integrated pipeline, G9 and its recovery response
    and both risks are stated, and no other decision moved; nothing claims automerge or a hosted run; only the named files changed; strict render prints nothing; doc catalog shows no additional unresolved
    links; the full required suite and quality gates pass; the independent whole-candidate review accepted with no blocking Finding; CommitIntent array has one plain path per element; Coordinator task-check
    passed.'
  withheld_authority: No change outside the two .github files, the named chapter-4 statements and the verification record; no other job-graph, permission, environment, trigger or action-pin change; no new
    action, secret or network access; no product code, test, script, Makefile, pyproject or version change; no .wfc/ or governance/ change; no push, tag, release, publication, workflow dispatch, GitHub
    setting (auto-merge, branch protection, Environments) or credential; no Runtime promotion; no weakening or deletion of tests; no self-acceptance.
  escalation_default: Escalate a needed file outside the scope, a requirement that would widen permissions, add an action or re-pin one, and missing required evidence. Do not silently substitute models.
    Incomplete work alone is not blocked.
