    write so every file stays a pure rename, repoint every live link, add the one README, and report recomputed counts and
    measured before and after values of every check.'
  independent_reviewer: 'Fresh adversarial reviewer: re-run V1 to V4 yourself, verify with --find-renames that every move
    is a pure rename, spot-check the basename rule on the groups and the leftover cases, search for any live reference to
    the old directory, check that nothing was recreated as a stub and that only the named source_path values changed in decisions.json;
    apply the simplicity objective; report material defects only and flag a disproportionate criterion for the maintainer
    instead of waiving it.'
