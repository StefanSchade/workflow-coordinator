  MD-1 option 1 (temporary, file-exact scope-ceiling addition for project_memory/canonical/decisions.json for D2-D4); package
  D3 of the accepted plan, D1 and D2 integrated, Runtime 98ac012 contains the rename-aware staged-path projection; not a G0
  declaration, no release, tag or push; Sonnet worker and Opus reviewer through the product Front Door, up to ten Hops. Successor
  of the stopped RUN-5364b169 (scope extended by ten named cold-storage link-target files). Second successor (RUN-fce440be
  stopped on staged state caused by the Operator task text). Third successor (RUN-0a89ee03 stopped on one pair missing from
  the Worker CommitIntent). Fourth successor (RUN-914b4607 stopped on a prose element in the CommitIntent paths array).
program:
  id: robust
  revision: v1
task:
  title: 'P2 package D3: group warm storage into ten workstream directories'
  body: 'Execute package D3 of the accepted documentation-consolidation plan docs/backlog/postbeta_plan_p2_documentation_consolidation.adoc:
    group docs/warm_storage/ into the ten workstream directories of its section 4 and keep every inbound reference working.
    The plan is the specification: read its sections 1-4, 5.3, 6 (checks V1-V4 and baselines), 7 and the package entry D3
    first. IMPORTANT: the plan''s counts date from its planning baseline; warm storage has since gained files (post-beta plans,
    reviews and assessments), D1 and D2 are integrated, and the baselines of V2/V3 moved. Recompute every count and baseline
    (file count per group, inbound link occurrences, V2 record count, V3 unresolved links and source_path misses) on the current
    repository BEFORE changing anything, and report old and new values; the basename rule of section 4.3 assigns every new
    file mechanically (wfc_postbeta_* go to post-beta-planning/, the P3 plan reviews and the D2 review included). DO: move
    every document of docs/warm_storage/concepts/ with a plain filesystem move (not git mv) into its group directory by the
    section 4.3 rule (first match wins, basenames never change, bodies never edited: pure renames); create docs/warm_storage/README.adoc
    as the plan describes (one table, one row per group, no per-group README); delete nothing from warm storage except what
    the plan lists as already retired bridges (verify none remain after D1); repoint every live inbound reference (relative
    links, xrefs and includes from docs/backlog/, docs/research/, docs/developer_guide/, docs/functional_model/, docs/semantic_model/,
    docs/technical_model/, docs/operator_manual/, docs/README.adoc, docs/ai_info/_ai_info.adoc, docs/ai_info/doc_conventions.adoc
    and cross-group links inside warm storage itself) so that it resolves; do not touch links inside archived Run evidence
    or cold storage except link targets that point INTO the moved files, which are retargeted without changing their labels
    (the C4 precedent). PROJECT MEMORY (maintainer decision of 2026-11-21, option 1, temporary file-exact scope exception):
    update ONLY the source_path values in `project_memory/canonical/decisions.json` that cite moved files (the plan counts
    7 values over 3 moving files; verify) and nothing else in it. MAINTAINER PRINCIPLES (binding): historical content stays
    findable but old paths have no entitlement to exist; create NO redirect, stub, shim, tombstone or parallel tree; archived
    Run evidence is not changed; no basename renamed, no document body edited, summarized, merged or retired, no warm-to-cold
    retirement, no new header, field, index or lifecycle state. Report the deliberately abandoned paths as a count per group,
    not file by file. COMMIT MECHANICS: the CommitIntent must name every source AND every destination of every move individually
    (never directories), plus every changed leaf; if the intent is large, that is expected. No agent Git writes. VERIFY with
    the plan''s checks, each with measured before and after values: V1 (strict Asciidoctor render of the listed books and
    entry points), V2 (python3 scripts/wfc_doc_catalog.py generate: records unchanged except +1 for the new README), V3 (python3
    scripts/wfc_doc_catalog.py check: exit 0, unresolved links not above the recomputed baseline, source_path misses not above
    the recomputed baseline), V4 on the prefix docs/warm_storage/concepts/ (no live link or include outside cold storage;
    under the plan''s R1 exclusions none under tests/ beyond archive fixtures and frozen literals, which stay as they are).
    Show with `git diff --find-renames --numstat` over the package range that every moved file is a pure rename with zero
    added or deleted lines, and report each group with its file count. Add no new script, make target or report. PROPORTION
    (maintainer principle): move, repoint, add one README; nothing else. A Worker never reports any Finding operation (resolve,
    residual or any other delta); only the independent reviewer opens and resolves Findings. SUCCESSOR NOTE: the predecessor
    Run RUN-5364b169 completed the whole move in one Hop and was stopped only because its commit named ten cold-storage files
    that were outside its scope (Operator scope error, not a Worker error). Its uncommitted tree is preserved on the local
    branch `salvage/postbeta-d3-001-h001` of the Development repository, but you cannot see it and must not rely on it: redo
    the work from the current checkout, mechanically, by the basename rule. This Commission''s scope now lists the ten cold-storage
    files individually: they hold relative links INTO moved warm documents (expect link-target-only changes, labels kept).
    If you find a further cold or other file with a live link into the moved files that is NOT in scope, do not skip it: stop
    and name it. SECOND SUCCESSOR NOTE (Operator correction): the previous attempt (RUN-fce440be) also completed the whole
    move in one Hop and was stopped only because it left staged state: the earlier task text told it to use `git mv`, which
    writes the index, while agents must make NO Git writes and the Coordinator refuses to commit over a pre-existing index
    (`trusted_commit: pre-existing staged state`). That was the Operator''s error. This time move the files with the plain
    filesystem (`mv`, after creating the group directories) and run NO git command that writes (no git mv, add, rm, reset,
    stash, commit): leave the index untouched; the Coordinator stages and commits from your CommitIntent, which names every
    moved file''s old path (as deleted) and new path (as new) individually. You may use read-only git commands (status, diff,
    ls-files, grep, show). The previous attempts are on the local branches `salvage/postbeta-d3-001-h001` and `salvage/postbeta-d3-002-h001`
    of the Development repository; you cannot see them and must not rely on them. THIRD SUCCESSOR NOTE: the previous attempt
    (RUN-0a89ee03) did the whole move correctly with the plain filesystem and was stopped only because ONE moved pair, `wfc_backlog_consolidation_001_broad_review_2026-11-14.adoc`
    (old path under concepts/ and new path under coordinator-mechanics/), was missing from its CommitIntent (`trusted_commit:
    unexpected dirty path`). It is the Coordinator''s rule that every changed path be named. SELF-CHECK BEFORE YOU FINISH
    (mandatory): derive the CommitIntent mechanically from the real working tree, not from memory: `git status --short -uall`
    lists every deleted old path (` D`) and every new path (`??`); the intent must name EVERY one of them individually plus
    every modified leaf (` M`), and the counts must match exactly: number of old paths named == number of ` D` entries, number
    of new paths named == number of `??` entries (these two numbers are equal for pure moves), number of modified leaves named
    == number of ` M` entries. State the three counts in your result. Also run `git status --short -uall` once more at the
    very end and confirm nothing in it is missing from the intent. Previous attempts are on the local branches `salvage/postbeta-d3-001-h001`,
    `-002-h001` and `-003-h001`; you cannot see them and must not rely on them. FOURTH SUCCESSOR NOTE: the previous attempt
    (RUN-914b4607) did everything right (V1-V4, 144 pure moves, counts) and was stopped only because its structured result''s
    `commit_intent.paths` contained ONE prose string (a sentence saying that 333 leaves were enumerated elsewhere) instead
    of the 333 paths: the Coordinator reads only that array and treated the sentence as a path outside scope. FORM RULE (mandatory):
    `commit_intent.paths` is a JSON array with exactly one element per path: 144 old paths, 145 new paths (the 144 moved plus
    the new docs/warm_storage/README.adoc) and every modified leaf, each element one plain repository-relative path and nothing
    else; no sentence, no count, no glob, no directory, no abbreviation, no comment inside the array. The array may be long
    (about 330 elements); the structured result has no length limit and it is the ONLY place the Coordinator looks. Put your
    counts and explanations in the summary, never in the paths array. Previous attempts are on the local branches `salvage/postbeta-d3-001-h001`
    to `-004-h001`; you cannot see them and must not rely on them.'
  acceptance: Every document formerly in docs/warm_storage/concepts/ lies in exactly the group its basename dictates; docs/warm_storage/concepts/
    no longer exists; docs/warm_storage/README.adoc is one table of the ten groups with their counts; git diff --find-renames
    over the package range shows only pure renames (zero added or deleted lines) besides the README, link repointings and
    the named Project Memory values; no redirect, stub, shim or parallel tree; V1 clean, V2 records unchanged except the one
    new README, V3 exits 0 with unresolved links and source_path misses not above the recomputed baselines, V4 finds no live
    reference to docs/warm_storage/concepts/ outside cold storage and the named exclusions; the recomputed counts and the
    deliberately abandoned paths are reported; independently accepted with no blocking Findings and Coordinator task-check
    passed.
  withheld_authority: No basename renamed; no document body edited, summarized, merged or retired; no per-group README; no
    warm-to-cold retirement; no new header, field, index or lifecycle state; no change to Project Memory beyond the source_path
    values of moved files; no change to src/, scripts/, governance/ or tests logic; no redirect, stub, shim or parallel tree;
    no Runtime promotion, push, merge, rebase or tag.
  escalation_default: Escalate a document the basename rule cannot place, a live consumer the plan or the scope missed (name
    it), a commit the Coordinator refuses for a move, or a check whose recomputed baseline contradicts the plan; incomplete
    work alone is not blocked.
