authority_source: 'Maintainer decisions of 2026-11-21 (G0 order exception, M1-M3, AD-1 to AD-6): one ADR commission with Opus
  worker and Opus reviewer, through the product Front Door, up to twelve Hops; the exception is not a declaration that G0
  is fulfilled; no release, tag or push; no Runtime promotion by the Commission.'
program:
  id: robust
  revision: v1
task:
  title: 'ADR: closed, versioned workflow programs on a generic kernel (AD-1 to AD-6)'
  body: 'Write the post-Beta architecture decision record (ADR) on workflow generality versus closed, versioned workflow programs,
    recording the six maintainer decisions below. This is a DOCUMENT-ONLY Commission: nothing under src/, tests/ or governance/
    changes. Read first: docs/backlog/postbeta_plan_p1_adr_and_hardening.adoc (sections 3, 6 and 7: the decision questions,
    alternatives, evidence and the plan''s recommendations; it is planning input, not authority), docs/backlog/ROADMAP-POST-BETA-TO-RELEASE-BRIEF.adoc
    sections 3.1-3.4, the three backlog records named below, docs/technical_model/ch04_target_and_alternatives/ (the chapter
    the ADR joins) and the code the decisions concern (src/workflow_coordinator/commissioning.py, reducer.py, model.py, structured_result_schema.py,
    frontdoor/lifecycle.py). Verify every repository statement you make against the files; the earlier planning reviews repeatedly
    found misattributed citations and miscounts. DELIVER: (1) the ADR as the new leaf docs/technical_model/ch04_target_and_alternatives/03_adr_closed_versioned_workflow_programs.adoc,
    written in the style of its sibling leaves (ifndef::assembled[] header) and added to docs/technical_model/ch04_target_and_alternatives/_chapter.adoc
    with one include line; the ADR joins the existing Technical Model, it does not create a competing documentation tree;
    (2) a short dated paragraph in each of docs/backlog/FTR-WFC-PHASE-SCOPED-RESULT-SCHEMA.adoc, docs/backlog/FTR-WFC-LIFECYCLE-ROTATION.adoc
    and docs/backlog/FTR-WFC-FRONT-DOOR-PHASE-ENTRY-CONTINUATION.adoc naming the ADR and what it decided for that record;
    leave every Status:: line alone (status flips are the maintainer''s). THE MAINTAINER''S DECISIONS (2026-11-21), to be
    recorded as decisions with their reasons, each with at least one named rejected alternative and an honest statement of
    the effect on complexity and maintainability: AD-1 = C, closed product-owned versioned programs on a generic kernel; consumers
    cannot define their own workflow topology outside a WFC release. Architecture goal to state: new workflow programs should
    come as additional DECLARATIVE program definitions inside a WFC release, without kernel changes, as long as they use the
    existing semantic mechanisms. Total ignorance of concrete phase names in the kernel is not an end in itself; what matters
    is practical extensibility. Describe that boundary correctly from the ACTUAL responsibilities of kernel, compiler and
    resources (what is declarative today, what is compiler code such as program templates, role resources, evidence profile
    literals, durable-artifact keys and the fixed initial phase, what a new program would still require), without overstating
    either way. WFC stays generic at the task level and suitable for non-software tasks; closing the topology does not close
    the task domain. AD-2 = direct@v1 is unsupported and retained as historical material (not removed; nothing under governance/
    is touched). AD-3 = the current Python literal in the compiler is the authoritative source; a single packaged declarative
    program resource is the target architecture (the earlier option B), without an immediate migration. No equivalence test
    between the governance YAML and the code is needed: verify and state, with evidence, that the product does not read governance/workflow-programs
    at all (search src and tests), so that YAML is historical material. A later implementation must explicitly check whether
    a new workflow can be delivered without additional hard-coded compiler logic. AD-4 = B, phase-authority-scoped result
    contracts for the CURRENT contract versions: the findings surface of the projected result contract is narrowed from properties
    the admitted phase already carries (its finding_authority), derived declaratively, with no hard-coded phase names and
    no new unnecessary state mechanism; historical replay contracts stay intact. The maintainer authorizes hardening Commission
    H1 on this basis; the ADR records the decision, the reasons (a foreign consumer must not depend on the discipline of an
    Operator''s task wording; the observed drop of Finding-authority stops after improved task wording is confounded by model
    choice and changed tasks) and the condition that if the narrowing turns out materially more complex than planned, the
    work escalates with a traceable assessment of alternatives instead of adding mechanisms. AD-5 = C, one Run per checkout
    stays for now: the ADR states it as the Beta contract and records the strong, simple invariant as a benefit; the operational
    friction is preferably reduced later by automated worktree or branch creation and controlled cleanup at the Front Door,
    not by loosening the kernel invariant; keep the five design constraints of FTR-WFC-LIFECYCLE-ROTATION as entry conditions
    for any later lifecycle revision. AD-6 = B as a DESIRED capability, implementation deferred: describe the validated start
    phase (an explicit field limited to phases the selected program declares and that can reach a terminal route, with the
    two negative constraints), but record that hardening Commission H4 is NOT authorized and that the current alternative
    works in practice (a Worker verification Hop plus a fresh independent review, as the three final-assurance Runs showed);
    the capability is revisited after a renewed cost-benefit assessment. Also state as separate labelled statements: the public
    configuration boundary; the compatibility policy for the rendered historical Commission bundles and the historical governance
    YAML (retained as history, not offered as a surface); the implication for the phase-scoped result-schema FTR; and the
    revisit triggers (opening topology to consumers; lifecycle revision; phase entry). PROPORTION (maintainer principle):
    keep the ADR as short as it can be while complete; prefer one decision table plus short sections; do not restate the planning
    document; no new governance entity, process or framework; a decision records the reason and the consequence, not additional
    safeguards. A Worker never reports any Finding operation (resolve, residual or any other delta); only the independent
    reviewer opens and resolves Findings. The CommitIntent names every changed leaf individually, never directories; no agent
    Git writes.'
  acceptance: 'The ADR leaf renders with Asciidoctor and is included in the Technical Model chapter; it contains one section
    per AD-1 to AD-6 with the maintainer''s decision, its reason, at least one named rejected alternative and the effect on
    complexity and maintainability; the AD-1 boundary statement is verified against the actual kernel, compiler and resources;
    the claim that the product does not read governance/workflow-programs is evidenced; H4 is recorded as not authorized and
    H1 as authorized only on the stated conditions; the three records each carry the dated paragraph with their Status:: lines
    unchanged; `python3 scripts/wfc_doc_catalog.py generate && python3 scripts/wfc_doc_catalog.py check` reports no unresolved
    link newly caused by this Run; `git diff --name-only <base_head>..HEAD -- src tests governance` prints nothing; independently
    accepted with no blocking Findings and Coordinator task-check passed.'
  withheld_authority: 'No change under src/, tests/, governance/ or project_memory/, to docs/backlog/_open.adoc, the P1 plan
    or the brief; no implementation, schema or program-definition change; no Status:: flip; no decision beyond the maintainer''s
    list (any open question is recorded as open); no tag, release, push, merge, rebase or Runtime promotion.'
  escalation_default: Escalate a real scope or authority conflict, a decision the maintainer list does not settle, or evidence
    that contradicts a decision as stated; incomplete work alone is not blocked.
