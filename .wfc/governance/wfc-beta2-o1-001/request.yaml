authority_source: 'Repository owner instructions of 2026-11-26: the decisions D1-D7 and the Beta rule recorded in the Beta-2 operator-efficiency plan, and the order to implement its slices autonomously
  and sequentially (this is slice O1); robust@v1 with Claude Sonnet / Claude Sonnet / Claude Opus as worker, focused reviewer and broad reviewer (the owner''s model rule; the focused-review binding differs
  from the committed role default); local integration only; no push, tag, release, publication, Runtime promotion or .wfc/config.yaml change.'
program:
  id: robust
  revision: v1
task:
  title: 'Beta-2 O1: the shipped operator texts say what the operator sessions learned'
  body: 'GOAL. Implement plan slice O1: make the shipped operator texts (the Agent Skill sources and the Operator Manual) say what the Level-1 operator sessions of 2026-11-25/26 learned, as specified by
    the slice''s own section `[[o1]]` of `docs/backlog/beta2_operator_efficiency_plan.adoc` (its "Acceptance (verifiable)" list is BINDING and is not repeated here; read it first) and by `docs/backlog/FTR-WFC-LEVEL1-OPERATOR-GUIDANCE.adoc`
    (the record enumerates the statements, each against its friction-log entry; update it with a dated implementation note), grounded in `docs/warm_storage/post-beta-planning/wfc_beta2_operator_efficiency_analysis.adoc`
    and the friction log `docs/warm_storage/post-beta-planning/wfc_level1_operator_friction_log.adoc` (entries 1-21).


    WHAT HAS CHANGED SINCE THE SLICE WAS WRITTEN (binding updates). The maintainer decided D1-D7 on 2026-11-26 (see the plan''s revision section). Statements the slice must write as *planned*, each next
    to the slice that will retire it: the second reviewer-less config file for `simple@v1` (retired by O3; decision D2 A: unused repository-config role defaults will be tolerated and shown, unused CLI overrides
    still refused); `--executable` must be given for every non-default adapter (O2); the Consumer Request is authored by hand from the previewed fields (O5; decision D1 B: a separate `wfc request` subcommand,
    `wfc plan` stays side-effect free); the per-checkout environment recipe done by hand (O4; decision D4 A: preparation automated, no destructive clean-up); ONE evidence command per Commission (O7; decision
    D6: an ordered evidence-command list will be adopted, so the rule ''the single command must run the repository''s own gates, lint and tests, e.g. `make check`, or `make check-docs` for documentation
    work'' is the interim rule); no in-place Hop-budget raise (O8; decision D7a: an explicit, journaled, maintainer-authorised extension will be added, an agent never extends a budget on its own; D7b: no
    Worker-only Finding closure). `wfc resume` and `reconcile` cover only the mechanical durable-artifact anomaly class today (O10 evaluates a general path); a successor Run always enters at the implementation
    phase today (O9 evaluates later-phase entry). The repository now has `make docs-render` (strict render of every `.adoc` under `docs/`) and `make check-docs` (= `check` then `docs-render`; `check` itself
    is unchanged) from slice O6; the evidence command for documentation Commissions is `make check-docs`. The per-Hop timeout default is 14400 s and a repository default can be set with the optional `hop_timeout_seconds`
    key in `.wfc/config.yaml` (already in the shipped texts; keep them consistent). Also include, as operator rules with their evidence: a refused baseline probe spends the checkout path, so run the exact
    evidence command by hand in the fresh checkout first, with the verified offline bundle in the environment; a `simple@v1` Commission in a repository whose config names a reviewer needs a second reviewer-less
    config file selected with `--config`, never an edit of the committed `.wfc/config.yaml` (friction entries 1 and 21; interim until O3); do not set `PYTHONPATH=src` when running the suite in a checkout
    that has a `src/*.egg-info` (pip then sees the package as installed); a ceiling or config edit is the maintainer''s, not the operator''s.


    EVERY STATEMENT ABOUT THE PRODUCT carries a `path:line` in the record (as the slice requires) and must be true at the current `main` HEAD; verify each against the source, do not copy it from the analysis.
    Where the plan, the analysis or an existing text states something the source contradicts, fix the text and say so in your result. The four existing contract tests (`tests/unit/test_agent_skill_content.py`,
    `tests/unit/test_frontdoor_skill.py`, `tests/architecture/test_consumer_tutorial_pages.py`, `tests/architecture/test_tutorial_kit_quotes.py`) must stay green; if a deliberate text change requires a
    deliberate test-expectation update (for example a pinned phrase or digest), make it minimally and state it. Include the one correction the slice names (`operator_manual/ch03_running/01_preparation.adoc`
    on `--request` being repository-relative).


    DESIGN. Not a design slice; the judgement is completeness and truth of the statements. Keep the texts dense and decision-grade (see `docs/ai_info/_ai_info.adoc` and the doc style of the neighbouring
    pages); do not pad the skill: it is loaded into an agent''s context, so every added line must earn its place and replace rather than append where it can.


    PLAN CONTEXT (binding). This Commission implements slice O1 of the Beta-2 operator-efficiency plan (`docs/backlog/beta2_operator_efficiency_plan.adoc`, section "Revision of 2026-11-26" and the slice''s
    own section; read the revision first, then the slice and the record it names). The maintainer''s decisions D1-D7 of 2026-11-26 and the Beta rule are part of it: contracts, schemas, CLI surfaces and
    programs are provisional in Beta, the existence of an accepted contract is no argument against a change, and what must be preserved are the intended safety and governance properties (independent reviewer''s
    sole Finding authority, trusted-commit boundary, fail-closed admission and recovery, one Run per checkout), not necessarily their present technical realisation. Judge every change on benefit, effort,
    risk and dependencies. Where a design is needed, the FIRST thing you do is write the design down (what you decide, the alternatives you reject and why, which safety property each decision preserves)
    as a short dated `Design` section of the record the slice names (never in a review artifact: those belong to the reviewers), so the reviewers judge the design before the code. A slice without a design
    question (a mechanical one) needs no such section.


    FRONT DOOR DOCS-SYNC (binding). Apply `docs/developer_guide/ch03_engineering_conventions.adoc` section `frontdoor-docs-sync`: when Front Door behaviour or the operating surface changes, check the Operator
    Manual, the consumer tutorials and the shipped Agent Skill sources (`src/workflow_coordinator/agent_skill/wfc/`) and edit what became inaccurate, incomplete or misleading in the same slice (retire statements
    an earlier slice wrote as "planned"); if the slice changes no Front Door behaviour, say so in one sentence in your result.


    CHECKS. The Coordinator''s task-check after every Hop is the evidence command of this Commission and is authoritative (real `bwrap`, offline bundle, about six minutes). Your Hop sandbox cannot start
    `bwrap`, has a read-only `/tmp` and no network: run the focused tests you can and `python -m ruff check .`, and reason carefully about the rest. Strict render for every new or changed .adoc (`asciidoctor
    --safe-mode=safe -a assembled -o /dev/null --failure-level=WARN <file>` prints nothing); `python3 scripts/wfc_doc_catalog.py generate` then `check` must not report more unresolved links (baseline 83)
    or Project Memory misses (baseline 4); generated catalog output must not be left as a stray file. Unused imports and similar residue of a removal are the defect class the lint gate exists for: run `python
    -m ruff check .` before you finish.


    COMMIT AND INDEX DISCIPLINE (binding, mechanical). Use NO git command that writes: never `git add`, `git commit`, `git stash`, `git reset`, `git mv`, `git rm`, `git checkout -- <path>` or any other
    index or history mutation; the index must remain untouched, so `git status --short` shows only unstaged working-tree changes when you finish. Your result''s CommitIntent `subject` MUST contain the WorkItem
    id and the current Hop id, for example `feat(frontdoor): <what you did> (WI-WFC-BETA2-O1-001, H001)` (use the real Hop id of this Hop). `commit_intent.paths` is a JSON array with exactly one plain repository-relative
    path per element: every new, modified or deleted leaf individually (no sentence, count, glob or directory); derive it from `git status --short -uall` and compare the counts before you finish. Deliver
    a complete candidate in the first Hop; a late correction costs three Hops. Leave no stray file behind. A Worker never reports any Finding operation; only the independent reviewer opens and resolves
    Findings.'
  acceptance: Every item of the plan's O1 acceptance list and every binding update above is present in the Agent Skill sources and the Operator Manual, carries no claim its cited source does not support,
    and is marked as planned where the plan says so; the FTR-WFC-LEVEL1-OPERATOR-GUIDANCE record carries the statement list with `path:line` evidence; the four contract tests stay green; the evidence command
    is `make check-docs`. No existing test is weakened, skipped or deleted; strict render prints nothing; the doc catalog check shows no additional unresolved links or Project Memory misses; `ruff check
    .` is clean; the full evidence command passes; the independent focused and whole-candidate broad reviews accepted with no blocking Finding; CommitIntent array has one plain path per element; Coordinator
    task-check passed.
  withheld_authority: No `.wfc/config.yaml`, governance/, `.github/`, scope-ceiling or release-workflow change; no push, tag, release, publication or Runtime promotion; no `wfc skill install`; no change
    beyond the slice scope; no weakening, skipping or deletion of a test; no change of the independent reviewer's sole Finding authority or of the trusted-commit boundary; no self-acceptance. No product
    code change (the Agent Skill texts are shipped resources, not code; no `.py` file under `src` changes); no statement of a planned behaviour as existing.
  escalation_default: Escalate a needed file outside the scope, a safety or authority property that cannot be preserved by any realisation of the slice (record the open decision with options and a recommendation),
    and a conflict with a recorded maintainer decision. Do not silently substitute models. Incomplete work alone is not blocked.
