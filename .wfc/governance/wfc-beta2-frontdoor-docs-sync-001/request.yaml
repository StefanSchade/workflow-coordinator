task:
  title: 'Engineering convention: keep Front Door changes and consumer documentation (Agent Skill, tutorials) in sync'
  body: 'GOAL. Establish one small engineering convention and make it findable: whenever the observable behavior or the operating surface of the WFC Front Door changes, check whether the shipped Agent Skill
    and the consumer tutorials still say what is true. Documentation only; this is not a new governance mechanism.


    THE CONVENTION (state it in your own precise words, as informative guidance). On any change to the observable behavior or the operating surface of the WFC Front Door (the installed `wfc` commands `init`/`plan`/`run`/`resume`/`status`/`audit`/`report`/`archive`/`skill`),
    check whether the shipped Agent Skill texts and the consumer tutorials need an adjustment. The check covers in particular: CLI commands, arguments and defaults; status and error classifications; reports,
    diagnostics and usage information; admission, execution-binding and recovery behavior; operating flows and documented limitations. Example of why: the Agent Skill and the quickstart currently document
    that token-usage data is not reliably available (`usage_not_reported`); an implementation of token accounting would make that statement incomplete or untrue and must trigger the check. An actual change
    to the skill or tutorials is needed ONLY when their statements or examples become inaccurate, incomplete or misleading because of the product change; a change that leaves them true needs no edit. The
    convention is a review question to ask, not an obligation to edit and not a gate.


    DO.

    1. Read first: `docs/ai_info/_ai_info.adoc`, `docs/developer_guide/ch03_engineering_conventions.adoc`, `docs/ai_info/doc_conventions.adoc` (placement and standing) and the owners named below.

    2. In `docs/developer_guide/ch03_engineering_conventions.adoc` add the convention at the fitting place (a short paragraph or a short subsection near the existing text "Maintain the owning documentation
    when behavior changes", keeping the file''s informative standing and its current structure; do not restructure or reformat existing text). Name the owners of the operating information, each with a working
    link: the Operator Manual (`docs/operator_manual/operator_manual.adoc`, notably chapter 3 running/launch/status, chapter 6 recovery and chapter 9 consumer quickstart and tutorials with its stated limitations
    list), the Agent Skill sources (`src/workflow_coordinator/agent_skill/wfc/SKILL.md` and `references/*.md`, one text shared by the Claude and Codex hosts) and the consumer tutorials (`docs/operator_manual/ch09_consumer_quickstart/`
    pages and the demo kit `examples/consumer-demo/`, whose quoted listings are guarded by `tests/architecture/test_tutorial_kit_quotes.py`). State briefly that the existing contract tests (`tests/unit/test_agent_skill_content.py`,
    `tests/unit/test_frontdoor_skill.py`, `tests/architecture/test_consumer_tutorial_pages.py`, `tests/architecture/test_tutorial_kit_quotes.py`) already pin parts of these texts, so a product change may
    also fail one of them; they do not replace the check. Verify each file path you name exists in the repository.

    3. In `docs/ai_info/_ai_info.adoc` add a concise pointer so that an agent changing the Front Door finds the rule: preferably one new row in the existing task table (need: change the Front Door''s observable
    behavior or operating surface; open first: the new Developer Guide passage, plus the owners), or one short sentence at the most natural place; keep the file''s style and do not touch other rows.

    4. Do not edit anything else. In particular: no product code, no tests, no workflow or program records, no Agent Skill text, no tutorial or Operator Manual content, no `.wfc/`, no `governance/`, no
    backlog or history file.


    BOUNDARIES. Informative guidance only: no new runtime gate, no hook, no script, no CI check, no mandatory change obligation, no new authority or governance document. Do not claim the convention is enforced.
    Do not invent behavior of the product; every statement about the skill and tutorials must be verified against the files.


    ENVIRONMENT: the Coordinator''s task-check runs the full required suite (`python -m pytest -q`) after your Hop with verified offline inputs; your sandbox may lack them, so do not claim full-suite counts
    you did not measure. Documentation checks you can run: strict doc render `asciidoctor --safe-mode=safe -a assembled -o /dev/null --failure-level=WARN <file>` must print nothing for each changed .adoc;
    `python3 scripts/wfc_doc_catalog.py generate` then `check` must not report additional unresolved links or Project Memory misses compared with before your change (note the baseline output before editing);
    `make doc-catalog-check` equivalently. Run the targeted contract tests named in step 2 with `--wfc-partial` plus explicit paths if a Python with pytest and PyYAML is available, and say exactly what
    you ran and what you could not run.


    COMMIT MECHANICS (binding): no git command that writes (no add, mv, rm, reset, stash, commit); the index stays untouched; `commit_intent.paths` is a JSON array with exactly one plain repository-relative
    path per element (every modified leaf individually; no sentence, count, glob or directory); derive it from `git status --short -uall` and compare the counts before you finish. Expected: exactly two
    changed files. Leave no stray file behind (no `__pycache__`, no generated catalog or build output that Git does not ignore). Never put untracked /dev/null-like wrapper entries into the CommitIntent.
    A Worker never reports any Finding operation.'
  acceptance: The convention is stated in docs/developer_guide/ch03_engineering_conventions.adoc and covers the five checked areas, the token-usage example and the rule that an edit is needed only when
    skill or tutorial statements become inaccurate, incomplete or misleading; it names the Operator Manual, the Agent Skill sources and the consumer tutorials (with the demo kit) as owners with links that
    resolve to existing files; docs/ai_info/_ai_info.adoc carries a concise pointer to it; exactly these two files changed and nothing else; the text adds no gate, hook, runtime check or automatic obligation;
    strict asciidoctor render of both files prints nothing; the doc catalog check reports no additional unresolved links; the full required suite and quality gates pass; CommitIntent array has one plain
    path per element; Coordinator task-check passed.
  withheld_authority: No change to product code, tests, workflow or program records, the Agent Skill text, tutorial or Operator Manual content, .wfc/ or governance/; no new gate, hook, script, CI check
    or automatic change obligation; no Runtime promotion, installation, push, tag, publication or external repository change; no weakening or skipping of tests; no self-acceptance.
  escalation_default: Escalate a requirement that would need a file outside the scope or would add a gate, hook or mandatory obligation, and missing required evidence. Do not silently substitute models.
    Incomplete work alone is not blocked.
