work_item_id: WI-WFC-EXEC-BOUNDARY-FTR-001
authority_source: 'Repository owner instruction 2026-11-25: robust@v1 planning Commission to revise FTR-WFC-EXECUTION-TRUST-BOUNDARIES and derive the Slice A (provider-dispatch integration of the bwrap
  boundary) and Slice B (phase profiles, later) FTRs with an implementation concept for Slice A; Claude Opus worker, Claude Sonnet focused review, Claude Opus broad review (maintainer decision, worker and
  focused-review bindings differ from the committed role defaults); documentation only; local integration only; no push, tag, release, publication or Runtime promotion.'
program:
  id: robust
  revision: v1
task:
  title: Execution Boundary FTR revision and Slice A implementation concept
  body: 'GOAL. Revise `docs/backlog/FTR-WFC-EXECUTION-TRUST-BOUNDARIES.adoc` against the maintainer''s clarified architecture intent (below) and derive from it TWO self-contained, mutually consistent FTRs:
    Slice A (provider-dispatch integration of the existing Bubblewrap boundary; to be implemented IMMEDIATELY afterwards by a separate Commission) and Slice B (extended phase-dependent visibility / mutation
    / capability profiles; planning only, explicitly later). Slice A must come with a technical implementation concept that is complete enough that an implementation Commission can start WITHOUT further
    conceptual work. This Commission changes NO product code, test, script, workflow, config or governance file: it produces verified, reviewed design documents. Shift left: the independent review is deliberately
    architecture- and security-heavy so that the implementation Commission needs few correction loops.


    MAINTAINER INTENT (binding; 2026-11-25). The existing Bubblewrap implementation (`src/workflow_coordinator/execution_boundary.py`) becomes the basis of a provider-independent, WFC-controlled Execution
    Boundary. Three distinct goals: (1) INTEGRITY: the agent may only modify authorized repository areas; `.git`, Git hooks, build/CI configuration and other execution-relevant surfaces are protected from
    unauthorized mutation. (2) CONFIDENTIALITY: certain repository areas can be completely HIDDEN from an agent, not merely read-only; e.g. an agent must not reach hidden content through the Git object
    database. (3) CONTEXT MANAGEMENT: non-confidential areas may be hidden on purpose, e.g. `cold_storage` may later no longer be directly accessible, with later retrieval services providing selected content.
    Important: these are restriction capabilities that become relevant LATER, in particular once further features give the agent access to the same resources by another route (MCP sidecar). The boundary
    shall in the long run model visibility, write permission and execution permission SEPARATELY; modelling visibility and writability becomes part of commissioning (partly already today, but today checked
    after the fact rather than enforced ahead of time).

    Further binding architecture rules: Git worktrees MUST be supported; ordinary agents need no direct `.git` access; trusted Git stays outside the agent boundary. Provider-native sandboxes are NOT the
    authoritative security boundary: once the outer WFC boundary is effectively qualified, Claude and Codex may be configured permissively INSIDE it; this is an intended architecture decision, not a compatibility
    workaround; until qualification no existing safeguard may be dropped unsecured. Network isolation is explicitly OUT OF SCOPE (Gondolin and egress concepts stay future topics). MCP sidecars are explicitly
    OUT OF SCOPE (a conceivable later way to offer controlled services such as Git access, cross-repository read access or semantic retrieval); Slice A must not depend on them. Execution-sensitive surfaces:
    the risk of agent-modified hooks, tests and build configuration is known; the intended direction is technically restricted normal phases, explicitly authorized elevated-privilege phases, and a mandatory
    defensive review afterwards; Bubblewrap shall enable this later architecture but Slice A need not implement the full privilege-elevation model. The already implemented filesystem isolation must not
    stay unconnected in the repository.


    READ FIRST (do not trust this brief over the files; verify and extend): `docs/backlog/FTR-WFC-EXECUTION-TRUST-BOUNDARIES.adoc` (the whole record including every dated maintainer decision/authorization),
    `docs/backlog/FTR-WFC-ELEVATED-PRIVILEGE-DEFENSIVE-REVIEW.adoc`, `docs/backlog/FTR-WFC-PHASE-WRITE-SCOPE-ARTIFACT-ISOLATION.adoc`, `docs/backlog/BUG-WFC-CLAUDE-ADAPTER-WRITE-PERMISSION-MISMATCH.adoc`,
    `docs/backlog/_open.adoc`, `docs/research/gondolin_execution_boundary_feasibility.adoc`, `docs/warm_storage/claude-adapter-and-sandbox/` (nested Claude qualification, external scratch implementation,
    live qualification), `docs/cold_storage/architecture/pre-0.1.0b1/workflow_coordinator_claude_adapter_development_retrospective_2026-11-08.adoc` and `docs/cold_storage/backlog/pre-0.1.0b1/infrastructure-and-incidents/BUG-WFC-CLAUDE-ADAPTER-SHORT-TMPDIR-RESOURCE-EXHAUSTION.adoc`
    (provenance only), the functional/technical model chapters that mention the boundary or scope (grep `execution_boundary`, `Execution Boundary`, `authorized_scope`, `scope`), and the CODE: `src/workflow_coordinator/execution_boundary.py`,
    `adapter.py` (AgentExecutionRequest and the port), `claude_adapter.py` (its closed settings, sandbox block, permission mode, scratch/TMPDIR handling, child process handling), `codex_adapter.py` (its
    `--sandbox`, approval and network arguments, child process handling), `operator.py`/`vertical.py` and `commissioning.py` (how adapters are constructed and dispatched per Hop and phase; how Commission
    scope (`Intent.scope`) differs from phase `authorized_scope`; where worktree, scratch, candidate acceptance and the post-Hop scope check live), the Git handling modules (Trusted Git, worktree identity,
    `.git` file vs directory), and the existing tests `tests/integration/test_execution_boundary_bwrap.py`, `tests/integration/test_nested_claude_bwrap_qualification.py`, `tests/unit/test_execution_boundary_config.py`
    and every adapter/dispatch test that a change would touch.


    DO.

    1. Rework `FTR-WFC-EXECUTION-TRUST-BOUNDARIES.adoc` into the umbrella record for the Execution Boundary: keep every recorded maintainer decision and dated authorization verbatim in substance (do not
    delete or rewrite history; add, restructure only where needed, and mark superseded statements as superseded with a pointer); integrate the 2026-11-25 intent above (three goals, separate visibility/write/execution
    dimensions, provider sandboxes not authoritative after qualification, network and MCP out of scope, worktrees); set Status/Next action/Not authorized consistently; point to Slice A and Slice B and state
    precisely what each guarantees and does not guarantee. Do not contradict accepted decisions (e.g. the 2026-11-09 provider-credential product-scope decision, the Beta-1 "no preventive isolation claim"
    statement until Slice A is actually accepted, DEC-WFC-009 standing); where the new intent changes an earlier statement, say so explicitly and name the old text it supersedes.

    2. Write `docs/backlog/FTR-WFC-EXECUTION-BOUNDARY-DISPATCH-INTEGRATION.adoc` (Slice A) and `docs/backlog/FTR-WFC-EXECUTION-BOUNDARY-PHASE-PROFILES.adoc` (Slice B), following the existing FTR structure
    (read `docs/backlog/README.adoc` and two existing FTRs).

    3. The Slice A FTR is the binding contract and implementation concept for the follow-up Commission (which will run `robust@v1` with Claude Sonnet as worker, focused reviewer and broad reviewer). It
    MUST decide and specify, verified against the actual code, at least: (a) the integration architecture: where the boundary wraps the provider child process (ideally one provider-neutral seam used by
    both adapters rather than two ad-hoc copies), how the adapter-built argv/env/cwd/stdin/streams/timeouts/process groups/cleanup pass through it, and how results, scratch and the result file reach the
    Coordinator; (b) git worktrees: `.git` as FILE, gitdir and common-dir outside the checkout; today `validate()` requires a real `.git` directory; specify the sandbox view (e.g. a `.git` placeholder that
    exposes no repository metadata and no object database), what the agent does NOT need (git commands are not a capability of ordinary agents), and what Coordinator-owned trusted Git keeps doing outside;
    check what the provider CLIs themselves need from Git inside the sandbox and what happens when Git is unavailable to them; (c) the mount model: repository view read-only by default; writable only for
    exactly the authorized paths, and the PRECISE relation between Commission scope and phase `authorized_scope` (what is mounted writable for a worker phase, for each reviewer phase and durable artifact
    paths, given that worker-phase scope today includes reviewer-artifact paths; state what is guaranteed and what is not, see `FTR-WFC-PHASE-WRITE-SCOPE-ARTIFACT-ISOLATION`; Slice A must not claim phase-specific
    isolation or confidentiality that the existing scope contracts do not carry); the not-yet-existing target paths (new files/directories the worker is authorized to create: a bind source must exist; specify
    the mechanism, e.g. writable parent directory vs pre-created target, and its consequences for scope enforcement); symlinks, hardlinks, mount overlaps, `/tmp` scratch and the external scratch bind, `/dev`,
    `/proc`, and the system mounts and what the provider CLIs need (HOME/XDG/config, authentication files, caches, DNS/TLS files, `/etc` entries, temp directories, local child processes such as Node, shells,
    ripgrep): which of these are exposed read-only, which writable, which hidden, with the credential-exposure consequence made explicit (the sandbox must expose the provider''s authentication to the provider
    process and nothing more; no blanket HOME grant; see the 2026-11-08 nested-qualification constraints); (d) provider configuration inside the boundary: precisely which Claude and Codex settings may become
    more permissive (for example the nested sandbox, permission prompts/approval and workspace-write modes), under which preconditions, how this is bound to the boundary being effective (permissive ONLY
    when the WFC boundary is actually in force for that invocation; unchanged provider safeguards for any unisolated run; no global weakening), and how an operator can tell which mode a Run used (evidence/report/audit
    visibility); (e) enablement and fail-closed semantics: how the boundary is requested and selected (design the least-surprising configuration or default, keeping existing Runs/configs/tests valid, and
    decide whether Slice A makes isolation default-on, opt-in, or per-adapter, with reasons and a migration path), preflight (bwrap present, user namespaces usable, nested-userns behaviour, provider binary
    resolvable inside the view), error classification (not started vs started), timeout and kill semantics (process group, zombie/leftover cleanup), cleanup of scratch, and NO silent fallback to unisolated
    execution; what Coordinator state is persisted so that a Run''s boundary mode is auditable; (f) the interaction with existing invariants: Trusted Git, evidence repository, candidate acceptance and post-Hop
    scope check (unchanged, still mandatory), reviewer read access to what it must see, the baseline probe and task-check (Coordinator-owned, outside the agent boundary or not: decide and justify), the
    per-Hop usage capture, recovery and resume; (g) the qualification plan: positive and NEGATIVE tests that actually attempt the forbidden accesses through the REAL dispatch path with fake providers (no
    network, deterministic) AND live qualification with real authenticated Claude and Codex runs under controlled, minimal, cheap test invocations (state exactly which live checks are required, what they
    prove, how the maintainer''s authentication is used without copying credentials, and that a missing or impossible live qualification is reported honestly and never replaced by a positive claim), the
    required negative cases (write outside the grant, write into `.git`, read hidden paths, escape via symlink/hardlink/`..`/new mount, reach the Git object database, create files at non-authorized paths,
    exhaust or abuse scratch, leave processes behind), and the exit criteria; (h) an explicit statement of what Slice A truly guarantees and what is deferred to Slice B or other work (network, confidentiality/hiding
    as a per-phase profile, phase-specific write scopes, elevated privilege, protection of execution-sensitive surfaces beyond the read-only default and `.git`, retrieval services), and the honest residual
    risks, including the already-known hardlink/TOCTOU limits of the validator and the mutable-source assumption; (i) the stop rule: if a requirement cannot be realised as specified, the implementation
    Run must end with a robust Finding or an honest stop instead of silently lowering the security claim; (j) the decomposition: whether Slice A fits ONE Run or needs an ordered internal sequence of reviewable
    steps (propose the Hop budget as an upper limit and the scope paths for the implementation Commission, exactly: `src`, `tests`, and the documentation files it must update; state whether `.wfc/config.yaml`,
    scripts or workflows are touched; remember the scope ceiling in `.wfc/config.yaml` and that any change of that ceiling is a maintainer decision) and the Front Door docs-sync impact (`docs/developer_guide/ch03_engineering_conventions.adoc`,
    section `frontdoor-docs-sync`: Operator Manual, Agent Skill sources, consumer tutorials), the documents that currently say the boundary is not integrated (list every such statement with path and line
    so the implementation Commission updates them).

    4. The Slice B FTR documents, planning only and explicitly NOT an implementation authorization: target architecture, dependencies and the open decisions, for at least: per-phase visible and writable
    repository subsets; hiding `cold_storage` and confidential areas (including the Git object-database question and its mitigation options); controlled widening of visibility and write rights (authority
    provenance as the umbrella FTR already requires); the technical form of the elevated-privilege / mandatory defensive review pattern (relation to `FTR-WFC-ELEVATED-PRIVILEGE-DEFENSIVE-REVIEW`); protection
    of execution-relevant repository surfaces; extensibility by later controlled services without presupposing MCP; the relation to `FTR-WFC-PHASE-WRITE-SCOPE-ARTIFACT-ISOLATION` (state whether Slice B
    subsumes or depends on it, and what program-version question this raises for the closed `robust@v1`; do not modify the accepted program) and to the commissioning model ("visibility and writability as
    part of commissioning"); what Slice A must therefore leave open (extension points, no premature schema commitment). Do not anticipate Slice B''s implementation; list prerequisites and decisions for
    the maintainer.

    5. Keep existing FTRs, indexes and status statements free of contradiction: update `docs/backlog/_open.adoc` (cards for A and B, the umbrella card; follow its ordering rules), and make the smallest
    possible status/pointer edit in `FTR-WFC-PHASE-WRITE-SCOPE-ARTIFACT-ISOLATION.adoc`, `FTR-WFC-ELEVATED-PRIVILEGE-DEFENSIVE-REVIEW.adoc` and `BUG-WFC-CLAUDE-ADAPTER-WRITE-PERMISSION-MISMATCH.adoc` only
    where they would otherwise contradict or lack the pointer. Statements in documents OUTSIDE the permitted scope (for example `docs/architecture.md`, technical/functional model chapters, research notes)
    that become stale when Slice A lands are NOT edited here: list them in the Slice A FTR for the implementation Commission.

    6. Write one compact planning record `docs/warm_storage/post-beta-planning/wfc_execution_boundary_planning_record.adoc`: the verified current-state findings with file:line evidence (including every
    place the boundary is or is not wired, the exact adapter permission and sandbox arguments today, how worktree `.git` looks, what the existing bwrap tests and the nested qualification already proved
    and did not prove), the design decisions with reasons and rejected alternatives, the claim-by-claim reconciliation with the existing FTRs and decisions, what you ran and could not run (for example live
    provider calls), and the open maintainer decisions with your recommendation. Prefer small, cheap, local experiments with a real `bwrap` (synthetic repository, a real `git worktree`, a fake provider)
    to confirm the key mechanisms (worktree `.git` file handling, creation of not-yet-existing authorized targets, which mounts a trivial child needs) over speculation, and record their outcome; do not
    call live providers in this Commission and do not copy credentials anywhere.


    CONSTRAINTS. Respect existing decisions; make no stealth change of meaning. Do not invent facts: unverified assumptions are marked as assumptions. Every path, symbol and line you cite must exist. Do
    not add a new governance layer, program, gate or role. No network design, no MCP design beyond naming it as a later extension point. Historical material under `docs/cold_storage/` and existing `docs/warm_storage/`
    records is immutable (new files only). Slice A must stay deliberately bounded yet deliver an EFFECTIVE boundary; do not let it grow into Slice B.


    ENVIRONMENT: the Coordinator''s task-check runs the full required suite (`python -m pytest -q`) after your Hop; your sandbox may lack the verified offline inputs, so do not claim full-suite counts you
    did not measure. Documentation checks you can run: strict render `asciidoctor --safe-mode=safe -a assembled -o /dev/null --failure-level=WARN <file>` must print nothing for each changed .adoc; `python3
    scripts/wfc_doc_catalog.py generate` then `check` must report no additional unresolved links or Project Memory misses than before your change (note the baseline first); catalog output is generated and
    must not be left as a stray file. Experiments must leave no stray files in the repository (use the scratch directory).


    COMMIT MECHANICS (binding): no git command that writes (no add, mv, rm, reset, stash, commit; read-only git such as `git worktree list` is fine, experiments with `git worktree add` belong in scratch
    repositories only, never in this checkout); the index stays untouched; `commit_intent.paths` is a JSON array with exactly one plain repository-relative path per element (every new, modified or deleted
    leaf individually; no sentence, count, glob or directory); derive it from `git status --short -uall` and compare the counts before you finish. Leave no stray file behind. A Worker never reports any
    Finding operation; only the independent reviewer opens and resolves Findings.


    REVIEW FOCUS (independent reviewer, whole candidate, by your own execution; security architecture first): is the Slice A contract implementable as written against the REAL code (verify the seams, the
    adapter arguments, the dispatch path, the worktree `.git` handling yourself, and re-run the key experiments); does it deliver an effective boundary rather than a cosmetic one (what can an agent still
    do, read, write, reach through Git, `/proc`, `HOME`, symlinks, scratch, leftover processes); are the provider-permissiveness rules bound to an effective boundary with no global weakening and no silent
    fallback; is the Commission-scope versus phase-scope relation stated correctly and without overclaiming; does Slice A overclaim confidentiality, phase isolation or network containment; are the negative
    and live qualification requirements concrete, achievable and honest; is the follow-up Commission sized and scoped soundly (scope ceiling, Hop upper limit, docs-sync impact); is Slice B planning-only
    with decisions and dependencies, no hidden implementation commitment; is the umbrella FTR consistent with every recorded decision and with the other FTRs and `_open.adoc`; does anything authorize or
    imply a push, tag, release, Runtime promotion or network/MCP work.'
  acceptance: The revised umbrella FTR, the Slice A FTR (binding contract and implementation concept, decisions (a)-(j) specified and verified against the code), the Slice B FTR (planning only), the `_open.adoc`
    cards, the minimal pointer edits in the three related records and the planning record exist and are mutually consistent; every recorded maintainer decision is preserved and every superseded statement
    is explicitly marked; Slice A states exactly what it guarantees, what it does not, and its honest residual risks; positive, negative and live qualification requirements are concrete and honest; the
    implementation Commission's scope, Hop upper limit, docs-sync impact and the list of stale statements are given; Slice B lists architecture, dependencies and open maintainer decisions without authorizing
    implementation; no product code, test, script, workflow, `.wfc/` or governance change; strict render of every changed .adoc prints nothing; the doc catalog check shows no additional unresolved links;
    the full required suite passes; the independent whole-candidate review accepted with no blocking Finding; CommitIntent array has one plain path per element; Coordinator task-check passed.
  withheld_authority: No product code, test, script, workflow, Makefile, pyproject, `.wfc/` or governance/ change; no live provider call and no credential copying; no network or MCP design; no push, tag,
    release, publication or Runtime promotion; no new governance layer, program or role; no invented facts; no weakening of an accepted decision; no edit of historical records; no self-acceptance; no implementation
    authorization for Slice B.
  escalation_default: Escalate a conflict with an accepted maintainer decision that blocks the design, a needed file outside the scope, and a requirement that cannot be realised as specified (record it
    as an open decision with options and a recommendation instead of lowering the security claim). Do not silently substitute models. Incomplete work alone is not blocked.
