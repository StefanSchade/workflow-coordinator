program:
  id: robust
  revision: v1
task:
  title: 'E2: release preflight tool, distribution audit tool, Make targets, README link repair'
  body: 'Execute package E2 of the accepted P3 release-engineering plan docs/backlog/postbeta_plan_p3_release_engineering.adoc
    (section 5, package E2; read sections 3 (C1-C7), 5 and 7 first) and the accepted chapter docs/developer_guide/ch04_release_management.adoc,
    which is the specification both tools implement. The plan and the chapter are authoritative; do not decide open items
    (C6/MD-5 stay open). A staged read-only reference of the sibling repository''s release tooling may exist under build/wfc/postbeta-inputs/
    (verify MANIFEST.sha256, read PROVENANCE.txt; release_check.sh is a shape reference only: this product''s tools are Python
    standard-library only, no network, no writes).


    DO: (1) Create scripts/wfc_release_check.py: read-only, writes nothing, no network. Mode comes from `git symbolic-ref
    -q HEAD` (attached = branch mode, detached = tag mode). Branch mode exits 1 on: branch not main; dirty tree; local main
    out of sync with origin/main; HEAD not reachable from origin/main; tag != "v" + version (the tag name is an argument or
    derived as the chapter specifies); missing or `planned` release-notes section for the version; any repository-relative
    documentation link in README.md. Tag mode (detached HEAD) skips the branch-identity and sync checks and instead exits
    1 unless the checked-out commit is reachable from origin/main, plus the same version, notes and README checks. Output:
    one clear line per failed check, exit 0 only if all pass. Make the version read from pyproject.toml (tomllib) and the
    notes check parse docs/release_notes/release_notes.adoc as the chapter''s C4 specifies. (2) Create scripts/wfc_dist_audit.py:
    takes the wheel and sdist paths, checks every archive entry against the C2 allow-list exactly as the chapter writes it
    (wheel: workflow_coordinator package .py files plus exactly the four reviewed resource texts and *.dist-info; sdist: pyproject.toml,
    setup.cfg, PKG-INFO, README.md, LICENSE, src/**), fails on anything unlisted and names the forbidden-by-name set explicitly
    in its message; it never modifies an artifact; one rule, one implementation. (3) Extend tests/architecture/test_offline_distribution.py
    so that it calls the audit on the artifacts it already builds (import or run the script; one implementation, two callers).
    (4) Create tests/unit/test_release_tooling.py covering both tools'' refusals: synthetic temporary Git repositories (with
    a local bare ''origin'') demonstrating branch mode and tag mode pass and every refusal above; synthetic wheels/sdists
    (zipfile/tarfile) showing the audit accepts a conforming artifact and rejects an unlisted entry, a forbidden entry and
    a missing resource; no real network, no dependency on this checkout''s own state. (5) Makefile: add targets `release-check`
    and `dist-audit` (declare them in .PHONY), minimal, calling the scripts (dist-audit audits dist/*.whl and dist/*.tar.gz).
    (6) README.md: repair exactly the four repository-relative .adoc links to absolute tag-pinned repository URLs of the form
    https://github.com/StefanSchade/workflow-coordinator/blob/v0.1.0b1/<path> (see chapter C5), leaving every other word unchanged.
    (7) Update docs/developer_guide/ch04_release_management.adoc: state the tools and Make targets as existing, describe the
    two modes accurately, and where C5 says documentation links should be tag-pinned make it a "must link" requirement; keep
    C6/MD-5 open and unchanged; do not describe the workflow (E3) as existing. CHECKS (measured): both tools run on the real
    checkout; `make dist-audit` on a freshly built dist (use the offline build as the existing distribution test does; if
    a real build is impossible in your sandbox, say so and rely on the extended test); ruff check and the repository''s ruff
    format check for the new files; the V1 strict render (`asciidoctor --safe-mode=safe -a assembled -o /dev/null --failure-level=WARN`
    over docs/developer_guide/developer_guide.adoc) exits 0 with no output; `python3 scripts/wfc_doc_catalog.py generate`
    then `check` adds no unresolved link or Project Memory miss; the Coordinator''s task-check runs the full required suite
    (your sandbox lacks the offline test inputs: run targeted tests with the wrapper-provided environment if present, otherwise
    do not claim full-suite counts). NON-GOALS: no workflow file, publication or credential; no network access from either
    tool; no change to the offline-input profile or the pinned digests; the audit never modifies an artifact; no new governance
    entity. NOTE: `git status --short -uall` in an agent worktree lists about 22 untracked /dev/null-like entries injected
    by the wrapper; they are not your output, never put them in the CommitIntent. A Worker never reports any Finding operation
    (resolve, residual or any other delta); only the independent reviewer opens and resolves Findings. COMMIT MECHANICS (binding):
    no git command that writes (no add, mv, rm, reset, stash, commit); the index stays untouched; `commit_intent.paths` is
    a JSON array with exactly one plain repository-relative path per element (every new or modified leaf individually, no
    sentence, count, glob or directory); derive it from `git status --short -uall` and compare counts before you finish; state
    counts in the summary, never in the array.'
  acceptance: Both tools exist, are read-only, network-free and standard-library only; wfc_release_check.py selects branch
    vs tag mode from git symbolic-ref and refuses exactly the listed conditions in each mode, demonstrated by the new unit
    test on synthetic repositories; wfc_dist_audit.py enforces the chapter's C2 allow-list with fail-on-unlisted and is called
    by the extended distribution test, one implementation; both Make targets exist; the four README links are absolute tag-pinned
    URLs and nothing else in README.md changed; ch04 states the tools as existing, the C5 link requirement as binding, C6/MD-5
    unchanged; V1 render exit 0 without output; catalog check adds no unresolved link or Project Memory miss; ruff clean for
    new files; the full required suite is green; CommitIntent array held one plain path per element; independently accepted
    with no blocking Findings and Coordinator task-check passed.
  withheld_authority: No workflow file, publication, credential, tag, push or Runtime promotion; no network access in either
    tool; no change to the offline-input profile, its digests, governance/, archived Run evidence, src/ or any normative document;
    Makefile changes limited to the two new targets and their .PHONY declaration; README.md changes limited to the four link
    repairs; no decision taken on the maintainer's behalf (MD-5 stays open); no weakening of any existing test.
  escalation_default: Escalate a conflict between the plan and the chapter (name it), a requirement that needs network access,
    a workflow file, or a change outside scope; incomplete work alone is not blocked.
