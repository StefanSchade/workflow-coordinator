task:
  title: Release chapter 4 reduced to its steady state with corrected recovery table (slice R2)
  body: 'GOAL. Implement slice R2 of the accepted Beta-2 release-streamlining plan: reduce `docs/developer_guide/ch04_release_management.adoc` to its steady state, correct its recovery text, and move the
    one-time release records verbatim to cold storage. Documentation only.


    CONTROLLING SOURCES (read both completely before editing; they are in HEAD): `docs/backlog/FTR-WFC-RELEASE-CONTRACT-STEADY-STATE.adoc` (scope, chosen direction, what the reduced chapter contains, the
    table of every "planned" statement and the slice that retires it, the corrected recovery table, acceptance criteria AC-1.., required tests, risks, execution notes, withheld authority) and section R2
    of `docs/backlog/beta2_release_streamlining_plan.adoc` (plus its `ch04-ownership` rule and the `external-state` section). The FTR is the specification: implement it exactly; where this task text and
    the FTR differ, the FTR governs and you report the difference. Background: `docs/warm_storage/post-beta-planning/wfc_release_streamlining_planning_record.adoc` (claim-by-claim evidence).


    DO. Everything the FTR''s acceptance criteria demand, in particular: the chapter keeps the contract, the job description, a one-page runbook and the corrected recovery table, and names the single `pypi`
    approval as the release authorization; the recovery paragraph no longer prescribes delete-and-retag for a TestPyPI-spent state; the recovery table carries the `release` job''s non-idempotence as an
    explicit exception while slice R3 is planned; G2''s wording matches its accepted state; the MD-5 investigation, the hosted-run record, the run-#9 primary evidence, the Q1 result record, both maintainer
    acceptance statements and the superseded template are moved VERBATIM (byte-identical content, verified by comparison, not by eye) into new files under `docs/cold_storage/backlog/pre-0.1.0b1/release-engineering/`
    with the group `README.adoc` the cold-storage convention asks for, and linked from the chapter; the preparation command of slice R1 and the pipeline facts of slice R3 are stated as PLANNED, never as
    existing, and R2''s own record lists each such statement with the slice that retires it; add this slice''s own card to `docs/backlog/_open.adoc`; touch `docs/README.adoc` and `docs/ai_info/_ai_info.adoc`
    only if a link target moves. Keep every other document''s links into chapter 4 working (grep the whole repository for links and anchors into the chapter and into the moved passages, including `tests/architecture/test_manual_standalone_links.py`
    expectations and the catalog), and note the catalog baseline BEFORE your first edit: the check compares, it is not absolute. Apply the Front Door docs-sync convention (`docs/developer_guide/ch03_engineering_conventions.adoc`,
    `frontdoor-docs-sync`): no Front Door behavior changes here, record the check and its answer in your result.


    NON-GOALS AND WITHHELD: no change to the meaning of any decision (C1-C7, MD-1, G1-G8 keep their meaning; give a before/after statement per item in your result record); no edit to the wording of a recorded
    acceptance; no product code, test, workflow, script, Makefile, pyproject or version change; no `.wfc/` or `governance/` change; no push, tag, release, publication or Runtime promotion; no new governance
    layer, program or role; no weakened or deleted test; no self-acceptance. A file outside the declared scope that proves necessary is a scope question for the maintainer (stop and name the file and why),
    not a reason to widen. Record what you did, the verbatim-move proof, the before/after statements and the checks you ran in a compact `docs/warm_storage/post-beta-planning/wfc_release_contract_steady_state_verification.adoc`.


    ENVIRONMENT: the Coordinator''s task-check runs the full required suite (`python -m pytest -q`) after your Hop with verified offline inputs; your sandbox may lack them, so do not claim full-suite counts
    you did not measure. Strict render `asciidoctor --safe-mode=safe -a assembled -o /dev/null --failure-level=WARN <file>` must print nothing for each changed .adoc (including any new file you create);
    `python3 scripts/wfc_doc_catalog.py generate` then `check` must not report more unresolved links or Project Memory misses than before your change (baseline today: 83 unresolved links, 4 Project Memory
    misses). Leave no generated catalog or other stray file behind.


    COMMIT MECHANICS (binding): no git command that writes (no add, mv, rm, reset, stash, commit); the index stays untouched; a verbatim move is expressed as new files plus the edited chapter, never as
    a git mv; `commit_intent.paths` is a JSON array with exactly one plain repository-relative path per element (every new, modified or deleted leaf individually; no sentence, count, glob or directory);
    derive it from `git status --short -uall` and compare the counts before you finish. Never put untracked /dev/null-like wrapper entries into the CommitIntent. A Worker never reports any Finding operation;
    only the independent reviewer opens and resolves Findings.


    REVIEW FOCUS (independent reviewer, whole candidate, by your own execution): no decision silently changed (compare each of C1-C7, MD-1, G1-G8 before/after); every moved record byte-identical to its
    source passage (run the comparison); no dangling link or anchor anywhere in the repository to a moved passage; no recovery instruction in the chapter is false for the pipeline as it is integrated today;
    every "planned" statement has an owning slice; the chapter is genuinely shorter and still sufficient for an agent to prepare, qualify and release; nothing authorizes a push, tag or publication.'
  acceptance: All acceptance criteria of FTR-WFC-RELEASE-CONTRACT-STEADY-STATE are met and each is evidenced in the verification record; chapter 4 is reduced to contract, job description, one-page runbook
    and corrected recovery table with the single pypi approval named as the release authorization; moved records are byte-identical in cold storage and linked; every planned statement has an owning slice;
    no decision's meaning changed (before/after per item); no dangling links; strict render of every changed or new .adoc prints nothing; doc catalog shows no additional unresolved links or Project Memory
    misses; only declared scope files changed; the full required suite and quality gates pass; the independent whole-candidate review accepted with no blocking Finding; CommitIntent array has one plain
    path per element; Coordinator task-check passed.
  withheld_authority: No change to the meaning of any decision or the wording of a recorded acceptance; no product code, test, workflow, script, Makefile, pyproject, version, .wfc/ or governance/ change;
    no push, tag, release, publication, GitHub setting or credential; no Runtime promotion; no new governance layer, program, role or phase binding in the product; no weakening or deletion of tests; no
    deletion or editing of historical records other than relocating the named ones verbatim; no self-acceptance.
  escalation_default: Escalate a requirement that would change a decision's meaning, a needed file outside the scope, and missing required evidence. Do not silently substitute models. Incomplete work alone
    is not blocked.
