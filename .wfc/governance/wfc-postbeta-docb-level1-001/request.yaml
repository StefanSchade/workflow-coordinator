work_item_id: WI-WFC-POSTBETA-DOCB-LEVEL1-001
authority_source: Maintainer order of 2026-11-23 (last pre-release documentation offensive for 0.1.0b1), package DOC-B; documentation
  only; regular Commission with independent review; no push, tag, publication, Runtime promotion or Q1; Sonnet worker and
  Opus reviewer, up to twelve Hops.
program:
  id: robust
  revision: v1
task:
  title: 'DOC-B: Claude Code as Level-1 orchestrator -- operating pattern tutorial'
  body: 'Package DOC-B of the maintainer''s last pre-release documentation offensive for the first public beta 0.1.0b1: a
    self-contained, findable tutorial that explains the operating pattern the project has actually practised for days: a superordinate
    Claude Code (Sonnet class) session as `Level 1` operating WFC (`Level 0`) to carry larger goals through bounded, independently
    reviewed Runs up to the next real human decision. STAGED READ-ONLY INPUT under build/wfc/postbeta-inputs/ (verify MANIFEST.sha256):
    LEVEL1_PRACTICE_FACTS.txt (the Level-1 operator''s own account of the practice; the facts to build on), CLI_FACTS.txt
    (real `wfc` help output), DEMO_FACTS.txt (a verified small consumer repository: init and plan executed, run not executed).
    Also read: docs/operator_manual (especially ch01 orientation and boundaries, ch02 commissioning including `Commissions
    that move or delete many files`, ch03 running, ch05 self-development, ch06 recovery, ch09 consumer quickstart and its
    new first-run example if present), docs/ai_info/_ai_info.adoc, docs/backlog/FTR-WFC-COMMIT-INTENT-ENUMERATION.adoc, docs/backlog/FTR-WFC-LIFECYCLE-ROTATION.adoc,
    and search the documentation for the existing mentions of this operating model (terms such as `Level 1`, `Level-1`, `higher-order`,
    `orchestrat`, `Strategic Execution Brief`; NOTE the directory docs/cold_storage/ is excluded from default ripgrep searches
    by an `.ignore` file: use `rg --no-ignore` there deliberately; cold storage is historical and non-authorizing). Read the
    existing sources, then write the tutorial so that a colleague does not have to read the project history.


    DO: (1) Create the new operator-manual chapter docs/operator_manual/ch10_level1_orchestration/ with `_chapter.adoc` and
    one or two leaves (for example `01_operating_pattern.adoc` and `02_worked_sequence.adoc`), following the existing chapter
    conventions exactly (front-matter fields Maturity/Authority/Updated/Owns, the `ifndef::assembled[]` pattern, anchors,
    the chapter include) and include it from docs/operator_manual/operator_manual.adoc after chapter 9. Maturity and Authority:
    informative; Owns: the Level-1 operating pattern as practised, explicitly not a product feature. (2) Content, in this
    order and compact: what the two levels are (Level 0 = WFC; Level 1 = an external Claude Code session; the maintainer keeps
    all authority that is not explicitly delegated), and an explicit table `Supported by WFC today` versus `Provided by the
    external Level-1 agent and the human` (do NOT document an integrated Level-1 product function; state that there is no
    universal factory control in this Beta and no autonomous planning product); prerequisites and directory layout (product
    or consumer repository, separate remote-less Evidence repository, an installed Runtime kept separate from development,
    one Git worktree per Run, a scratch/TMPDIR directory outside the repository), referring to the quickstart for installation
    and host requirements instead of repeating them; how a Level-1 session gets and keeps its context and goals (durable documents
    and a project instruction file such as CLAUDE.md instead of chat memory; a copyable, short template of standing instructions
    the human gives: what the agent may do on its own, what always needs the human, no push/tag/publish/config change/Runtime
    promotion, stop and ask at open decisions, no discarding of anything without consultation; honest note that long sessions
    lose context and why durable documents matter); how a larger goal becomes bounded Commissions (scope file-exact, acceptance,
    withheld authority, escalation default, hop budget with the rule of thumb of about twice the expected hops and why, one
    Run at a time, the program choice simple@v1 versus robust@v1 as the documentation states it); how authorization and independent
    review stay in the loop (`wfc plan` preview, `--yes` as the human''s standing delegation, the independent reviewer and
    the Findings model as the documentation states it, trusted commit, never skipped by Level 1); the launch/monitor/verify/integrate
    loop with REAL commands (worktree creation, `wfc plan`, `wfc run ... --yes` in the background, waiting on `wfc status
    --repository <worktree>` until the classification is terminal, `wfc report`; reading the classification and not the exit
    code; independent verification by the Level-1 agent before integrating; fast-forward integration; recording the Run id
    and Evidence commit), every command checked against CLI_FACTS.txt; handling stops, errors and recovery (the stop classifications
    as the manual defines them, review-only continuation Commission off a stopped branch, preserved work-in-progress, no in-place
    budget raise, one lifecycle per checkout path so a retry needs a fresh worktree, nothing discarded without the human);
    several Commissions in sequence (dependencies, one Run at a time, read-only preparation alongside, documenting each accepted
    Run); when Level 1 continues on its own and when a human decision is required (a short, concrete list); how to establish
    what was actually accepted (the archived Evidence and audit.json, the independent review record, the Coordinator task-check,
    not the Worker''s own report); scratch artifacts, worktrees, Evidence archives and the Runtime/development separation;
    and a compact, realistic EXAMPLE SEQUENCE of two or three small consecutive Commissions on the demo-style repository (command
    lines real, outcomes described as what to expect and what to check, no invented output). (3) A section `Starting small,
    and what it costs` carrying the maintainer''s expectation management, soberly and without alarming: suggest experimenting
    first with a small budget, for example an existing Claude Code subscription in the region of 25 euros per month if its
    current terms permit this use, one very small low-risk demo task, a cheaper Haiku-class Worker where the adapter supports
    it, only a few bounded Runs, then judge requirements, limits and cost from your own results; distinguish subscription,
    actual usage rights and limits, and separately billed API usage; do NOT state that any subscription or model guarantees
    unlimited WFC Runs; say that a seriously and continuously operated factory with capable models, independent reviews and
    repair loops can generate considerably higher token or usage cost; say that WFC in this Beta does not measure complete
    token usage itself (archived audit.json carries the limit `usage_not_reported`). Verify every claim about the product
    against the implementation or documents; where you rely on the Operator''s account in LEVEL1_PRACTICE_FACTS.txt, phrase
    it as practice and observation. (4) Keep the chapter dense and compact (an operating chapter of roughly 250 to 450 lines
    in total, not a report); link to existing canonical chapters for mechanics instead of copying them. CHECKS (measured):
    strict render `asciidoctor --safe-mode=safe -a assembled -o /dev/null --failure-level=WARN` over docs/operator_manual/operator_manual.adoc,
    docs/README.adoc and docs/ai_info/_ai_info.adoc exits 0 without output (do not edit the latter two; the router and index
    entries are added by a later package); `python3 scripts/wfc_doc_catalog.py generate` then `check` adds no unresolved link
    or Project Memory miss (report before and after; the catalog may add the new leaves); every command and option in the
    new chapter appears in CLI_FACTS.txt or is verified in the implementation (list the verification in your summary); the
    Coordinator task-check runs the full required suite (do not claim full-suite counts yourself).


    NON-GOALS and NOT AUTHORIZED: no change to WFC product semantics, Trusted-Git security rules, Harness, adapters or Runtime;
    no new features; no Q1 execution; no Runtime promotion; no push, tag, PyPI upload or GitHub Release; the release notes
    section for 0.1.0b1 stays `planned` (do not change that heading); no mass rewriting of historical documents, no change
    to completed reviews, no parallel source of truth (extend the canonical source, link instead of copying); no new governance
    structure; keep the size proportionate: a working document with real, verified examples beats governance prose. Describe
    the IMMINENT published state without claiming that the package has already been published: where text depends on publication,
    phrase it as the state of the 0.1.0b1 release (for example `once 0.1.0b1 is published`) and do not fabricate a PyPI page,
    URL or output.


    NOTE: `git status --short -uall` in an agent worktree lists about 22 untracked /dev/null-like entries injected by the
    wrapper; they are not your output, never put them in the CommitIntent. A Worker never reports any Finding operation; only
    the independent reviewer opens and resolves Findings. COMMIT MECHANICS (binding): no git command that writes (no add,
    mv, rm, reset, stash, commit); the index stays untouched; `commit_intent.paths` is a JSON array with exactly one plain
    repository-relative path per element (every new or modified leaf individually, no sentence, count, glob or directory);
    derive it from `git status --short -uall` and compare counts before you finish; state counts in the summary, never in
    the array. PARALLEL-WORK NOTE: package DOC-A runs concurrently in a separate worktree and adds docs/operator_manual/ch09_consumer_quickstart/02_first_run_example.adoc,
    a PyPI-first install section and host requirements to the quickstart; these do NOT exist in your checkout. Refer to them
    by file name and section name in prose (for example `the consumer quickstart and its first-run example leaf`), but do
    NOT write any link:/xref/include reference to a file or anchor that does not exist in your checkout (a later package adds
    the links and verifies them); likewise do not describe their content beyond what the task above states; for installation
    and host requirements say only that the consumer quickstart is the place for them.'
  acceptance: A new operator-manual chapter ch10 exists, is included from operator_manual.adoc and follows the chapter conventions;
    it explains Level 0 versus Level 1 with an explicit supported-by-WFC versus provided-by-the-Level-1-agent table and states
    that no integrated Level-1 product function exists; it covers prerequisites and layout, context and standing instructions
    (with a copyable template), decomposition into bounded Commissions, authorization and independent review staying in the
    loop, the launch/monitor/verify/integrate loop with real verified commands, stops and recovery, sequences of Commissions,
    the explicit human-decision list, how to establish what was accepted, scratch/worktree/Evidence/Runtime handling, and
    a compact realistic example sequence with no invented output; it carries the `Starting small, and what it costs` section
    as specified without promises or alarm; it links to canonical chapters instead of duplicating; it is dense and compact;
    strict render exit 0 without output; catalog check adds no unresolved link or Project Memory miss; no product, security
    or Runtime change; the full required suite is green; CommitIntent array one plain path per element; independently accepted
    with no blocking Findings and Coordinator task-check passed.
  withheld_authority: No change to src/, scripts/, tests/, Makefile, workflow files, pyproject.toml, README.md, docs/README.adoc,
    docs/ai_info/_ai_info.adoc (index and router entries are a later package), the release plan, governance/, archived reviews
    or any historical document; no new feature; no statement that a Level-1 product function exists; no statement that the
    package is already published; no push, tag, publication, Runtime promotion or Q1 execution.
  escalation_default: Escalate a conflict between a source document and the implementation (name it, do not resolve it by
    guessing), any statement you cannot verify, or a need to change product behaviour; incomplete work alone is not blocked.
