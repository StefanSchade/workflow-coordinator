schema_version: 3
policy_id: consumer-standard
revision: v1
scope:
- workflow-coordinator
governance_paths:
- .wfc/governance
work_item_scope_ceiling:
- src
- tests
- scripts
- docs
- README.md
- pyproject.toml
- Makefile
- examples/consumer-demo
max_autonomous_hops: 32
actions:
- edit
- commit
- review
evidence_commands:
  task-check:
    argv:
    - sh
    - -c
    - for f in docs/warm_storage/post-beta-planning/wfc_beta2_operator_efficiency_analysis.adoc
      docs/backlog/beta2_operator_efficiency_plan.adoc $(git ls-files -m -o --exclude-standard
      -- '*.adoc'); do [ -e "$f" ] || continue; asciidoctor --safe-mode=safe -a assembled
      -o /dev/null --failure-level=WARN "$f" || exit 1; done
    timeout_seconds: 600
