program:
  id: robust
  revision: v1
task:
  title: 'Recovery and routing bugfix: recoverable mechanical stops, regular resume path, reviewer route semantics'
  body: 'GOAL. Fix one concrete product defect and its underlying recovery contract: a robust@v1 Run whose independent focused review accepted can end in a terminal, unresumable `awaiting_human` that no
    documented path can recover. Implement three coordinated parts A, B, C below as one bugfix. This is not a general architecture study.


    INCIDENT (facts, read-only evidence: Evidence commit 38debc0, `archive/unclassified/workflow-coordinator-run-92112626ab9440c29a35f59dd12356e2` in the sibling evidence repository; do not modify it and
    do not touch ~/.local/state). RUN-92112626..., profile robust@v1, 6 of 14 Hops. H002 broad review changes_required (F001); H003 correction; H004 focused review accepted, F001 resolved, durable artifact
    committed; the Hop''s applied route was `correction` although the review found nothing to correct. robust@v1''s `focused_review` phase declares only the routes `correction` (goto `correct`) and `renew_broad_review`
    (goto `broad_review`); it has no `accept`/complete route by design (a converged focused review costs one further broad review, see docs/backlog/postbeta_plan_p1_adr_and_hardening.adoc section 4.2(3)).
    `correction` sent the Run back to the Worker phase: H005 Worker, no change, no commit. H006 was a second focused review, again with nothing to change: no commit and no CommitIntent. `vertical._durable_artifact_anomalies`
    then returned "required durable artifact has no CommitIntent" and the Run stopped `awaiting_human`: stop_reason `mechanical_preemption:required durable artifact has no CommitIntent`, no human_question,
    no semantic_stop, no open Finding, task-check pass, worktree clean, end HEAD 912cb86. `wfc resume` then reports `lifecycle already classified (no-op)` (`frontdoor/lifecycle._evaluate` returns early
    for any journaled `classified`); `reducer.resume_after_reconcile` needs `reconcile_required` and is not exposed by any CLI; `operator._predecessor_for_successor` demands a frozen semantic_stop, so `prepare-successor`
    refuses. `frontdoor/report.py` nevertheless tells the human to "answer the open question, then run `wfc resume`" although none exists.


    ROOT CAUSES. (1) The reviewer is not told what the permitted routes mean and picks the wrong forward route. (2) A purely mechanical post-acceptance anomaly with consistent facts is classified as terminal
    `awaiting_human` (a state meant for decisions) and the lifecycle journal treats every classification as final. (3) The next-action text promises a recovery that does not exist.


    DO.

    A. Honest classification of recoverable mechanical stops. Define one precise, tested predicate for a "recoverable mechanical stop": reason prefix `mechanical_preemption:`, no semantic stop, no human
    question, no open blocking Finding, the Hop outcome recorded, worktree clean, current HEAD equal to the last recorded Hop end HEAD, the anomalies exactly of the post-acceptance durable-artifact class
    (`vertical._durable_artifact_anomalies`; decide in the verification record whether the WFC-GIT-08 subject anomaly belongs to the class, default: no). A new Run that meets the predicate must stop as
    `reconcile_required` (explicit new reconcile reason, stopped Hop stays charged, the stop reason and anomaly text preserved in the Run record and in the archive), not as terminal `awaiting_human`. Every
    other mechanical stop keeps its current classification. `reconcile_required` semantics, `resume_after_reconcile` invariants and the rule that route authority is never read from Run state stay unchanged
    except where the new reason strictly needs it.

    B. A regular, authorized recovery path through `wfc resume`, for BOTH (i) a Run newly stopped under A and (ii) an already classified and archived `awaiting_human` Run that satisfies the same predicate
    (this is the situation of the incident Run and must work for it without any manual state edit). `wfc resume` re-verifies the predicate against the live Run facts and the checkout (exact HEAD, clean
    worktree, no changed Commission/envelope identity, lifecycle authorization still the original one), then appends new journal records (never rewrite or delete an existing record), moves the Run to READY
    at the same phase with the stopped Hop still charged and the hop limit unchanged, continues the engine, and classifies the continuation as a further `classified` record. The invocation of `wfc resume`
    is the maintainer/operator authorization of this recovery; it widens neither scope, program nor budget. If any predicate fails it refuses with a named classification and message and changes nothing.
    Historical Evidence is immutable: the already archived attempt (manifest, audit.json, raw files, its Evidence commit) is never rewritten, moved or overwritten; the continuation is archived additively
    under a distinct, collision-free destination that records its predecessor attempt and the recovery step, and an existing destination is refused, never overwritten. `wfc status`/`wfc report` must show
    the recovery history truthfully, and `report.py`''s "next" text for each affected classification must name only a path that exists.

    C. Route semantics for reviewers and the missing-commit trap. (i) The assembled prompt of every phase with a gate review must list each permitted route with a generic, profile-derived explanation (effect,
    target phase and its role, whether it is the `failed_evidence_route`), and state the rule: a review that finds no blocking issue must choose the forward route that continues toward acceptance, never
    a route that hands the work back to a Worker; `correction` is for `changes_required`. Derive it from the profile, do not hard-code route names, and do not change the robust@v1 or simple@v1 program records,
    route sets or catalogue digests. (ii) The prompt must state that in every review Hop, including a re-review with no new Finding, the required durable artifact must be updated with this Hop''s verdict
    and named in the CommitIntent. Do not weaken `_durable_artifact_anomalies`. (iii) Decide, with a test, whether the reducer should additionally reject or normalise the contradictory combination (gate
    review outcome `completed`, no open blocking Finding, requested route equal to `failed_evidence_route`); choose the smallest option that cannot create a new silent-accept path and cannot weaken reviewer
    authority, and document the decision.


    BOUNDARIES THAT MUST HOLD (reviewer: check each by execution). The independent reviewer''s authority and Finding rules are unchanged: nothing in A/B/C lets the operator, the Coordinator or a resume
    accept, resolve, open or override a Finding or skip a review. A recovery never converts an unreviewed state into an accepted one: after resume the Run still needs its normal accepting route. No historical
    Evidence or archived attempt is modified. No state outside the Run''s own checkout state and the additive archive is written. No relaxation of trusted-Git, sandbox, scope, evidence or durable-artifact
    checks.


    TESTS (required, they must fail without the fix). Reproduce the incident structurally: a robust@v1-shaped profile whose focused_review has no complete route, a no-change re-review without CommitIntent,
    and assert the new classification (A); a fixture journal with `classified: awaiting_human` and a Run record matching the incident facts, asserting that `wfc resume` recovers it, appends rather than
    rewrites, keeps the archived attempt byte-identical, refuses a collision, and refuses when each predicate element is violated one by one (B); prompt content for route semantics and artifact obligation,
    derived from a profile with different route names (C). Keep all existing tests green; do not weaken or delete an existing assertion except where a rule is deliberately replaced, and then say so. Add
    no test that needs the network.


    DOCS. Update only what changes: the Operator Manual recovery/diagnostics passages (ch03 launch/status, ch06 recovery, ch07 as applicable), the semantic-model statement of `reconcile_required`/`awaiting_human`
    if affected, and one compact record `docs/warm_storage/post-beta-planning/wfc_recovery_routing_fix_verification.adoc` with: the predicate, the design decisions (including C(iii) and the WFC-GIT-08 decision),
    the changed contracts, measured checks (commands, results, what you could not run and why), and the explicit statement that robust@v1 was left unchanged and why. Add the work-item line to docs/backlog/_open.adoc
    following existing entries; do not edit the autonomy FTR or any file about the Level-1 autonomy Commission.


    ENVIRONMENT: the Coordinator''s task-check runs the full required suite (`python -m pytest -q`) after your Hop with verified offline inputs; your sandbox may lack them, so do not claim full-suite counts
    you did not measure. Find a Python with pytest and PyYAML; run targeted files with `--wfc-partial` plus explicit paths and say exactly what you ran. `python -m ruff check .` is the lint gate. Strict
    doc render: `asciidoctor --safe-mode=safe -a assembled -o /dev/null --failure-level=WARN <file>` must print nothing for each changed .adoc. `python3 scripts/wfc_doc_catalog.py generate` then `check`
    must not report additional unresolved links or Project Memory misses compared with before your change.


    WITHHELD FOR EVERY HOP: no change to `src/workflow_coordinator/agent_skill/`, to the robust@v1/simple@v1 program records or catalogue digests, to adapters other than what C(i)/(ii) strictly needs in
    prompt assembly, trusted Git, sandbox, scope or admission rules, the release workflow, version literals, `governance/`, `.wfc/`, `.github/`; no new dependency; no push, tag, release, publication, Runtime
    promotion, installation; no other repository; never read, write or delete anything under ~/.local/state or the evidence repository. A file outside the declared scope that proves necessary is a scope
    question for the human (stop and say which file and why), not a reason to widen or work around. A resource file whose digest is pinned (src/workflow_coordinator/resources/**, implementation_identity.RESOURCE_DIGESTS)
    may be changed only if needed, with the digest update and its tests in the same change and mentioned in the verification record.


    NOTE: `git status --short -uall` in an agent worktree may list untracked /dev/null-like entries injected by the wrapper; never put them in the CommitIntent. A Worker never reports any Finding operation;
    only the independent reviewer opens and resolves Findings. COMMIT MECHANICS (binding): no git command that writes (no add, mv, rm, reset, stash, commit); the index stays untouched; `commit_intent.paths`
    is a JSON array with exactly one plain repository-relative path per element (every new, modified or deleted leaf individually; no sentence, count, glob or directory); derive it from `git status --short
    -uall` and compare the counts before you finish. Leave no stray file behind (no `__pycache__`, build output, or generated `.claude/skills/wfc/` that Git does not ignore).


    REVIEW FOCUS (independent reviewer, whole candidate, by your own execution): the predicate is exact and tested element by element; no path turns a stopped Run into an accepted one; the incident Run''s
    recorded facts would pass B while a Run with an open Finding, a semantic stop, a dirty tree or a moved HEAD would not; the archive stays immutable and additive; resume cannot be used to widen anything;
    C''s prompt text is generic and does not weaken the durable-artifact rule; the contradiction decision C(iii) is justified; docs and next-action texts name only existing paths; no other stop classification
    changed behaviour.'
  acceptance: A, B and C are implemented as specified; the incident is reproduced structurally by tests that fail without the fix; the incident Run's recorded facts satisfy the recovery predicate and every
    single violated predicate element is refused with a named reason; Evidence and archived attempts are provably unchanged by recovery; reviewer authority and Finding rules are untouched; robust@v1 and
    simple@v1 are unchanged; docs, the verification record and next-action texts are accurate; existing tests pass; the full required suite and quality gates pass; the independent whole-candidate review
    accepted with no blocking Finding; CommitIntent array has one plain path per element; Coordinator task-check passed.
  withheld_authority: No change to the robust@v1 or simple@v1 program records, no change to reviewer authority, Finding rules or acceptance semantics, no rewriting or deletion of Evidence, archives or state,
    no widening of scope, program or Hop budget through recovery, no operation on the real incident Run or on ~/.local/state (the operator performs real recovery separately after integration), no Runtime
    promotion, installation, push, tag, publication, external repository change, weakening or skipping tests, no self-acceptance.
  escalation_default: Escalate a requirement that would weaken an authority or safety boundary, a needed file outside the scope, and missing required evidence. Do not silently substitute models. Incomplete
    work alone is not blocked.
