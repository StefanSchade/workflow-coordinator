schema_version: 1
commission_id: wfc-demo-evidence-gitignore-drift-001
work_item_id: WI-WFC-DEMO-EVIDENCE-GITIGNORE-DRIFT-001
authority_source: 'Maintainer request 2026-11-24: prepare O-1 regression guard Commission;
  launch subject to explicit subsequent approval.'
program:
  id: robust
  revision: v1
task:
  title: Guard the consumer demo Evidence gitignore against drift
  body: Read O-1 in docs/backlog/BUG-WFC-CONSUMER-DEMO-KIT-GIT-IDENTITY.adoc and docs/warm_storage/post-beta-planning/wfc_bug_demo_kit_git_identity_broad_review.adoc.
    Add a focused regression test in tests/integration/test_consumer_demo_kit.py that
    compares the demo's actual generated Evidence repository .gitignore byte-for-byte
    with the Development source's workflow_coordinator.frontdoor.config.evidence_gitignore_block().
    Preserve the kit's standard-library-only constraint and avoid product changes
    or general refactoring. Demonstrate mutation sensitivity by temporarily changing
    one block in a disposable copy or reversible experiment, running the test and
    reporting the exact mutation, command and failure; restore and run against unchanged
    product, reporting the passing result. Do not commit the mutation. Record the
    work and measured checks in the new backlog work item, leaving independent acceptance
    and integration for the maintainer. Do not modify the closed BUG or its historical
    review. Follow repository policy; agents do not perform Git writes. CommitIntent
    lists each changed leaf separately. Only the independent reviewer opens or resolves
    Findings.
  acceptance: The test detects any byte difference between the produced demo block
    and the Development managed block, passes for the unchanged product, and demonstrably
    fails on an intentional difference. No existing test is weakened. The work item
    states the observation, scope, exact red/green evidence and pending acceptance;
    the Coordinator's full required task-check passes. Independent review evaluates
    the whole result and records its evidence in the designated review artifact.
  withheld_authority: No changes to product implementation, WFC trusted Git boundary,
    kit, configuration, runtime, existing closed BUG or its review, other tests, dependency
    declarations, or existing governance. No push, tag, publication, Runtime promotion
    or historical worktree cleanup. No weakening or skipping tests. Escalate any necessary
    scope expansion.
  escalation_default: Escalate scope or authority conflicts, inability to demonstrate
    mutation sensitivity, or a material disagreement with the recorded observation;
    report facts rather than asserting acceptance.
scope:
- tests/integration/test_consumer_demo_kit.py
- docs/backlog/FTR-WFC-DEMO-EVIDENCE-GITIGNORE-DRIFT.adoc
- docs/warm_storage/post-beta-planning/wfc_demo_evidence_gitignore_drift_broad_review.adoc
- docs/warm_storage/post-beta-planning/wfc_demo_evidence_gitignore_drift_focused_review.adoc
personas:
  worker: 'Careful maintenance engineer: add the smallest mutation-sensitive regression
    guard and record measured red and green evidence.'
  independent_reviewer: 'Independent adversarial reviewer: verify the comparison,
    reproduce mutation sensitivity and assess all acceptance criteria on the full
    candidate.'
evidence:
  argv:
  - python
  - -m
  - pytest
  - -q
  timeout_seconds: 900
max_autonomous_hops: 10
durable_artifacts:
  broad_review:
