authority_source: 'Repository owner instructions of 2026-11-26: the decisions D1-D7 and the Beta rule recorded in the Beta-2 operator-efficiency plan, and the order to implement its slices autonomously
  and sequentially (this is slice SKC2); robust@v1 with Claude Opus / Claude Sonnet / Claude Opus as worker, focused reviewer and broad reviewer (the owner''s model rule; the focused-review binding differs
  from the committed role default); local integration only; no push, tag, release, publication, Runtime promotion or .wfc/config.yaml change.'
program:
  id: robust
  revision: v1
task:
  title: 'Correction of the Operator Skill SK-001 (successor): executable shell examples and a precise notes trust statement'
  body: 'GOAL. A narrowly bounded CORRECTION of the integrated Operator Skill consolidation (`WI-WFC-BETA2-SK-001`, Run `RUN-4fc5cc28d9e54840bbd03b149b161486`, integrated at `3161028`). The architecture
    decision and the consolidation itself are ACCEPTED; this is explicitly NOT a renewed general rework. The existing SK-001 review (`docs/warm_storage/post-beta-planning/wfc_beta2_sk_broad_review.adoc`)
    and its findings stay UNCHANGED: this Commission is a separate, separately traceable correction; do not edit completed review artifacts.\n\nINPUT. The maintainer forwarded two findings from an additional
    external review of SK-001. The operator checked both against the repository before commissioning this task and confirmed both, with one refinement on the first (below). Verify them yourself against
    the current repository state and the actual contracts; if you consider a finding unfounded, say so with concrete evidence instead of mechanically adopting the proposed wording.\n\nFINDING 1: shell examples
    in the shipped skill files that are not executable as written. Placeholders in angle brackets stand inside fenced shell blocks, where the shell reads `<word` as an input redirection and `word>` as an
    output redirection. Operator-confirmed locations (the first three are definite, the fourth is a fragment): `src/workflow_coordinator/agent_skill/wfc/SKILL.md` around line 120 (`git show <base-ref>:docs/operator-notes.md`);
    `references/commission.md` around line 21 (`--evidence-command lint --evidence-argv <lint-argv-token>` and the test-token twin); `references/commission.md` around line 58 (`wfc request task.md --repository
    . <the same flags as above> \\ --output ../wfc-scratch/request.yaml`); `references/stops-and-evidence.md` around line 165 (`wfc report <evidence-repo>/archive/unclassified/<attempt-id>/audit.json`).
    A placeholder that stands inside quotes (for example the `--authority \"<the maintainer''s instruction>\"` example in `stops-and-evidence.md`) is fine. REFINEMENT: these blocks are syntactically VALID
    shell (`bash -n` returns 0 for every one of them); the defect is that a literal execution means redirections: it fails with ''No such file'' or creates a stray file. A regression test based on `bash
    -n` alone would therefore not catch it. Find ALL comparable examples (also `text`/other fences that are presented as runnable, the Operator Manual pages the skill mirrors, `docs/operator-notes.md`)
    and correct them. Goals: a block presented as executable must run as written once the stated values are filled in, or be marked unambiguously as a fragment or pseudocode (for example a `text` fence
    or an explicit lead-in sentence); a placeholder must be clearly recognisable as one without triggering redirection; keep ONE consistent placeholder convention across the skill (your choice, justify
    it: for example shell variables introduced by a preceding line, quoted placeholders, or upper-case words), and distinguish ''syntactically valid'' from ''executable with concrete project values'' in
    the convention''s one-sentence statement. Add REGRESSION TESTS without a large new framework: a token-level check (for example with `shlex`) over the shipped skill''s shell fences that rejects an unquoted
    angle-bracket placeholder, and, if useful, a `bash -n` syntax check as a second, weaker line; keep it small and non-fragile (no pinning of particular wording).\n\nFINDING 2: an over-strong trust statement
    about the consumer operator notes. The convention `docs/operator-notes.md` is right and stays. Several places claim, in substance, ''a Run cannot write the notes the next Run is operated by''. Operator-confirmed
    locations: `docs/operator_manual/ch09_consumer_quickstart/01_quickstart.adoc` around line 313 (''so a Run cannot write the notes the next Run is operated by'') and `src/workflow_coordinator/agent_skill/wfc/references/setup.md`
    around line 184 (''a Run must not be able to write the notes the ...''); find the equivalent statements in the Operator Manual, the design record `docs/backlog/FTR-WFC-LEVEL1-OPERATOR-GUIDANCE.adoc`,
    the inventory `docs/warm_storage/post-beta-planning/wfc_skill_consolidation_inventory.adoc`, `docs/operator-notes.md` itself and the tests (`tests/architecture/test_operator_notes_convention.py`, `tests/unit/test_agent_skill_content.py`).
    That is not correct in that generality: Run A may change `docs/operator-notes.md` inside its authorised scope; after review and integration the change is part of the committed base of Run B, and Level
    1 then reads it for Run B. The guarantee that actually holds is narrower: THE NOTES ARE READ FROM A SPECIFIC COMMITTED BASE STATE. UNCOMMITTED CHANGES OR A RUNNING RUN CANDIDATE MUST NOT INFLUENCE THE
    NOTES SELECTED FOR THAT RUN. Correct every such statement to the guarantee that holds. State plainly the difference between reproducibility and integrity of the Git state that is read, and trustworthiness
    of the content: a committed file is not thereby human-authored or individually checked by the maintainer, and the correction must not imply that. Keep: the notes confer no authority, are subordinate
    to the general operator rules, and a note that the installed CLI contradicts is merely stale. You may add, as an operating recommendation and never as a mechanism, that a change to the notes inside
    a Run''s scope goes through that Run''s ordinary independent review and that a maintainer who does not want a Worker to edit the notes keeps the file out of Worker scopes. Introduce NO new runtime function,
    configuration option or approval level. If a test pins the over-strong claim, correct the test to the narrower guarantee (a deliberate expectation change, stated in your result).\n\nPROCEDURE. (1) Inventory
    every affected location completely (search the repository for the placeholder patterns and for the trust phrasings, including paraphrases such as ''cannot write'', ''must not be able to'', ''never influence'');
    write the inventory as a short dated section in the design record `docs/backlog/FTR-WFC-LEVEL1-OPERATOR-GUIDANCE.adoc` (what you found, what you corrected, what you left and why). (2) Make the smallest
    consistent corrections. (3) Add or adjust the tests. (4) Run the deterministic gates: `python -m ruff check .`, the focused tests you can, strict render of every changed `.adoc`; the Coordinator''s
    task-check (`make check-docs`) is authoritative. (5) The independent reviews follow. Do not change the word count of the skill needlessly: replace rather than append.\n\nBOUNDARIES. No change to Runtime
    behaviour, the CLI or the authority model; no renewed general skill consolidation; no Runtime promotion, no `wfc skill install`, no push, tag or release; no change to the canonical project history;
    the completed SK-001 review artifacts stay as they are. If a correction would need a code change in the Runtime, record it as a candidate in the design record and do not implement it.


    SUCCESSOR AND SALVAGE NOTE (binding). This Commission is the successor of `wfc-beta2-skc-001` (Run `RUN-acba225567734db5a97a023bf8debace`). Its Worker Hop H001 produced a complete candidate (19 files)
    but left two stray, untracked scratch scripts in the repository (`tests/unit/_skc_probe_tmp.py`, `tests/unit/_skc_survey_tmp.py`); the Coordinator''s trusted commit refused the unexpected dirty paths
    and the Run stopped MECHANICALLY before any task-check or review. The candidate was never task-checked and never reviewed. It is preserved as NON-AUTHORITATIVE Git history on the local branch `salvage/beta2-skc-h001`
    (without the two stray files): read it with `git diff main salvage/beta2-skc-h001 --stat` and `git show salvage/beta2-skc-h001:<path>`; do not run git commands that write; ignore the old Run''s `.wfc/governance/...`
    files. Treat it as an UNTRUSTED DRAFT: write your own copy of what is right, re-verify every finding, every location and every claim against the current repository, and correct what is wrong; the independent
    reviews judge the result as a fresh candidate.\n\nWORKTREE DISCIPLINE (the reason the predecessor stopped; binding). Never create scratch, probe or survey scripts inside the repository. Put every temporary
    file under `$TMPDIR` (outside the checkout), or, if your sandbox forces a file inside the repository, delete it BEFORE you finish. Before you finish, `git status --short -uall` must show ONLY the files
    of your intended change (ignore the host sandbox''s placeholder dotfiles and directories in the checkout root such as `.bashrc`, `.gitconfig`, `.mcp.json`, `.claude/`, `.idea`, `.bash_profile`, which
    are not yours). Your CommitIntent `commit_intent.paths` must list exactly the changed leaves, one plain path per element.


    PLAN CONTEXT (binding). This Commission implements slice SKC2 of the Beta-2 operator-efficiency plan (`docs/backlog/beta2_operator_efficiency_plan.adoc`, section "Revision of 2026-11-26" and the slice''s
    own section; read the revision first, then the slice and the record it names). The maintainer''s decisions D1-D7 of 2026-11-26 and the Beta rule are part of it: contracts, schemas, CLI surfaces and
    programs are provisional in Beta, the existence of an accepted contract is no argument against a change, and what must be preserved are the intended safety and governance properties (independent reviewer''s
    sole Finding authority, trusted-commit boundary, fail-closed admission and recovery, one Run per checkout), not necessarily their present technical realisation. Judge every change on benefit, effort,
    risk and dependencies. Where a design is needed, the FIRST thing you do is write the design down (what you decide, the alternatives you reject and why, which safety property each decision preserves)
    as a short dated `Design` section of the record the slice names (never in a review artifact: those belong to the reviewers), so the reviewers judge the design before the code. A slice without a design
    question (a mechanical one) needs no such section.


    FRONT DOOR DOCS-SYNC (binding). Apply `docs/developer_guide/ch03_engineering_conventions.adoc` section `frontdoor-docs-sync`: when Front Door behaviour or the operating surface changes, check the Operator
    Manual, the consumer tutorials and the shipped Agent Skill sources (`src/workflow_coordinator/agent_skill/wfc/`) and edit what became inaccurate, incomplete or misleading in the same slice (retire statements
    an earlier slice wrote as "planned"); if the slice changes no Front Door behaviour, say so in one sentence in your result.


    CHECKS. The Coordinator''s task-check after every Hop is the evidence command of this Commission and is authoritative (real `bwrap`, offline bundle, about six minutes). Your Hop sandbox cannot start
    `bwrap`, has a read-only `/tmp` and no network: run the focused tests you can and `python -m ruff check .`, and reason carefully about the rest. Strict render for every new or changed .adoc (`asciidoctor
    --safe-mode=safe -a assembled -o /dev/null --failure-level=WARN <file>` prints nothing); `python3 scripts/wfc_doc_catalog.py generate` then `check` must not report more unresolved links (baseline 83)
    or Project Memory misses (baseline 4); generated catalog output must not be left as a stray file. Unused imports and similar residue of a removal are the defect class the lint gate exists for: run `python
    -m ruff check .` before you finish.


    COMMIT AND INDEX DISCIPLINE (binding, mechanical). Use NO git command that writes: never `git add`, `git commit`, `git stash`, `git reset`, `git mv`, `git rm`, `git checkout -- <path>` or any other
    index or history mutation; the index must remain untouched, so `git status --short` shows only unstaged working-tree changes when you finish. Your result''s CommitIntent `subject` MUST contain the WorkItem
    id and the current Hop id, for example `feat(frontdoor): <what you did> (WI-WFC-BETA2-SKC2-001, H001)` (use the real Hop id of this Hop). `commit_intent.paths` is a JSON array with exactly one plain
    repository-relative path per element: every new, modified or deleted leaf individually (no sentence, count, glob or directory); derive it from `git status --short -uall` and compare the counts before
    you finish. Deliver a complete candidate in the first Hop; a late correction costs three Hops. Leave no stray file behind. A Worker never reports any Finding operation; only the independent reviewer
    opens and resolves Findings.'
  acceptance: Every shell block in the shipped skill that is presented as runnable runs as written once its stated values are filled in, or is marked unambiguously as a fragment; one consistent placeholder
    convention is stated; a small token-level regression test rejects unquoted angle-bracket placeholders in the skill's shell fences; every statement that a Run cannot write the notes the next Run is operated
    by is corrected to the narrower guarantee (read from a specific committed base state; uncommitted changes and a running candidate cannot influence it), with reproducibility/integrity of the Git state
    distinguished from trustworthiness of the content, no authority conferred, no new runtime function; the inventory of affected locations is recorded in the design record; the completed SK-001 review
    artifacts are untouched; no runtime, CLI or authority-model change; the evidence command passes. No existing test is weakened, skipped or deleted; strict render prints nothing; the doc catalog check
    shows no additional unresolved links or Project Memory misses; `ruff check .` is clean; the full evidence command passes; the independent focused and whole-candidate broad reviews accepted with no blocking
    Finding; CommitIntent array has one plain path per element; Coordinator task-check passed.
  withheld_authority: No `.wfc/config.yaml`, governance/, `.github/`, scope-ceiling or release-workflow change; no push, tag, release, publication or Runtime promotion; no `wfc skill install`; no change
    beyond the slice scope; no weakening, skipping or deletion of a test; no change of the independent reviewer's sole Finding authority or of the trusted-commit boundary; no self-acceptance. No edit of
    the completed SK-001 review artifacts; no Runtime, CLI or authority-model change; no new runtime function, configuration option or approval level.
  escalation_default: Escalate a needed file outside the scope, a safety or authority property that cannot be preserved by any realisation of the slice (record the open decision with options and a recommendation),
    and a conflict with a recorded maintainer decision. Do not silently substitute models. Incomplete work alone is not blocked.
