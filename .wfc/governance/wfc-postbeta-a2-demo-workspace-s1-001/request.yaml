task:
  title: 'A2: Consumer Demo Workspace S1 -- seed repository, request templates and workspace generator'
  body: 'Implement slice S1 ("Workspace") of docs/backlog/FTR-WFC-CONSUMER-DEMO-WORKSPACE.adoc. READ FIRST and treat as the
    specification: that FTR in full (kit layout, seed repository, `The workspace make_workspace.py creates`, `Requests`, the
    security invariants SI-1 to SI-9, acceptance criteria AC-1, AC-2, AC-3, AC-8 as far as S1 can reach, AC-9, `Required tests`,
    `Failure and recovery expectations`, `Implementation sequence` S1); docs/warm_storage/post-beta-planning/wfc_postbeta_consumer_surface_concept.adoc
    is rationale only. The maintainer accepted the directory `examples/consumer-demo/` (D3). Also read tests/integration/test_beta_e2e_fake_provider.py
    and tests/fixtures/bp9/wfc_entry.py (how a test puts a `wfc` wrapper for the working tree on PATH with a temporary HOME),
    src/workflow_coordinator/frontdoor/request.py (the Consumer Request grammar) and the real `--help` of `wfc init` and `wfc
    plan`.


    DO, exactly S1: create under examples/consumer-demo/ the `seed/` tree (every file the FTR tabulates, including the empty
    `greeter/__init__.py` and `tests/__init__.py`, the `.gitignore` with the single line `__pycache__/`, `checks/check.sh`
    with its executable bit and header comment, `checks/doc_titles.py`, `.wfc/governance/repository-policy.md`), the `requests/`
    templates (the three task documents and the four request templates with the token `{{GUIDANCE_COMMIT}}`, names, programs,
    Hop limits, scopes, personas, durable artifacts, commission and work-item ids exactly as the FTR fixes them), `make_workspace.py`
    with the preflight, the ordered steps, the return codes 0/2/1, the `--wfc`/`WFC_BIN`/PATH resolution, the marker file
    `WFC-DEMO-WORKSPACE`, the printed layout and the Git-filter notice as specified, and a short kit `README.md` (what this
    is, the commands that exist after S1, a pointer to the consumer quickstart chapter; do not describe `rehearse.py` as existing:
    it is slice S2). Do NOT create `scripted_provider.py`, `scenarios/` or `rehearse.py`. The kit modules use the standard
    library only, import nothing from `workflow_coordinator` and nothing from `tests/`, and pass `make lint`. The kit never
    writes outside the workspace named on the command line, never deletes or overwrites, refuses a target inside any Git work
    tree, and calls the installed `wfc init` instead of writing a Consumer Config itself. TESTS (required suite), in tests/integration/test_consumer_demo_kit.py:
    workspace (AC-1), each preflight refusal returns 2 and creates nothing (AC-2: non-empty target, target inside a Git work
    tree, `wfc` not found), plan (AC-3: for each of the three task requests `wfc plan` with the rendered task document and
    the request''s fields exits 0 in a fresh worktree, with `--execution-override` for adapter, model and reasoning of each
    role), containment (AC-8 as far as S1 reaches: a throw-away HOME stays empty after the kit commands), boundary (an AST
    check that every kit module present imports only the standard library); every test builds its workspace under `tmp_path`,
    sets HOME to a temporary directory and uses the working-tree `wfc` wrapper as test_beta_e2e_fake_provider.py does; no
    test calls a provider or the network. Extend tests/architecture/test_offline_distribution.py for AC-9 (a wheel and an
    sdist built from the tree contain no path under `examples/`); do not weaken or restructure its existing assertions. Mind
    the trap the FTR records: a check that leaves a file Git does not ignore makes the baseline probe refuse; verify `sh checks/check.sh`
    leaves `git status --porcelain` empty in the generated repository. CHECKS to run and record: the new tests (targeted,
    `--wfc-partial`), `python -m ruff check .`, one manual end-to-end `make_workspace.py` run into a temporary directory outside
    the repository with the working-tree wrapper (show the printed layout and `git -C <ws>/greeter log --oneline`), and that
    the repository tree is clean of generated files afterwards.


    ENVIRONMENT: the Coordinator''s task-check runs the full required suite (`python -m pytest -q`) after your Hop with verified
    offline inputs; your own sandbox may lack them, so do not claim full-suite counts you did not measure. Find a Python that
    has pytest and PyYAML (`python -m pytest --version`, else `python3`); run targeted test files with `--wfc-partial` plus
    explicit paths (the repository''s explicit marker for a partial run) and say exactly what you ran. `python -m ruff check
    .` is the lint gate (`make lint`). The strict documentation render is `asciidoctor --safe-mode=safe -a assembled -o /dev/null
    --failure-level=WARN <file>` and must print nothing. `python3 scripts/wfc_doc_catalog.py generate` then `check` must report
    no additional unresolved link or Project Memory miss (currently 83 and 4).


    WITHHELD FOR EVERY SLICE: no change to adapters, the reducer, admission, the Trusted Commit, existing subcommands'' behaviour
    or output, the release workflow (.github/), the version literals (pyproject.toml version, implementation_identity.VERSION),
    governance/ or archived review records; no new runtime dependency; no push, tag, release, publication, Runtime promotion
    or provider call beyond this Run''s own role sessions; no write to any real agent configuration or to the real HOME. A
    file outside the declared scope that proves necessary is a scope question for the human (stop and say which file and why),
    not a reason to widen or to work around.


    NOTE: `git status --short -uall` in an agent worktree may list about 22 untracked /dev/null-like entries injected by the
    wrapper; they are not your output, never put them in the CommitIntent. A Worker never reports any Finding operation (open,
    resolve, residual or any other delta); only the independent reviewer opens and resolves Findings. COMMIT MECHANICS (binding):
    no git command that writes (no add, mv, rm, reset, stash, commit); the index stays untouched; `commit_intent.paths` is
    a JSON array with exactly one plain repository-relative path per element (every new, modified or deleted leaf individually;
    no sentence, count, glob or directory); derive it from `git status --short -uall` and compare the counts before you finish;
    state counts in the summary, never in the array. Leave no stray file behind (no `__pycache__`, build output or scratch
    inside the repository that Git does not ignore).'
  acceptance: examples/consumer-demo/ contains the S1 kit (seed, requests, make_workspace.py, README.md) exactly as the FTR
    specifies and no S2 file; make_workspace.py on an empty target outside any Git work tree produces the specified layout
    with greeter/ at exactly two commits, a clean tree, no remote, the check passing and leaving the tree clean (AC-1); each
    preflight refusal returns 2 and creates nothing (AC-2); `wfc plan` exits 0 for each of the three task requests in a fresh
    worktree (AC-3); a throw-away HOME stays empty (AC-8 for S1); the kit modules import only the standard library; `make
    lint` passes; built wheel and sdist contain no path under examples/ (AC-9) with the existing distribution assertions intact;
    SI-1 to SI-4, SI-8 and SI-9 hold for what S1 delivers; tests/integration/test_consumer_demo_kit.py is in the required
    suite and passes; the full required suite is green; CommitIntent array one plain path per element; independently accepted
    with no blocking Finding and Coordinator task-check passed.
  withheld_authority: 'Only slice S1: no scripted provider, scenario file or rehearse.py; no change to src/, pyproject.toml,
    scripts/, the Makefile, the artifact allow-list or its documentation, README.md, docs/ (other than the two review artifacts),
    tests/fixtures/bp9/ or any existing test''s meaning; the kit installs, upgrades, downloads and deletes nothing and opens
    no network connection.'
