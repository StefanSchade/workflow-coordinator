  title: 'A1: Consumer Tutorials S1 -- standalone-link repairs, link guard, README entry points -- review-first continuation
    of the stopped Run'
  body: 'THIS IS A REVIEW-FIRST CONTINUATION, NOT A NEW IMPLEMENTATION. The stopped Run RUN-34836e1ddac741878ea4e7d55b827ae6
    (Commission `wfc-postbeta-a1-tutorials-s1-001`) ended `reconcile_required` after 5 of 10 Hops: the provider dispatch of
    its next Hop was interrupted (a provider usage limit at the time). That Run keeps its own outcome and is not reinterpreted;
    it established no acceptance. Its candidate is already in this checkout (implementation 811a7d3, correction 1875ab3; its
    focused review 9b89355 resolved Finding F001 and the final renewed broad review was the interrupted Hop). The slice specification
    is unchanged: the original Commission''s task document at `.wfc/governance/wfc-postbeta-a1-tutorials-s1-001/task.md` in
    this checkout together with the FTR it names; read both in full first. Review records written by the stopped Run (docs/warm_storage/post-beta-planning/wfc_postbeta_a1_tutorials_s1_broad_review.adoc,
    docs/warm_storage/post-beta-planning/wfc_postbeta_a1_tutorials_s1_focused_review.adoc where present) are context only,
    never acceptance. The interrupted Hop left an uncommitted partial review text in the stopped worktree; it is preserved
    outside this checkout as non-authoritative material and is not part of the candidate.


    DO (Worker, implement Hop): do NOT re-implement or restructure the candidate. Verify it against every acceptance criterion
    of the slice by your own execution, criterion by criterion. Where you can demonstrate a defect or a gap against the specification,
    correct it within the scope and say exactly what you changed and why; otherwise change nothing. Write one compact verification
    record `docs/warm_storage/post-beta-planning/wfc_postbeta_a1_tutorials_s1_verification.adoc` with your measured results
    per criterion (commands run, results, anything you could not run and why) and any correction made. The independent reviewer
    then performs the whole-slice broad review from scratch against the FTR and the original task document, by their own execution;
    the product may be corrected further only where the reviewer proves a material defect.


    ENVIRONMENT: the Coordinator''s task-check runs the full required suite (`python -m pytest -q`) after your Hop with verified
    offline inputs; your own sandbox may lack them, so do not claim full-suite counts you did not measure. Find a Python that
    has pytest and PyYAML (`python -m pytest --version`, else `python3`); run targeted test files with `--wfc-partial` plus
    explicit paths (the repository''s explicit marker for a partial run) and say exactly what you ran. `python -m ruff check
    .` is the lint gate (`make lint`). The strict documentation render is `asciidoctor --safe-mode=safe -a assembled -o /dev/null
    --failure-level=WARN <file>` and must print nothing. `python3 scripts/wfc_doc_catalog.py generate` then `check` must report
    no additional unresolved link or Project Memory miss (currently 83 and 4).


    WITHHELD FOR EVERY SLICE: no change to adapters, the reducer, admission, the Trusted Commit, existing subcommands'' behaviour
    or output, the release workflow (.github/), the version literals (pyproject.toml version, implementation_identity.VERSION),
    governance/ or archived review records; no new runtime dependency; no push, tag, release, publication, Runtime promotion
    or provider call beyond this Run''s own role sessions; no write to any real agent configuration or to the real HOME. A
    file outside the declared scope that proves necessary is a scope question for the human (stop and say which file and why),
    not a reason to widen or to work around.


    NOTE: `git status --short -uall` in an agent worktree may list about 22 untracked /dev/null-like entries injected by the
    wrapper; they are not your output, never put them in the CommitIntent. A Worker never reports any Finding operation (open,
    resolve, residual or any other delta); only the independent reviewer opens and resolves Findings. COMMIT MECHANICS (binding):
    no git command that writes (no add, mv, rm, reset, stash, commit); the index stays untouched; `commit_intent.paths` is
    a JSON array with exactly one plain repository-relative path per element (every new, modified or deleted leaf individually;
    no sentence, count, glob or directory); derive it from `git status --short -uall` and compare the counts before you finish;
    state counts in the summary, never in the array. Leave no stray file behind (no `__pycache__`, build output or scratch
    inside the repository that Git does not ignore).'
  acceptance: The verification record exists and reports measured results for every acceptance criterion of the slice; the
    candidate, including any correction made here, meets the acceptance of the original task document and the FTR slice in
    full (not partially); every correction is stated and inside the scope; the independent whole-slice broad review accepted
    with no blocking Finding; the full required suite is green; CommitIntent array one plain path per element; Coordinator
    task-check passed.
  withheld_authority: 'Only slice S1: no overview page, no tutorial text, no quote guard, no chapter rename, no change to
    chapter 10 beyond the three link repairs, no change to the quickstart, the release notes, src/, scripts/, pyproject.toml,
    the Makefile or the release workflow; no new dependency. No re-implementation or restructuring of the accepted-shape candidate
    beyond demonstrated defects; the stopped Run''s records are not edited.'
  escalation_default: Escalate a conflict between the FTR and the implementation or the CLI (name it; do not resolve it by
    guessing), a needed file outside the scope, or a requirement that would change product semantics or a withheld authority;
    incomplete work alone is not blocked.
