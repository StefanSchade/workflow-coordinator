schema_version: 3
policy_id: consumer-standard
revision: v1
scope:
- workflow-coordinator
governance_paths:
- .wfc/governance
work_item_scope_ceiling:
- src
- tests
- scripts
- docs
- README.md
- pyproject.toml
- Makefile
- examples/consumer-demo
max_autonomous_hops: 32
actions:
- edit
- commit
- review
evidence_commands:
  task-check:
    argv:
    - sh
    - -c
    - 'make check-docs && python3 scripts/wfc_doc_catalog.py generate > /dev/null
      && python3 scripts/wfc_doc_catalog.py check | grep -E "Informational: ([0-9]|[1-7][0-9]|8[0-3])
      unresolved links; [0-4] Project Memory"'
    timeout_seconds: 900
