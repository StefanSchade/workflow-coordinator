program:
  id: robust
  revision: v1
task:
  title: 'P2 package D1: retire the 25 pointer bridges'
  body: 'Execute package D1 of the accepted documentation-consolidation plan docs/backlog/postbeta_plan_p2_documentation_consolidation.adoc:
    retire the 25 pointer bridges. Read the plan''s sections 1-3, 5.1, 6 (the checks V1-V4 and their baselines), 7 (deliberately
    abandoned paths) and the package entry D1 first; verify its counts and the two link consumers against the repository before
    changing anything. DO: delete the whole directory docs/backlog/operator-manual-consolidation/ (11 leaves) and the 14 named
    bridge leaves under docs/warm_storage/concepts/ (the twelve operator-manual review bridges, wfc_operator_manual_p2_planned_scope_2026-11-10.adoc
    and wfc_documentation_consolidation_plan.adoc; each is 16-48 lines of pointer text whose substantive body already exists
    under docs/cold_storage/backlog/pre-0.1.0b1/); retarget the two live links in docs/warm_storage/concepts/wfc_minimal_documentation_lifecycle_001_broad_review_2026-11-14.adoc
    to the cold originals; update docs/backlog/FTR-WFC-DOCUMENTATION-CURATION.adoc so that its statement that 25 retired source
    paths retain temporary bridges records their removal instead (keep its original C4 narrative intact), and correct the
    curation row in docs/README.adoc and the planning-evidence paragraph in docs/ai_info/_ai_info.adoc so that neither implies
    live bridges. MAINTAINER PRINCIPLES (binding): historical content stays findable but old paths have no entitlement to
    exist; create NO redirect, stub, shim, tombstone file or parallel tree; archived Run evidence and cold-storage bodies
    are not changed; change no Status:: line and no acceptance claim. Report the deliberately abandoned paths in your result
    instead of recreating them. VERIFY with the plan''s checks, each with the measured before and after values in your result:
    V1 (the strict Asciidoctor render of the listed books and entry points, expected no output and exit 0), V2 (python3 scripts/wfc_doc_catalog.py
    generate: the record count must drop by exactly the 25 deleted records), V3 (python3 scripts/wfc_doc_catalog.py check:
    exit 0, Project Memory source_path misses unchanged at 4, unresolved links not above the baseline) and V4 for all 25 basenames
    (the git grep forms in the plan; expected no live reference). Add no new script, make target, metadata field or report.
    PROPORTION (maintainer principle): a pure deletion with two link repairs and three prose corrections; add nothing beyond
    that and no documentation of the documentation. A Worker never reports any Finding operation (resolve, residual or any
    other delta); only the independent reviewer opens and resolves Findings. The CommitIntent names every changed and every
    deleted leaf individually, never directories; no agent Git writes.'
  acceptance: 'The 25 bridge records are gone and no redirect, stub or tombstone replaces them; the two retargeted links resolve
    to the cold originals; the curation record, the README router row and the _ai_info.adoc paragraph no longer imply live
    bridges and the C4 narrative is preserved; V1 prints nothing and exits 0, V2''s record count dropped by exactly 25, V3
    exits 0 with the four source_path misses unchanged and unresolved links not above the baseline, V4 finds no live reference
    for any of the 25 basenames; no cold body, Status:: line or acceptance claim changed; the deliberately abandoned paths
    are reported; independently accepted with no blocking Findings and Coordinator task-check passed.'
  withheld_authority: 'No further retirement, no restructure of warm storage, no change to the retained FTR05 review, to any
    Status:: line or acceptance claim, to cold storage bodies, to project_memory/, governance/, src/, tests/ or scripts/;
    no redirect, stub, shim or parallel tree; no Runtime promotion, push, merge, rebase or tag.'
  escalation_default: Escalate a real scope or authority conflict, a live consumer the plan missed, or a check whose baseline
    does not reproduce; incomplete work alone is not blocked.
