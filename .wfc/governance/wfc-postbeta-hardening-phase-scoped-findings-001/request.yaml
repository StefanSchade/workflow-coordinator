authority_source: 'Maintainer decisions of 2026-11-21 (AD-4 = B; hardening H1 authorized after the accepted ADR; G0 order
  exception, not a declaration that G0 is fulfilled): one robust Commission with Opus worker and Opus reviewer, through the
  product Front Door, up to fourteen Hops; no release, tag or push; no Runtime promotion by the Commission.'
program:
  id: robust
  revision: v1
task:
  title: 'Hardening H1: phase-authority-scoped findings surface for the current result contracts'
  body: 'Implement hardening H1 as decided in the ADR on closed, versioned workflow programs (decision AD-4 = B, maintainer
    2026-11-21): narrow the `findings` surface of the projected structured-result contract by what the admitted phase already
    carries (its `finding_authority`), for the CURRENT result-contract versions only. PROBLEM (verify it first at the current
    HEAD, with the cited lines): src/workflow_coordinator/structured_result_schema.py (around lines 82-94) offers both Finding-delta
    shapes to every phase, including phases whose permitted operations are empty (reducer.py around 1693-1703); Workers then
    emit schema-valid but phase-authority-invalid Finding operations and the reducer stops the Run fail-closed (`invalid_finding_delta`:
    4 stops in the Beta series; the route enum already shows the working narrowing pattern at structured_result_schema.py
    around line 94). READ: the ADR docs/technical_model/ch04_target_and_alternatives/03_adr_closed_versioned_workflow_programs.adoc
    (AD-4 and its conditions), docs/backlog/FTR-WFC-PHASE-SCOPED-RESULT-SCHEMA.adoc (activation, proposal and non-goals),
    model.select_result_contract (model.py around 679-699, whose selection key already includes finding_authority), vertical.py
    (around 301), reducer.py (around 1558 and 1693-1703), prompt.py (around 140 and 154), adapter.py, codex_adapter.py, claude_adapter.py,
    tests/unit/test_codex_adapter_conformance.py, tests/unit/test_claude_adapter_conformance.py, tests/unit/test_slice3_vertical.py,
    tests/unit/test_reducer.py and tests/architecture/test_replays.py. DESIGN RULES: first establish where the admitted phase''s
    finding_authority is ALREADY available when the findings item schema is built, and choose the smallest change that makes
    it reach the schema builder; derive the narrowing declaratively from that property, so that the schema admits exactly
    the operations the reducer would admit for that phase; no phase name anywhere in product code; no new state mechanism,
    FindingState, Finding operation or authority kind; no automatic repair or silent omission of an unauthorized delta; the
    reducer stays untouched and remains the authority; historical result contracts and archived-result replays stay exactly
    as they are (identify the current versions from select_result_contract and leave the others alone); no change to robust@v1,
    simple@v1 or any program definition, to route projection or to the contract-kind split. ESCALATION RULE (maintainer):
    if the narrowing needs model.py or prompt.py changes, a new state or parameter plumbing through more modules than the
    scope below, or is otherwise materially more complex than described here, STOP and escalate with a traceable assessment
    of the alternatives (what each costs in code, tests and ongoing complexity, its risk, and your recommendation) instead
    of adding mechanisms. PROPORTION (maintainer principles, 2026-11-21): fix the proven product problem and nothing more;
    add a test only where it detects a meaningful regression; add no guard, state, abstraction or documentation out of habit;
    keep the change materially as small as the problem allows; if you consider a stated acceptance criterion disproportionate
    or unnecessary, say so for the maintainer instead of satisfying it with further mechanism or silently waiving it. A Worker
    never reports any Finding operation (resolve, residual or any other delta); only the independent reviewer opens and resolves
    Findings. The CommitIntent names every changed leaf individually, never directories; no agent Git writes.'
  acceptance: 'A new test in each of the two adapter conformance suites shows that for an empty finding authority the generated
    findings item schema admits no authoritative state transition and for finding_authority=(''resolve'',) admits exactly
    the resolution shape, and each fails without the product change (the independent reviewer re-runs it against the base
    HEAD); the three existing reducer negative tests (test_finding_lifecycle_requires_gate_or_human_authority, test_new_finding_creation_uses_explicit_authority_operation,
    test_supervisor_has_no_finding_disposition_surface) and tests/architecture/test_replays.py pass unmodified; a forged out-of-schema
    delta is still refused by the reducer (the existing negatives cover it; add no weaker variant); no phase name appears
    in the added product code (the reviewer can grep for it); the required-mode suite passes, and ruff check and ruff format
    --check pass for the changed files if ruff is available; docs/backlog/FTR-WFC-PHASE-SCOPED-RESULT-SCHEMA.adoc carries
    a dated implementation paragraph with its Status:: line unchanged; independently accepted with no blocking Findings and
    Coordinator task-check passed.'
  withheld_authority: No change to the reducer, robust@v1, simple@v1 or any program definition, route projection, the contract-kind
    split, historical result contracts, model.py or prompt.py (escalate instead); no new FindingState, operation or authority
    kind; no phase name in product code; no change under governance/; no Runtime promotion, push, merge, rebase or tag.
  escalation_default: Escalate a real scope or authority conflict, a design that turns out materially more complex than described
    (with a traceable assessment of alternatives), or evidence that contradicts the stated problem; incomplete work alone
    is not blocked.
