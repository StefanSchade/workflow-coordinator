schema_version: 1
repository_name: workflow-coordinator
governance_dir: .wfc/governance
work_item_scope_ceiling:
  - src
  - tests
  - scripts
  - docs
  - README.md
  - pyproject.toml
  - Makefile
  - examples/consumer-demo
max_autonomous_hops: 32
default_execution:
  worker:
    adapter: claude_cli
    model: claude-sonnet-5
    reasoning: high
  independent_reviewer:
    adapter: claude_cli
    model: claude-opus-5
    reasoning: high
evidence:
  repository: ../workflow-coordinator-run-evidence
  raw: commit
