domain: curriculum_construction
open_requirement: each learning objective is supported by an assessed activity
local_revisions:
  - map each stated objective to an activity
  - add assessment evidence for each mapped activity
independent_counterexamples:
  - objective: compare primary sources
    observation: the mapped discussion has no assessed activity
  - objective: explain local civic participation
    observation: the mapped reflection has no assessed activity
expected_protocol:
  - correction
  - independent_counterexample
  - diagnosis
  - reframe
  - strategy_assessment
