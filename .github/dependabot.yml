# Maintainer decision D3 (2026-11-25, docs/backlog/beta2_release_streamlining_plan.adoc#d3).
# Scope: the github-actions ecosystem only, directory "/" (the single
# workflow file at .github/workflows/release.yml). This file does not and
# cannot enable auto-merge: auto-merge is a GitHub repository setting the
# maintainer configures separately. The "groups" below only make the
# automerge-eligible action set identifiable by name (in each pull request's
# title and branch name), for a repository rule or workflow the maintainer
# owns to act on; see
# docs/developer_guide/ch04_release_management.adoc#release-ci for the
# mechanism and its limit.

version: 2
updates:
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    cooldown:
      default-days: 7
    groups:
      # Actions that run only in the unprivileged `check` and `python-compat`
      # jobs. Minor/patch updates here are the automerge-eligible set (D3).
      check-only-actions:
        patterns:
          - "actions/checkout"
          - "actions/setup-python"
          - "actions/upload-artifact"
        update-types:
          - "minor"
          - "patch"
      # Actions that run in publish-testpypi, publish-pypi or release.
      # Always reviewed by hand; never automerge-eligible.
      publish-path-actions:
        patterns:
          - "actions/download-artifact"
          - "pypa/gh-action-pypi-publish"
