name: release

# Implements docs/developer_guide/ch04_release_management.adoc (package E3 of
# docs/backlog/postbeta_plan_p3_release_engineering.adoc). C6/MD-5 (what runs
# on a hosted runner) stays OPEN until a hosted run of this workflow proves
# route R-A green; this file is that route, offered as evidence, not as a
# maintainer decision. No repository secret is used anywhere: TestPyPI and
# PyPI publication use OIDC Trusted Publishing (MD-1); the `pypi` Environment's
# required-reviewer rule (G8) is a maintainer-created repository setting, not
# anything this file can create.
#
# Every third-party action is pinned to a full commit SHA, resolved on
# 2026-11-23 with `git ls-remote` against the upstream repositories: the SHA is
# the commit the previously used mutable reference (`v6`, `v4`, `release/v1`)
# pointed to, and the trailing comment names the exact release that commit
# carries. No action was upgraded by pinning. To change a version, resolve the
# new tag to its commit with `git ls-remote --tags <repo> <tag> <tag>^{}` (use
# the peeled `^{}` commit for an annotated tag) and update SHA and comment
# together. See ch04_release_management.adoc.

on:
  push:
    branches:
      - main
    tags:
      - 'v*'

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v6.1.0 (v6)
        with:
          fetch-depth: 0

      # Branch-push runs already have origin/main locally (it is the pushed
      # ref); a tag-push run does not, and release-check's tag mode (and this
      # job's own reachability expectations) needs it to decide whether the
      # tagged commit is reachable from origin/main.
      - name: Fetch origin/main for the tag-mode reachability check
        run: git fetch origin main

      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v6.3.0 (v6)
        with:
          python-version: '3.13.5'

      - name: Relax unprivileged user namespaces for bubblewrap
        run: sudo sysctl kernel.apparmor_restrict_unprivileged_userns=0

      - name: Install Asciidoctor (for the strict documentation render, G5)
        run: |
          sudo apt-get update
          sudo apt-get install -y asciidoctor

      - name: Fetch offline test inputs
        run: >
          python3 scripts/wfc_test_inputs.py fetch
          --profile cp313-linux-x86_64 --bundle "$RUNNER_TEMP/wfc-bundle"

      - name: Install WFC (editable) from the offline bundle
        run: >
          python3 scripts/wfc_test_inputs.py exec
          --profile cp313-linux-x86_64 --bundle "$RUNNER_TEMP/wfc-bundle"
          -- python3 -m pip install -e '.[dev]'

      - name: Lint
        run: make lint

      - name: Format check
        run: make format-check

      - name: Install Bubblewrap
        run: |
          sudo apt-get update
          sudo apt-get install -y bubblewrap
          bwrap --version

      # Step-scoped only: GIT_CONFIG_NOSYSTEM is set as this step's own `env:`,
      # not via a persistent `git config --global`, and it neutralizes only
      # the runner's own system-level git-lfs filter config for this step's
      # subprocess tree. It must not, and does not, touch WFC's own
      # clean/process filter-refusal test, which is part of the unmodified
      # suite run here.
      - name: Required test suite
        env:
          GIT_CONFIG_NOSYSTEM: "1"
          XDG_CONFIG_HOME: ${{ runner.temp }}/wfc-ci-config
          TMPDIR: ${{ runner.temp }}
        run: |
          set -euo pipefail
          mkdir -p "$XDG_CONFIG_HOME/git"
          git config --file "$XDG_CONFIG_HOME/git/config" user.name "WFC CI Test"
          git config --file "$XDG_CONFIG_HOME/git/config" user.email "wfc-ci@example.invalid"

          env -u GIT_CONFIG_NOSYSTEM git config --show-origin \
            --get-regexp '^filter\..*\.(clean|process)$' || true

          # WFC removes inherited GIT_* variables. Its trusted Git
          # subprocesses must not inherit the runner's Git-LFS filters.
          sudo git config --system --unset-all filter.lfs.clean
          sudo git config --system --unset-all filter.lfs.process

          python3 scripts/wfc_test_inputs.py exec \
            --profile cp313-linux-x86_64 \
            --bundle "$RUNNER_TEMP/wfc-bundle" \
            -- python3 -m pytest -q | tee "$RUNNER_TEMP/pytest-output.txt"

      - name: Build distributions
        run: >
          python3 scripts/wfc_test_inputs.py exec
          --profile cp313-linux-x86_64 --bundle "$RUNNER_TEMP/wfc-bundle"
          -- python3 -m build

      - name: Distribution content audit (C2, G3)
        run: |
          set -euo pipefail
          make dist-audit | tee "$RUNNER_TEMP/dist-audit-output.txt"

      - name: Clean-environment install and CLI identity smoke (C3, G4)
        run: |
          set -euo pipefail
          expected_version="$(python3 -c "import tomllib; print(tomllib.load(open('pyproject.toml', 'rb'))['project']['version'])")"
          wheel="$(ls dist/*.whl)"
          python3 -m venv "$RUNNER_TEMP/wfc-smoke-venv"
          python3 scripts/wfc_test_inputs.py exec \
            --profile cp313-linux-x86_64 --bundle "$RUNNER_TEMP/wfc-bundle" \
            -- "$RUNNER_TEMP/wfc-smoke-venv/bin/pip" install "$wheel"
          cd "$RUNNER_TEMP"
          "$RUNNER_TEMP/wfc-smoke-venv/bin/wfc" --help
          "$RUNNER_TEMP/wfc-smoke-venv/bin/wfc" --version --json > "$RUNNER_TEMP/wfc-version.json"
          cat "$RUNNER_TEMP/wfc-version.json"
          python3 - "$RUNNER_TEMP/wfc-version.json" "$expected_version" <<'PY'
          import json
          import sys

          with open(sys.argv[1]) as handle:
              payload = json.load(handle)
          expected = sys.argv[2]
          if payload["version"] != expected:
              raise SystemExit(f"C3: reported version {payload['version']!r} != expected {expected!r}")
          if payload["source_commit"] is not None:
              raise SystemExit(f"C3: source_commit is not null: {payload['source_commit']!r}")
          print(f"C3 clean-venv install smoke OK (version={payload['version']}, source_commit=null)")
          PY

      - name: Documentation renders strictly (G5)
        run: |
          asciidoctor --safe-mode=safe -a assembled -o /dev/null --failure-level=WARN \
            docs/operator_manual/operator_manual.adoc docs/developer_guide/developer_guide.adoc \
            docs/functional_model/workflow_program_use_cases.adoc docs/README.adoc \
            docs/semantic_model/workflow_execution_semantics.adoc docs/backlog/_open.adoc \
            docs/technical_model/workflow_program_architecture.adoc \
            docs/ai_info/_ai_info.adoc docs/ai_info/doc_conventions.adoc

      # The mandatory release preflight (G1) runs for release-tag events only.
      # On an ordinary `main` push the release notes still say `planned` by
      # design, so the preflight would fail there, skip the upload below and
      # starve `python-compat`; branch mode of `wfc_release_check.py` remains
      # the maintainer's local pre-tag check. A tag push still blocks here:
      # this step precedes the checksum record and the artifact upload, and
      # `publish-testpypi` needs `check`, so a refused preflight stops the
      # publication chain.
      - name: Release preflight (G1, tag events only)
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          set -euo pipefail
          make release-check TAG="${GITHUB_REF_NAME}"

      - name: Record artifact checksums
        run: |
          cd dist
          sha256sum *.whl *.tar.gz > SHA256SUMS.txt
          {
            echo '### Release artifact SHA-256'
            echo '```'
            cat SHA256SUMS.txt
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      # Every value here is already produced earlier in this job; nothing new
      # is computed and no step's exit status changes. `if: always()` and the
      # fallback on every line so a diagnostic can never be the reason the
      # job stops or the summary is incomplete (R-4).
      - name: Decision facts for the job summary (W5)
        if: always()
        run: |
          set +e
          {
            echo '### Decision facts'
            echo "- interpreter and seed pip version: $(python3 --version 2>&1), pip seed $(python3 -c 'import ensurepip; print(ensurepip.version())' 2>/dev/null || echo 'not captured')"
            echo "- bwrap version: $(bwrap --version 2>&1 || echo 'not captured')"
            pytest_line="$(grep -E '^[0-9]+ (passed|failed|error)' "$RUNNER_TEMP/pytest-output.txt" 2>/dev/null | tail -n 1)"
            echo "- required-suite pass/skip counts: ${pytest_line:-not captured}"
            echo "- artifact names, sizes and SHA-256:"
            echo '```'
            if (cd dist && ls *.whl *.tar.gz SHA256SUMS.txt) >/dev/null 2>&1; then
              (cd dist && for f in *.whl *.tar.gz SHA256SUMS.txt; do
                printf '%s %s bytes\n' "$f" "$(stat -c %s "$f" 2>/dev/null || echo '?')"
              done
              cat SHA256SUMS.txt 2>/dev/null)
            else
              echo 'not captured'
            fi
            echo '```'
            tree_sha256="$(python3 -c 'import json, sys; print(json.load(open(sys.argv[1]))["implementation_tree_sha256"])' "$RUNNER_TEMP/wfc-version.json" 2>/dev/null)"
            echo "- implementation_tree_sha256: ${tree_sha256:-not captured}"
            audit_line="$(tail -n 1 "$RUNNER_TEMP/dist-audit-output.txt" 2>/dev/null)"
            echo "- dist-audit result: ${audit_line:-not captured}"
          } >> "$GITHUB_STEP_SUMMARY"

      # Nothing downstream rebuilds this artifact; publish-testpypi and
      # publish-pypi download it unchanged and re-verify SHA256SUMS.txt.
      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0 (v6)
        with:
          name: release-dist
          path: dist/
          if-no-files-found: error

  # Separate, smaller Python-compatibility job (maintainer decision of
  # 2026-11-23): `requires-python = ">=3.10"` and the classifiers are unchanged;
  # the one fully qualified profile stays CPython 3.13 / Linux x86-64 in `check`.
  # This job installs the wheel that `check` built once (never a rebuild) into a
  # clean environment per interpreter and runs a small provider-free set of
  # installed-package tests. It is NOT qualification: no offline bundle, no
  # bubblewrap, no provider, no full suite. It IS release gate G9 (maintainer
  # decision D6, 2026-11-25): `publish-testpypi`'s `needs:` below includes this
  # job, so a red `python-compat` blocks publication.
  python-compat:
    needs: check
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.10', '3.11', '3.12']
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v6.1.0 (v6)

      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v6.3.0 (v6)
        with:
          python-version: ${{ matrix.python-version }}

      - uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7.0.0 (v7)
        with:
          name: release-dist
          path: dist

      - name: Verify that the wheel is the one `check` built
        run: |
          cd dist
          sha256sum -c SHA256SUMS.txt

      - name: Install the built wheel into a clean environment
        run: |
          set -euo pipefail
          python -m venv "$RUNNER_TEMP/compat-venv"
          "$RUNNER_TEMP/compat-venv/bin/python" -m pip install --disable-pip-version-check "$(ls dist/*.whl)" "pytest>=8.2"
          "$RUNNER_TEMP/compat-venv/bin/python" --version

      - name: Installed metadata, package resources and CLI identity
        run: |
          set -euo pipefail
          expected_version="$(sed -n 's/^version = "\(.*\)"/\1/p' pyproject.toml | head -n 1)"
          cd "$RUNNER_TEMP"
          "$RUNNER_TEMP/compat-venv/bin/wfc" --help > /dev/null
          "$RUNNER_TEMP/compat-venv/bin/wfc" --version --json > "$RUNNER_TEMP/compat-version.json"
          cat "$RUNNER_TEMP/compat-version.json"
          "$RUNNER_TEMP/compat-venv/bin/python" - "$RUNNER_TEMP/compat-version.json" "$expected_version" <<'PY'
          import hashlib
          import importlib.metadata
          import importlib.resources
          import json
          import sys

          with open(sys.argv[1]) as handle:
              payload = json.load(handle)
          expected = sys.argv[2]
          installed = importlib.metadata.version("workflow-coordinator")
          if not (payload["version"] == installed == expected):
              raise SystemExit(f"version mismatch: reported {payload['version']!r}, metadata {installed!r}, expected {expected!r}")
          if payload["source_commit"] is not None:
              raise SystemExit(f"source_commit is not null: {payload['source_commit']!r}")
          root = importlib.resources.files("workflow_coordinator").joinpath("resources")
          for name, digest in payload["resources"].items():
              actual = hashlib.sha256(root.joinpath(*name.split("/")).read_bytes()).hexdigest()
              if actual != digest:
                  raise SystemExit(f"resource {name} digest {actual} != reported {digest}")
          print(f"compat install OK (python {sys.version.split()[0]}, version={installed}, {len(payload['resources'])} resources verified)")
          PY

      # `-o pythonpath=.` replaces the repository's `src` entry so the tests
      # import the INSTALLED wheel, not the checkout. `--wfc-partial` is the
      # repository's explicit marker for a deliberately partial run: this is a
      # compatibility smoke selection and never the required-suite acceptance.
      - name: Provider-free tests against the installed wheel
        env:
          GIT_CONFIG_NOSYSTEM: "1"
          XDG_CONFIG_HOME: ${{ runner.temp }}/wfc-compat-config
          TMPDIR: ${{ runner.temp }}
        run: |
          mkdir -p "$XDG_CONFIG_HOME/git"
          git config --file "$XDG_CONFIG_HOME/git/config" user.name "WFC CI Compat"
          git config --file "$XDG_CONFIG_HOME/git/config" user.email "wfc-ci@example.invalid"
          "$RUNNER_TEMP/compat-venv/bin/python" -m pytest -q -p no:cacheprovider -o pythonpath=. --wfc-partial \
            tests/unit/test_quickstart_commands.py \
            tests/unit/test_serialization.py \
            tests/unit/test_reducer.py \
            tests/unit/test_consumer_compiler.py \
            tests/unit/test_frontdoor_init_plan.py \
            tests/unit/test_evidence_config.py \
            tests/unit/test_a3_operating_contract.py \
            tests/unit/test_codex_adapter_conformance.py \
            tests/unit/test_claude_adapter_conformance.py \
            tests/unit/test_persistence.py \
            tests/unit/test_report.py

      - name: Coverage and limits of this job
        if: always()
        run: |
          {
            echo "### Python compatibility job (Python ${{ matrix.python-version }})"
            echo "Covered: the wheel built once by check, installed into a clean venv; installed metadata, packaged resources and CLI identity; 11 provider-free test modules run against the installed wheel."
            echo "Not covered: the full required suite, bubblewrap, offline-bundle build isolation, real providers, Q1, any release gate. CPython 3.13 on Linux x86-64 in the check job remains the only fully qualified profile; this job is not qualification and not upstream security support."
          } >> "$GITHUB_STEP_SUMMARY"

  publish-testpypi:
    needs:
      - check
      - python-compat
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-24.04
    environment: testpypi
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7.0.0 (v7)
        with:
          name: release-dist
          path: dist

      - name: Verify the checked artifact is unchanged (G6)
        run: |
          cd dist
          sha256sum -c SHA256SUMS.txt
          rm SHA256SUMS.txt

      # A real upload (rehearsal), not --dry-run: only a real upload proves
      # the Trusted Publisher OIDC wiring and the index's metadata acceptance
      # (MD-1, G6). This spends the TestPyPI version, which cannot be reused.
      - name: Publish to TestPyPI
        uses: pypa/gh-action-pypi-publish@7245906fb61fa33a13554f9d5fb856fe61758086 # v1.14.3 (release/v1)
        with:
          repository-url: https://test.pypi.org/legacy/
          packages-dir: dist/

  publish-pypi:
    needs: publish-testpypi
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-24.04
    # The `pypi` Environment's required-reviewer rule (G8) is a repository
    # setting only the maintainer can create (external to this file, ES-2),
    # and must be confirmed to exist and name the maintainer before the first
    # tag is pushed (ES-4). Approval of the pending deployment is never
    # inferred from a green `check`/`publish-testpypi` job.
    environment: pypi
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7.0.0 (v7)
        with:
          name: release-dist
          path: dist

      - name: Verify the checked artifact is unchanged
        run: |
          cd dist
          sha256sum -c SHA256SUMS.txt
          rm SHA256SUMS.txt

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@7245906fb61fa33a13554f9d5fb856fe61758086 # v1.14.3 (release/v1)
        with:
          packages-dir: dist/

  release:
    needs: publish-pypi
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7.0.0 (v7)
        with:
          name: release-dist
          path: dist

      - name: Create or update the GitHub Release (idempotent, W1)
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          tag="${GITHUB_REF_NAME}"

          set +e
          view_output="$(gh release view "${tag}" --json id 2>&1)"
          view_status=$?
          set -e

          if [ "${view_status}" -eq 0 ]; then
            echo "Release ${tag} already exists; replacing its assets."
            gh release upload "${tag}" \
              dist/*.whl dist/*.tar.gz dist/SHA256SUMS.txt \
              --clobber
          elif printf '%s' "${view_output}" | grep -qi "release not found"; then
            echo "Release ${tag} does not exist yet; creating it."
            gh release create "${tag}" \
              dist/*.whl dist/*.tar.gz dist/SHA256SUMS.txt \
              --title "${tag}" \
              --notes "Release notes: https://github.com/${GITHUB_REPOSITORY}/blob/${tag}/docs/release_notes/release_notes.adoc"
          else
            echo "gh release view failed for a reason other than an absent release:" >&2
            printf '%s\n' "${view_output}" >&2
            exit 1
          fi
