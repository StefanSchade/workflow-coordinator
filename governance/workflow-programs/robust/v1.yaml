schema_version: 1
program_id: robust
revision: "v1"
source: >-
  Literal closed program record from
  docs/warm_storage/concepts/workflow_coordinator_front_door_commission_contract_design_2026-10-28.adoc
  section 5.2 ("Robust-v1 literal record and renewal constraint"), accepted
  at the fresh independent rereview in
  docs/warm_storage/concepts/workflow_coordinator_front_door_commission_contract_design_2026-10-28_review_002.adoc
  (outcome accept, WI-WFC-FRONT-DOOR-COMMISSION-CONTRACT-DESIGN-001-CONTINUATION-001
  H002, Development commit c770b843390154681677009ef5d3741ba5df6daf). This
  catalogue entry is hand-authored governance, not WFC-Run-produced output:
  operator.py's _admit_a1 unconditionally forbids any WorkItem/profile
  authorized_scope from overlapping repository policy governance_paths, so
  no Run may ever write this file; it is maintained the same way as
  governance/workflow-programs/direct/v1.yaml,
  governance/self-development/components.yaml, and
  governance/self-development/repository-policy.yaml. A correction to this
  entry is a new revision; existing revisions are never edited in place.

  Substitution sentinels (resolved only by the deterministic compiler, never
  by a CommissionIntent): a phase's `scope: S` is replaced by the Intent's
  full A1-normalized `scope`; a phase's `scope: A` together with its
  non-null `artifact_key` is replaced by exactly the Intent's
  `durable_artifacts[artifact_key]` path list, and only that list -- never
  unioned with `S`, matching design section 5.2's `authorized_scope:
  [A(broad_review)]` / `[A(focused_review)]`; a phase's `evidence: E` is
  replaced by `evidence_profiles[intent.evidence_profile].evidence`, which
  for robust@v1 is always `[task-check]` because `task-check-v1` is the
  only permitted evidence-profile value (design section 5, "robust@v1
  permits exactly task-check-v1, hence E = [task-check]"; unlike direct@v1,
  there is no `none` entry here).

  Renewed-broad-review constraint (design section 5.2): this literal record
  places the only `{effect: complete}` route on `broad_review.accept`; no
  route on any other phase, including `focused_review`, ever carries that
  effect. Both `broad_review` and `focused_review` are `context: fresh`
  gate reviews, so re-entering `broad_review` after any `correct` hop is
  necessarily an independent fresh review, never a relabelled or reused
  focused verdict. The constraint is therefore enforced structurally by
  this closed, non-removable route/effect map -- not by a general
  reachability validator -- and cannot be weakened, bypassed, or made
  optional by any CommissionIntent field, because an Intent has no write
  path to a program's phases, routes, or review descriptors (design section
  2.1). The first implementation Commission must prove this exact template
  invariant with positive/negative tests (design section 5.2, section 6
  last item); it must not implement a general profile reachability
  validator ("P3.5") to do so.
roles: [worker, independent_reviewer]
scope_slot: S
artifact_scope_slot: A
evidence_profiles:
  task-check-v1:
    evidence: [task-check]
phases:
  implement:
    role: worker
    components:
      role: [worker]
      modifiers: []
      repository_policy: []
    durable_artifact: none
    scope: S
    artifact_key: null
    authorized_actions: [edit, commit]
    human_gates: []
    evidence: []
    review: null
    routes:
      broad_review: {effect: goto, target: broad_review}
  broad_review:
    role: independent_reviewer
    components:
      role: [reviewer]
      modifiers: []
      repository_policy: []
    durable_artifact: required
    scope: A
    artifact_key: broad_review
    authorized_actions: [review, edit, commit]
    human_gates: []
    evidence: E
    review:
      purpose: "independent adversarial full-scope review of the rendered Commission"
      breadth: broad
      authority: gate
      context: fresh
      blocking_policy: blocking_only
      trigger: profile_selected
      exit: declared_route
      finding_authority: [resolve]
      failed_evidence_route: correction
    routes:
      accept: {effect: complete}
      correction: {effect: goto, target: correct}
  correct:
    role: worker
    components:
      role: [worker]
      modifiers: []
      repository_policy: []
    durable_artifact: none
    scope: S
    artifact_key: null
    authorized_actions: [edit, commit]
    human_gates: []
    evidence: []
    review: null
    routes:
      focused_review: {effect: goto, target: focused_review}
  focused_review:
    role: independent_reviewer
    components:
      role: [reviewer]
      modifiers: []
      repository_policy: []
    durable_artifact: required
    scope: A
    artifact_key: focused_review
    authorized_actions: [review, edit, commit]
    human_gates: []
    evidence: E
    review:
      purpose: "independent focused verification of correction and disposition of the prior broad/focused Findings"
      breadth: focused
      authority: gate
      context: fresh
      blocking_policy: blocking_only
      trigger: profile_selected
      exit: declared_route
      finding_authority: [resolve]
      failed_evidence_route: correction
    routes:
      correction: {effect: goto, target: correct}
      renew_broad_review: {effect: goto, target: broad_review}
