schema_version: 1
program_id: direct
revision: "v1"
source: >-
  Literal closed program record from
  docs/warm_storage/concepts/workflow_coordinator_front_door_commission_contract_design_2026-10-28.adoc
  section 5.1 ("Direct-v1 literal record"), accepted at Development commit
  c770b843390154681677009ef5d3741ba5df6daf. This catalogue entry is
  hand-authored governance, not WFC-Run-produced output: operator.py's
  _admit_a1 unconditionally forbids any WorkItem/profile authorized_scope
  from overlapping repository policy governance_paths, so no Run may ever
  write this file; it is maintained the same way as
  governance/self-development/components.yaml and
  governance/self-development/repository-policy.yaml. A correction to this
  entry is a new revision; existing revisions are never edited in place.
roles: [worker]
scope_slot: S
evidence_profiles:
  none:
    evidence: []
  task-check-v1:
    evidence: [task-check]
phases:
  implement:
    role: worker
    components:
      role: [worker]
      modifiers: []
      repository_policy: []
    durable_artifact: none
    scope: S
    authorized_actions: [edit, commit]
    human_gates: []
    evidence: []
    review: null
    routes:
      verify: {effect: goto, target: verification}
  verification:
    role: worker
    components:
      role: [worker]
      modifiers: []
      repository_policy: []
    durable_artifact: none
    scope: S
    authorized_actions: [review]
    human_gates: []
    evidence: E
    review:
      purpose: "deterministic task-check disposition only; no semantic review"
      breadth: verification
      authority: gate
      context: fresh
      blocking_policy: blocking_only
      trigger: profile_selected
      exit: declared_route
      finding_authority: []
      failed_evidence_route: correction
    routes:
      accept: {effect: complete}
      correction: {effect: goto, target: implement}
