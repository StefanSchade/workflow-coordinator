schema_version: 1
program_id: simple
revision: "v1"
source: >-
  Literal closed program record from
  docs/warm_storage/concepts/workflow_coordinator_simple_v1_architecture_design_2026-10-31.adoc
  section 3 ("Proposed Simple programme and finite execution lifecycle"),
  accepted at the final independent broad review in
  docs/warm_storage/concepts/workflow_coordinator_simple_v1_architecture_design_2026-10-31_broad_review.adoc
  (outcome accept, RUN-fd99befee6734b7aba04f94773013ddd H008, Development
  commit a2051c5c3d606f89e567d9fe7b3f156e62382cf4). This catalogue entry is
  hand-authored governance, not WFC-Run-produced output: operator.py's
  _admit_a1 unconditionally forbids any WorkItem/profile authorized_scope
  from overlapping repository policy governance_paths, so no Run may ever
  write this file; it is maintained the same way as
  governance/workflow-programs/direct/v1.yaml,
  governance/workflow-programs/robust/v1.yaml,
  governance/self-development/components.yaml, and
  governance/self-development/repository-policy.yaml. A correction to this
  entry is a new revision; existing revisions are never edited in place.

  Substitution sentinels (resolved only by the deterministic compiler, never
  by a CommissionIntent): this program's sole phase's `scope: S` is replaced
  by the Intent's full A1-normalized `scope`, matching direct@v1/robust@v1;
  its `evidence: E` is replaced by
  `evidence_profiles[intent.evidence_profile].evidence`, which is always
  `[task-check]` because `task-check-v1` is the only permitted
  evidence-profile value -- unlike direct@v1, there is deliberately no
  `none` entry (design section 3). This program defines no artifact scope
  slot: `durable_artifact: none` and there is no `artifact_scope_slot`,
  unlike robust@v1.

  No-second-invocation constraint (design sections 3-4): this literal record
  defines exactly one phase, `implement` (the fixed
  render_commission-produced WorkItem initial phase for every program), with
  exactly one route, `accept: {effect: complete}`, and no `goto` route of
  any kind. No profile-internal path back to any phase exists, so a second
  Hop is structurally unreachable from this program's shape alone; the
  Intent-level `max_autonomous_hops: 1` (design section 4) is a required
  additional Intent-authoring discipline, not the only safeguard. The
  implementation Commission must prove this exact template invariant with
  the positive/negative tests specified in design section 10.

  Self-check modifier (design sections 3, 7, 9): `components.modifiers`
  selects exactly one entry, `simple-self-check`, instructing the Worker to
  self-check before emitting its sole result. That instruction is
  Worker-attributed guidance only; it grants no evidence authority and does
  not alter the shared `worker` component. Admitting this program safely
  additionally requires the bounded `render_commission` selected-component
  traversal completion specified in design section 7, tracked as
  docs/backlog/BUG-WFC-COMMISSION-SELECTED-COMPONENT-PROVENANCE.adoc, and
  the early provider-transport guard tracked as
  docs/backlog/BUG-WFC-PROVIDER-TRANSPORT-CANDIDATE-ACCEPTANCE.adoc; see
  docs/warm_storage/concepts/workflow_coordinator_simple_v1_implementation_boundary_handoff_2026-10-31.adoc
  for the full staged sequence. Until both corrections and the Stage B
  implementation Commission land, this catalogue entry has no runtime
  effect: commissioning.py's program_specs and
  commission_intent_from_yaml's required_personas mappings recognize only
  direct@v1 and robust@v1 today and reject every other (program_id,
  revision) pair.
roles: [worker]
scope_slot: S
evidence_profiles:
  task-check-v1:
    evidence: [task-check]
phases:
  implement:
    role: worker
    components:
      role: [worker]
      modifiers: [simple-self-check]
      repository_policy: []
    durable_artifact: none
    scope: S
    authorized_actions: [edit, commit]
    human_gates: []
    evidence: E
    review: null
    routes:
      accept: {effect: complete}
