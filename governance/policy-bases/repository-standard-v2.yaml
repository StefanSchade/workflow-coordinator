schema_version: 3
policy_id: repository-standard
revision: "v2"
scope:
  - workflow-coordinator
governance_paths:
  - governance
work_item_scope_ceiling:
  - src
  - tests
  - scripts
  - docs
  - README.md
  - Makefile
max_autonomous_hops: 10
actions:
  - edit
  - commit
  - review
evidence_commands:
  task-check:
    argv:
      - python
      - -m
      - pytest
      - -q
    timeout_seconds: 900
