schema_version: 2
work_item_id: WI-WFC-WORKFLOW-PROFILE-ARCHAEOLOGY-001
authority_source: >-
  Maintainer-authorized bounded WFC self-development architecture-survey
  Commission, commissioned following the structural precedent of
  `WI-WFC-P35-REQUIREMENTS-ARCHAEOLOGY-REASSESSMENT-001` (accepted at H004;
  see its review for disposition). Only that precedent's four-phase
  investigation/review/correction/rereview structure, its budget rationale,
  and its scope/authority discipline are reused; its task-specific
  hypotheses, historical claims, and Finding-identifier namespace
  (`P35RAR-NNN`) are not.

  OBJECTIVE: investigate the current and historical WFC workflow-profile
  corpus under `governance/self-development/`, distinguish genuine
  workflow-program variants from Commission-specific configuration, and
  identify concrete evidence needed before the maintainer's planned
  Runtime/Profile/Commission ("Front Door") boundary refactoring. This is an
  architecture SURVEY: it produces an inventory, classifications, evidence
  gaps, and escalation points for maintainer disposition. It is explicitly
  NOT an implementation Run and NOT an architecture-decision Run: it does
  not select a target architecture, does not design a program
  catalogue/DSL/parameter grammar, and leaves Level 1 unresolved.

  GOVERNING RECORDS (current authority, read-only for this Run): docs/README.adoc;
  docs/architecture.md; docs/run-preparation.adoc; docs/self-development.adoc;
  docs/ai_info/_ai_info.adoc; docs/backlog/_open.adoc (current P3.5 / Front
  Door rows); the current WorkItem/WorkflowProfile/RepositoryPolicy schemas
  and production preflight contract (src/workflow_coordinator/model.py,
  serialization.py, operator.py:_preflight). DISCUSSION RECORDS, explicitly
  DRAFT / NON-AUTHORIZING per docs/README.adoc's own classification, read as
  motivating context only, never as settled requirements or an already-
  accepted target architecture: docs/functional_model/workflow_program_use_cases.adoc;
  docs/semantic_model/workflow_execution_semantics.adoc;
  docs/technical_model/workflow_program_architecture.adoc;
  docs/warm_storage/concepts/workflow_program_boundary_working_brief_2026-10-26.adoc;
  docs/warm_storage/concepts/workflow_coordinator_front_door_priority_and_profile_commission_boundary_plan_2026-10-26.adoc.

  SCOPE: this Commission authors one new durable survey document and one new
  durable independent-review/Finding-disposition-history document (both
  listed in `scope` below), under its own dedicated phases. Its accepted
  output is an evidence base and recommendation set for maintainer
  disposition of the Front Door boundary refactor; it is NOT automatic
  authority to amend any accepted architecture document, any existing
  workflow profile/WorkItem/policy (including every inventoried self-
  development profile), the backlog, Project Memory, or the DRAFT
  functional/semantic/technical model documents themselves. It does not
  implement any part of the Front Door refactor, does not migrate or edit
  any existing profile, and does not modify workflow-coordinator-runtime or
  workflow-coordinator-run-evidence.

  BUDGET: `max_autonomous_hops: 16`, within the Coordinator hard maximum
  (`COORDINATOR_HARD_MAX_AUTONOMOUS_HOPS = 20`,
  src/workflow_coordinator/model.py:25) and this WorkItem's own dedicated
  policy ceiling (governance/self-development/workflow-profile-archaeology-001-policy.yaml,
  below) -- deliberately NOT the shared
  governance/self-development/repository-policy.yaml, whose five-Hop ceiling
  and unrelated `work_item_scope_ceiling` cannot support this Commission's
  two new durable artifacts or a realistic review/correction loop. This
  WorkItem's four-phase topology (assessment -> review -> {accept,
  correction}; correction -> rereview -> {accept, correction}) mirrors the
  precedent's own budget rationale: 2 Hops for the first assessment/review
  pass, leaving up to 7 further correction/rereview cycles within the
  16-Hop ceiling, so a genuine further review/correction oscillation does
  not end in an unproductive budget stop.

  NON-SCOPE (binding on every phase of this WorkItem): this Commission does
  not implement any Front Door / Runtime/Profile/Commission boundary change;
  does not migrate, edit, or re-author any existing workflow profile
  (including every inventoried self-development profile) or any existing
  WorkItem or policy other than this WorkItem's own four-file bundle; does
  not modify src/workflow_coordinator/** or tests/** in any form; does not
  modify docs/backlog/**, docs/architecture.md, docs/README.adoc,
  docs/self-development.adoc, docs/run-preparation.adoc, or the DRAFT
  functional_model/semantic_model/technical_model documents or the working
  brief; does not modify project_memory/ or Project Memory in any form; does
  not modify workflow-coordinator-runtime or mutate
  workflow-coordinator-run-evidence; does not alter the generic Coordinator;
  does not push; does not promote Runtime; does not launch a Run; introduces
  no P3.5 route guard, no convergence-escape phase, no final adversarial-
  review phase, and no new profile mechanism; and performs no unrelated
  cleanup. No phase of this WorkItem carries push, Runtime-promotion,
  Evidence-mutation, Project-Memory-edit, backlog-edit, or WFC-launch
  authority. An `accept` disposition at `review`/`rereview` makes the
  survey document this Commission's accepted evidence/recommendation set for
  maintainer disposition of the Front Door boundary refactor; it supplies no
  further authority and does not itself adopt any recommendation.
profile_ref: governance/self-development/workflow-profile-archaeology-001-profile.yaml
repository: workflow-coordinator
scope:
  - docs/warm_storage/concepts/workflow_program_profile_archaeology_2026-10-27.adoc
  - docs/warm_storage/concepts/workflow_program_profile_archaeology_2026-10-27_review.adoc
initial_phase: assessment
max_autonomous_hops: 16
personas:
  worker: >-
    senior WFC workflow-profile archaeologist, independent of every
    inventoried profile's authorship and of the Front Door planning
    discussion; separates genuine workflow-program topology/semantics from
    Commission-specific bindings using Git history and actual profile
    revisions, not only current final profiles; distinguishes current
    implementation, historical design, tests, and actual Run usage; holds no
    authority beyond this bundle; never turns an unresolved question into an
    architecture decision.
  independent_reviewer: >-
    independent, adversarial WFC profile-archaeology reviewer, fresh
    context, falsifying the survey's inventory and classifications against
    actual profile YAML, Git history, and current source rather than mere
    conformance to the survey's own framing; requires an evidence reference
    for every material claim; holds resolve-only Finding authority; never
    accepts with a material Finding open.
durable_artifacts:
  review:
    - docs/warm_storage/concepts/workflow_program_profile_archaeology_2026-10-27_review.adoc
  rereview:
    - docs/warm_storage/concepts/workflow_program_profile_archaeology_2026-10-27_review.adoc
