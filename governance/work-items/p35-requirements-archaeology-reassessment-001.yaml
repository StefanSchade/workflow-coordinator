schema_version: 2
work_item_id: WI-WFC-P35-REQUIREMENTS-ARCHAEOLOGY-REASSESSMENT-001
authority_source: >-
  Maintainer-authorized bounded WFC self-development design-assessment-only
  Commission. The accepted P3.5 Finding-Authority Reachability design
  (docs/warm_storage/concepts/workflow_coordinator_p35_finding_reachability_design_2026-10-18.adoc,
  as corrected by H001, Development commit `6807d56`) was independently
  accepted at H002
  (docs/warm_storage/concepts/workflow_coordinator_p35_finding_reachability_design_2026-10-18_review_003.adoc,
  Development commit `b3dbbd9`). A prior independent architecture
  reassessment, `WI-WFC-P35-STRUCTURAL-INVARIANT-REASSESSMENT-001`, was
  independently accepted at H004
  (docs/warm_storage/concepts/workflow_coordinator_p35_structural_invariant_reassessment_2026-10-25_review.adoc,
  Development commit `fab606e`) and recommended deferring most of the
  accepted P3.5 package for Level 0 while retaining the already-implemented
  runtime completion guard. That recommendation has NOT been adopted as a
  maintainer decision: docs/backlog/_open.adoc's P3.5 row still reads
  "Design accepted; implementation explicitly paused pending architecture
  reconsideration" and names the 2026-10-21 Level-0 MVP planning decisions
  §2 pending-decision framing as current, not the prior reassessment's own
  recommendation.

  OBJECTIVE: the maintainer suspects that the accepted design's own target
  property -- requiring a strictly later disposition opportunity on *every*
  relevant checkpoint-reaching continuation path of a Finding-opening phase
  -- is stronger than the originally intended requirement. This WorkItem
  performs an independent requirements-archaeology and reassessment Run to
  test that suspicion against the actual history of the governing Concept,
  the motivating BUG, the initial P3.5 design proposal, its design-review
  iterations, and the prior structural-invariant reassessment -- using Git
  history and actual document revisions, not only current final documents --
  and to test the maintainer's three candidate requirement hypotheses
  (static connectivity/authority only, never route prediction; existential
  per-phase disposition opportunity when a Finding may remain on exit;
  alternative undisposed routes are not inherently forbidden if a legally
  reachable repair route exists and is selectable) against both the
  documentary record and independently constructed counterexamples. No
  outcome is predetermined: the universal all-path quantifier may be
  confirmed as the originally intended and independently justified
  requirement, judged an unintended escalation introduced during design
  review, or judged partially justified with a precisely narrowed
  replacement. The prior reassessment's own recommendation and its
  assumptions (including its own acceptance of the universal-path reading
  as the correct characterization of the accepted design, recorded in its
  H002/H004 `P35SIR-001` disposition) are independent inputs to be
  re-examined here, not conclusions this WorkItem may adopt without its own
  evidence.

  SCOPE: this Commission authors one new durable requirements-archaeology
  and reassessment document and one new durable independent-review/
  Finding-disposition-history document (both listed in `scope` below),
  under its own dedicated phases. It is a recommendation for maintainer
  disposition of the still-pending P3.5 architecture decision; it is NOT
  automatic authority to amend the already-accepted P3.5 design document,
  the governing Projected Result Contracts concept, the motivating BUG, the
  backlog, the prior structural-invariant reassessment's own bundle or
  artifacts, or any prior Commission's own bundle or review artifact -- all
  of those remain read-only inputs for the entire Run. It does not
  implement P3.5, does not migrate any profile, does not change
  workflow-coordinator-runtime, and does not mutate
  workflow-coordinator-run-evidence.

  GOVERNING RECORDS: docs/wfc_projected_result_contracts_concept_2026-10-07.adoc
  §§4, 11, 17, 19, 20, 22 (current authoritative P3.5 definition source, and
  its own revision history -- see TASK background); the review that drove
  §11's current wording,
  docs/cold_storage/concepts/reviews/wfc_projected_result_contracts_concept_2026-10-07_review_001.adoc
  §4.2 (read-only historical evidence, not reopened); Development commit
  `f31a423` (the correction that rewrote §11 from its original membership
  wording to the current ordered-reachability wording); the first draft,
  Development commit `fa308c3`; docs/backlog/BUG-WFC-SELF-DEVELOPMENT-GATE-FINDING-AUTHORITY.adoc
  (the concrete motivating defect); the accepted design
  docs/warm_storage/concepts/workflow_coordinator_p35_finding_reachability_design_2026-10-18.adoc
  and its design-review lineage (non-numbered, -002, -003; read-only
  precedent, not reopened or amended); the prior reassessment
  docs/warm_storage/concepts/workflow_coordinator_p35_structural_invariant_reassessment_2026-10-25.adoc
  and its review
  docs/warm_storage/concepts/workflow_coordinator_p35_structural_invariant_reassessment_2026-10-25_review.adoc
  (H004 acceptance, Development commit `fab606e`; read-only input, not
  reopened or amended); the maintainer's
  docs/warm_storage/concepts/workflow_coordinator_level0_mvp_planning_decisions_2026-10-21.adoc
  §2 (the still-current pending-decision framing); and docs/backlog/_open.adoc
  (current P3.5 backlog status, read-only, confirming the prior
  reassessment's recommendation is not yet adopted).

  BUDGET: `max_autonomous_hops: 16`, within the Coordinator hard maximum
  (`COORDINATOR_HARD_MAX_AUTONOMOUS_HOPS = 20`,
  src/workflow_coordinator/model.py:25) and this WorkItem's own dedicated
  policy ceiling (governance/self-development/p35-requirements-archaeology-
  reassessment-001-policy.yaml, below) -- deliberately NOT the shared
  governance/self-development/repository-policy.yaml (its five-Hop ceiling
  governs a different, broader self-development lineage and is not
  referenced by this Commission). This WorkItem's four-phase topology
  (assessment -> review -> {accept, correction}; correction -> rereview ->
  {accept, correction}) spends 2 Hops on the first assessment/review pass,
  leaving up to 7 further correction/rereview cycles within the 16-Hop
  ceiling -- deliberately generous, matching the prior reassessment's own
  budget rationale, so a genuine further review/correction oscillation does
  not end in an unproductive budget stop before the adversarial review is
  actually satisfied.

  NON-SCOPE (binding on every phase of this WorkItem): this Commission does
  not implement P3.5; does not migrate, edit, or re-author any existing
  workflow profile (including any of the inventoried self-development
  profiles); does not modify src/workflow_coordinator/** or tests/** (other
  than this WorkItem's own commissioning-validation test, added at
  commissioning time, not by the Run); does not modify any existing
  workflow profile, Commission, or policy other than this WorkItem's own
  four-file bundle; does not modify
  docs/wfc_projected_result_contracts_concept_2026-10-07.adoc,
  docs/backlog/BUG-WFC-SELF-DEVELOPMENT-GATE-FINDING-AUTHORITY.adoc, any
  other docs/backlog/** record, the accepted P3.5 design/review documents,
  or the prior structural-invariant reassessment's own assessment/review
  documents; does not modify project_memory/ or Project Memory in any form;
  does not modify workflow-coordinator-runtime or mutate
  workflow-coordinator-run-evidence; does not alter the generic Coordinator;
  does not push; does not promote Runtime; does not launch a Run; and
  performs no unrelated cleanup. No phase of this WorkItem carries push,
  Runtime-promotion, Evidence-mutation, Project-Memory-edit, backlog-edit, or
  WFC-launch authority. An `accept` disposition at `review`/`rereview` makes
  the assessment document this Commission's accepted recommendation; it
  supplies no authority to amend the accepted P3.5 design, close the
  governing BUG, migrate any profile, adopt the prior reassessment's
  recommendation, or promote Runtime -- the maintainer separately chooses
  the next P3.5 action.
profile_ref: governance/self-development/p35-requirements-archaeology-reassessment-001-profile.yaml
repository: workflow-coordinator
scope:
  - docs/warm_storage/concepts/workflow_coordinator_p35_requirements_archaeology_reassessment_2026-10-26.adoc
  - docs/warm_storage/concepts/workflow_coordinator_p35_requirements_archaeology_reassessment_2026-10-26_review.adoc
initial_phase: assessment
max_autonomous_hops: 16
personas:
  worker: >-
    senior WFC requirements-archaeology engineer, independent of the P3.5
    design's and the prior reassessment's authorship; traces the Concept,
    BUG, design/review history, and prior reassessment via Git history and
    actual revisions, not only final text; separates documentary evidence
    from interpretation; tests the maintainer's hypotheses with minimal
    counterexamples; holds no authority beyond this bundle; never adds a
    requirement merely to enable a stronger theorem.
  independent_reviewer: >-
    independent, adversarial WFC requirements reviewer, fresh context,
    falsifying the interpretation against the original incident and
    historical sources, not merely conformance to the accepted design or
    the prior reassessment's framing; requires an evidence reference for
    every material claim; holds resolve-only Finding authority; never
    accepts with a material Finding open.
durable_artifacts:
  review:
    - docs/warm_storage/concepts/workflow_coordinator_p35_requirements_archaeology_reassessment_2026-10-26_review.adoc
  rereview:
    - docs/warm_storage/concepts/workflow_coordinator_p35_requirements_archaeology_reassessment_2026-10-26_review.adoc
