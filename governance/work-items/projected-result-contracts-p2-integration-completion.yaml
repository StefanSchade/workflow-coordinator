    fresh adversarial reviewer, no prior context; on independent_review,
    performs the FIRST genuine review the complete accumulated P2
    candidate has ever received, broadly, incl. the Slice4B salvage,
    granting it no grandfathered credit; on rereview, fresh context but a
    bounded surface disposing known current-Run Findings and direct
    correction regressions, not general rediscovery; both gates declare a
    failed-evidence correction route and hold resolve-only Finding
    authority
durable_artifacts:
