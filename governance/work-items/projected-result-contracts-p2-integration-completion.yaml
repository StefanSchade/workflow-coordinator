schema_version: 2
work_item_id: WI-WFC-PROJECTED-RESULT-CONTRACTS-P2-INTEGRATION-COMPLETION
authority_source: >-
  Maintainer-authorized FRESH successor Commission continuing and intending to
  COMPLETE P2 ("Strict worker / review result families") of the accepted
  concept docs/wfc_projected_result_contracts_concept_2026-10-07.adoc
  (sections 6-9). This is not a resume, retry, replay, or reconciliation of
  any predecessor Run; not a new P2 implementation from scratch; not a
  redesign of projected result contracts; not a new evidence or scope
  mechanism; and not P3/P3.5/P4/P5 or Higher-Loop implementation.

  FROZEN HISTORICAL RUNS (preserved as historical truth; not resumed,
  mutated, reopened, or rewritten by this successor). Original P2 Run
  RUN-90c24baad80645b0958ed96ae0a2cc3f executed one Hop, landed a trusted
  candidate, then stopped awaiting_human before any independent review
  because required full-repository evidence failed with no configured
  route. A first integration successor, RUN-d5ae5bd0eadb41dba2c10c1d085e6c4d,
  widened worker scope, landed a second trusted integration commit, and
  stopped the same way. A further continuation,
  RUN-6fa0b56e3b844896a55f147f4ee41fea, used exactly one Hop of eight; its
  worker returned `blocked` with `requires_human=true` and
  `escalation.kind=scope`; no trusted Run commit landed; trusted pytest
  still ran and failed; the worktree remained dirty; the Run stopped
  awaiting_human under mechanical preemption; no independent review ever
  executed; no Run-native Finding was ever created. That Run was archived in
  Evidence at 5fb370146d70178fd44ca34da8729cc680956eaf, and its ledger
  curation is included in Evidence HEAD
  0a239baa710d7f603eea57f4784d38f1b4e20ee5. None of the three Runs ever
  reached a review Hop; P2 has never received its first genuine independent
  semantic review.

  NON-AUTHORIZING AUDIT. After archival, an independent, non-authorizing
  architecture/commissioning audit,
  docs/wfc_p2_stagnation_audit_2026-10-09.adoc, diagnosed the repeated
  stagnation and found NO P2 core implementation defect, but found that the
  three Runs never exercised their own declared correction loop because (a)
  full-suite `pytest` evidence was placed on the worker phases, which
  structurally cannot declare `failed_evidence_route`, turning every worker
  Hop into an accidental one-shot acceptance gate; (b) the review gates
  themselves omitted `failed_evidence_route`, so even a reviewer Hop could
  not have absorbed a clean evidence failure into correction; and (c)
  predecessor Commission prose conflated worker `completed` with proof of
  downstream trusted acceptance, steering commit-ready work into `blocked`
  plus an unjustified scope escalation. The audit is read-only, authorizes
  nothing, and is explicitly not the first independent P2 review -- this
  Commission's `independent_review` phase is. See also
  docs/wfc_operator_manual.adoc section 22 ("Trusted evidence, worker
  completion, and correction routing"), added to generalize the audit's
  mechanism; both are read in full before this Commission's work begins.

  SALVAGE STATUS. After archival and audit, the maintainer preserved the
  useful dirty Slice4B candidate as Development commit
  405f3b26be90604c12572297f12c6c6ed7ae9e2e ("wip(p2): preserve stopped-run
  Slice4B candidate"; preserved diff sha256
  8ffc6a584da12b13cc749ed96a5d0b727f386af498b5945eb99e1527db5e6d6c), which
  changes only tests/unit/test_slice4b_git_authority.py, migrating the stale
  worker fake's result field from the retired generic `outcome` to the
  strict worker `status`, including the one `blocked` call site. This is the
  current Development starting point for this Commission. Per the
  established rule SALVAGE PRESERVES WORK, NOT AUTHORITY: it is useful
  preserved work, but it is NOT a trusted predecessor Run commit, NOT P2
  acceptance, NOT independent review, NOT correctness authority, and NOT a
  new assurance baseline. The successor worker and reviewer must assess the
  complete resulting P2 candidate from scratch under this Commission's own
  authority; they may retain, modify, replace, or remove salvaged material
  within their authorized scope, and the reviewer must grant it no
  grandfathered correctness credit.

  KNOWN REMAINING INTEGRATION DEBT (non-authorizing diagnostic context only,
  not trusted evidence, not binding on the worker). A disposable diagnostic
  clone reproduced two remaining stale worker fake result constructors in
  tests/unit/test_wfc_op.py that still emit the legacy generic `outcome`
  field where P2 selects `WorkResult` and requires `status` -- the shared
  `ONE_HOP_FAKE_BODY` provider fake and one further inline fake inside the
  frozen-`PATH` launch test. With the current Slice4B salvage plus those two
  fake corrections, the disposable clone's complete suite went green (734
  collected, 1 skipped, exit 0). This is diagnostic review evidence only; it
  is NOT trusted Run evidence and NOT P2 acceptance. The worker must inspect
  current repository truth itself rather than trusting this characterization
  and must not be forced to make exactly those two edits if direct
  inspection shows something different.

  LINEAGE. P1 ("Projection infrastructure") is complete, independently
  assured, and promoted to Runtime 9e49458de12e79dae4d8827a60f7cd39d18b4c80
  (detached, clean, push-disabled -- unchanged by this Commission). This
  Commission's semantic starting point is Development HEAD
  405f3b26be90604c12572297f12c6c6ed7ae9e2e, carrying the full prior P2
  lineage plus the two documentation commits
  84b8ffeab13d6165cb515075d7806d6f3fff4317 ("docs(wfc): clarify trusted
  evidence and correction routing") and
  d1b7414f6e2f784215d1afe6f33cb6b4967ac5a6 ("docs(review): record P2
  stagnation audit"), both orthogonal to P2 implementation. The future
  Harness PREPARE step pins the actual Commission-inclusive Development
  HEAD; this Commission does not predict that self-referential commit hash.

  CORRECTED WORKFLOW TOPOLOGY. Unlike its immediately preceding lineage
  (governance/work-items/projected-result-contracts-p2-integration-continuation.yaml
  and its profile/policy), which placed full-suite `pytest` as required
  Coordinator evidence on the worker `integration`/`correction` phases and
  omitted `failed_evidence_route` from both review gates -- the precise
  topology defect the audit diagnosed as the primary cause of all three
  stagnations -- this Commission's profile places NO required Coordinator
  evidence on `integration` or `correction` (`evidence: []`), places the
  complete `python -m pytest -q` suite as required Coordinator evidence
  ONLY on `independent_review` and `rereview`, and declares
  `review.failed_evidence_route: correction` on BOTH of those gates. This is
  the canonical converging-review shape of
  docs/wfc_operator_manual.adoc section 22.4, loaded and simulated
  successfully against current production mechanics by the audit (section
  10). Do not blindly copy the immediately preceding lineage's profile or
  task text; their evidence topology and worker-facing evidence prose were
  materially wrong, and correcting them is this successor's purpose.

  WORKER COMPLETION SEMANTICS (corrected; see
  docs/wfc_operator_manual.adoc section 22.2 and 22.4, and
  docs/wfc_p2_stagnation_audit_2026-10-09.adoc sections 5 and 12). Worker
  `status: completed` means the bounded candidate for this phase is coherent
  and ready for its declared next step -- it does NOT mean the worker has
  proven all downstream trusted acceptance evidence, which is unsatisfiable
  because Coordinator-trusted evidence executes after the semantic result
  and after any admitted Coordinator-owned commit. Agent-side tests,
  including a full-suite run in the agent's own sandbox, are diagnostic
  input the worker should use to understand and improve its candidate, never
  Coordinator-trusted evidence. A red agent-side full suite is NOT by itself
  a reason to return `blocked`; inability to run the full suite in the agent
  sandbox is NOT by itself a scope escalation. The worker must report any
  such diagnostic limitation truthfully in `summary` and otherwise proceed
  on the merits of its bounded candidate. `blocked` is reserved for a real
  missing authority, scope, prerequisite, or capability needed by THIS Hop
  -- never for a downstream gate that has not run yet. This Commission
  introduces no new Definition-of-Done schema; the correction is prose
  discipline and correct evidence placement, not new mechanism.

  INTEGRATION WORKER PURPOSE. The `integration` phase's worker must: (1)
  inspect the complete current P2 candidate and the complete current test
  suite, treating the Slice4B salvage as unverified candidate ancestry
  rather than trusted prior work; (2) identify remaining P2 integration debt
  within its authorized scope; (3) fix remaining stale consumers/fixtures
  needed for the P2 strict result families; (4) preserve P2's strictness --
  it must NOT weaken P2's contracts merely to accept legacy `outcome`
  payloads, nor make a strict schema permissive to accommodate a stale
  fixture; (5) run useful focused or full tests diagnostically where its
  sandbox permits; (6) return `completed` with a `CommitIntent` once its
  bounded integration work is coherent and ready for independent review.
  The two known `tests/unit/test_wfc_op.py` fake-result sites above are
  named only as useful diagnostic context from a disposable audit clone --
  this Commission does not reduce the worker's purpose or authority to
  blindly changing exactly two lines; the worker must inspect and establish
  current repository truth itself.

  FIRST INDEPENDENT REVIEW -- MUST BE BROAD. `independent_review` is the
  FIRST genuine independent semantic review P2 has ever received. It must
  assess the COMPLETE accumulated P2 candidate: the original strict
  result-family implementation, every trusted integration correction from
  the predecessor Runs, the non-authoritative Slice4B salvage now
  incorporated into current ancestry, and this successor's own integration
  work -- not only the latest diff. Use `context: fresh`. It must at minimum
  verify: (1) WorkResult and ReviewVerdict are genuinely distinct strict
  result families; (2) worker phases select WorkResult for the intended
  admitted combinations; (3) review gates select ReviewVerdict for the
  intended admitted combinations; (4) convergence-role phases retain their
  intended generic behavior; (5) provider schema, parser, prompt vocabulary,
  and persisted contract identity remain synchronized; (6) unknown/legacy
  fields are rejected rather than silently accepted; (7) no phase-name
  string inference has replaced declarative selection; (8) replay/history
  remains truthful; (9) existing Finding semantics are preserved and P3 has
  not been accidentally implemented; (10) no P3/P3.5/P4/P5 scope creep is
  present; (11) the current full trusted repository suite is green when
  Coordinator evidence executes; (12) salvaged material is reviewed as
  ordinary untrusted candidate code and receives no grandfathered
  correctness credit. The durable review artifact for this review is a NEW
  artifact, docs/backlog/FTR-WFC-PROJECTED-RESULT-CONTRACTS_implementation_review_006.adoc
  -- `_003.adoc`, `_004.adoc`, and `_005.adoc` belong to prior Commission
  reservations/history, even though no review Hop of any predecessor ever
  actually ran to create them, and are left untouched and unreused by this
  successor.

  REREVIEW -- DELIBERATELY NARROWER. `rereview` uses a fresh reviewer
  context but a bounded surface: known current-Run Findings opened by
  `independent_review` (or an earlier `rereview` of this same successor
  Run), the corresponding corrections, direct regressions from those
  corrections, and the gate's own required trusted `pytest` evidence. It
  must not copy the broad `independent_review` purpose verbatim, and must
  not reopen general rediscovery merely because its context is fresh. A
  genuinely new MATERIAL defect supported by concrete new evidence may still
  be reported and escape this bounded surface; an unrelated newly noticed
  MINOR observation must not automatically reset convergence.

  FAILED-EVIDENCE ROUTING. Both `independent_review` and `rereview`
  explicitly declare `review.failed_evidence_route: correction`, naming the
  existing `correction` goto route on each gate. A reviewer may semantically
  return `accept` while trusted `pytest` later fails; in that case the
  reducer routes to `correction` rather than completing or stopping
  awaiting_human, per docs/wfc_operator_manual.adoc section 22.3.

  FINDING AUTHORITY. Both `independent_review` and `rereview` hold
  `finding_authority: [resolve]` only, for any genuine current-Run-local
  Finding either phase of THIS successor Run itself opens, once
  independently verified corrected. No `residual`, `supersede`, or `reopen`
  is granted or required. This successor owns only Findings arising in this
  Run; it confers no authority over any predecessor Run or its records,
  none of which ever had a Finding.

  TRUSTED EVIDENCE. `independent_review` and `rereview` each select
  `evidence: [pytest]`; `integration` and `correction` select `evidence: []`.
  The policy's `evidence_commands.pytest` remains the unweakened complete
  command `python -m pytest -q`, 900-second timeout. This complete command
  is the acceptance boundary the Coordinator independently executes on the
  review gates, after the semantic result and after any admitted
  Coordinator-owned commit -- never a prerequisite the worker must itself
  satisfy before reporting `completed`.

  EXACT SUCCESSOR MUTATION SURFACE. `integration` and `correction` (role
  worker): bounded directory authority over exactly `src/workflow_coordinator`
  and `tests` (no wildcard syntax, no bare repository-wide scope; scope is
  an authority boundary, not an implementation plan -- the worker discovers
  which files inside these authorized areas need correction).
  `independent_review` and `rereview` (role independent_reviewer): exactly
  one new durable review artifact,
  docs/backlog/FTR-WFC-PROJECTED-RESULT-CONTRACTS_implementation_review_006.adoc.
  Review phases must not mutate production/tests; worker phases must not
  mutate the review artifact.

  P2 ACCEPTANCE BOUNDARY AND WITHHELD WORK (unchanged from the original P2
  Commission and its successors). This Commission does not authorize: P3
  Finding-authority/update generalization beyond the one bounded P2-local
  decision already resolved by the original P2 Commission (preserving the
  current `AGENT`-authority `NewFindingDelta` capability for worker-role
  phases); P3.5 Commission/profile static authority-conformance
  implementation; the explicit evidence-failure-disposition admission guard
  documented as a future direction only; any PREPARE/preflight hardening; P4
  Coordinator-owned effects refactor; P5 provider-capability/registry
  cleanup; Harness changes; Runtime mutation or promotion; Evidence
  mutation; Operator Manual changes; P2 audit changes; BUG/FTR mutation
  outside the one named review artifact; Higher-Loop implementation;
  automatic successor generation; automatic Commission authoring; automatic
  Runtime promotion; push; provider fallback/model routing; sandbox
  redesign; or unrelated defect closure. If trusted evidence reveals a
  repository defect genuinely unrelated to P2 integration, this Commission
  does not authorize silently absorbing or opportunistically fixing it --
  escalate (`requires_human=true`, `escalation.kind=scope`) and preserve
  truth instead.

  Where this task text or the profile summarizes the governing concept
  document, the original P2 task, the stagnation audit, or the Operator
  Manual, their own exact wording controls if they ever appear to differ; do
  not resolve an apparent conflict by inventing a third reading -- stop and
  report it (`requires_human=true`, `escalation.kind=scope`) instead.
