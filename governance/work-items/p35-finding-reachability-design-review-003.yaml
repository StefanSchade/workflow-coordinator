authority_source: >-
  Maintainer-authorized bounded WFC self-development design-review-only
  successor Commission, continuing the unresolved semantic correction of the
  P3.5 finding-reachability design after its direct predecessor,
  `WI-WFC-P35-FINDING-REACHABILITY-DESIGN-REVIEW-002`
  (Run `RUN-554ae793e21d461281bcc1fe74956ee4`, final HEAD
  `4f9598f5cf4b4be3e3b0c744ee58e13b26cf4cd6`), stopped `awaiting_human_budget`
  at its 5/5-Hop ceiling with a clean worktree and zero anomalies. That
  predecessor Run is historically final: it is not resumed, retried, or
  modified retroactively by this Commission, and its durable review
  artifact
  docs/warm_storage/concepts/workflow_coordinator_p35_finding_reachability_design_2026-10-18_review_002.adoc
  is treated as read-only history.

  PREDECESSOR DISPOSITION CARRIED FORWARD (H005, the predecessor's final
  recorded disposition): of the four durable design-review identifiers
  (`P35DR-001` through `P35DR-004`), three are CLOSED/ADDRESSED --
  `P35DR-001` (origin-checkpoint decision rule), `P35DR-003` (schema-v4
  lineage semantics), and `P35DR-004` (worked-example/diagnostic
  consistency) -- and must remain closed, not re-litigated, absent genuinely
  new material evidence. Exactly one identifier remains MATERIAL and OPEN:
  `P35DR-002`. Per H005's own recorded reason, the design's schema-v2
  compatibility candidate rule (design §4.3) excludes a reviewed opening
  phase from the `creates_blocking` candidate set merely because it also
  holds `resolve`/`residual`/`supersede` closing authority, and separately
  accepts a schema-v2 profile where a reviewed opener's Finding is carried,
  undisposed, to a later non-reviewing completion phase. Both are concrete,
  falsified counterexamples in H005 (design-locations and minimal profiles
  recorded there), not a restated compatibility claim: the governing
  Projected Result Contracts concept
  (docs/wfc_projected_result_contracts_concept_2026-10-07.adoc §11) requires
  a disposer strictly after the opening invocation on every relevant forward
  path and does not exempt an opener merely because it also holds closing
  authority elsewhere in its own tuple.

  SCOPE: this Commission continues the exact same bounded design-review-only
  scope as its predecessor -- the already-drafted design document
  docs/warm_storage/concepts/workflow_coordinator_p35_finding_reachability_design_2026-10-18.adoc
  (`correction` only) and this Commission's own new durable review artifact
  docs/warm_storage/concepts/workflow_coordinator_p35_finding_reachability_design_2026-10-18_review_003.adoc
  (`rereview` only). It begins directly at `correction`, because independent
  review of this design has already completed three full rereview passes
  (H001, H003, H005) under the predecessor WorkItem; there is no unreviewed
  material left to perform a fresh first independent review of. It does not
  implement P3.5, does not author a new design, and does not modify the
  governing concept, the BUG, or the predecessor's own four-file governance
  bundle.

  BUDGET: `max_autonomous_hops: 12`, within the Coordinator hard maximum
  (`COORDINATOR_HARD_MAX_AUTONOMOUS_HOPS = 20`,
  src/workflow_coordinator/model.py:25) and this WorkItem's own dedicated
  policy ceiling (below) -- not the shared
  governance/self-development/repository-policy.yaml, which governs a
  different, broader self-development lineage and is not referenced by this
  Commission. Twelve Hops allow up to six full correction/rereview cycles
  under this profile's two-phase topology, deliberately more generous than
  the predecessor's exhausted five-Hop budget, so that a genuine further
  review/correction oscillation does not again end in an unproductive
  budget stop.

  GOVERNING RECORDS: docs/wfc_projected_result_contracts_concept_2026-10-07.adoc
  §§4, 11, 17, 19, 20, 22 (the current authoritative definition source for
  P3.5); docs/backlog/BUG-WFC-SELF-DEVELOPMENT-GATE-FINDING-AUTHORITY.adoc
  (the concrete motivating defect); the predecessor's own design document
  and its `_review_002.adoc` artifact (above), both read as provenance,
  neither modified except the design document itself under `correction`'s
  own authorized scope.

  NON-SCOPE (binding on every phase of this WorkItem): this Commission does
  not implement P3.5; does not modify src/workflow_coordinator/** or
  tests/**; does not modify any existing workflow profile, Commission, or
  policy other than this WorkItem's own four-file bundle, including the
  predecessor's own bundle
  (`governance/work-items/p35-finding-reachability-design-review-002.yaml`
  and its profile/policy/task siblings) and its `_review_002.adoc` artifact;
  does not modify docs/wfc_projected_result_contracts_concept_2026-10-07.adoc
  or docs/backlog/BUG-WFC-SELF-DEVELOPMENT-GATE-FINDING-AUTHORITY.adoc or any
  other backlog record; does not modify project_memory/ or Project Memory in
  any form; does not modify workflow-coordinator-runtime or
  workflow-coordinator-run-evidence; does not implement a Finding-kind
  taxonomy, LangGraph, hierarchical orchestration, or general workflow
  liveness checking; does not alter the generic Coordinator; does not push;
  does not promote Runtime; and performs no unrelated cleanup. No phase of
  this WorkItem carries push, Runtime-promotion, Evidence-mutation,
  Project-Memory-edit, or WFC-launch authority.
