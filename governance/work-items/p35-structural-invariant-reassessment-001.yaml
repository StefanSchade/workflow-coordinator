schema_version: 2
work_item_id: WI-WFC-P35-STRUCTURAL-INVARIANT-REASSESSMENT-001
authority_source: >-
  Maintainer-authorized bounded WFC self-development design-assessment-only
  Commission. P3.5 Finding-Authority Reachability
  (docs/warm_storage/concepts/workflow_coordinator_p35_finding_reachability_design_2026-10-18.adoc,
  as corrected by H001, Development commit `6807d56`) was independently
  accepted at H002
  (docs/warm_storage/concepts/workflow_coordinator_p35_finding_reachability_design_2026-10-18_review_003.adoc,
  "ACCEPT -- P35DR-002 CLOSED / ADDRESSED. DESIGN ACCEPTED.", Development
  commit `b3dbbd9`). The accepted design's own inventory is load-bearing: its
  static ordered-reachability rule rejects *all 43* currently inventoried
  schema-v2 self-development profiles (43 rejections / 0 acceptances). The
  2026-10-21 Level-0 MVP planning decisions
  (docs/warm_storage/concepts/workflow_coordinator_level0_mvp_planning_decisions_2026-10-21.adoc
  §2) record this as a *pending architecture decision*: "A design being
  independently accepted as internally correct does not by itself establish
  that rejecting every current profile is the right MVP move," and
  explicitly authorizes neither profile migration nor an implementation
  Commission until the underlying profile/structural-invariant hypothesis is
  reconsidered. This WorkItem performs exactly that reconsideration, and
  nothing else.

  OBJECTIVE: an independent architecture reassessment answering: is P3.5's
  accepted static ordered-reachability invariant the right architecture for
  Level 0, given its 43/43 schema-v2 profile-rejection consequence and the
  Coordinator's existing runtime completion guards
  (reducer.py `_has_open_blocker`/`_apply_route`)? The Run must determine: (1)
  the actual failure class P3.5 is intended to prevent; (2) what existing
  runtime guards already prevent, and what risk remains; (3) whether P3.5 is
  a safety invariant, an admission-time liveness/usability check, or a
  combination; (4) whether the current strict-after disposition rule is
  necessary in all cases; (5) why all 43 inventoried profiles fail, using
  concrete representative profiles and minimal counterexamples; (6) whether a
  narrower sound invariant is possible; (7) whether retaining the current
  design and migrating profiles is justified; (8) whether P3.5 can be reduced
  for the Level-0 MVP without leaving an unacceptable defect. No solution is
  predetermined by this authorization. Breaking compatibility is acceptable
  if justified by the reassessment; preserving the 43 existing profiles at
  the expense of genuine safety is not an objective of this WorkItem.

  The reassessment must explicitly test the distinction between a reviewer
  being *authorized* to open a blocking Finding (declared
  `review.authority: gate` / `blocking_policy: blocking_only` capability)
  and that reviewer *actually opening* such a Finding in a given Run's
  history -- the exact distinction
  docs/backlog/BUG-WFC-SELF-DEVELOPMENT-GATE-FINDING-AUTHORITY.adoc and
  Projected Result Contracts concept §11 turn on, and the distinction P3.5's
  static check necessarily collapses (it can only reason about declared
  capability, never about whether a specific Run's history actually exercised
  it). The reassessment must evaluate every claim against actual reducer
  behavior (`src/workflow_coordinator/reducer.py`:
  `_finding_operation`, `_may_dispose`, `_apply_legacy_finding_deltas`,
  `_apply_v2_finding_deltas`, `_has_open_blocker`, `_apply_route`,
  `reduce_result`), not solely against the design document's prose or the
  Projected Result Contracts concept's worked examples.

  SCOPE: this Commission authors one new durable architecture-reassessment
  document and one new durable independent-review/Finding-disposition-history
  document (both listed in `scope` below), under its own dedicated phases.
  It is a recommendation for maintainer disposition of the pending
  architecture decision; it is NOT automatic authority to amend the already-
  accepted P3.5 design document, the governing Projected Result Contracts
  concept, the motivating BUG, the backlog, or any prior Commission's own
  bundle or review artifact -- all of those remain read-only inputs for the
  entire Run. It does not implement P3.5, does not migrate any profile, does
  not change workflow-coordinator-runtime, and does not mutate
  workflow-coordinator-run-evidence.

  GOVERNING RECORDS: docs/wfc_projected_result_contracts_concept_2026-10-07.adoc
  §§4, 11, 17, 19, 20, 22 (current authoritative P3.5 definition source);
  docs/backlog/BUG-WFC-SELF-DEVELOPMENT-GATE-FINDING-AUTHORITY.adoc (the
  concrete motivating defect); the accepted design
  docs/warm_storage/concepts/workflow_coordinator_p35_finding_reachability_design_2026-10-18.adoc
  and its accepted review
  docs/warm_storage/concepts/workflow_coordinator_p35_finding_reachability_design_2026-10-18_review_003.adoc
  (H002 acceptance, read-only precedent and evidence, not reopened or
  amended by this WorkItem); the maintainer's
  docs/warm_storage/concepts/workflow_coordinator_level0_mvp_planning_decisions_2026-10-21.adoc
  §2 (the pending-decision framing and its explicit constraints); and
  docs/backlog/_open.adoc (current P3.5 backlog status, read-only).

  BUDGET: `max_autonomous_hops: 16`, within the Coordinator hard maximum
  (`COORDINATOR_HARD_MAX_AUTONOMOUS_HOPS = 20`,
  src/workflow_coordinator/model.py:25) and this WorkItem's own dedicated
  policy ceiling (governance/self-development/p35-structural-invariant-
  reassessment-001-policy.yaml, below) -- deliberately NOT the shared
  governance/self-development/repository-policy.yaml (its five-Hop ceiling
  governs a different, broader self-development lineage and is not
  referenced by this Commission). This WorkItem's four-phase topology
  (assessment -> review -> {accept, correction}; correction -> rereview ->
  {accept, correction}) spends 2 Hops on the first assessment/review pass,
  leaving up to 7 further correction/rereview cycles within the 16-Hop
  ceiling -- deliberately generous, so a genuine further review/correction
  oscillation does not end in an unproductive budget stop before the
  adversarial review is actually satisfied.

  NON-SCOPE (binding on every phase of this WorkItem): this Commission does
  not implement P3.5; does not migrate, edit, or re-author any existing
  workflow profile (including any of the 43 inventoried self-development
  profiles); does not modify src/workflow_coordinator/** or tests/** (other
  than this WorkItem's own commissioning-validation test, added at
  commissioning time, not by the Run); does not modify any existing
  workflow profile, Commission, or policy other than this WorkItem's own
  four-file bundle; does not modify
  docs/wfc_projected_result_contracts_concept_2026-10-07.adoc,
  docs/backlog/BUG-WFC-SELF-DEVELOPMENT-GATE-FINDING-AUTHORITY.adoc, any
  other docs/backlog/** record, or the accepted design/review-003 documents;
  does not modify project_memory/ or Project Memory in any form; does not
  modify workflow-coordinator-runtime or mutate
  workflow-coordinator-run-evidence; does not alter the generic Coordinator;
  does not push; does not promote Runtime; does not launch a Run; and
  performs no unrelated cleanup. No phase of this WorkItem carries push,
  Runtime-promotion, Evidence-mutation, Project-Memory-edit, backlog-edit, or
  WFC-launch authority. An `accept` disposition at `review`/`rereview` makes
  the assessment document this Commission's accepted recommendation; it
  supplies no authority to amend the accepted P3.5 design, close the
  governing BUG, migrate any profile, or promote Runtime -- the maintainer
  separately chooses the next P3.5 action.
