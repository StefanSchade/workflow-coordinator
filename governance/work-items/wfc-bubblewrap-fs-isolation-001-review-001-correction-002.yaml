authority_source: >-
  Operator-session maintainer authorization (direct chat instruction,
  2026-11-06) for a fresh successor correction Commission, after two
  consecutive provider-side interruptions prevented any independent
  investigation of the bind-mount-alias lead left open by H006 of
  `WI-WFC-BUBBLEWRAP-FS-ISOLATION-001-REVIEW-001`
  (`RUN-11823103c2d9465ab9d7c0a70974562c`): H006 itself failed with a Codex
  CLI provider-turn cybersecurity-content rejection before emitting a
  structured candidate (archived unmodified to `workflow-coordinator-run-
  evidence` at `d77b3ea5930cc288741599829c7ce1a8ad6690c0`); its immediate
  successor, `WI-WFC-BUBBLEWRAP-FS-ISOLATION-001-REVIEW-001-CORRECTION-001`
  (`RUN-e231286c9a474df1b48aefd31e7b31c1`), also using `codex_cli`, was
  likewise interrupted by a Codex CLI provider-turn cybersecurity-content
  rejection before performing any file change, Git mutation, or delivered
  candidate, and stopped `reconcile_required` (archived unmodified to
  `workflow-coordinator-run-evidence` at
  `414eae31c3b1b4199057ba75b8da161cd463993a`). Both Attempts are frozen
  historical fact; neither is relaunched, resumed, or rewritten by this
  WorkItem, and correction-001 performed no investigation whose absence of
  findings could carry any evidentiary weight here.

  H001-H005 of the predecessor review Attempt completed and were
  Coordinator-trusted-committed, resolving the original hardlink/inode-alias
  Finding F001 through `a83bf5badefbd54a0fdaaeef0214d13b376afaf7` (H005, last
  trusted head). H006's dirty, never-delivered artifact was separately
  preserved per `docs/run-recovery-and-salvage.adoc` as an explicitly
  non-authoritative Git salvage commit `649437735955a0bc85fecf5260c3ab04359fef8f`
  on dedicated branch `salvage/wfc-bubblewrap-fs-isolation-001-review-001-h006`
  -- never merged into `main`, carrying no acceptance, no Finding ID, no
  correctness credit.

  This WorkItem is an entirely separate, freshly authorized Commission -- not
  a `successor_provenance`-bearing successor of either interrupted Attempt
  (neither reached `RunStatus.AWAITING_HUMAN` with a non-null `semantic_stop`,
  so neither is eligible for `prepare-successor`) and not a resume of either
  Run. It reuses the exact same, already-committed `robust@v1` profile.yaml
  and policy.yaml unchanged (same routes, scopes, role bindings, evidence
  gates, Finding authority, and correction path -- nothing narrowed),
  mirroring the identical established mechanism used to author both
  predecessor WorkItems. It enters directly at `correct` (worker phase),
  which the Coordinator's own admission rules already permit for any phase a
  profile declares, with `max_autonomous_hops: 1`. This is a deliberate
  structural boundary, not a typical sizing choice: the `correct` phase's
  only route (`focused_review`) unconditionally goes to an independent-
  reviewer phase, and this maintainer authorization explicitly withholds that
  final independent adversarial review of any correction for a separately
  authorized later stage, in a fresh context. Bounding the Hop budget to
  exactly 1 makes the Coordinator itself -- via the existing, unmodified
  `autonomous_hop_budget_exhausted` / `AWAITING_HUMAN_BUDGET` mechanism in
  `reducer.py` -- mechanically refuse to dispatch the `focused_review` Hop,
  rather than relying on any agent discipline, a faked phase completion, or a
  bypass of the Coordinator.

  This Commission departs from both predecessor Attempts in one respect,
  per explicit maintainer instruction: every role binding uses the
  `claude_cli` execution adapter instead of `codex_cli`. WFC's existing
  mixed-adapter preflight rejection (`operator.py`: "mixed execution adapters
  are incompatible with the single scalar executable") is unchanged and
  continues to apply; this WorkItem does not request or require any change
  to that invariant, only a uniform `claude_cli` selection across both
  declared roles (`worker`, `independent_reviewer`), consistent with it.

  Development baseline verified clean immediately before authoring this
  WorkItem: `HEAD` `468527a6ad9f3f46f5798fb3c1715bf07c3b96fe`, which the
  maintainer confirms consists only of the predecessor correction-001
  Commission-authoring commits on top of the last trusted bubblewrap
  implementation head (`a83bf5badefbd54a0fdaaeef0214d13b376afaf7`, H005) --
  not additional bubblewrap implementation changes. This authorization
  covers authoring, hand-validation via `wfc-op prepare`'s regular operator
  preflight, and launch, subject to all required preflight and authority
  conditions passing; if any hard preflight or authority condition fails,
  preparation/launch stops and the blocker is reported rather than bypassed.
