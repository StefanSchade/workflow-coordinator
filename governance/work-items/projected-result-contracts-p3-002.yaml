authority_source: >-
  Maintainer-authorized bounded WFC self-development FRESH SUCCESSOR
  Commission for P3 (Finding Projection) of the accepted design
  docs/warm_storage/concepts/workflow_coordinator_p3_finding_projection_design_2026-10-11.adoc,
  as corrected and accepted by
  docs/warm_storage/concepts/workflow_coordinator_p3_finding_projection_design_2026-10-11_review_002.adoc
  (A -- CORRECTIONS ACCEPTED). The design record, not this Commission,
  remains the authoritative source for P3 semantics; this Commission only
  authorizes implementation and direct verification of that settled slice.

  This is a fresh successor, not a continuation, same-Run resume, retry,
  replay, migration, or reinterpretation of predecessor WorkItem
  WI-WFC-PROJECTED-RESULT-CONTRACTS-P3 or its Commission. Its predecessor
  Run RUN-8875175a2ea343adbaf47c105699f91e correctly stopped awaiting_human
  after H001 raised a scope escalation. That Run, its Commission, its status,
  and all of its evidence remain frozen historical truth. The preserved
  candidate refs/wfc/candidates/RUN-8875175a2ea343adbaf47c105699f91e/H001
  is UNTRUSTED SALVAGE only: it grants no authority, acceptance, review
  credit, or implementation credit. A successor worker may inspect, reuse,
  modify, or discard individual candidate changes only after fresh
  verification under this Commission; it must establish its own evidence and
  receive its own independent review.

  IMPLEMENTATION AUTHORITY. Implement the accepted P3 structural split for
  existing Findings: a same-state citation is evidence-only and structurally
  distinct from a state-changing transition; citation needs no
  finding_authority and cannot carry proposed_state, successor_ref, or
  new_material_evidence; transitions retain the existing disposition-authority
  checks; successor_ref is structurally available only on the supersede
  transition shape; new-Finding authorship is unchanged. Admit
  result_contract_version 3 for WORK_RESULT and REVIEW_VERDICT only, preserve
  supported version-1/2 semantics, fail closed for every unknown or
  unadmitted (kind, version) pair, and keep GENERIC_ROUTING_RESULT version 3
  unadmitted. The CORRECTOR-only tracked-obligation check stays unchanged
  unless its preservation is structurally impossible; if doubt remains,
  escalate scope rather than widen it.

  The accepted correction adds exactly two necessary production seams to the
  predecessor's scope: src/workflow_coordinator/adapter.py and
  src/workflow_coordinator/prompt.py. They are authorized solely for the
  smallest kind-aware version-admission mechanism that admits (WORK_RESULT,
  3) and (REVIEW_VERDICT, 3), retains versions 1/2 unchanged, and rejects
  (GENERIC_ROUTING_RESULT, 3). They do not authorize a generic provider
  redesign, provider-capability registry, transport redesign, Claude adapter,
  route-selection change, or prompt-content redesign.

  EXPLICITLY WITHHELD: P3.5 authority composition; P4; P5; Front Door work;
  vertical.py route-selection changes; legacy replay, cross-version
  continuation, migration, compatibility-registry, version-pinning,
  pairless-history machinery, or pairless replay requirements; mutation of
  predecessor governance/Run/Evidence; Runtime promotion; Evidence mutation;
  and push. Cross-version continuation of an active/non-terminal Run remains
  unsupported and may fail closed.
