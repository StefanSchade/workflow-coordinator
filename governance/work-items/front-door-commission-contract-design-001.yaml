schema_version: 2
work_item_id: WI-WFC-FRONT-DOOR-COMMISSION-CONTRACT-DESIGN-001
authority_source: >-
  Maintainer-authorized bounded WFC self-development design-only Commission:
  Workstream 3 ("Target architecture for reusable profiles and safe
  Commission parameterization") of
  docs/warm_storage/concepts/workflow_coordinator_front_door_priority_and_profile_commission_boundary_plan_2026-10-26.adoc
  §6, informed by the accepted (H008) read-only survey
  docs/warm_storage/concepts/workflow_program_profile_archaeology_2026-10-27.adoc
  and by maintainer decisions `DEC-WFC-019` through `DEC-WFC-023` recorded in
  docs/warm_storage/concepts/workflow_coordinator_front_door_mvp_decisions_2026-10-27.adoc.
  This WorkItem produces, and has independently reviewed, ONE design record
  for the smallest viable Commission Intent / Commission Compiler contract
  that lets a semantically specified, authorized Commission Intent select a
  versioned reusable workflow program and deterministically produce the
  governing inputs (`WorkItem`, `profile`, `policy`, `task`, `components`)
  that existing WFC admission (`operator.py:_preflight` and its
  sub-predicates) already consumes. It does not implement, migrate a
  profile, author a renderer, or launch any Run.

  PURPOSE: close the specific open design question left by the 2026-10-26
  plan §3.4 and the 2026-10-27 decisions record §4 -- the concrete schema of
  the shared, two-interface semantic Commission contract (`DEC-WFC-020`) and
  the implementation decomposition of its deterministic, authority-free
  projection into governing inputs -- using the accepted profile archaeology
  as evidence for how much parameterization surface genuinely exists (F4 as
  the strongest reuse hypothesis; Finding authority, evidence-failure route,
  phase/route structure, and mandatory defensive review as counterexamples
  that must not become safe parameters), and treating Direct and Robust
  (`DEC-WFC-022`) as the two target program scenarios the resulting grammar
  must express.

  REQUIRED DESIGN COVERAGE (see this WorkItem's task text for the full,
  non-summarized statement of each):
  (1) boundary and ownership -- separate immutable program semantics,
  Commission-specific task bindings, explicit authorization, derived
  effective permissions, and Runtime-owned execution; where programs are
  stored; how revisions are pinned; which Commission parameters are allowed;
  (2) Commission Intent -- a minimal, understandable structured contract
  usable through both a human-facing interface and a machine CLI/file
  interface; a clear separation of user-provided semantic decisions from
  compiler-derived fields; realistic examples; how an operator inspects
  effective inputs before launch;
  (3) deterministic projection and fail-early validation -- how the compiler
  produces existing WFC governing inputs without granting authority; every
  generated Commission undergoing provider-free validation using the
  existing trusted admission/preflight semantics before launch; no silent
  weakening of process guarantees, scope, mandatory reviews, or
  Finding-disposition permissions; input pinning and the check that launched
  inputs match validated inputs; invalid configurations failing before the
  first agent invocation;
  (4) reusable program compatibility -- Direct and Robust as the two initial
  target scenarios; preserving the Robust invariant that successful
  completion requires a fresh broad review following corrections; preserving
  separately authorized successor continuations (`DEC-WFC-014`) and existing
  technical recovery; identifying only the minimal program-semantic or
  grammar gaps the target contract exposes, without designing an unrestricted
  workflow DSL;
  (5) concrete proof path -- the smallest vertical implementation slice
  exercisable on one real, newly authorized Commission without migrating
  historical profiles, plus appropriate tests for program invariants and
  compiler/admission correctness.

  SCOPE LIMITATIONS (binding on every phase of this WorkItem): design and
  independent review only -- no production code or test implementation; no
  bulk profile migration or historical-compatibility project; no P3.5
  implementation -- its general static reachability validator is deferred
  beyond the Beta MVP unless a concrete MVP safety requirement demonstrably
  makes it unavoidable, and this record must not make that case unprompted;
  no Level-1 implementation, Front Door Advanced, provider registry, quota
  scheduler, or generalized orchestration framework; no redesign of archive
  storage or the Claude adapter.

  OUTPUT SHAPE: prefer ONE principal design artifact containing every
  element of the required design coverage above, plus ONE durable review
  artifact recording independent review and any rereview history -- not a
  family of proliferating schema/vision/migration-plan papers.

  NON-SCOPE (binding on every phase of this WorkItem): this Commission does
  not implement a `CommissionIntent` schema parser, renderer, or compiler;
  does not modify `src/workflow_coordinator/**`; does not migrate, rewrite,
  or delete any existing `governance/self-development/*-profile.yaml` or its
  paired WorkItem/policy/task; does not author or launch a Direct or Robust
  profile; does not implement or redesign P3.5, P4, or P5; does not design
  Front Door Advanced, a provider registry, a quota scheduler, archive
  storage, or the Claude adapter; does not change Runtime, the Evidence
  repository, or canonical Project Memory; does not push; does not edit
  `docs/backlog/_open.adoc` or any existing `docs/*.adoc` file outside this
  WorkItem's own two-file scope. No phase of this WorkItem carries push,
  Runtime-promotion, Evidence-mutation, Project-Memory-edit, or WFC-launch
  authority; all remain maintainer-owned and are not exercised by this Run.
