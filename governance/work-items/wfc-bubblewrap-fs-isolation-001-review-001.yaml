authority_source: >-
  Operator-session maintainer authorization (direct chat instruction,
  2026-11-06) to author, validate, prepare, and launch an ordinary
  hand-authored WorkItem that reuses Commission
  `wfc-bubblewrap-fs-isolation-001`'s already-committed, already-admitted
  `robust@v1` profile.yaml and policy.yaml completely unchanged (same
  routes, scopes, role bindings, evidence gates, Finding authority, and
  correction path -- nothing narrowed to review-only), with
  `initial_phase: broad_review` instead of the Intent renderer's hardcoded
  `implement`. `model.py:891-892` and `operator.py:395-397` already admit
  any `initial_phase` declared by the supplied profile; only the Commission
  Intent renderer hardcodes `implement` (`commissioning.py:450`), which is
  why this WorkItem is hand-authored rather than rendered. This mirrors the
  established precedent `WI-WFC-CLAUDE-ADAPTER-WRITE-PERMISSIONS-004-REVIEW-001`
  (`governance/work-items/wfc-claude-adapter-write-permissions-004-review-001.yaml`),
  which used the identical mechanism for the identical reason and completed
  normally.

  This WorkItem exists because predecessor Commission
  `wfc-bubblewrap-fs-isolation-001`'s Run (`RUN-d9c2ff670e5143c0a746db90defea1a2`,
  Attempt `wfc-bubblewrap-fs-isolation-001-20261106-01`) was interrupted by
  an external low-memory condition that killed the backgrounding operator
  shell, not by any WFC, Commission, or security-admission failure. Hops
  H001-H004 completed and were Coordinator-trusted-committed in sequence:
  `605a324685731b774d6a445fea8968c811637870` (H001, worker, `implement` ->
  `broad_review`), `ce48cf3f8aa976ad93a56e65198b34b8b49dd972` (H002,
  independent_reviewer, two blocking Findings F001/F002, route
  `correction`), `f4c3a68d9b15b4f21b11569114db29ef87947ef3` (H003, worker,
  `correct` -> `focused_review`), and
  `b5928df8cdaba2172304009c711d757ef30c5416` (H004, independent_reviewer,
  accepted the focused corrections but, per `robust@v1`'s structural
  renewed-broad-review constraint, routed to a *fresh* `broad_review`
  rather than `accept`). `b5928df` is the predecessor Run's last trusted
  head and the Development HEAD this WorkItem is authored against; the
  working tree was independently verified clean at that head.

  A dispatch marker for H005 exists
  (`checkouts/9658315c-d75a-447c-8215-7d633e566553/dispatch.json`:
  `hop_id H005`, `sequence 5`, `invocation_id INV-1f360b4912684fdea3710f1634fd26dc`,
  `base_head b5928df...`), but `execution-evidence.json` records only
  H001-H004 and `result-message.json` is empty (0 bytes); no process from
  this Attempt is running. Whether a provider subprocess for H005 actually
  started or performed any work is therefore not established either way --
  it is recorded here as unresolved, not as "never dispatched" and not as
  "completed." No uncommitted or untracked material exists in the
  Development worktree at any point verified. The predecessor Run was
  mechanically archived, unmodified and in its real nonterminal state
  (`run_status: ready`, the H005 dispatch marker included verbatim), to
  `workflow-coordinator-run-evidence` at commit
  `b869916a3b64a8bf2089ef556078b4105f18fa2f`
  (`archive/unclassified/wfc-bubblewrap-fs-isolation-001-20261106-01`).
  The predecessor Run's own STATE/OPS were left otherwise untouched: no
  manual completion, no invented semantic stop, no removal of the H005
  dispatch marker, and no claim that broad review succeeded.

  Confirmed, before authoring this WorkItem, that neither currently
  implemented recovery primitive covers this exact stop: same-Run
  reconcile/resume has no operator-CLI wiring at all (unchanged gap named
  in `docs/backlog/FTR-WFC-ATOMIC-HOP-RECOVERY.adoc`); and
  `prepare-successor` (`operator.py::_predecessor_for_successor()`, line
  1463) admits only a predecessor whose `status is RunStatus.AWAITING_HUMAN`
  with a non-null `semantic_stop` -- this Run's persisted `status` is
  `ready` with `semantic_stop: null`, so it is categorically ineligible for
  that path. This WorkItem is therefore an ordinary fresh Commission, not a
  `successor_provenance`-bearing successor; it carries no special
  continuation authority, and `b5928df` is not accepted merely because it
  is committed (`docs/wfc_operator_manual.adoc` §22.2: a trusted commit is
  publication, not acceptance). `wfc_op.py launch` was deliberately not
  re-invoked on the original Attempt -- its own `--help` text states it
  "executes the already-materialized launch.sh exactly once. It never
  repairs, retries, or reconciles," and this project's own doctrine
  (`docs/run-recovery-and-salvage.adoc`) treats same-Run resume as always
  an explicit, separately considered maintainer act, never an assumed-safe
  retry.

  Development baseline verified clean immediately before authoring this
  WorkItem: `HEAD` `b5928df8cdaba2172304009c711d757ef30c5416`, unchanged
  since the predecessor Run's own last trusted commit. This authorization
  covers authoring, `commission`-free hand-validation via `wfc-op prepare`'s
  regular operator preflight, and launch, subject to all required
  preflight and authority checks passing; if any hard preflight or
  authority condition fails, preparation/launch stops and the blocker is
  reported rather than bypassed.
