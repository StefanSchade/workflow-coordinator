work_item_id: WI-WFC-PROJECTED-RESULT-CONTRACTS-P2
authority_source: >-
  maintainer-authorized bounded WFC self-development implementation
  commission for P2 ("Strict worker / review result families") of the
  accepted concept docs/wfc_projected_result_contracts_concept_2026-10-07.adoc
  (revision anchor Development a309527bcaaa9db5942e05172c06b9a02d0acd15,
  Runtime 9e49458de12e79dae4d8827a60f7cd39d18b4c80 detached/clean/push-
  disabled, Evidence 165b3de09e41d583a77e1c29854102d8d2ddce43). That concept
  is CONCEPT ONLY and authorizes nothing by itself. THIS Commission, not the
  concept alone, is the maintainer authorization that lets a bounded P2 Run
  act on it.

  P1 ("Projection infrastructure") is COMPLETE: implemented
  (a54ad63ef49e8a03a352002910b8fb1d124d17b8, H001), corrected
  (9e49458de12e79dae4d8827a60f7cd39d18b4c80, H003), freshly and
  independently assured by a successor Run against the original P1
  Commission with no reliance on the predecessor's own rereview as
  authority (RUN-f0b6bee64f69441e8f1adc6659d6a241, H001
  a309527bcaaa9db5942e05172c06b9a02d0acd15, verdict ACCEPT, route accept --
  docs/backlog/FTR-WFC-PROJECTED-RESULT-CONTRACTS_implementation_review_002.adoc),
  archived and semantically curated in workflow-coordinator-run-evidence,
  and promoted to Runtime at 9e49458de12e79dae4d8827a60f7cd39d18b4c80. P2 is
  explicitly named the NEXT implementation slice in the accepted concept's
  own sequencing (concept section 17: "P2 Strict worker/review result
  families ... NEXT").

  The concept underwent one further revision cycle after P1's promotion,
  entirely orthogonal to P2's own readiness: commit 965d14d35240c19b1973
  ("docs(wfc): refine projected result contract roadmap") added the new P3.5
  Commission/authority-conformance slice and sharpened P4. An independent
  adversarial review of that revision
  (docs/wfc_projected_result_contracts_concept_2026-10-07_review_001.adoc,
  commit c8c9736) returned MATERIAL_REVISION_REQUIRED against two findings
  (4.1: the P3.5 "admits every currently accepted profile" wording
  contradicted its own S3-002-rejection goal; 4.2: the P3.5 target property
  checked path membership, not path order, and was vacuously satisfiable by
  authority parked on a Finding's own opening phase), but explicitly found
  "P2 is ready to be commissioned as the next implementation slice,
  independent of whether sections 4.1-4.3's corrections are applied first"
  (review_001 section 8) with "no MUST-resolve-before-Commission blocker"
  for P2. Concept correction commit f31a4235d7af6395358b972b09cd17da0e4ecfde
  ("docs(wfc): correct P3.5 conformance criteria") then closed both MATERIAL
  findings by rewording sections 11/18/19 only (two hunks, one file,
  verified bounded). A narrow closure review
  (docs/wfc_projected_result_contracts_concept_2026-10-07_review_002.adoc,
  commit 5979d75f96ceb6cdddafa18da2b9a1174ec9478d -- this Commission's own
  pre-authoring Development anchor) independently confirmed both findings
  CLOSED and returned verdict ACCEPT. Neither the revision, its review, nor
  its correction touched P1's completion/promotion status, P2's own
  sections (8-9), or P2's readiness in any way (review_002 section 6,
  regression check). This Commission, not the concept alone, is the sole
  authorization for actual P2 mutation; P2 is bounded implementation of
  already-accepted architecture, NOT authority to redesign the concept.

  SOURCE-INSPECTION-DERIVED P2 ARCHITECTURE FACTS (binding; not merely the
  concept's own illustrative sketches):

  Today's single seam (model.py `select_result_contract` ->
  `AgentExecutionRequest.result_contract_kind` -> `codex_adapter.execute` ->
  `adapter.validated_result` -> `routing_result_from_data` ->
  `RoutingResult` -> `reducer.reduce_result`) maps EVERY currently admitted
  Profile/Phase/Run combination to one closed `ResultContractKind` member,
  `GENERIC_ROUTING_RESULT`. `select_result_contract` (model.py:545-567)
  already reads exactly `phase.role`, `phase.review is not None`,
  `phase.review.finding_authority` (when present),
  `phase.convergence_role`, `profile.schema_version`, and
  `run.schema_version` -- never a phase-key string -- and is the permanent
  seam P2 must extend, not replace. `reduce_result` (reducer.py:1407)
  presently rejects `Outcome.CHANGES_REQUIRED` from a phase with no review
  descriptor only AFTER parsing a generic `RoutingResult` that could already
  carry that value -- this is the exact stateful-rejection-of-a-
  representable-shape S4-001 failure class P2 exists to make structurally
  unrepresentable at the type/schema boundary instead.

  Slice-4 convergence-role phases (`phase.convergence_role is not
  ConvergenceRole.NONE`: CORRECTOR, DIAGNOSIS, REFRAME, STRATEGY_GATE,
  EVALUATOR) already have their own disjoint RoutingResult-v2 field family
  (`coverage_claims`, `convergence_assessments`, `diagnosis`,
  `strategy_revision`, `strategy_assessment`) validated by
  `_validate_convergence_records_before_apply` (reducer.py:936 ff.). P2's
  `WorkResult`/`ReviewVerdict` mapping applies only where
  `phase.convergence_role is ConvergenceRole.NONE`; every convergence-role
  phase remains on the existing generic `RoutingResult`/v2 contract
  unchanged -- this is the "other still-supported invocation families ...
  remain on the appropriate existing generic contract" branch the concept's
  P2 direction (section 8) itself names, confirmed necessary by inspecting
  `vertical.py:run_one_hop` and `reducer.py`'s convergence-record validator,
  which key on `convergence_role`, not on `WorkflowRole` alone.

  `adapter.validated_result` (adapter.py:107-129) today unconditionally
  calls `routing_result_from_data` regardless of
  `request.result_contract_kind` -- it is NOT currently kind-dispatched.
  Making it select the parser matching the actually-dispatched kind (not
  merely accepting a wider union) is necessary production surface, confirmed
  by direct inspection, not merely implied by the concept's seam diagram.

  `codex_adapter.py`'s `CodexCliAdapter.execute` (codex_adapter.py:255-262)
  already rejects an unsupported `result_contract_kind` before schema
  creation or subprocess launch; it must gain the two new kinds and branch
  `routing_result_openai_schema`-equivalent schema construction by kind, not
  merely widen the one existing schema function's shape.

  `vertical.py:run_one_hop` (vertical.py:282-402) reads
  `result.outcome.value`, `result.commit_intent`, `result.scope_changed`,
  `result.requires_human`, `result.escalation`, `result.claimed_commits`,
  `result.evidence_refs`, and `result.summary` directly as `RoutingResult`
  attributes to drive trusted-commit admissibility, anomaly detection, and
  Hop construction. Confirmed necessary P2 surface: this function must
  consume whichever of `RoutingResult | WorkResult | ReviewVerdict` the
  selected kind produced without re-collapsing the two new types back into
  one generic shape in a way that defeats P2's own structural-impossibility
  purpose; the smallest-necessary mechanical projection (commit intent,
  evidence refs, summary, and whatever each family's escalation/outcome-
  equivalent actually is) is implementation's to derive, not this
  Commission's to pre-design.

  `reducer.reduce_result` and its Finding-admission helpers
  (`_apply_finding_deltas` family, reducer.py:515 ff.) already admit
  `NewFindingDelta` from an `AGENT`-authority (non-review) phase today --
  confirmed by inspection: a worker phase with `review: null` passes
  `authority=FindingAuthority.AGENT` into `_apply_finding_deltas` with
  `result.findings` unconditionally, so worker-role phases creating new
  Findings is PRESENT, SUPPORTED, CURRENT behavior, not a hypothetical. P2
  must therefore resolve its own open question (concept section 22: whether
  `findings` belongs on `WorkResult`) by preserving this currently exercised
  capability for worker-role phases that use it today, reusing the existing
  disjoint `NewFindingDelta`/`ExistingFindingDelta` split as-is (P3's later
  generalization, not P2's job).

  `prompt.py:_header` (prompt.py:116-142) and `assemble_prompt`'s
  `[result_output_contract]` footer (prompt.py:234-236) are currently keyed
  ONLY on the legacy int `contract_version` (e.g. `output_contract=
  structured_result_v2`, "Return one JSON structured_result_v2 envelope"),
  with NO kind-awareness at all -- confirmed by direct inspection, contrary
  to what an uninspected reading of "prompt.py already derives its text
  entirely from Phase facts" might suggest is sufficient. Because
  `tests/unit/test_a3_operating_contract.py` asserts this exact footer
  string byte-for-byte
  (`test_prompt_places_complete_contract_once_after_header_before_consumers_and_footer`),
  any kind-aware prompt text change necessarily touches both `prompt.py`
  and that test file; both are therefore authorized, narrowly, for exactly
  this purpose. The static, SHA256-pinned `agent_operating_contract_v6.txt`
  resource itself describes result reporting only in generic terms ("Report
  the outcome, requested route, scope change...") and is NOT proposed to
  change; only the per-invocation generated header/footer text P2 itself
  must keep synchronized with the selected kind's actual schema is in
  scope.

  EXACT P2 MUTATION SURFACE (frozen after inspection, not an unfiltered
  candidate list): production -- src/workflow_coordinator/model.py,
  src/workflow_coordinator/adapter.py,
  src/workflow_coordinator/codex_adapter.py,
  src/workflow_coordinator/vertical.py, src/workflow_coordinator/reducer.py,
  src/workflow_coordinator/serialization.py,
  src/workflow_coordinator/prompt.py. Tests -- tests/support.py,
  tests/unit/test_slice3_vertical.py, tests/unit/test_slice4.py,
  tests/unit/test_reducer.py, tests/unit/test_codex_adapter_conformance.py,
  tests/unit/test_serialization.py, tests/architecture/test_replays.py,
  tests/unit/test_a3_operating_contract.py. No new test file is authorized:
  every acceptance proof this Commission requires (type/schema
  impossibility, kind-to-adapter reachability, kind-specific parsing,
  fail-closed rejection, replay-identity fidelity, historical-Run fidelity)
  already has a natural, narrower home in one of these eight existing
  files, exactly as P1 established; `persistence.py`, `operator.py`,
  `scripts/wfc_op.py`, `tests/unit/test_operator.py`,
  `tests/unit/test_wfc_op.py`, `tests/unit/test_persistence.py`,
  `tests/architecture/test_package_boundaries.py`,
  `tests/architecture/test_self_development_governance.py` (a P3.5-scoped
  file, not a P2 one), and every other path are explicitly NOT authorized.
  If implementation genuinely cannot be expressed without one of these, the
  worker must escalate (requires_human=true, escalation.kind=scope) rather
  than silently widen authority.

  CORE P2 PROPERTY: make worker-vs-review category mistakes
  structurally unrepresentable, not merely rejected later. A worker/
  corrector invocation (role worker, `phase.convergence_role is
  ConvergenceRole.NONE`, no review descriptor) selects `WorkResult`
  (`status: completed | blocked`, plus the currently-exercised evidence/
  commit-intent/Finding-proposal fields a worker-role phase genuinely uses
  today); it structurally cannot carry `changes_required` or any other
  review-only verdict -- absent from the type AND the provider schema, not
  merely rejected by the reducer. A review/rereview invocation (role
  independent_reviewer, a review descriptor present,
  `phase.convergence_role is ConvergenceRole.NONE`) selects `ReviewVerdict`
  (`verdict: accept | changes_required`, plus Finding proposals/updates,
  evidence, summary); it structurally cannot expose worker-only status
  vocabulary. Every convergence-role phase (Slice 4) and every other
  currently admitted combination not matching one of these two shapes
  continues to select the existing generic `RoutingResult` contract
  unchanged. Selection remains the one P1 selector, keyed only on admitted
  Profile/Phase/Run facts, never a phase-key string.

  BOUNDED P2-LOCAL DECISIONS (resolve by source inspection, do not escalate
  scope): whether `WorkResult` carries Finding proposals for worker-role
  phases (resolve by preserving the already-current `AGENT`-authority
  `NewFindingDelta`-equivalent capability, confirmed present above, not by
  inventing new Finding authority); whether `escalation` is one shared
  shape available to both families or projected per-family (resolve by the
  smallest representation preserving current `requires_human`/`escalation`
  behavior, without introducing hierarchical escalation). Document both
  choices in the implementation review. Neither choice may redesign Finding
  lifecycle, broaden Finding authority beyond what is already exercised
  today, reintroduce immutable trusted Finding fields
  (`invariant`/`blocking`/origin-hop) into `ExistingFindingDelta`-equivalent
  updates, or implement P3's full `NewFindingAuthoring`/
  `ExistingFindingUpdate` generalization.

  P4 FIELDS MUST NOT BE "CLEANED UP" IN P2: `CommitIntent` ownership/
  rendering, `requested_route` derivation, `requires_human` derivation,
  `claimed_commits`, durable-artifact mechanics, and `summary` ownership
  all remain present in P2's new types exactly where current behavior
  requires them, unredesigned. P2's job is phase-family semantic typing,
  not P4's later generative-echo cleanup.

  WITHHELD: P3 full Finding-authority/update generalization
  (`NewFindingAuthoring`/`ExistingFindingUpdate`) beyond the P2-local
  decision above; P3.5 Commission/profile static authority-conformance
  implementation (deliberately, even though this Commission's OWN profile
  below must not repeat the known self-development authority defect); P4
  Coordinator-owned effects/mechanics extraction including canonical
  CommitIntent rendering; P5 provider-capability/registry cleanup; Harness
  v1; moving baseline pinning from `prepare` to `launch`; outer/higher
  orchestration; a new workflow DSL/ontology/generic plugin system/provider
  registry; a Claude adapter; hierarchical escalation; provider fallback;
  model/cost routing; sandbox/trust redesign; backlog picker; automatic
  Commission generation; automatic Runtime promotion; automatic push;
  semantic-ledger automation; unrelated BUG closure; retroactive mutation of
  historical Runs/evidence/ledger; Harness/operator architecture change;
  Operator Manual changes; Runtime mutation; Evidence mutation.
