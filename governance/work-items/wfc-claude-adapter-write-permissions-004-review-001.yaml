authority_source: >-
  Operator-session maintainer authorization (direct chat instruction,
  2026-11-05) to author and validate -- but not launch -- an ordinary
  hand-authored WorkItem that reuses Commission
  `wfc-claude-adapter-write-permissions-004`'s already-committed,
  already-admitted `robust@v1` profile.yaml and policy.yaml completely
  unchanged (same routes, scopes, role bindings, evidence gates, Finding
  authority, and correction path -- nothing narrowed to review-only), with
  `initial_phase: broad_review` instead of the Intent renderer's hardcoded
  `implement`. `model.new_run()` and `operator._preflight()` already admit
  any `initial_phase` declared by the supplied profile
  (`model.py:891-892`, `operator.py:395-396`); only the Commission Intent
  renderer hardcodes `implement` (`commissioning.py:450`), which is why this
  WorkItem is hand-authored rather than rendered. That renderer gap is
  separately recorded, not implemented, at
  `docs/backlog/FTR-WFC-FRONT-DOOR-PHASE-ENTRY-CONTINUATION.adoc`.

  This WorkItem exists because predecessor Commission
  `wfc-claude-adapter-write-permissions-004`'s Run
  (`RUN-6ebce1ac10df4e099e93848d6c292f8b`,
  attempt `wfc-claude-adapter-write-permissions-004-20261105-01`, archived
  at `workflow-coordinator-run-evidence/archive/unclassified/wfc-claude-adapter-write-permissions-004-20261105-01`)
  stopped `reconcile_required` (`reconcile_reason: interruption`,
  `semantic_stop: null`) after its Hop 1 (`implement`) completed and was
  trusted-committed as `498c331c25a65198a849a228de495127cee3bb5b`, but its
  Hop 2 (`broad_review`) was charged as an uncertain dispatch when the
  reviewer's Codex CLI invocation (`INV-fdf0c15edf044674b0c3adab186d3144`,
  model `gpt-6.1-sol`) exited 1 with no candidate. That invocation's local,
  untrusted diagnostics (`invocation-diagnostics/INV-fdf0c15e....json`,
  never archived, by design, into Evidence) show the literal provider
  message `"Selected model is at capacity. Please try a different model."`
  -- a transient provider-capacity condition, not a defect in the
  Commission, the diagnosis, or the implementation. The trusted commit is
  clean and unmodified; nothing was salvaged because nothing was dirty.

  Confirmed, before authoring this WorkItem, that neither currently
  implemented recovery primitive covers this exact stop: same-Run
  reconcile/resume (`reducer.resume_after_reconcile()`) has no
  operator-CLI wiring at all (unchanged gap named in
  `docs/backlog/FTR-WFC-ATOMIC-HOP-RECOVERY.adoc`); and `prepare-successor`
  (`operator.py::_predecessor_for_successor()`) admits only a predecessor
  whose `status is RunStatus.AWAITING_HUMAN` with a non-null
  `semantic_stop` (`operator.py:1463-1464`) -- this Run's stop is
  mechanical, not semantic, so it is categorically ineligible for that
  path. This WorkItem is therefore an ordinary fresh Commission, not a
  `successor_provenance`-bearing successor; it carries no special
  continuation authority, and the committed `498c331` candidate is not
  accepted merely because it is committed (`docs/wfc_operator_manual.adoc`
  §22.2: trusted commit is publication, not acceptance).

  Development baseline verified clean immediately before authoring:
  `HEAD` `498c331c25a65198a849a228de495127cee3bb5b`
  (`fix: correct Claude edit permissions WI-WFC-CLAUDE-ADAPTER-WRITE-PERMISSIONS-004 H001`),
  the exact predecessor Run's `current_head`/`reconcile_anchor`, unchanged
  since. This authorization covers authoring and provider-free validation
  (`wfc-op prepare`'s regular operator preflight) only; it is not
  authorization to launch, to perform a nested authenticated Claude/Codex
  invocation, to change any governance limit, to promote Runtime, or to
  push. Launch requires separate, explicit maintainer authorization.
