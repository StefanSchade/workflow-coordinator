authority_source: >-
  Maintainer-authorized bounded WFC self-development IMPLEMENTATION
  Commission: "Run B" of the two-Run sequence the maintainer previously
  described. Run A (WI-WFC-DOCS-ARCHITECTURE-CONSOLIDATION-DESIGN-001)
  produced and, after one correction/rereview cycle, had independently
  accepted ONE compact documentation/backlog/information-architecture
  design together with ONE concrete file/directory-level migration plan,
  at design revision commit f15d65b83b04a565aae891e9df548651817f7e0e,
  closed under the bounded independent closure review at commit
  80ac584d0886dce397273de2eb2baa7d35906255 (closing findings R2-001 and
  R2-002). Acceptance of that design and closure review did NOT itself
  authorize this implementation Run: Run A's own acceptance boundary
  (its section 9) states explicitly that acceptance "does not authorize
  that migration" and that a later implementation Run still "requires
  its own separate, explicit maintainer Commission." THIS WorkItem is
  that separate, explicit maintainer authorization, and it authorizes
  exactly ONE bounded implementation Run: Run B executes the accepted
  migration manifest (design revision commit f15d65b, sections 3-7, the
  decision-complete manifest at section 6.1, and the Project Memory
  referential-integrity exception at section 6.2), has that
  implementation independently reviewed, corrects blocking findings if
  necessary, and undergoes bounded rereview until accepted or the
  autonomous Hop ceiling is reached. Run B implements the accepted plan;
  it does not redesign, reinterpret, or reopen the accepted information
  architecture, the accepted migration manifest, or the accepted
  P3.5/P4/P5 family card. No authority is granted for any adjacent
  product, architecture, or code work; see NON-SCOPE below.

  AUTHORITATIVE INPUTS: the accepted design/plan
  docs/warm_storage/concepts/workflow_coordinator_documentation_information_architecture_consolidation_2026-10-15.adoc
  at its initial warm path, read together with its accepted review
  history
  docs/warm_storage/concepts/workflow_coordinator_documentation_information_architecture_consolidation_2026-10-15_review_001.adoc
  and
  docs/warm_storage/concepts/workflow_coordinator_documentation_information_architecture_consolidation_2026-10-15_review_002.adoc.
  Run B's own terminal migration step moves this same controlling plan
  to its accepted terminal cold path
  docs/cold_storage/concepts/history/workflow_coordinator_documentation_information_architecture_consolidation_2026-10-15.adoc
  and keeps or places its review provenance under
  docs/cold_storage/concepts/reviews/. The plan remains the controlling
  migration manifest at EITHER path: Run B must be able to read and use
  it at its initial warm path before the terminal move and at its
  terminal cold path afterward, including through any correction/
  rereview cycle that runs after the terminal move.

  SCOPE SOURCE: the exact migration manifest at the accepted design's
  sections 3 through 7, decision-complete section 6.1, and Project
  Memory exception section 6.2. This WorkItem authorizes only what that
  accepted manifest requires: creating docs/ai_info/_ai_info.adoc,
  docs/backlog/_open.adoc, and docs/cold_storage/README.adoc; the
  limited navigation/lifecycle edits to the explicitly retained current
  root/reference documents; the bounded normalization of the explicitly
  retained active BUG/FTR source records; the exact backlog/history/
  review family moves under docs/backlog/ and docs/warm_storage/
  concepts/ (both directories are, in their entirety, governed by the
  accepted manifest's closure rules -- every file each currently
  contains is already classified by that manifest as retained,
  normalized, or moved; granting scope over these two directories is
  therefore the smallest path-family representation available, not a
  blanket docs/** grant, and it specifically excludes
  docs/imported/core-incubator/**, docs/provenance/**, and
  docs/warm_storage/runbooks/**, none of which the accepted manifest
  touches); the cold-storage destination families under
  docs/cold_storage/ (an entirely new tree populated only by moves the
  same closure rules govern); and the single narrow mechanical
  project_memory/canonical/decisions.json `source_path` reconciliation
  authorized by the accepted section 6.2 -- and no other Project Memory
  semantics or canonical table. Run B does not reinterpret the
  manifest; a genuine current-state semantic conflict with it is a stop
  for maintainer disposition, not authority to redesign it.

  NON-SCOPE (binding on every phase of this WorkItem): this Commission
  does not authorize any change to src/workflow_coordinator/**, any
  Python package reorganization, or any code-architecture redesign; any
  implementation or design of P3.5, P4, or P5; any design of Claude
  support, Front Door, or provider/capability-registry architecture;
  any workflow DSL work; any Project Memory semantic curation or any
  Project Memory change outside the narrow moved-source `source_path`
  reconciliation named above; any governance redesign or any change to
  this Commission's own governing files during Run execution; any
  Runtime mutation or promotion; any Evidence-repository mutation; any
  push; any change to the spreadsheet-handling reference repository;
  and no opportunistic cleanup merely discovered while reading. No
  phase of this WorkItem carries push, Runtime-promotion, Evidence-
  mutation, governance-mutation, or WFC-launch authority; all remain
  maintainer-owned and are not exercised by this Run.
