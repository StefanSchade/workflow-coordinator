  MAINTAINER ARCHITECTURE DISPOSITION. The accepted hardening intentionally
  distinguishes historical readability from new-launch admission. Historical
  profiles may remain readable for parsing/replay/salvage, including
  _export_salvage(), but a NEW launch must reject a non-gate phase carrying
  non-empty Coordinator-required evidence. The currently failing architecture
  test still expects an historical standalone profile with worker-required
  evidence to pass current production _preflight(). That expectation is stale
  relative to the accepted hardening design. This WorkItem explicitly
  authorizes a bounded update of
  tests/architecture/test_self_development_governance.py to reflect the
  accepted distinction.

  This authority is NOT general permission to weaken architecture tests or
  make the suite green by changing architectural expectations. If inspection
  shows that satisfying the accepted design requires a different architecture
  choice, wider architecture-test authority, profile migration, or a new
  compatibility decision, stop and escalate rather than inventing that
  authority.

  ACCEPTANCE. Complete only after a fresh broad independent review accepts the
  complete resulting hardening and Coordinator-owned full repository pytest
  passes. This Commission does not promote Runtime, mutate Evidence, curate
  the semantic Run ledger, authorize P3/P3.5/P4/P5, generate another
  Commission, or push.
