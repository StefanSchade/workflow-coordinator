  directly at `correct` (worker phase), which the Coordinator's own
  admission rules already permit for any phase a profile declares, with
  `max_autonomous_hops: 1`. This is a deliberate structural boundary, not a
  typical sizing choice: the `correct` phase's only route (`focused_review`)
  unconditionally goes to an independent-reviewer phase, and this maintainer
  authorization explicitly withholds that final independent adversarial
  review of the corrected implementation for a separately authorized later
