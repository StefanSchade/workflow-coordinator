  LATER POST-ACCEPTANCE ASSURANCE (this Commission's execution starting
  point): development HEAD at commissioning time
  37aa97fb66a6703123b2076e22d1bc50c024ad39
  ("docs(convergence): record post-acceptance Slice-4 assurance findings"),
  carrying the immutable, maintainer-facing external-assurance artifact
  docs/backlog/FTR-WFC-CORRECTION-CONVERGENCE-ESCAPE_slice4_post_acceptance_assurance_review_001.adoc,
  verdict C -- MATERIAL BLOCKING DEFECT FOUND. That review is later evidence
  than S4-003 H005; it does not rewrite history, does not reopen S4-003 Run
  state, and is not itself a Commission, a correction, an accepted FTR, a WFC
  Run, or Run-native evidence. Historical acceptance and current assurance
  sufficiency are distinct: H005 historically accepted Slice 4; later
  evidence means H005 is not currently sufficient assurance for Runtime
  promotion or R1A until the externally found blockers are corrected and
  freshly re-reviewed.

  DURABLE POST-ACCEPTANCE ASSURANCE IDENTIFIERS (external, non-WFC-Finding
  identifiers; a fresh S4-004 Run inherits no Run-native Finding ledger from
  any predecessor and may introduce only its own fresh S4-004-local Findings
  under ordinary current semantics):

  OPUS-S4-001 (BLOCKING) -- persisted Run-v3 replay validation is weaker than
  live reduction: `_validate_v3_run()` and
  `validate_convergence_route_history()` do not consult phase/role
  provenance, do not require the referenced escape's routing decision to have
  been actually applied, and test Finding membership rather than
  open/blocking/tracked state, so a persisted strategy chain that valid live
  execution could never have produced can still advance a derived strategy
  generation. The correction must require a GENERAL correction of this
  invariant class, not a one-counterexample predicate patch, and must add
  deterministic regressions for phase/role relabelling, a strategy chain
  anchored to a pending supervisor-judgment escape, a strategy chain anchored
  to an autonomous-hop-budget-exhaustion-preempted escape, and a triggering
  Finding persisted outside the required open/blocking/tracked state -- each
  failing closed before `derive_convergence_facts()` or any trusted
  projection.

  OPUS-S4-002 (BLOCKING ASSURANCE DEFECT) -- central successful Slice-4
  strategy-chain paths were never exercised by the accepted repository suite;
  part of the historical closure evidence cited a complete-chain projection
  test that does not exist in Git history or at HEAD. Green tests are
  explicitly insufficient; the correction must add deterministic POSITIVE
  coverage of the live complete
  escape -> diagnosis -> reframe -> accepted-strategy-gate chain, role/phase
  admission, accepted strategy-gate route authority, exactly-once generation
  advancement for every and only triggering (Finding ID, generation) pairs,
  qualified-cycle reset, non-triggering Finding isolation, `changes_required`
  non-advancement, stale-revision rejection, and live/replay/checkpoint/
  prompt/operator projection equivalence over a CONSUMED escape and
  non-zero trigger generation.

  OPUS-S4-003 (NON-BLOCKING) -- a first-versus-latest diagnosis
  record-selection asymmetry: persisted/projection selection of one escape's
  diagnosis may differ from the diagnosis the accepted revision/assessment
  chain actually used. The Commission authorizes a narrow bounded correction
  of this issue if it falls out naturally alongside the OPUS-S4-001/002
  hardening; it is not promoted to a blocking acceptance condition by this
  Commission, and if closing it would require broader architecture/profile
  redesign the rereviewer may retain it explicitly as a non-blocking residual
  with concrete rationale -- it must never silently disappear from the
  rereview disposition.

  OPUS-S4-004 (OBSERVATION, OUT OF CORRECTION SCOPE) -- a misleading
  pre-existing `invalid_finding_delta` mechanical-preemption operator label
  applied to several unrelated Slice-4 error classes; operator-legibility
  debt only, not a Slice-4 acceptance blocker, and not authorized for
  correction in this Commission.

  OPUS-S4-005 (OBSERVATION, OUT OF CORRECTION SCOPE) -- the result-v2 schema
  structurally permits diagnosis/revision/assessment records in more phases
  than may actually use them, enlarging the human-stop surface; this is
  design-conformant under the accepted Slice-4 design, is relevant only to
  the separately open docs/backlog/BUG-WFC-PHASE-COMPLETION-CONTRACT-OPAQUENESS.adoc,
  and does NOT authorize projected-schema or Phase-Completion-Contract work
  in this Run.

  HISTORICAL S4-IR DISPOSITION UNDER LATER CHALLENGE (do not rewrite the
  historical H005 dispositions; this Commission's rereviewer must establish
  whether current assurance is restored): S4-IR-001's historical closure
  assurance is falsified by later evidence (OPUS-S4-001); S4-IR-002's
  substantive closure survives challenge, but part of its cited closure
  evidence was unsupported (OPUS-S4-002); S4-IR-003 and S4-IR-004 closure
  both survive challenge unchanged.

  CURRENT OPEN BUGS (verify status only; close none of them):
  docs/backlog/BUG-WFC-CORRECTION-BLOCKING-SET-CARRYOVER.adoc remains
  independently OPEN.
  docs/backlog/BUG-WFC-SELF-DEVELOPMENT-GATE-FINDING-AUTHORITY.adoc remains
  OPEN; this Commission's `finding_authority: [resolve]` shape on `rereview`
  is one further narrowly scoped application of its corrected invariant,
  reused unchanged from the prior Slice-4 lineage, not the general profile
  audit that record defers to later work, and does not close it.
  docs/backlog/BUG-WFC-PHASE-COMPLETION-CONTRACT-OPAQUENESS.adoc remains
  OPEN, documentation only; OPUS-S4-005 is relevant evidence for that
  separately open record but does NOT authorize projected-contract work in
  this Run.

  This Commission authorizes ONLY a bounded `correct -> rereview` successor
  loop against exactly the seventeen already-authorized Slice-4
  implementation/test paths and the single existing durable implementation-
  review artifact. It does NOT authorize Runtime promotion, mutation of
  workflow-coordinator-runtime, Slice 5, R1A dogfood, foreign-domain
  falsification, push, Evidence mutation, Project Memory mutation, OPS/STATE
  mutation, another nested Run, automatic provider fallback, Claude adapter
  work, Operator Harness implementation, projected phase-specific result
  contracts, Coordinator-owned effect redesign, Commission-generation
  redesign, hard-hop-ceiling configuration work, correction of OPUS-S4-004,
  redesign motivated by OPUS-S4-005, or closure of any of the three currently
  open BUG records.
