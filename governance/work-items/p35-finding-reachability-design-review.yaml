work_item_id: WI-WFC-P35-FINDING-REACHABILITY-DESIGN-REVIEW
authority_source: >-
  Maintainer-authorized bounded WFC self-development design-review-only
  Commission for the independent review, correction, and rereview of an
  already-drafted P3.5 design document. The design artifact,
  docs/warm_storage/concepts/workflow_coordinator_p35_finding_reachability_design_2026-10-18.adoc,
  was committed at fa308c3a2201ea0ad98801963038f1a98b50a206
  ("docs(wfc): draft P3.5 finding reachability design") and is marked in its
  own text "DRAFT -- PENDING INDEPENDENT REVIEW. NOT ACCEPTED. AUTHORIZES
  NOTHING." This Commission performs exactly that pending independent review
  and, if correction is needed, the bounded correction/rereview loop to reach
  a disposition -- nothing more.

  This Run begins at `independent_review`. There is no initial design-
  authoring phase: the design already exists and this Commission does not
  author, replace, or redesign it; `correction` may only amend the existing
  artifact in response to findings the independent reviewer records.

  GOVERNING RECORDS: docs/wfc_projected_result_contracts_concept_2026-10-07.adoc
  §§4, 11, 17, 19, 20, 22 (the current authoritative definition source for
  P3.5); docs/backlog/BUG-WFC-SELF-DEVELOPMENT-GATE-FINDING-AUTHORITY.adoc
  (the concrete motivating defect P3.5 is meant to generalize a permanent
  engine-level fix for); docs/backlog/_open.adoc (current P3.5 status: "NOW,
  select and commission P3.5 after this consolidation"). This Commission does
  not treat either governing record as authorizing anything beyond review of
  the existing draft; it does not close the BUG and does not alter the
  Concept doc's own authority.

  PURPOSE: establish, before any P3.5 implementation Commission is ever
  authorized, that the design's static ordered-reachability graph algorithm,
  its new authority-declaration semantics, its compatibility/migration
  treatment, and its scope boundary are independently and adversarially
  sound -- or, if not, that the design is corrected and reverified until they
  are. This Commission produces no implementation and authorizes none.

  REVIEW EMPHASIS (see this WorkItem's task text for the full statement):
  (1) the graph algorithm in design §4 -- the `disposer`/`checkpoint`/
  `creates_blocking` predicates, the `danger` fixpoint, the decision rule,
  and guarded-route interaction -- verified against current source
  (`src/workflow_coordinator/model.py`, `serialization.py`, `reducer.py`,
  `operator.py`) and falsified with minimal constructed counterexamples where
  possible; (2) the authority semantics in design §3 and §5.3 -- the claimed
  independence of `may_open_findings` from `review.finding_authority`, and
  the no-silent-default rationale for a new profile schema version;
  (3) the compatibility and migration treatment in design §6 -- in particular
  whether the review-presence proxy for schema-v2/v3 profiles collaterally
  rejects any currently-accepted self-development profile outside the eight
  lineages the design and the Concept doc §19 name; (4) the scope boundary in
  design §1.3 and §10 -- that the design does not reopen P1-P3, does not
  introduce a Finding-kind taxonomy, does not become a general workflow DSL
  or liveness checker, and does not decide hierarchical escalation.

  BASELINE: Development HEAD at commissioning time is
  fa308c3a2201ea0ad98801963038f1a98b50a206, the exact commit that drafted the
  design artifact under review; the repository worktree is clean. The actual
  Run baseline is whichever exact HEAD Harness `prepare` later pins at launch
  time, which must equal or descend cleanly from this commit with the design
  artifact unchanged by any intervening commit, or preparation must be
  re-examined before launch.

  NON-SCOPE (binding on every phase of this WorkItem): this Commission does
  not implement P3.5; does not modify
  src/workflow_coordinator/**, tests/**, or any other production/test source;
  does not modify any existing workflow profile, Commission, or policy other
  than this WorkItem's own four-file bundle; does not modify
  docs/wfc_projected_result_contracts_concept_2026-10-07.adoc or
  docs/backlog/BUG-WFC-SELF-DEVELOPMENT-GATE-FINDING-AUTHORITY.adoc or any
  other backlog record; does not modify project_memory/ or Project Memory in
  any form; does not modify workflow-coordinator-runtime or
  workflow-coordinator-run-evidence; does not implement a Finding-kind
  taxonomy, LangGraph, hierarchical orchestration, or general workflow
  liveness checking; does not push; does not promote Runtime; and performs no
  unrelated cleanup. No phase of this WorkItem carries push, Runtime-
  promotion, Evidence-mutation, Project-Memory-edit, or WFC-launch authority.
