schema_version: 2
work_item_id: WI-WFC-DOCS-ARCHITECTURE-CONSOLIDATION-DESIGN-001
authority_source: >-
  Maintainer-authorized bounded WFC self-development design-only Commission:
  "Run A" of a two-Run sequence the maintainer has explicitly described.
  Run A produces, and has independently reviewed, ONE compact
  documentation/backlog/information-architecture design for the standalone
  workflow-coordinator repository, together with ONE concrete file/
  directory-level migration/implementation plan sufficient to commission a
  later, separately authorized "Run B" directly. Run A does not perform the
  documentation migration itself. Run B (implementation of the accepted
  plan, independently reviewed, correction if needed, rereview, accept) is
  explicitly NOT authorized by this WorkItem and requires its own separate,
  explicit future maintainer Commission.

  PURPOSE: the maintainer wants WFC's documentation, backlog, and
  information architecture consolidated before choosing the next product
  slice. The goal is not "make WFC look like spreadsheet-handling/core
  structurally"; it is to avoid unnecessary structural divergence across
  repositories that solve the same problem so the maintainer does not have
  to learn needless repository-specific mental models, while letting
  convergence run in either direction: core's docs/ai_info navigation and
  lean-context approach is a useful reference WFC may adopt from, and WFC's
  explicit operational runbooks may be stronger for some operational
  concerns and must be preserved rather than discarded for superficial
  symmetry. Justified differences remain justified differences. The design
  must compare the two repositories empirically, not assume a winner.

  REFERENCE REPOSITORY (read-only): /home/stefan/repos/spreadsheet-handling/core,
  in particular docs/ai_info/, docs/developer_guide/, docs/technical_model/,
  docs/backlog/, its docs/warm_storage/ versus docs/cold_storage/ convention,
  runbooks/operational guidance, Project Memory navigation, and the Domain
  Maintainer Contract (DMC; see
  docs/developer_guide/ch06_code_conventions/05_domain_maintainer_contract.adoc)
  and its philosophy. This Commission grants NO authority to read core as
  anything other than a comparison reference, and grants NO authority to
  modify core at all.

  DESIGN PHILOSOPHY: apply the useful spirit of core's DMC -- begin from
  real responsibilities, problems, and invariants; documentation exists to
  make the system understandable and operable; do not let documentation
  history generate requirements merely because old documents mention them;
  historical evidence is not automatically current product truth; avoid
  taxonomy/ontology growth without demonstrated value; prefer local human
  readability and small, explicit ownership boundaries; preserve
  traceability without forcing archaeology; do not create ceremony merely
  because an agent can perform ceremony cheaply; keep the smallest structure
  that reliably answers real navigation and engineering questions.
  Documentation should compress orientation and verifiable contracts, not
  manufacture new product requirements from its own history -- but this is
  not itself a new formal principle to add to the design unless the actual
  analysis of WFC's repository supports doing so.

  PROBLEMS THE DESIGN MUST SOLVE (see this WorkItem's task text for the
  full, non-summarized statement of each): (1) entry/navigation for a human
  or fresh agent; (2) sharp separation of active/current truth from
  completed reviews, old concept iterations, and historical provenance,
  without burying current authority; (3) backlog comprehensibility,
  including reconstructing and making navigable the CURRENT meaning and
  status of P3.5, P4, and P5 (named and scoped in
  docs/wfc_projected_result_contracts_concept_2026-10-07.adoc sections 11,
  17, and 22) WITHOUT implementing or redesigning those slices; (4) avoiding
  self-referential requirement inflation from reviews/corrections/old
  planning documents; (5) where operational runbooks belong and how they
  are discovered, preserving WFC's explicit runbook pattern
  (docs/self-development.adoc, docs/run-preparation.adoc,
  docs/run-recovery-and-salvage.adoc, docs/warm_storage/runbooks/) where it
  is the stronger pattern; (6) which concepts should look structurally
  similar between WFC and core and which differences are justified; (7) a
  concrete fresh-agent post-migration comprehension test; (8) a concrete
  migration plan classifying, for each meaningful current documentation
  area/file class, the intended treatment (retain canonical/current,
  consolidate, move/rename, archive/cold-store, supersede, delete only if
  truly redundant and provenance-safe, or leave unchanged), with ordering,
  dependencies, and validation.

  CODE STRUCTURE BOUNDARY: the maintainer separately considers WFC's current
  src/workflow_coordinator/*.py topology in need of later improvement. This
  Commission must acknowledge that but must NOT design or implement that
  refactor, and the documentation this Commission produces must avoid
  unnecessarily canonizing today's flat module layout as a permanent
  conceptual architecture. The design may identify documentation seams that
  should remain stable across a later code/package reorganization. A
  separate later "Code Architecture Assessment" is out of this Commission's
  scope entirely.

  OUTPUT SHAPE: prefer ONE principal design/plan artifact (not a family of
  proliferating vision/requirements/architecture/migration-plan/backlog-
  design papers), containing both the accepted target information/
  documentation architecture and the concrete Run-B migration/implementation
  plan, plus ONE durable review artifact recording independent review and
  any rereview history.

  NON-SCOPE (binding on every phase of this WorkItem): this Commission does
  not perform the documentation migration; does not modify
  src/workflow_coordinator/**; does not reorganize Python packages; does not
  design the future code architecture; does not implement P3.5, P4, or P5;
  does not design Claude support, Front Door, or provider architecture; does
  not change Runtime, the Evidence repository, or canonical Project Memory;
  does not push; does not update core; does not create a cross-repository
  synchronization system; does not turn every historical review into a
  permanent requirement; and does not require structural identity with core
  where repository-specific differences are justified. No phase of this
  WorkItem carries push, Runtime-promotion, Evidence-mutation, Project-
  Memory-edit, or WFC-launch authority; all remain maintainer-owned and are
  not exercised by this Run.
