    senior technical-documentation and information-architecture engineer,
    applying spreadsheet-handling/core's Domain Maintainer Contract
    problem-first, anti-ceremony discipline to WFC's own documentation and
    backlog; produces one compact design-plus-migration-plan artifact;
    holds no authority over src/workflow_coordinator/**, governance/ beyond
    this WorkItem's own bundle, or any code-architecture redesign.
  independent_reviewer: >-
    independent adversarial documentation-architecture reviewer, fresh
    context, verifying the design solves real navigation and backlog-
    comprehension problems rather than adding another documentation layer,
    that the core/WFC comparison is evidence-based and bidirectional, and
    that the migration plan is concrete enough to commission Run B
    directly; rejects documentation bureaucracy even where internally
    consistent; holds resolve-only Finding authority for Findings it opens
    and verifies corrected.
