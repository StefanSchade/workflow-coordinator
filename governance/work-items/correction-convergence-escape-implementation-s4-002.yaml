authority_source: >-
  maintainer-authorized bounded WFC self-development FRESH SUCCESSOR
  implementation commission for Slice 4 ("Diagnosis and reframe support") of
  the accepted correction-loop convergence-escape architecture,
  docs/backlog/FTR-WFC-CORRECTION-CONVERGENCE-ESCAPE.adoc (accepted by
  independent review with zero remaining findings, commit
  4edcea0e341e9c8669378fa299104d66aed2851f), as corrected and completed for
  Slice 2 by the independently accepted Design Revision 001,
  docs/backlog/FTR-WFC-CORRECTION-CONVERGENCE-ESCAPE_design_revision_001.adoc
  (accepted by fresh independent rereview with zero remaining findings,
  commit f08c8cb61480ec5b9e2529eebc5ae44a0463bc9e, stable design blocker
  DR1-IR-001 explicitly closed). Accepted prerequisite lineage, the ASSURANCE
  BASELINE this Commission preserves: Slice 1 is implemented and
  independently accepted (durable acceptance record
  83cccb98bb800479645d87051fb1cd66b3a4ac7f; stable implementation-review
  identifiers S1-IR-001 and S1-IR-002 closed). Revised Slice 2 is implemented
  and independently accepted (accepted corrected Slice-2 implementation
  candidate 34587fcdaaf2efe940b7d2d9241fc6e1b64436df; durable Slice-2
  acceptance record 01a0dead992e32f6569f9a06324e5fce1b828a2d; stable
  implementation-review identifiers S2-IR-001 and S2-IR-002 closed). Slice 3
  is implemented and independently accepted (accepted Slice-3 implementation
  candidate 343f419a2cf122221dd5b7ec98be92cd61e2ec24; durable Slice-3
  acceptance record a889f9a3b515b4cac600dc9f7366637a388f2e25; stable
  implementation-review identifiers S3-IR-001, S3-IR-002, and S3-IR-003 all
  closed). This Commission does NOT treat any S4-001 salvage material as a new
  assurance baseline; the assurance baseline remains exactly the Slice-1/2/3
  lineage above.

  PREDECESSOR S4-001 HISTORICAL TRUTH (frozen; not retrofitted, not amended,
  not reinterpreted as completed): WorkItem
  WI-WFC-CORRECTION-CONVERGENCE-ESCAPE-IMPLEMENTATION-S4-001, attempt
  wfc-correction-convergence-escape-implementation-s4-001-20261005-03, Run
  RUN-3efc7eb2aa374263a2b12954213642f1, checkout
  f95b8ae8-f73e-41e2-82ff-4f4007f5cb11, predecessor execution baseline /
  Commission HEAD 3f801665bdcac2fa4065a4c165789e88ee712176. Its H001 (phase
  implement, role worker, binding codex_cli / gpt-5.6-terra / medium)
  invoked its provider successfully, trusted pytest evidence passed, and it
  modified exactly the eight in-scope production paths, yet no trusted
  workflow commit was ever created and final repository HEAD remained the
  predecessor baseline: H001's structured result returned
  outcome=changes_required with requested_route=review and a non-null
  commit_intent, describing the implementation as partial with ordinary
  authorized Slice-4 work still remaining. The Coordinator correctly rejected
  the payload commit because changes_required is NOT a commit-capable
  ordinary implementation disposition. The post-evidence worktree was dirty,
  mechanical preemption stopped the Run, final Run status is awaiting_human,
  hop_used is 1 of 10, and no H002 ever occurred -- review was never reached,
  so no S4-IR identifier was ever opened or dispositioned for Slice 4 and
  none is invented here.

  SALVAGE (preservation only, carrying no authority): the exact dirty
  candidate H001 left behind was mechanically proven identical to its own
  frozen diff (SHA-256
  a7adb30666cca54891dc61c76c9df5d81bb945eb217c36c546c7e8e92ee8a44f,
  reproduced identically from the resulting salvage commit) and preserved by
  a maintainer-owned salvage commit, Development HEAD
  15102e6b17a3180e2650ac1cb2a5e4bffe3822f8, "wip(convergence): preserve
  preempted S4-001 H001 candidate". The predecessor Run was mechanically
  archived, before salvage, in the separate evidence repository
  workflow-coordinator-run-evidence@02d04d4a4f81748e48518e33abdbba2ac67047e4
  at archive/unclassified/wfc-correction-convergence-escape-implementation-s4-001-20261005-03;
  this Commission does not mutate that archive or the predecessor Run state.
  The salvage commit is explicitly NOT a trusted WFC H001 implementation
  commit, NOT a successful reconstruction of predecessor H001, NOT
  independent review, NOT Slice-4 implementation acceptance, NOT same-Run
  resume, NOT same-Hop retry, and NOT evidence that the salvaged
  implementation is correct or complete. Salvage preserves work, not
  authority. Every salvaged line in model.py, serialization.py, reducer.py,
  and codex_adapter.py is therefore UNVERIFIED candidate work: this
  Commission's successor worker may retain, modify, replace, or remove any
  of it within the scope authorized below, and nothing in it is accepted
  merely because the predecessor's trusted pytest run passed.

  FRESH SUCCESSOR RATIONALE: the salvaged work is useful enough to preserve
  but never acquired trusted Hop authority, so this Commission authorizes a
  separately authorized fresh successor, WI-WFC-CORRECTION-CONVERGENCE-ESCAPE-IMPLEMENTATION-S4-002,
  under the normal fresh-successor rule that the execution starting point
  (the salvage commit, as candidate ancestry) is not the same thing as the
  assurance baseline (the accepted Slice-1/2/3 lineage above). The future
  prepared Run's execution starting HEAD must be at or after this
  Commission's own commit; this Commission-authoring act itself does not
  launch any Run and does not invoke any provider.

  S3-002 H001 created Run-native Findings F001, F002, and F003, belonging
  solely to that frozen predecessor Run, which its own rereview could not
  resolve because its profile declared finding_authority: [] on a
  disposition-bearing gate -- a self-development Commission-authoring
  governance defect tracked at
  docs/backlog/BUG-WFC-SELF-DEVELOPMENT-GATE-FINDING-AUTHORITY.adoc. F001/F002/F003
  are Run-native WFC Finding IDs; they are NOT the same identifiers as, and
  are never aliases of, the stable durable cross-Run implementation-review
  identifiers S3-IR-001/S3-IR-002/S3-IR-003 -- the two are distinct identity
  surfaces that happen to concern corresponding implementation issues. The
  fresh S3-003 successor Commission corrected the governance defect by
  granting finding_authority: [resolve]; S3-003 did not inherit and did not
  resolve S3-002's F001/F002/F003 (which remain frozen, open, predecessor
  Run-local history). This Commission applies the same corrected
  least-privilege invariant: its topology is implement -> review -> {accept,
  correct} -> correct -> rereview, not review-first: H001 is implement, not
  review. This fresh S4-002 Run begins with an empty Run-native Finding
  ledger -- it inherits no Finding from the stopped S4-001 predecessor, which
  never reached review. The implement Hop may legitimately create a genuine
  new current-Run OPEN Finding, and doing so is NOT itself a disposition
  operation (the reducer's `_finding_operation(None, FindingState.OPEN)`
  returns no operation, so no finding_authority is required to create an OPEN
  Finding; only a later OPEN -> RESOLVED/RESIDUAL/SUPERSEDED/REOPEN transition
  is a disposition operation gated by finding_authority). Consequently H002
  review may legitimately encounter an H001-created current-Run OPEN Finding
  and, if its own independent verification confirms the corresponding
  blocker is in fact satisfied, resolve it; if review instead finds a genuine
  defect, it opens or leaves open a Finding and routes correct, and rereview
  may later resolve it once correction is independently verified sufficient.
  Both review and rereview are therefore granted the same minimal
  finding_authority: [resolve] -- nothing broader; S4-IR identifiers remain
  durable review-artifact prose dispositioned by writing directly into that
  artifact, never by a WFC Finding-ledger operation.

  The source BUG, docs/backlog/BUG-WFC-CORRECTION-BLOCKING-SET-CARRYOVER.adoc,
  remains OPEN; this Commission does not close it. docs/backlog/BUG-WFC-SELF-DEVELOPMENT-GATE-FINDING-AUTHORITY.adoc
  also remains OPEN; this Commission's least-privilege finding_authority
  shape is one further narrowly scoped application of its invariant, not the
  general profile audit or governance-test strengthening that record defers
  to later work, and this Commission does not close it either.

  This Commission authorizes Slice 4 ONLY, as a FULL fresh implementation
  successor (not a narrow "finish whatever S4-001 left unfinished" task):
  activation of non-null typed DiagnosisReport, StrategyRevision, and
  StrategyAssessment result-v2 content; exact escape-hop/diagnosis-hop/
  revision-hop correlation and exact triggering Finding-ID/strategy-generation
  set validation through the complete diagnosis/reframe/strategy-gate chain;
  exactly-once strategy-generation advancement bound only to an accepted,
  exactly correlated strategy assessment, with no persisted mutable
  generation counter; diagnosis-phase read-only/non-mutating enforcement with
  respect to the subject artifact; strategy-gate semantic authority limited
  to accepting or rejecting the proposed strategy revision, carrying no
  Finding disposition authority and no ability to complete the Run;
  preservation of Slice-3 escape-routing semantics, requested/applied route
  precedence, and the reserved-route/trusted-qualification boundary;
  preservation of replay/checkpoint determinism for the complete diagnosis/
  reframe/strategy chain; and the domain-neutral curriculum-domain
  falsification fixture the accepted FTR assigns to this slice. It does NOT
  authorize Slice 5, R1A dogfood, foreign-domain falsification, source-BUG
  closure, closure of BUG-WFC-SELF-DEVELOPMENT-GATE-FINDING-AUTHORITY,
  Runtime promotion, push, or another Run. This Commission does not promote
  workflow-coordinator-runtime, does not push, does not mutate the
  workflow-coordinator-run-evidence repository or its run ledger, does not
  mutate canonical Project Memory or OPS/STATE, does not launch any Run or
  invoke any provider, and does not mutate any accepted design/review/BUG/
  history artifact other than appending a fresh S4-002 Slice-4 section to the
  existing shared implementation-review artifact.
