schema_version: 2
work_item_id: WI-WFC-PROJECTED-RESULT-CONTRACTS-P2-INTEGRATION-CLOSURE
authority_source: >-
  maintainer-authorized bounded WFC self-development successor commission
  continuing P2 ("Strict worker / review result families") of the accepted
  concept docs/wfc_projected_result_contracts_concept_2026-10-07.adoc
  (sections 6-9), after the predecessor P2 Commission
  (3354c5448e3237ba2800ebc1a8d82fe8fca8daca) produced one trusted
  implementation candidate and then stopped correctly, fail-closed, before
  any independent review.

  PREDECESSOR HISTORICAL TRUTH (frozen; not resumed, mutated, reopened, or
  rewritten by this successor). Predecessor Run RUN-90c24baad80645b0958ed96ae0a2cc3f
  (Attempt wfc-projected-result-contracts-p2-20261008-01, max_autonomous_hops
  8) executed exactly one Hop: H001 `worker` `completed`, producing trusted
  Development candidate 25861f2c19d438c82144d1aed742c48ea038f352
  ("feat(WI-WFC-PROJECTED-RESULT-CONTRACTS-P2): add strict result families
  H001"), implementing the intended P2 direction through the existing P1
  projection seam -- distinct WorkResult/ReviewVerdict provider-neutral
  types reusing the one P1 selector, provider-schema/parser/prompt
  vocabulary kept per-family-synchronized, every convergence-role (Slice 4)
  phase preserved unchanged, current Finding semantics preserved without
  implementing P3. H001's own focused validation subset passed. The
  Coordinator-trusted required-evidence command, `python -m pytest -q` over
  the complete repository, independently failed (exit 1). With no
  configured route for that failure, the Run correctly stopped fail-closed:
  run_status awaiting_human, stop_reason required_evidence_failed_without_route,
  phase implement, hop_used 1 of hop_limit 8. There was no H002, no
  independent review, no rereview, no Run-native Finding, no accepted
  review verdict, no P2 completion, no Runtime promotion, and no push. H001
  is NOT reinterpreted as accepted merely because its own focused checks
  passed; no review provenance that never existed is fabricated here. The
  Run was mechanically archived at workflow-coordinator-run-evidence
  25b350c62d49e23f961258f44c74dfb059d64ade and semantically curated at
  1f669d9c8f0d722925ecf84e2b43adaf4cc45e32
  ("docs(ledger): record projected contracts P2 evidence stop"); neither
  record is mutated by this Commission.

  WHY A SUCCESSOR IS NEEDED, NOT A RESUME. The predecessor Commission
  granted its implement/correction phases a deliberately file-exact
  authorized_scope -- exactly fifteen named source/test paths -- while the
  governing policy simultaneously required trusted full-repository `pytest`
  evidence. The P2 contract change had consumers in existing tests outside
  that fifteen-path predicted set (per H001's own uninvestigated claim,
  "legacy worker fixtures in Slice-4-oriented tests still emitting the
  retired generic outcome envelope" -- recorded as the agent's own
  characterization, not established fact, and to be verified rather than
  trusted by this successor's own worker); full-suite evidence exercised
  that wider surface and failed. This is the durable lesson now recorded in
  docs/wfc_operator_manual.adoc's "Commission mutation-scope granularity"
  section: scope is an authority boundary, not an implementation plan.
  Harness already supports directory-level scope; this successor therefore
  widens worker authorized_scope to bounded area/directory level
  (src/workflow_coordinator, tests) rather than inventing any new scope
  mechanism, exactly as that section's own recommended default illustrates.

  LINEAGE. P1 ("Projection infrastructure") is complete, independently
  assured by a successor Run, and promoted to Runtime
  9e49458de12e79dae4d8827a60f7cd39d18b4c80 (detached, clean, push-disabled
  -- unchanged by this Commission). Original P2 Commission commit
  3354c5448e3237ba2800ebc1a8d82fe8fca8daca authorized the predecessor Run.
  H001 candidate 25861f2c19d438c82144d1aed742c48ea038f352 is the starting
  point this successor integrates from -- it is not reimplemented from
  scratch. Predecessor stop: awaiting_human /
  required_evidence_failed_without_route, after H001, before any
  independent review. Mechanical archive: Evidence
  25b350c62d49e23f961258f44c74dfb059d64ade. Semantic ledger curation:
  Evidence 1f669d9c8f0d722925ecf84e2b43adaf4cc45e32. Pre-authoring
  Development anchor for this Commission: 49f59bf6baa44764e3dbb36ca8baa9a009d98856
  ("docs(wfc): add mechanism admission guidance") -- an anchor used to
  verify repository reality before authoring, NOT a self-referential future
  Run baseline; the Harness's own `prepare` step pins the actual Development
  revision later, under current Harness PREPARE/LAUNCH behavior, which this
  Commission does not redesign.

  SUCCESSOR PURPOSE. This successor Run shall: (1) perform the bounded
  integration/correction work, within src/workflow_coordinator and tests,
  required to make the existing H001 P2 candidate satisfy trusted
  repository-wide `pytest` evidence; (2) then obtain the FIRST genuine fresh
  independent semantic review of the complete P2 candidate -- P2 has never
  been independently reviewed; (3) if that review opens a blocking
  current-Run Finding, permit bounded correction; (4) then perform fresh but
  BOUNDED rereview of known Findings and direct correction regressions,
  per docs/wfc_operator_manual.adoc's "Review breadth and bounded rereview
  convergence" section; (5) complete only if trusted evidence and semantic
  review both permit it. The initial integration worker must inspect the
  existing H001 implementation and the current full-suite failures and make
  the smallest P2-consistent integration correction needed; it may modify
  existing H001 production code only if investigation finds an actual P2
  defect, never a gratuitous rewrite merely because a fresh implementation
  would look different.

  MECHANISM-ADMISSION DISCIPLINE (docs/wfc_operator_manual.adoc,
  "Mechanism admission and design economy"). The observed problem is
  already adequately addressed by existing directory-capable scope
  mechanics, better Commission authoring, and bounded rereview purpose.
  This Commission therefore introduces no new scope schema, no
  globs/include/exclude machinery, no `may_modify_tests` field, no automatic
  impact analysis, no dynamic scope escalation, no new review states, no new
  evidence-routing mechanism, no new "integration failure" lifecycle state,
  and no new Commission field to encode this incident -- it uses existing
  WFC mechanics correctly.

  EXACT SUCCESSOR MUTATION SURFACE. integration and correction (role
  worker): bounded directory authority over exactly
  src/workflow_coordinator and tests (no wildcard syntax, no bare
  repository-wide scope). independent_review and rereview (role
  independent_reviewer): exactly one new durable review artifact,
  docs/backlog/FTR-WFC-PROJECTED-RESULT-CONTRACTS_implementation_review_004.adoc
  (a NEW successor artifact; `_003.adoc` was reserved, but never
  authoritatively created, by the predecessor Commission's own review
  phases, which never ran -- it is left untouched and is not reused or
  renumbered by this successor). Review phases must not mutate
  production/tests; worker phases must not mutate the review artifact.

  P2 ACCEPTANCE BOUNDARY (unchanged from the original P2 Commission). This
  successor may integrate/correct the existing P2 candidate; it does not
  authorize P3 Finding-authority generalization beyond the one bounded
  P2-local decision already resolved by the original P2 Commission
  (preserving the current `AGENT`-authority `NewFindingDelta` capability for
  worker-role phases); P3.5 Commission/profile static authority-conformance
  implementation; P4 Coordinator-owned effect extraction/CommitIntent
  redesign; P5 provider capability/registry cleanup; a Claude adapter;
  provider registry redesign; hierarchical escalation; Harness v1;
  PREPARE/LAUNCH baseline-pinning redesign; outer orchestration; backlog
  picker; automatic Commission generation; automatic Runtime promotion;
  automatic push; sandbox redesign; unrelated BUG closure; model/provider
  routing optimization; cost optimization; general Project Memory changes;
  semantic ledger automation; Operator Manual changes; Runtime mutation;
  Evidence mutation; or any retroactive mutation of the predecessor P2
  Run/archive/ledger. If trusted full-suite evidence reveals a repository
  defect genuinely unrelated to P2 integration, this Commission does not
  authorize silently absorbing or opportunistically fixing it; escalate
  (requires_human=true, escalation.kind=scope) instead.

  FINDING AUTHORITY. Both independent_review and rereview are granted
  `finding_authority: [resolve]` only -- the same minimal least-privilege
  operation already established as the correct fix for the self-development
  authority-gap defect elsewhere in this repository (e.g.
  governance/self-development/projected-result-contracts-p1-assurance-closure-profile.yaml),
  so a disposition-bearing gate is never again commissioned without the
  operation its own purpose requires. No `residual`, `supersede`, or
  `reopen` is granted; none is required for this Commission's purpose. This
  authority applies ONLY to Findings this successor Run itself opens; the
  predecessor P2 Run had none, and none is fabricated or inherited here.

  TRUSTED EVIDENCE. Keep the existing repository evidence-command
  convention -- `python -m pytest -q`, 900-second timeout, per this
  Commission's own policy's `evidence_commands.pytest` -- unweakened. The
  predecessor's failure was not "pytest was too broad"; widening worker
  mutation authority to the bounded source/test areas is precisely what
  lets legitimate integration work satisfy the existing full-suite
  evidence without weakening it.
