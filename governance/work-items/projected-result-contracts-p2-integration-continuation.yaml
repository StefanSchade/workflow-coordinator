work_item_id: WI-WFC-PROJECTED-RESULT-CONTRACTS-P2-INTEGRATION-CONTINUATION
authority_source: >-
  maintainer-authorized bounded WFC self-development successor commission
  continuing P2 ("Strict worker / review result families") of the accepted
  concept docs/wfc_projected_result_contracts_concept_2026-10-07.adoc
  (sections 6-9). This is a continuation of already-authorized P2
  integration work, not a new P2 implementation from scratch, not a redesign
  of projected result contracts, not a new evidence or scope mechanism, not
  a retry/resume of either frozen historical Run, and not P3/P3.5/P4/P5 or
  Higher-Loop implementation.

  HISTORICAL LINEAGE (frozen; not resumed, mutated, reopened, or rewritten
  by this successor). Original P2 Commission
  3354c5448e3237ba2800ebc1a8d82fe8fca8daca launched Run
  RUN-90c24baad80645b0958ed96ae0a2cc3f (Attempt
  wfc-projected-result-contracts-p2-20261008-01, hop_limit 8), which
  executed exactly one Hop -- H001 `worker` `completed`, landing trusted
  Development candidate 25861f2c19d438c82144d1aed742c48ea038f352
  ("feat(WI-WFC-PROJECTED-RESULT-CONTRACTS-P2): add strict result families
  H001") -- then stopped fail-closed before any independent review because
  the Coordinator's required full-repository `python -m pytest -q`
  evidence failed, with no configured route for that failure:
  run_status awaiting_human, stop_reason
  required_evidence_failed_without_route, hop_used 1 of hop_limit 8,
  findings none, worktree clean. Mechanical archive: Evidence
  25b350c62d49e23f961258f44c74dfb059d64ade. Semantic ledger curation:
  Evidence 1f669d9c8f0d722925ecf84e2b43adaf4cc45e32.

  A first integration-closure successor Commission
  3d9bfcecf2b243e676cb8393f329277c0d6d4be8 then widened worker
  authorized_scope to bounded directory authority
  (src/workflow_coordinator, tests) and launched successor Run
  RUN-d5ae5bd0eadb41dba2c10c1d085e6c4d, which again executed exactly one
  Hop -- H001 `worker` `integration`, legitimately modifying five files
  under that directory authority (tests/unit/test_a2_evidence_commands.py,
  tests/unit/test_operator.py, tests/unit/test_proof_harness.py,
  tests/unit/test_slice4.py, tests/unit/test_slice5b.py) and landing
  trusted Development commit ba34ec2418a72baa4685607092f35a2a7261b05b
  ("test(WI-WFC-PROJECTED-RESULT-CONTRACTS-P2-INTEGRATION-CLOSURE): align
  strict fixtures H001"). The worker requested `independent_review`, but
  the Coordinator-required `python -m pytest -q` again failed, and the Run
  again correctly stopped fail-closed: run_status awaiting_human,
  stop_reason required_evidence_failed_without_route, hop_used 1 of
  hop_limit 8, findings none, current_head
  ba34ec2418a72baa4685607092f35a2a7261b05b, worktree clean. There was no
  H002, no independent review, no rereview, no Run-native Finding, no
  review verdict, no P2 acceptance, no P2 completion, no Runtime
  promotion, and no push. Mechanical archive: Evidence
  524dd73e7f7067420e8e57be9184eb322f4d6f91. Semantic ledger curation:
  Evidence 2e2a4e59eb4a65f98377176a4fe76cfd2a983a25. Both historical Runs
  are permanently frozen; this new Commission creates a FRESH successor
  Run later -- it is not a resume or retry of either.

  POST-RUN DIAGNOSIS (post-Run operator observation; NOT trusted evidence
  of either frozen Run; must not be fabricated as such). After
  RUN-d5ae5bd0eadb41dba2c10c1d085e6c4d terminated, operator diagnosis
  established at least one remaining P2 integration class: legacy worker
  fixtures in tests/unit/test_slice4b_git_authority.py still emit the
  retired generic `outcome` field where the now-selected strict
  `WorkResult` family requires `status`
  (workflow_coordinator.serialization.ValidationError: "work result has
  unknown fields: outcome"), observed across eight tests in that one file.
  Pre-authoring inspection for THIS Commission independently re-confirmed
  that full-suite `python -m pytest -q` is still currently red and
  reproduced that same eight-test failure class in
  tests/unit/test_slice4b_git_authority.py, plus additional currently
  failing tests in tests/unit/test_wfc_op.py whose failure shape (worktree-
  cleanliness/launch-return-code assertions) differs from the `outcome`
  vocabulary pattern and has NOT been root-caused by this authoring step.
  Neither this inspection nor the prior post-run diagnosis establishes the
  complete repository-wide failure set, and neither establishes that every
  remaining failure is necessarily P2 integration debt rather than a
  genuinely unrelated pre-existing problem; the new worker must inspect
  current repository truth directly rather than trusting either
  characterization, and must use existing blocked/escalation semantics
  (requires_human=true, escalation.kind=scope) if a remaining failure
  genuinely requires authority outside this Commission's bounded scope or
  non-P2 semantics, rather than widening scope or weakening P2 strictness
  to force the suite green.

  LINEAGE. P1 ("Projection infrastructure") is complete, independently
  assured, and promoted to Runtime 9e49458de12e79dae4d8827a60f7cd39d18b4c80
  (detached, clean, push-disabled -- unchanged by this Commission). This
  successor's semantic implementation starting point is
  ba34ec2418a72baa4685607092f35a2a7261b05b; it is integrated from, not
  reimplemented. Development currently also contains a later
  documentation-only commit, e1c24783c60db5de1043c5c93b289a0b3fdfcaa3
  ("docs(wfc): clarify stop propagation across orchestration levels"),
  changing only
  docs/product_boundary_and_higher_order_orchestration_concept_2026-09-25.adoc;
  it is orthogonal to P2 implementation. The future Harness PREPARE step
  pins the actual Commission-inclusive Development HEAD; this Commission
  does not predict that self-referential commit hash. The recently
  documented Higher-Loop stop-propagation concept introduced by that
  documentation commit is context only and is explicitly NOT implemented
  by this Commission.

  SUCCESSOR PURPOSE. This successor Run shall: (1) inspect the complete
  current P2 candidate and the complete repository test suite, and make
  the smallest P2-consistent integration/correction fixes, within bounded
  src/workflow_coordinator and tests authority, needed to satisfy trusted
  full-repository `pytest` evidence -- continuing until the suite is green
  unless a genuinely unrelated or unauthorized problem prevents it; (2)
  then obtain the FIRST genuine independent adversarial review of the
  complete P2 candidate -- no prior P2 independent-review Hop has ever
  executed; (3) if that review opens a blocking current-Run Finding,
  permit bounded correction; (4) then perform fresh but narrowly bounded
  rereview of known current-Run Findings and direct correction
  regressions, per docs/wfc_operator_manual.adoc's "Review breadth and
  bounded rereview convergence" section; (5) complete only if trusted
  evidence and semantic review both permit it. The worker must prefer
  test/fixture integration where production behavior is already correct,
  touching production inside src/workflow_coordinator only if investigation
  finds an actual P2 defect requiring a bounded fix -- never a gratuitous
  rewrite, and never weakening P2's strict schemas/parsers/types merely to
  accommodate a stale fixture.

  MECHANISM-ADMISSION DISCIPLINE (docs/wfc_operator_manual.adoc,
  "Mechanism admission and design economy"). The observed problem is
  already adequately addressed by existing directory-capable scope
  mechanics, careful Commission authoring, and bounded rereview purpose.
  This Commission therefore introduces no Definition-of-Done schema, no
  new evidence field, no new result field, no new Evidence mechanism, no
  new Coordinator behavior, no scope-globbing machinery, and no new
  lifecycle state -- it uses existing WFC mechanics correctly, exactly as
  the directly preceding successor Commission already established.

  EXACT SUCCESSOR MUTATION SURFACE. integration and correction (role
  worker): bounded directory authority over exactly
  src/workflow_coordinator and tests (no wildcard syntax, no bare
  repository-wide scope). This authoring step does not freeze an exact
  touched-file list -- scope is an authority boundary, not an
  implementation plan; the worker discovers which files inside the
  authorized areas need correction. independent_review and rereview (role
  independent_reviewer): exactly one new durable review artifact,
  docs/backlog/FTR-WFC-PROJECTED-RESULT-CONTRACTS_implementation_review_005.adoc
  -- a NEW successor artifact. `_003.adoc` was reserved by the original P2
  Commission and `_004.adoc` was reserved by the first integration-closure
  successor Commission, but no review Hop of either predecessor ever ran,
  so neither artifact was ever authoritatively created; both are left
  untouched and are not reused or renumbered by this successor. Review
  phases must not mutate production/tests; worker phases must not mutate
  the review artifact.

  P2 ACCEPTANCE BOUNDARY (unchanged from the original P2 Commission and its
  first successor). This successor may integrate/correct the existing P2
  candidate; it does not authorize P3 Finding-authority generalization
  beyond the one bounded P2-local decision already resolved by the
  original P2 Commission (preserving the current `AGENT`-authority
  `NewFindingDelta` capability for worker-role phases); P3.5
  Commission/profile static authority-conformance implementation; P4
  Coordinator-owned effect extraction/CommitIntent redesign; P5 provider
  capability/registry cleanup; a Claude adapter; provider fallback;
  model/cost routing; sandbox/trust redesign; Harness redesign; moving
  baseline pinning from PREPARE to LAUNCH; new scope machinery; new
  evidence machinery; a Definition-of-Done schema; automatic evidence
  projection implementation; Higher-Loop implementation; automatic
  successor creation; automatic Commission generation; backlog picker;
  automatic Runtime promotion; automatic push; semantic-ledger automation;
  unrelated BUG/FTR closure; Project Memory mutation; Runtime mutation;
  Evidence mutation; or any retroactive mutation of either predecessor P2
  Run/archive/ledger. If trusted full-suite evidence reveals a repository
  defect genuinely unrelated to P2 integration, this Commission does not
  authorize silently absorbing or opportunistically fixing it; escalate
  (requires_human=true, escalation.kind=scope) instead.

  FINDING AUTHORITY. Both independent_review and rereview are granted
  `finding_authority: [resolve]` only, consistent with the already-
  corrected successor pattern -- a disposition-bearing gate is never again
  commissioned without the operation its own purpose requires. No
  `residual`, `supersede`, or `reopen` is granted; none is required for
  this Commission's purpose. This authority applies ONLY to Findings this
  successor Run itself opens; it confers no authority over either
  predecessor Run or its records, neither of which had any Finding.

  TRUSTED EVIDENCE. Keep the existing repository evidence-command
  convention -- `python -m pytest -q`, 900-second timeout, per this
  Commission's own policy's `evidence_commands.pytest` -- unweakened and
  selected for every phase. The complete command `python -m pytest -q` is
  the acceptance boundary the Coordinator will independently execute
  before any requested route may proceed; the worker should run this exact
  complete command itself before reporting `completed`, where its
  environment permits, but its own run is diagnostic/agent-attributed, not
  a substitute for the Coordinator's independent trusted run. A narrower
  substitute -- individual test files, a hand-selected subset, a top-level
  filename glob, or focused pytest only -- does not establish that the
  required complete suite is satisfied.
