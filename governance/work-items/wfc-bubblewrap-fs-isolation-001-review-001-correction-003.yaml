authority_source: >-
  Operator-session maintainer authorization (direct chat instruction,
  2026-11-06) for a fresh, third successor correction Commission, after the
  two immediately preceding Attempts were each stopped by an unrelated
  environmental/provider blocker before performing any independent
  investigation of the bind-mount-alias lead left open by H006 of
  `WI-WFC-BUBBLEWRAP-FS-ISOLATION-001-REVIEW-001`
  (`RUN-11823103c2d9465ab9d7c0a70974562c`).

  `WI-WFC-BUBBLEWRAP-FS-ISOLATION-001-REVIEW-001-CORRECTION-001`
  (`RUN-e231286c9a474df1b48aefd31e7b31c1`, `codex_cli`) was interrupted by a
  Codex CLI provider-turn cybersecurity-content rejection before any file
  change, Git mutation, or delivered candidate, and stopped
  `reconcile_required`; archived unmodified to `workflow-coordinator-run-
  evidence` at `414eae31c3b1b4199057ba75b8da161cd463993a`.
  `WI-WFC-BUBBLEWRAP-FS-ISOLATION-001-REVIEW-001-CORRECTION-002`
  (`RUN-921eae416d264bbaba51c603b33b33c0`, `claude_cli`) switched adapters to
  avoid that class of blocker, but its single worker Hop
  (`INV-c4e614cd051a42d5a1f682aef517e1f3`) hit a distinct operational
  blocker instead: the Claude CLI's own Bash tool sandbox failed to
  initialize ("Failed to create bridge sockets after 5 attempts") for every
  command, so no bwrap reproduction, regression re-run, or pytest run was
  possible; the Hop made zero commits and zero changed paths
  (`base_head == end_head == final_head ==
  533eac4966525a4eeab1e70e53fa4ce1ee2aaa78`) and stopped `awaiting_human`
  with a non-null operational `semantic_stop`
  (`stop_reason: mechanical_preemption:human_authority:operational`),
  `worktree_clean: true`, `anomalies: []`. That Attempt has since been
  mechanically archived, unmodified, to `workflow-coordinator-run-evidence`
  commit `a28ccbd24ea8f30b5b547109ac1cb74354ca6a9f`
  (`archive/unclassified/wfc-bubblewrap-fs-isolation-001-review-001-
  correction-002-20261106-01`), with a verified manifest and preserved Run
  facts. Although that Run reached `AWAITING_HUMAN` with a non-null
  `semantic_stop` (unlike the review-001/H006 and correction-001
  predecessors), it carries no candidate material for the separate,
  differently-scoped `export-salvage`/`prepare-successor` mechanism
  (`docs/run-recovery-and-salvage.adoc`, "Relation to adjacent mechanisms")
  to package: zero commits and zero changed paths mean there is nothing to
  hand a successor beyond the frozen historical record itself. This
  WorkItem is therefore, like both predecessors, an entirely separate,
  freshly authorized Commission -- not a `successor_provenance`-bearing
  successor and not a resume of any prior Run.

  The sandbox-bridge blocker that stopped correction-002 has since been
  independently diagnosed and repaired in Development, outside this
  WorkItem's own scope and authority, under the maintainer's separate
  direction: commit `4776fd0` gives the Claude CLI subprocess launched by
  `claude_adapter.py` a short, invocation-specific `TMPDIR` instead of
  inheriting WFC's long Attempt-scoped one (the inherited path's length was
  breaking the CLI's own `AF_UNIX` IPC-bridge socket creation), with cleanup
  after subprocess completion including on timeout; commit `7a5b736` adds an
  opt-in live smoke test that exercised the real Claude CLI end-to-end three
  times under a simulated long-TMPDIR WFC environment, observed the bridge
  socket paths landing directly under the short `TMPDIR` as intended, and
  passed the full suite. Development HEAD `7a5b736f3f56a95d5f0fc3f1975ca678efe3f9bb`
  is this WorkItem's verified-clean baseline; it is exactly correction-002's
  baseline (`533eac4`) plus only those two orthogonal adapter-execution-
  environment commits -- no change to `execution_boundary.py` or either of
  its test files. WFC Runtime has separately been promoted by the maintainer
  from `4eb69d9` to this exact commit (preconditions and postconditions of
  `self-development.adoc`'s "Runtime promotion runbook" independently
  re-verified immediately before this WorkItem was authored), so the Hop
  this WorkItem authorizes will itself execute under the repaired adapter,
  not merely investigate a target that has it.

  This WorkItem reuses the exact same, already-committed `robust@v1`
  profile.yaml and policy.yaml unchanged (same routes, scopes, role
  bindings, evidence gates, Finding authority, and correction path --
  nothing narrowed), mirroring the identical established mechanism used to
  author both predecessor correction WorkItems. It enters directly at
  `correct` (worker phase), which the Coordinator's own admission rules
  already permit for any phase a profile declares, with
  `max_autonomous_hops: 1`. This is a deliberate structural boundary, not a
  typical sizing choice: the `correct` phase's only route
  (`focused_review`) unconditionally goes to an independent-reviewer phase,
  and this maintainer authorization explicitly withholds that final
  independent adversarial review of any correction for a separately
  authorized later stage, in a fresh context. Bounding the Hop budget to
  exactly 1 makes the Coordinator itself -- via the existing, unmodified
  `autonomous_hop_budget_exhausted` / `AWAITING_HUMAN_BUDGET` mechanism in
  `reducer.py` -- mechanically refuse to dispatch the `focused_review` Hop,
  rather than relying on any agent discipline, a faked phase completion, or
  a bypass of the Coordinator.

  Every role binding again uses the `claude_cli` execution adapter,
  consistent with correction-002's established departure from `codex_cli`
  and with the just-verified repair of that adapter's sandbox-bridge
  blocker. WFC's existing mixed-execution-adapter preflight rejection is
  unchanged and continues to apply; this WorkItem does not request or
  require any change to it, only a uniform `claude_cli` selection across
  both declared roles (`worker`, `independent_reviewer`).

  Development baseline verified clean immediately before authoring this
  WorkItem: `HEAD` `7a5b736f3f56a95d5f0fc3f1975ca678efe3f9bb`. This
  authorization covers authoring, hand-validation via `wfc-op prepare`'s
  regular operator preflight, and launch, subject to all required preflight
  and authority conditions passing; if any hard preflight or authority
  condition fails, preparation/launch stops and the blocker is reported
  rather than bypassed.
