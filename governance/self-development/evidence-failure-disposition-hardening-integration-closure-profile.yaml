schema_version: 2
profile_id: evidence-failure-disposition-hardening-integration-closure
revision: "1"
phases:
  closure_correction:
    role: worker
    components:
      role: [worker]
      modifiers: []
      repository_policy: []
    durable_artifact: none
    authorized_scope:
      - src/workflow_coordinator/serialization.py
      - src/workflow_coordinator/reducer.py
      - src/workflow_coordinator/operator.py
      - tests/unit
      - tests/architecture/test_self_development_governance.py
      - docs/wfc_operator_manual.adoc
    authorized_actions: [edit, commit]
    human_gates: []
    evidence: []
    review: null
    routes:
      independent_review: {effect: goto, target: independent_review}

  independent_review:
    role: independent_reviewer
    components:
      role: [reviewer]
      modifiers: []
      repository_policy: []
    durable_artifact: required
    authorized_scope:
      - docs/backlog/FTR-WFC-EVIDENCE-FAILURE-DISPOSITION-HARDENING_implementation_review_001.adoc
    authorized_actions: [review, edit, commit]
    human_gates: []
    evidence: [pytest]
    review:
      purpose: >-
        Fresh broad independent review of the complete evidence-failure
        disposition hardening after the stopped predecessor Run, preserved
        H003 unit-test corrections, and the bounded architecture-test
        disposition authorized by this successor Commission. Review the
        resulting implementation against the accepted design rather than
        granting correctness credit to predecessor review or salvage commits.
        Explicitly verify new-launch admission, historical parsing/salvage
        compatibility, failed-evidence GOTO/AWAIT_HUMAN behavior, the
        architecture-test update, and absence of unrelated architecture or
        P3/P3.5/P4/P5 work.
      breadth: broad
      authority: gate
      context: fresh
      blocking_policy: blocking_only
      trigger: profile_selected
      exit: declared_route
      finding_authority: [resolve]
      failed_evidence_route: correction
    routes:
      accept: {effect: complete}
      correction: {effect: goto, target: correction}

  correction:
    role: worker
    components:
      role: [worker]
      modifiers: []
      repository_policy: []
    durable_artifact: none
    authorized_scope:
      - src/workflow_coordinator/serialization.py
      - src/workflow_coordinator/reducer.py
      - src/workflow_coordinator/operator.py
      - tests/unit
      - tests/architecture/test_self_development_governance.py
      - docs/wfc_operator_manual.adoc
    authorized_actions: [edit, commit]
    human_gates: []
    evidence: []
    review: null
    routes:
      rereview: {effect: goto, target: rereview}

  rereview:
    role: independent_reviewer
    components:
      role: [reviewer]
      modifiers: []
      repository_policy: []
    durable_artifact: required
    authorized_scope:
      - docs/backlog/FTR-WFC-EVIDENCE-FAILURE-DISPOSITION-HARDENING_implementation_review_001.adoc
    authorized_actions: [review, edit, commit]
    human_gates: []
    evidence: [pytest]
    review:
      purpose: >-
        Fresh focused disposition of current-Run Findings and direct
        correction regressions after the independent review. Re-test the
        specific blocking concerns and the architecture-test correction
        without reopening general discovery merely because context is fresh.
        A genuinely new MATERIAL defect with concrete evidence may still be
        reported.
      breadth: focused
      authority: gate
      context: fresh
      blocking_policy: blocking_only
      trigger: profile_selected
      exit: declared_route
      finding_authority: [resolve]
      failed_evidence_route: correction
    routes:
      accept: {effect: complete}
      correction: {effect: goto, target: correction}
