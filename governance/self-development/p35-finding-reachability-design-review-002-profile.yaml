    authorized_actions: [review, edit, commit]
    human_gates: []
    evidence: [pytest]
    review:
      purpose: >-
        fresh, independent, adversarial falsification of the already-drafted
        P3.5 finding-reachability design
        (docs/warm_storage/concepts/workflow_coordinator_p35_finding_reachability_design_2026-10-18.adoc,
        commit fa308c3a2201ea0ad98801963038f1a98b50a206) against the governing
        Projected Result Contracts concept §§4, 11, 17, 19, 20, 22 and
        BUG-WFC-SELF-DEVELOPMENT-GATE-FINDING-AUTHORITY: verify the static
        ordered-reachability graph algorithm (its `disposer`/`checkpoint`/
        `creates_blocking` predicates, the `danger` fixpoint, the decision
        rule, and its interaction with guarded routes), construct minimal
        counterexample profiles where the algorithm as specified may
        incorrectly accept a true dead end or incorrectly reject a safe
        profile; verify the independence of `may_open_findings` from
        `finding_authority` and the schema-v4 no-default-value rationale;
        verify the compatibility/migration claim that no schema-v2/v3 profile
        outside the eight named self-development lineages would be
        collaterally rejected by the proposed review-presence proxy; and
        verify the design stays within P3.5's actual bounded scope (no P1-P3
        reopening, no Finding-kind taxonomy, no workflow DSL or general
        liveness checker, no hierarchical-escalation decision, no closure of
        the governing BUG). Reject the design even where internally
        consistent if it is unsound or oversteps scope. Do not modify the
        design document under review from this phase. This phase holds
        resolve-only Finding authority for any genuine Run-native Finding it
        itself opens and later verifies corrected, consistent with the
        governing BUG's least-privilege lesson.
      breadth: broad
      authority: gate
      context: fresh
      blocking_policy: blocking_only
      trigger: profile_selected
      exit: declared_route
      finding_authority: [resolve]
      failed_evidence_route: correction
    routes:
      accept: {effect: complete}
      correction: {effect: goto, target: correction}
