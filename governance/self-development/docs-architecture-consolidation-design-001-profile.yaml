    authorized_actions: [review, edit, commit]
    human_gates: []
    evidence: [pytest]
    review:
      purpose: >-
        independent adversarial falsification, with fresh context, of the
        proposed single documentation/backlog/information-architecture
        design and its concrete Run-B migration plan against: whether it
        solves real navigation and current-truth-versus-history problems
        rather than adding another documentation layer; whether P3.5/P4/P5
        become navigable without archaeology; whether the core/WFC
        comparison is evidence-based and bidirectional rather than
        core-wins-by-default, and whether WFC strengths such as explicit
        runbooks are preserved where better; whether the migration plan is
        concrete enough (file/directory-level, with ordering, dependencies,
        and validation) to commission Run B directly without a further
        planning document; whether unnecessary new categories, taxonomies,
        or process ceremony were introduced; whether historical material
        remains provenance-available while removed from the normal
        current-truth reading path; and whether the artifact accidentally
        designs or canonizes source-code architecture (including today's
        flat src/workflow_coordinator/*.py module layout as if permanent)
        rather than staying within documentation/backlog/information
        architecture. Reject documentation bureaucracy even where internally
        consistent.
      breadth: broad
      authority: gate
      context: fresh
      blocking_policy: blocking_only
      trigger: profile_selected
      exit: declared_route
      finding_authority: [resolve]
      failed_evidence_route: correction
    routes:
      accept: {effect: complete}
      correction: {effect: goto, target: correction}
  correction:
