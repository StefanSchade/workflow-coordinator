phases:
  design:
    role: worker
    components:
      role: [worker]
      modifiers: []
      repository_policy: []
    durable_artifact: none
    authorized_scope:
      - docs/warm_storage/concepts/workflow_coordinator_front_door_commission_contract_design_2026-10-28.adoc
    authorized_actions: [edit, commit]
    human_gates: []
    evidence: []
    review: null
    routes:
      independent_review: {effect: goto, target: independent_review}
  independent_review:
    role: independent_reviewer
    components:
      role: [reviewer]
      modifiers: []
      repository_policy: []
    durable_artifact: required
    authorized_scope:
      - docs/warm_storage/concepts/workflow_coordinator_front_door_commission_contract_design_2026-10-28_review_001.adoc
    authorized_actions: [review, edit, commit]
    human_gates: []
    evidence: [pytest]
    review:
      purpose: >-
        independent adversarial falsification, with fresh context, of the
        proposed Commission Intent / Commission Compiler contract against:
        whether boundary and ownership (program semantics, task bindings,
        authorization, derived permissions, Runtime execution) are kept
        cleanly separate and consistent with the accepted Commissioning
        Service boundary concept's trust-boundary split and monotonicity
        rule; whether the Commission Intent distinguishes user-provided
        semantic decisions from compiler-derived fields and gives realistic,
        inspectable examples for both the human and machine interface;
        whether the deterministic projection produces existing WFC governing
        inputs without granting authority, fails before the first agent
        invocation on an invalid configuration, and pins/reverifies launched
        inputs against validated inputs; whether it silently weakens any
        existing process guarantee, scope, mandatory review, or
        Finding-disposition permission (compare directly against
        `operator.py:_preflight`, `_admit_a1`, and
        `_admit_evidence_disposition`); whether Direct and Robust receive
        concrete, non-DSL grammar coverage, including Robust's renewed-
        broad-review-before-Complete invariant and preserved successor-
        continuation/technical-recovery semantics; whether the identified
        program-semantic or grammar gaps are minimal rather than a step
        toward an unrestricted workflow DSL; and whether the proposed proof
        path is genuinely the smallest vertical slice exercisable on one
        real Commission without historical-profile migration. Reject
        speculative platform-building even where internally consistent.
      breadth: broad
      authority: gate
      context: fresh
      blocking_policy: blocking_only
      trigger: profile_selected
      exit: declared_route
      finding_authority: [resolve]
      failed_evidence_route: correction
    routes:
      accept: {effect: complete}
      correction: {effect: goto, target: correction}
  correction:
    role: worker
    components:
      role: [worker]
      modifiers: []
      repository_policy: []
    durable_artifact: none
    authorized_scope:
      - docs/warm_storage/concepts/workflow_coordinator_front_door_commission_contract_design_2026-10-28.adoc
    authorized_actions: [edit, commit]
    human_gates: []
    evidence: []
    review: null
    routes:
      rereview: {effect: goto, target: rereview}
  rereview:
    role: independent_reviewer
    components:
      role: [reviewer]
      modifiers: []
      repository_policy: []
    durable_artifact: required
    authorized_scope:
      - docs/warm_storage/concepts/workflow_coordinator_front_door_commission_contract_design_2026-10-28_review_001.adoc
    authorized_actions: [review, edit, commit]
    human_gates: []
    evidence: [pytest]
    review:
      purpose: >-
        fresh independent disposition of the corrected Commission Intent /
        Compiler design, preserving the prior review history in the same
        durable review artifact and durably appending this Hop's own
        disposition; bounded to the concrete blocking problems the
        preceding review or rereview recorded and to direct correction
        regressions, without re-litigating already-closed questions; holds
        resolve-only Finding authority for any genuine current-Run-local
        Finding it itself opens and later verifies corrected.
      breadth: focused
      authority: gate
      context: fresh
      blocking_policy: blocking_only
      trigger: profile_selected
      exit: declared_route
      finding_authority: [resolve]
      failed_evidence_route: correction
    routes:
      accept: {effect: complete}
      correction: {effect: goto, target: correction}
