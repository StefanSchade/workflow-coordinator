schema_version: 1
profile_id: standalone-developer-ergonomics
revision: "3"
phases:
  investigate:
    role: developer
    components:
      role: [developer]
      modifiers: []
      repository_policy: []
    durable_artifact: optional
    authorized_scope:
      - Makefile
      - README.md
      - pyproject.toml
      - scripts/wfc_snapshot.py
      - tests/unit/test_wfc_snapshot.py
      - tests/architecture/test_package_boundaries.py
    authorized_actions: [edit, commit]
    human_gates: []
    evidence: [pytest]
    review: null
    routes:
      review: {effect: goto, target: review}
  review:
    role: independent_reviewer
    components:
      role: [reviewer]
      modifiers: []
      repository_policy: []
    durable_artifact: required
    authorized_scope:
      - docs/backlog/wfc_reviews
    authorized_actions: [review, edit, commit]
    human_gates: []
    evidence: [pytest]
    review:
      purpose: independent falsification
      breadth: focused
      authority: gate
      context: fresh
      blocking_policy: blocking_only
      trigger: profile_selected
      exit: declared_route
      finding_authority: [resolve]
      failed_evidence_route: correct
    routes:
      rereview: {effect: goto, target: rereview}
      correct: {effect: goto, target: correct}
  correct:
    role: developer
    components:
      role: [developer]
      modifiers: []
      repository_policy: []
    durable_artifact: optional
    authorized_scope:
      - Makefile
      - README.md
      - pyproject.toml
      - scripts/wfc_snapshot.py
      - tests/unit/test_wfc_snapshot.py
      - tests/architecture/test_package_boundaries.py
    authorized_actions: [edit, commit]
    human_gates: []
    evidence: [pytest]
    review: null
    routes:
      rereview: {effect: goto, target: rereview}
  rereview:
    role: independent_reviewer
    components:
      role: [reviewer]
      modifiers: []
      repository_policy: []
    durable_artifact: none
    authorized_scope:
      - docs/backlog/wfc_reviews
    authorized_actions: [review]
    human_gates: []
    evidence: [pytest]
    review:
      purpose: fresh disposition
      breadth: focused
      authority: gate
      context: fresh
      blocking_policy: blocking_only
      trigger: profile_selected
      exit: declared_route
      finding_authority: [resolve]
    routes:
      accept: {effect: complete}
      correct: {effect: goto, target: correct}
