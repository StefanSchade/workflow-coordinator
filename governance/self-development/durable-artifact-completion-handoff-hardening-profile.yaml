schema_version: 2
profile_id: durable-artifact-completion-handoff-hardening
revision: "1"
phases:
  implement:
    role: worker
    components:
      role: [worker]
      modifiers: []
      repository_policy: []
    durable_artifact: none
    authorized_scope:
      - src/workflow_coordinator/prompt.py
      - src/workflow_coordinator/operator.py
      - src/workflow_coordinator/vertical.py
      - tests/unit
      - docs/wfc_operator_manual.adoc
    authorized_actions: [edit, commit]
    human_gates: []
    evidence: []
    review: null
    routes:
      independent_review: {effect: goto, target: independent_review}

  independent_review:
    role: independent_reviewer
    components:
      role: [reviewer]
      modifiers: []
      repository_policy: []
    durable_artifact: required
    authorized_scope:
      - docs/backlog/FTR-WFC-DURABLE-ARTIFACT-COMPLETION-HANDOFF-HARDENING_implementation_review_001.adoc
    authorized_actions: [review, edit, commit]
    human_gates: []
    evidence: [pytest]
    review:
      purpose: >-
        FIRST independent review of the complete bounded durable-artifact
        completion-handoff hardening defined by this Commission's own
        WorkItem task text. Review the COMPLETE candidate, not only the
        latest diff, with fresh adversarial context. Must explicitly verify,
        numbered one through twenty, exactly the checklist recorded in this
        Commission's own task text's "FIRST INDEPENDENT REVIEW" section --
        in particular that no new early `validated_result`/`run_one_hop`
        durable-artifact enforcement layer was introduced; that
        `_durable_artifact_anomalies` remains the sole enforcement point,
        invoked at its existing call site with its existing disposition
        semantics; that the only change to it is deterministic message
        granularity; that the agent-facing prompt/context projects a
        Coordinator-composed obligation sentence derived only from
        already-in-scope facts, never phrased so as to instruct an
        ADVISORY-review phase under `durable_artifact: required` to supply a
        CommitIntent for `changes_required`; that blocked/failed/
        requires_human/escalation/scope_changed dispositions gain no new
        permission to supply CommitIntent; that a valid required-artifact
        completion with a correct CommitIntent still proceeds into the
        existing trusted Git/artifact verification path; that optional/none
        durable-artifact phases remain unaffected; that the Run does not
        newly end in RECONCILE_REQUIRED because of this hardening; that the
        generic pinned `agent_operating_contract_v6.txt` resource,
        `CONTRACT_VERSION`, and `REVIEWED_SHA256` were not touched; that no
        new persisted field, `ResultContractKind`, or Codex/OpenAI
        provider-schema change was introduced; that the ADVISORY + required
        + changes_required composition anomaly was neither fixed nor
        broadened; that no P3/P3.5/P4/P5 or unrelated scope creep occurred;
        and that the complete Coordinator-owned repository pytest evidence
        passes.
      breadth: broad
      authority: gate
      context: fresh
      blocking_policy: blocking_only
      trigger: profile_selected
      exit: declared_route
      finding_authority: [resolve]
      failed_evidence_route: correction
    routes:
      accept: {effect: complete}
      correction: {effect: goto, target: correction}

  correction:
    role: worker
    components:
      role: [worker]
      modifiers: []
      repository_policy: []
    durable_artifact: none
    authorized_scope:
      - src/workflow_coordinator/prompt.py
      - src/workflow_coordinator/operator.py
      - src/workflow_coordinator/vertical.py
      - tests/unit
      - docs/wfc_operator_manual.adoc
    authorized_actions: [edit, commit]
    human_gates: []
    evidence: []
    review: null
    routes:
      rereview: {effect: goto, target: rereview}

  rereview:
    role: independent_reviewer
    components:
      role: [reviewer]
      modifiers: []
      repository_policy: []
    durable_artifact: required
    authorized_scope:
      - docs/backlog/FTR-WFC-DURABLE-ARTIFACT-COMPLETION-HANDOFF-HARDENING_implementation_review_001.adoc
    authorized_actions: [review, edit, commit]
    human_gates: []
    evidence: [pytest]
    review:
      purpose: >-
        Fresh focused rereview of current-Run Findings opened by
        `independent_review` (or an earlier `rereview` of this same Run),
        their corrections, direct correction regressions, and the gate's
        own required trusted pytest evidence. Do not reopen the broad
        `independent_review` discovery surface merely because context is
        fresh. Even when the semantic verdict is ACCEPT with no Findings,
        append and commit a rereview section to the durable review
        artifact. Do not claim final Run acceptance before Coordinator-owned
        pytest and reducer disposition. A genuinely new MATERIAL defect
        supported by concrete new evidence may still be reported and escape
        this bounded surface; an unrelated newly noticed MINOR observation
        should not automatically reset convergence.
      breadth: focused
      authority: gate
      context: fresh
      blocking_policy: blocking_only
      trigger: profile_selected
      exit: declared_route
      finding_authority: [resolve]
      failed_evidence_route: correction
    routes:
      accept: {effect: complete}
      correction: {effect: goto, target: correction}
