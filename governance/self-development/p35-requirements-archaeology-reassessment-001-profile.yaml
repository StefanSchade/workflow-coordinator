schema_version: 2
profile_id: p35-requirements-archaeology-reassessment-001
revision: "1"
phases:
  assessment:
    role: worker
    components:
      role: [worker]
      modifiers: []
      repository_policy: []
    durable_artifact: none
    authorized_scope:
      - docs/warm_storage/concepts/workflow_coordinator_p35_requirements_archaeology_reassessment_2026-10-26.adoc
    authorized_actions: [edit, commit]
    human_gates: []
    evidence: []
    review: null
    routes:
      review: {effect: goto, target: review}
  review:
    role: independent_reviewer
    components:
      role: [reviewer]
      modifiers: []
      repository_policy: []
    durable_artifact: required
    authorized_scope:
      - docs/warm_storage/concepts/workflow_coordinator_p35_requirements_archaeology_reassessment_2026-10-26_review.adoc
    authorized_actions: [review, edit, commit]
    human_gates: []
    evidence: [pytest]
    review:
      purpose: >-
        independent, adversarial first-pass verification of the
        requirements-archaeology and reassessment document's historical
        archaeology (earliest supported introduction of the universal
        all-path requirement, distinguishing documentary evidence from
        interpretation), its requirements-fidelity testing of the
        maintainer's three candidate hypotheses against concrete graph
        counterexamples, its architectural-placement analysis, and its
        reevaluation of the prior structural-invariant reassessment's four
        deferred components and 43/43 rejection breakdown -- attempting to
        falsify the requirements interpretation against the original
        incident and historical sources, not merely assessing conformance
        to the accepted P3.5 design or to the prior reassessment's own
        framing. Does not mutate the assessment document itself -- only this
        review artifact. Does not predetermine or demand any particular
        recommendation.
      breadth: focused
      authority: gate
      context: fresh
      blocking_policy: blocking_only
      trigger: profile_selected
      exit: declared_route
      finding_authority: [resolve]
      failed_evidence_route: correction
    routes:
      accept: {effect: complete}
      correction: {effect: goto, target: correction}
  correction:
    role: worker
    components:
      role: [worker]
      modifiers: []
      repository_policy: []
    durable_artifact: none
    authorized_scope:
      - docs/warm_storage/concepts/workflow_coordinator_p35_requirements_archaeology_reassessment_2026-10-26.adoc
    authorized_actions: [edit, commit]
    human_gates: []
    evidence: []
    review: null
    routes:
      rereview: {effect: goto, target: rereview}
  rereview:
    role: independent_reviewer
    components:
      role: [reviewer]
      modifiers: []
      repository_policy: []
    durable_artifact: required
    authorized_scope:
      - docs/warm_storage/concepts/workflow_coordinator_p35_requirements_archaeology_reassessment_2026-10-26_review.adoc
    authorized_actions: [review, edit, commit]
    human_gates: []
    evidence: [pytest]
    review:
      purpose: >-
        fresh independent re-verification of the corrected
        requirements-archaeology and reassessment document against exactly
        the Findings this profile's own review phase opened, directly
        falsifying the correction's coverage claim against the original
        incident and historical sources rather than accepting it at face
        value, while preserving any already-closed identifier absent
        genuinely new material evidence. Accepts only once every material
        Finding this phase or its predecessor review opened is legitimately
        resolved; otherwise routes back to correction, naming the precise
        remaining defect. Does not mutate the assessment document itself --
        only the review artifact.
      breadth: focused
      authority: gate
      context: fresh
      blocking_policy: blocking_only
      trigger: profile_selected
      exit: declared_route
      finding_authority: [resolve]
      failed_evidence_route: correction
    routes:
      accept: {effect: complete}
      correction: {effect: goto, target: correction}
