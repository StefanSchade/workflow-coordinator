schema_version: 2
profile_id: workflow-profile-archaeology-001
revision: "1"
phases:
  assessment:
    role: worker
    components:
      role: [worker]
      modifiers: []
      repository_policy: []
    durable_artifact: none
    authorized_scope:
      - docs/warm_storage/concepts/workflow_program_profile_archaeology_2026-10-27.adoc
    authorized_actions: [edit, commit]
    human_gates: []
    evidence: []
    review: null
    routes:
      review: {effect: goto, target: review}
  review:
    role: independent_reviewer
    components:
      role: [reviewer]
      modifiers: []
      repository_policy: []
    durable_artifact: required
    authorized_scope:
      - docs/warm_storage/concepts/workflow_program_profile_archaeology_2026-10-27_review.adoc
    authorized_actions: [review, edit, commit]
    human_gates: []
    evidence: [pytest]
    review:
      purpose: >-
        independent, adversarial first-pass verification of the
        workflow-profile archaeology survey's inventory (all current and
        historical self-development profiles, including schema-v2/v3
        confusion risk), its workflow-family classification against the six
        functional-model scenarios, its historical archaeology (Git
        evidence, not assumption), and its governance-implications and
        reuse-hypothesis sections -- attempting to falsify the survey's
        classifications and equivalence claims against actual profile YAML,
        Git history, and current source, not merely assessing internal
        consistency. Does not mutate the survey document itself -- only this
        review artifact. Does not predetermine or demand any particular
        recommendation, and does not authorize treating an unresolved
        question as a decided architecture.
      breadth: focused
      authority: gate
      context: fresh
      blocking_policy: blocking_only
      trigger: profile_selected
      exit: declared_route
      finding_authority: [resolve]
      failed_evidence_route: correction
    routes:
      accept: {effect: complete}
      correction: {effect: goto, target: correction}
  correction:
    role: worker
    components:
      role: [worker]
      modifiers: []
      repository_policy: []
    durable_artifact: none
    authorized_scope:
      - docs/warm_storage/concepts/workflow_program_profile_archaeology_2026-10-27.adoc
    authorized_actions: [edit, commit]
    human_gates: []
    evidence: []
    review: null
    routes:
      rereview: {effect: goto, target: rereview}
  rereview:
    role: independent_reviewer
    components:
      role: [reviewer]
      modifiers: []
      repository_policy: []
    durable_artifact: required
    authorized_scope:
      - docs/warm_storage/concepts/workflow_program_profile_archaeology_2026-10-27_review.adoc
    authorized_actions: [review, edit, commit]
    human_gates: []
    evidence: [pytest]
    review:
      purpose: >-
        fresh independent re-verification of the corrected survey against
        exactly the Findings this profile's own review phase opened,
        directly re-deriving or reconstructing each counterexample/defect
        rather than accepting the correction's claim at face value, while
        preserving any already-closed identifier absent genuinely new
        material evidence. Accepts only once every material Finding this
        phase or its predecessor review opened is legitimately resolved;
        otherwise routes back to correction, naming the precise remaining
        defect. Does not mutate the survey document itself -- only the
        review artifact.
      breadth: focused
      authority: gate
      context: fresh
      blocking_policy: blocking_only
      trigger: profile_selected
      exit: declared_route
      finding_authority: [resolve]
      failed_evidence_route: correction
    routes:
      accept: {effect: complete}
      correction: {effect: goto, target: correction}
