schema_version: 3
policy_id: workflow-coordinator-self-development
revision: "1"
scope:
  - workflow-coordinator
governance_paths:
  - governance
work_item_scope_ceiling:
  - Makefile
  - README.md
  - pyproject.toml
  - scripts/wfc_snapshot.py
  - tests/unit/test_wfc_snapshot.py
  - tests/architecture/test_package_boundaries.py
  - docs/backlog/first_wfc_on_wfc_dogfood_review.adoc
max_autonomous_hops: 4
actions:
  - edit
  - commit
  - review
evidence_commands:
  pytest:
    argv:
      - python
      - -m
      - pytest
      - -q
    timeout_seconds: 900
