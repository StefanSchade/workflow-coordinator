schema_version: 2
profile_id: projected-result-contracts-p2-integration-continuation
revision: "1"
phases:
  integration:
    role: worker
    components:
      role: [worker]
      modifiers: []
      repository_policy: []
    durable_artifact: none
    authorized_scope:
      - src/workflow_coordinator
      - tests
    authorized_actions: [edit, commit]
    human_gates: []
    evidence: [pytest]
    review: null
    routes:
      independent_review: {effect: goto, target: independent_review}
  independent_review:
    role: independent_reviewer
    components:
      role: [reviewer]
      modifiers: []
      repository_policy: []
    durable_artifact: required
    authorized_scope:
      - docs/backlog/FTR-WFC-PROJECTED-RESULT-CONTRACTS_implementation_review_005.adoc
    authorized_actions: [review, edit, commit]
    human_gates: []
    evidence: [pytest]
    review:
      purpose: >-
        FIRST genuine independent semantic review of the complete P2 strict
        worker/review result-family candidate (continued from the
        predecessor Runs' H001 candidates and this successor's own
        integration correction), adversarially falsifying it with fresh
        context against the accepted concept
        docs/wfc_projected_result_contracts_concept_2026-10-07.adoc
        (sections 6-9), the original P2 Commission's acceptance boundary,
        this successor's own integration scope, and P1
        compatibility/historical replay truth. Must explicitly assess at
        minimum, numbered one through fifteen -- (1) are worker phases
        structurally projected as WorkResult rather than generic
        RoutingResult where P2 requires it; (2) are review phases
        structurally projected as ReviewVerdict where P2 requires it; (3)
        can a worker structurally emit reviewer-only changes_required
        semantics (it must not); (4) is reviewer vocabulary narrow and
        coherent; (5) does P2 still reuse the one accepted P1
        result-contract selector rather than introducing phase-key/name
        branching; (6) are provider schema, parser, prompt vocabulary,
        validation, and selected contract kind mutually consistent; (7)
        does the reducer remain the authority for stateful legality rather
        than projected contracts replacing reducer authority; (8) are
        current Finding semantics preserved without implementing P3; (9)
        are convergence-role/Slice-4 phases that intentionally remain
        generic unaffected; (10) is historical replay truthful; (11) does
        new history persist enough information to know which contract
        family was dispatched; (12) did the integration corrections
        preserve strictness rather than making the production contract
        permissive to accommodate stale fixtures; (13) is the complete
        trusted repository test suite green; (14) did any P3/P3.5/P4/P5
        behavior leak into the candidate; (15) is there any hidden second
        result-family selector or duplicated semantic decision undermining
        P1's seam. Holds resolve-only Finding authority for any genuine
        current-Run-local Finding it itself opens and later verifies
        corrected; it has no authority over, and must not reference as if
        open to it, any Finding belonging to either frozen predecessor Run,
        neither of which had any Finding.
      breadth: focused
      authority: gate
      context: fresh
      blocking_policy: blocking_only
      trigger: profile_selected
      exit: declared_route
      finding_authority: [resolve]
    routes:
      accept: {effect: complete}
      correction: {effect: goto, target: correction}
  correction:
    role: worker
    components:
      role: [worker]
      modifiers: []
      repository_policy: []
    durable_artifact: none
    authorized_scope:
      - src/workflow_coordinator
      - tests
    authorized_actions: [edit, commit]
    human_gates: []
    evidence: [pytest]
    review: null
    routes:
      rereview: {effect: goto, target: rereview}
  rereview:
    role: independent_reviewer
    components:
      role: [reviewer]
      modifiers: []
      repository_policy: []
    durable_artifact: required
    authorized_scope:
      - docs/backlog/FTR-WFC-PROJECTED-RESULT-CONTRACTS_implementation_review_005.adoc
    authorized_actions: [review, edit, commit]
    human_gates: []
    evidence: [pytest]
    review:
      purpose: >-
        Fresh independent disposition of the known current-Run Findings
        after correction. Re-test those specific Findings and inspect
        direct correction regressions. Do not reopen general discovery
        merely because context is fresh -- do not copy the broad
        independent_review purpose into this narrower rereview. A
        genuinely new MATERIAL defect supported by concrete new material
        evidence may still be reported and escape this bounded surface; an
        unrelated newly noticed MINOR observation should not automatically
        reset convergence.
      breadth: focused
      authority: gate
      context: fresh
      blocking_policy: blocking_only
      trigger: profile_selected
      exit: declared_route
      finding_authority: [resolve]
    routes:
      accept: {effect: complete}
      correction: {effect: goto, target: correction}
