schema_version: 2
profile_id: evidence-failure-disposition-hardening
revision: "1"
phases:
  implement:
    role: worker
    components:
      role: [worker]
      modifiers: []
      repository_policy: []
    durable_artifact: none
    authorized_scope:
      - src/workflow_coordinator/serialization.py
      - src/workflow_coordinator/reducer.py
      - src/workflow_coordinator/operator.py
      - tests/unit
      - docs/wfc_operator_manual.adoc
    authorized_actions: [edit, commit]
    human_gates: []
    evidence: []
    review: null
    routes:
      independent_review: {effect: goto, target: independent_review}
  independent_review:
    role: independent_reviewer
    components:
      role: [reviewer]
      modifiers: []
      repository_policy: []
    durable_artifact: required
    authorized_scope:
      - docs/backlog/FTR-WFC-EVIDENCE-FAILURE-DISPOSITION-HARDENING_implementation_review_001.adoc
    authorized_actions: [review, edit, commit]
    human_gates: []
    evidence: [pytest]
    review:
      purpose: >-
        FIRST independent review of the complete bounded evidence-failure
        disposition hardening defined by
        docs/wfc_evidence_failure_disposition_hardening_design_2026-10-09.adoc.
        Review the COMPLETE candidate, not only the latest diff, with fresh
        adversarial context. Must explicitly verify, numbered one through
        twenty-one, exactly the checklist recorded in this Commission's own
        task text's "FIRST INDEPENDENT REVIEW" section -- in particular that
        no new evidence-disposition schema field or parallel routing
        mechanism was introduced; that `failed_evidence_route` still names a
        real route key and admits exactly `goto` or `await_human`; that the
        v3 evaluator permitted-goto-key accounting remains exact; that
        new-launch admission at `_preflight()` and `_prepare_successor()`
        rejects a non-gate phase with non-empty evidence and a gate omitting
        `failed_evidence_route`, while leaving empty-evidence phases
        unaffected; that `_export_salvage()` remains explicitly outside that
        admission predicate and historical violating profiles remain
        readable for salvage; that `await_human` disposition still requires
        and surfaces its authored `question` through existing `_apply_route`
        / human-stop mechanics; that `goto` disposition and evidence `PASS`
        / `ERROR` / malformed / `not_run` behavior are unchanged; that the
        accepted P2 successor profile remains admissible; that historical
        governance profiles were not bulk-migrated; that
        docs/wfc_operator_manual.adoc section 22 accurately documents the
        implemented boundary; that no P3/P3.5/P4/P5 or unrelated scope creep
        occurred; and that the complete Coordinator-owned repository pytest
        evidence passes.
      breadth: broad
      authority: gate
      context: fresh
      blocking_policy: blocking_only
      trigger: profile_selected
      exit: declared_route
      finding_authority: [resolve]
      failed_evidence_route: correction
    routes:
      accept: {effect: complete}
      correction: {effect: goto, target: correction}
  correction:
    role: worker
    components:
      role: [worker]
      modifiers: []
      repository_policy: []
    durable_artifact: none
    authorized_scope:
      - src/workflow_coordinator/serialization.py
      - src/workflow_coordinator/reducer.py
      - src/workflow_coordinator/operator.py
      - tests/unit
      - docs/wfc_operator_manual.adoc
    authorized_actions: [edit, commit]
    human_gates: []
    evidence: []
    review: null
    routes:
      rereview: {effect: goto, target: rereview}
  rereview:
    role: independent_reviewer
    components:
      role: [reviewer]
      modifiers: []
      repository_policy: []
    durable_artifact: required
    authorized_scope:
      - docs/backlog/FTR-WFC-EVIDENCE-FAILURE-DISPOSITION-HARDENING_implementation_review_001.adoc
    authorized_actions: [review, edit, commit]
    human_gates: []
    evidence: [pytest]
    review:
      purpose: >-
        Fresh independent disposition of the known current-Run Findings
        opened by `independent_review`, after correction. Re-test those
        specific Findings and inspect direct correction regressions,
        together with the gate's own required trusted pytest evidence. Do
        not reopen general discovery merely because context is fresh -- do
        not copy the broad `independent_review` purpose into this narrower
        rereview. A genuinely new MATERIAL defect supported by concrete new
        evidence may still be reported and escape this bounded surface; an
        unrelated newly noticed MINOR observation should not automatically
        reset convergence.
      breadth: focused
      authority: gate
      context: fresh
      blocking_policy: blocking_only
      trigger: profile_selected
      exit: declared_route
      finding_authority: [resolve]
      failed_evidence_route: correction
    routes:
      accept: {effect: complete}
      correction: {effect: goto, target: correction}
