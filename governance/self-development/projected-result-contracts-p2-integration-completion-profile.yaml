schema_version: 2
profile_id: projected-result-contracts-p2-integration-completion
revision: "1"
phases:
  integration:
    role: worker
    components:
      role: [worker]
      modifiers: []
      repository_policy: []
    durable_artifact: none
    authorized_scope:
      - src/workflow_coordinator
      - tests
    authorized_actions: [edit, commit]
    human_gates: []
    evidence: []
    review: null
    routes:
      independent_review: {effect: goto, target: independent_review}
  independent_review:
    role: independent_reviewer
    components:
      role: [reviewer]
      modifiers: []
      repository_policy: []
    durable_artifact: required
    authorized_scope:
      - docs/backlog/FTR-WFC-PROJECTED-RESULT-CONTRACTS_implementation_review_006.adoc
    authorized_actions: [review, edit, commit]
    human_gates: []
    evidence: [pytest]
    review:
      purpose: >-
        FIRST genuine independent semantic review of the COMPLETE
        accumulated P2 strict worker/review result-family candidate --
        the original P2 implementation, every trusted integration
        correction from the predecessor Runs
        (RUN-90c24baad80645b0958ed96ae0a2cc3f,
        RUN-d5ae5bd0eadb41dba2c10c1d085e6c4d,
        RUN-6fa0b56e3b844896a55f147f4ee41fea), the non-authoritative
        Slice4B salvage (Development commit
        405f3b26be90604c12572297f12c6c6ed7ae9e2e) now incorporated into
        current ancestry, and this successor's own integration work.
        Review the complete candidate, not only the latest diff, with
        fresh adversarial context against the accepted concept
        docs/wfc_projected_result_contracts_concept_2026-10-07.adoc
        (sections 6-9) and the original P2 Commission's acceptance
        boundary. Must explicitly assess at minimum, numbered one through
        twelve -- (1) WorkResult and ReviewVerdict are genuinely distinct
        strict result families; (2) worker phases select WorkResult for
        the intended admitted combinations; (3) review gates select
        ReviewVerdict for the intended admitted combinations; (4)
        convergence-role phases retain their intended generic behavior;
        (5) provider schema, parser, prompt vocabulary, and persisted
        contract identity remain synchronized; (6) unknown/legacy fields
        are rejected rather than silently accepted; (7) no phase-name
        string inference has replaced declarative selection; (8)
        replay/history remains truthful; (9) existing Finding semantics
        are preserved and P3 has not been accidentally implemented; (10)
        no P3/P3.5/P4/P5 scope creep is present; (11) the complete trusted
        repository test suite is green when Coordinator evidence
        executes; (12) salvaged material is reviewed as ordinary
        untrusted candidate code and receives no grandfathered
        correctness credit. Holds resolve-only Finding authority for any
        genuine current-Run-local Finding it itself opens and later
        verifies corrected; it has no authority over, and must not
        reference as if open to it, any Finding belonging to any frozen
        predecessor Run, none of which had any Finding.
      breadth: broad
      authority: gate
      context: fresh
      blocking_policy: blocking_only
      trigger: profile_selected
      exit: declared_route
      finding_authority: [resolve]
      failed_evidence_route: correction
    routes:
      accept: {effect: complete}
      correction: {effect: goto, target: correction}
  correction:
    role: worker
    components:
      role: [worker]
      modifiers: []
      repository_policy: []
    durable_artifact: none
    authorized_scope:
      - src/workflow_coordinator
      - tests
    authorized_actions: [edit, commit]
    human_gates: []
    evidence: []
    review: null
    routes:
      rereview: {effect: goto, target: rereview}
  rereview:
    role: independent_reviewer
    components:
      role: [reviewer]
      modifiers: []
      repository_policy: []
    durable_artifact: required
    authorized_scope:
      - docs/backlog/FTR-WFC-PROJECTED-RESULT-CONTRACTS_implementation_review_006.adoc
    authorized_actions: [review, edit, commit]
    human_gates: []
    evidence: [pytest]
    review:
      purpose: >-
        Fresh independent disposition of the known current-Run Findings
        after correction. Re-test those specific Findings and inspect
        direct correction regressions, together with the gate's own
        required trusted pytest evidence. Do not reopen general
        discovery merely because context is fresh -- do not copy the
        broad independent_review purpose into this narrower rereview. A
        genuinely new MATERIAL defect supported by concrete new material
        evidence may still be reported and escape this bounded surface;
        an unrelated newly noticed MINOR observation should not
        automatically reset convergence.
      breadth: focused
      authority: gate
      context: fresh
      blocking_policy: blocking_only
      trigger: profile_selected
      exit: declared_route
      finding_authority: [resolve]
      failed_evidence_route: correction
    routes:
      accept: {effect: complete}
      correction: {effect: goto, target: correction}
