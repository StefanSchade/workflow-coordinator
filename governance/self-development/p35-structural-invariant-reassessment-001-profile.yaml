        authorized-to-open-versus-actually-opened distinction, and of every
        claim's grounding in actual reducer/operator behavior rather than
        design prose alone. Does not mutate the assessment document itself --
        only this review artifact. Does not predetermine or demand any
        particular outcome (retain, narrow, or reduce the invariant).
