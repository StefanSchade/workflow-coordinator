        is a safety invariant, an admission-time liveness/usability check, or
        both; whether the strict-after disposition rule is necessary in all
        cases; why all 43 inventoried schema-v2 profiles fail, by concrete
        representative profile and minimal counterexample; whether a narrower
        sound invariant exists; whether retaining the design and migrating
        profiles is justified; whether P3.5 can be reduced for Level-0 without
