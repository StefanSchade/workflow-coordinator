  - docs/warm_storage/concepts/workflow_coordinator_doc_authority_index_001_broad_review_2026-10-30.adoc
  - docs/warm_storage/concepts/workflow_coordinator_doc_authority_index_001_focused_review_2026-10-30.adoc

personas:
