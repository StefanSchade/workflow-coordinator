task:
  title: Verify and independently accept the preserved BP5 archive candidate
  body: 'This is one new robust@v1 Commission; it does not resume or mutate historical RUN-49357f88d4ee4a60b6a111353d5d8664
    (awaiting_human, Evidence c0b1a67). Maintainer preserved its exact candidate in WIP d1b78814a42359c025012d996617b0ffe66661eb,
    binary diff from a6aaeaf SHA-256 70587c0ac31c542f405da6e6bd59e39bc03b7f7a7a66d1bf3b99181aece7ab03. This WIP
    and earlier fc922a7 are non-authoritative: do not claim a trusted predecessor candidate, test, review or acceptance.
    The true BP5 assurance baseline is 54b99ba788206fe61ea89cdeee96db434d4a1c79. Inspect the complete resulting
    product diff from that baseline, including all inherited code, tests, fixture and docs; do not implement BP5
    from scratch. Historical review e26e838 and fb9b0f8 are evidence leads, not acceptance credit.


    Worker: independently inspect the entire candidate and test A (neutral run.fixture.json materializes exact original
    bytes at run.json only in disposable fixture, unchanged original digest b65eee56b2a96a149b8c2eea7ec3c1d7750d9e4869019d68cfde5d36d711f861,
    provenance and real old/new archive parity), B (archive and staging symlink/destination escape refused before
    outside mutation), C (interrupted retry rejects changed data/digest, size, wrong attempt/source identity, unsafe
    absolute/traversal/duplicate/symlink paths; preserves placed data and HEAD; intact retry makes exactly one correct
    commit and next identical repeat is a no-op). Recheck all applicable legacy conformance tests, Git scope/hook/filter
    controls and original BP5 acceptance; never weaken existing tests. Use disposable repositories and avoid mutations
    to the actual Evidence archive. Existing legacy scripts and real archive are in `build/wfc/bp5-evidence-inputs/`
    and tracked fixtures, with provenance; actual pre-fix probes are `build/wfc/bp5-qualification-20261119.py`.
    Preserve old/new archived manifests and file digests/facts identical except archived_at, transparently describing
    necessary temporary path relocation.


    Create the scoped worker-verification artifact `docs/warm_storage/concepts/wfc_beta1_bp5_final_assurance_001_worker_verification.adoc`
    recording actual commands/results, original baseline, fixture digest/provenance, old/new archive comparison,
    retry/containment checks, any inherited material limitations and whether changes were necessary. It is technical
    evidence for independent review, never a claim of acceptance. This substantive verification record gives the
    Coordinator a real, narrowly scoped trusted CommitIntent even if product bytes need no modification. Correct
    only demonstrable material defects within explicitly authorized BP5 candidate files/tests; do not add architecture
    or unrequested features. Escalate genuine authority, design or scope conflicts. Exact CommitIntent lists every
    actual modified/added/deleted leaf, never directories; do not perform Git writes. Avoid introducing a new rename-shaped
    change, whose previously documented limitation is tracked separately. Subject must contain WI-WFC-BETA1-BP5-FINAL-ASSURANCE-001
    and actual Hop ID.


    Independent Opus reviewer evaluates the ENTIRE resulting BP5 product against 54b99ba and original acceptance,
    including preserved ancestry, not just the fresh worker diff or its verification report. Independently verify
    source equivalence, recorded conformance exceptions, fixture portability, actual trusted Git authority, no writes
    outside destination, tamper/refusal behavior and intact retry, plus A/B/C evidence. A reproduced explicit acceptance
    violation is blocking regardless of presumed risk or legacy parity. Report nonblocking observations in the review
    artifact and summary, not unauthorized residual Finding transitions (`finding_authority: [resolve]`); no historic
    Finding is a current Run Finding. Follow robust correction, focused and fresh broad review where necessary.
    Coordinator full task-check is mandatory, and worker completion or an accepting review artifact alone never
    establishes Run acceptance. Preserve historical results.

    '
  acceptance: Coordinator trusted commit for substantive worker-verification artifact; full BP5 candidate independently
    reviewed against 54b99ba with no blocking findings; original applicable conformance and real Run old/new digest/fact
    parity; A fixture bytes/provenance and preparation regression, B symlink/destination containment, C tamper/identity/path
    refusal plus valid single-commit retry and no-op; Coordinator full task-check pass; completed Run.
  withheld_authority: No BP4/BP6, local evidence destination, product architecture rewrite, provider/reducer/compiler/workflow
    or trusted Git implementation changes; no global Git configuration change, test weakening, historical Run/evidence
    edits, extra Commission, Runtime promotion, push, merge or rebase.
  escalation_default: Escalate a genuine need for new authority or design, any unsupported trusted publication under
    WIP ancestry, and inability to establish full BP5 acceptance; do not invent a successful Candidate.
