task:
  title: 'Implement FTR09: source-verified failure-mode guidance'
  body: 'Implement only FTR09 as one complete Worker candidate in H001 on Development main. Read completely the series charter
    docs/backlog/operator-manual-consolidation/FTR-WFC-OPERATOR-MANUAL-CONSOLIDATION.adoc and FTR09 docs/backlog/operator-manual-consolidation/FTR-WFC-OPERATOR-MANUAL-09-FAILURE-MODES.adoc
    at accepted planning commit e01a4084595ff0923f4a6dbebf056e76267f2d1c; read the P2 scope docs/warm_storage/concepts/wfc_operator_manual_p2_planned_scope_2026-11-10.adoc
    and the permission and scratch BUGs linked from FTR09; inspect accepted FTR08 post-state and its final broad review at
    e6133aea9eba3db0a3d18de701aad391fecd659a. Use read-only git show for pinned sources. Follow all FTR09 and charter allocation,
    ownership, metadata, invariants, validation and review rules. Do not access the parallel docs worktree or Fable branch.


    Create exactly docs/operator_manual/ch07_diagnostics/02_failure_modes.adoc. Modify only docs/operator_manual/ch07_diagnostics/_chapter.adoc,
    docs/operator_manual/ch07_diagnostics/01_troubleshooting.adoc and docs/operator_manual/ch04_evidence/01_acceptance.adoc.
    Reviewer artifacts are reserved to their configured phases. Preserve all uninvolved files and accepted chapters byte-identically;
    no deletion or rename.


    Cover fully and once P2 scope item 1: unsatisfiable or overly strict Worker acceptance criteria; blocked versus completed
    and CommitIntent requirements; semantic versus mechanical stops and awaiting_human; exact subject rules and normalized
    exact leaf paths, including new/deleted files, rename detection and current admission limits; provider success followed
    by Coordinator rejection; dirty worktree after rejected commit admission; noninteractive provider permission denials;
    model/CLI compatibility; executable availability versus actual provider integration; limits where full provider tool transcripts
    were not persisted; TMPDIR, scratch environment and external scratch. Put exact CommitIntent and admission rules solely
    in ch04 acceptance, including edit and commit actions, unchanged scope and absence of escalation/human requirement as
    verified in code. Put a diagnosis matrix symptom -> persisted observation -> bounded authorized action -> knowledge or
    authority limit in the new ch07 file. Link from existing troubleshooting without duplicating diagnoses or procedures,
    and include via wrapper. Recovery and salvage stay in ch06 with no second procedure. Each scenario must identify verifiable
    persisted evidence and an authorized action. Examples must use valid identity tokens and concrete normalized leaf paths;
    no implicit authorization of deletes or renames.


    Read and verify against current src/workflow_coordinator/git_facts.py commit_subject_error and trusted_commit, vertical.py
    run_one_hop, claude_adapter.py, operator.py, tests/unit/test_slice4b_git_authority.py and tests/unit/test_operator.py.
    Use BUG-WFC-CLAUDE-ADAPTER-WRITE-PERMISSION-MISMATCH.adoc and BUG-WFC-CLAUDE-ADAPTER-SHORT-TMPDIR-RESOURCE-EXHAUSTION.adoc
    as bounded historical evidence, not proof of new behavior and do not close either. Distinguish current code guarantees,
    historical observations and hypotheses/unverifiable behavior when transcripts are unavailable. Never invent guarantees,
    extra mechanisms or authority. No live provider experiments, installation or downloads to qualify documentation.


    Apply all charter/FTR09 shared validation: full topic coverage and explain any exact duplicate merges; strict Asciidoctor
    renders of entry, all eight wrappers standalone and assembled, and changed sections standalone; resolve includes, links,
    xrefs and fragments, legacy stubs, metadata and heading levels; verify CLI commands/options against owning help; compare
    uninvolved bodies/files byte-for-byte; inspect exact leaf scope, no delete/rename, git diff --check and committed-range
    diff hygiene. Scratch/output outside repository. Agent-local checks do not substitute Coordinator trusted evidence.


    CommitIntent lists every actually changed normalized repository-relative leaf exactly, including new leaves, no directories
    or unchanged files; reconcile actual dirty set. Subject is a single Conventional Commit line with WI-WFC-OPERATOR-MANUAL-FAILURE-MODES-001
    and actual Hop ID as separate bounded tokens. Worker performs no mutating Git operation. Incomplete work alone is not
    blocked; continue authorized work. Blocked carries no CommitIntent.


    Independent reviewer checks full FTR09 post-state independently against FTR09, charter, P2 scope, BUG evidence and current
    code/tests: exact admission contract including edit/commit and scope, persisted evidence and bounded actions per diagnosis,
    valid examples, classification and transcript limits, no duplicate recovery, exact four implementation leaves and untouched
    files, anchors/links/renders and committed-range diff. Only declared reviewer artifact may change; append rounds and propose
    leaf-exact CommitIntent with actual identities. Open blocking Findings for material defects and failed mandatory checks.
    Follow existing robust correction, focused rereview and fresh broad review. Acceptance requires Coordinator trusted task-check
    and fresh broad review without open blocking Findings. Worker and reviewer use the same model in separate fresh invocations.'
  acceptance: '1. Exactly one specified new leaf and three specified modified leaves, no deletion or rename, all uninvolved
    files byte-identical; complete first candidate in H001.

    2. All P2 item 1 and FTR09 topics covered once in appropriate owners; exact commit rules in ch04 match current code including
    edit and commit, unchanged scope, no escalation/human requirement, exact identities and leaves. No duplicated procedure
    or unauthorized delete/rename example.

    3. Each failure scenario states symptom, persisted observation, bounded operator action and knowledge/authority limit;
    distinguish code guarantees, historical observations and hypotheses, respect transcript limits, and do not close BUGs.

    4. All applicable charter and FTR09 validations pass including strict standalone and assembled renders, metadata, headings,
    includes, links, xrefs, fragments, stubs, source/code and CLI verification, byte-identical unrelated files, leaf scope
    and diff hygiene.

    5. Coordinator trusted task-check passes and fresh independent broad review accepts with no open blocking Findings.'
  withheld_authority: No FTR10 or complete commission-to-archive walkthrough, other implementation leaves, source code, scripts,
    tests, governance, existing backlog, project memory, historical records, Runtime or Evidence mutations, recovery/archive/promotion
    operations by agents, agent Git writes, live provider experiments, installations or downloads, push, promotion, successor
    or extra Commission. Do not access or modify parallel docs worktree or Fable branch. Review artifacts belong only to configured
    reviewer phases.
  escalation_default: Escalate only for a concrete obstacle requiring authority or unresolved normative contradiction not
    settled by source and code. Incomplete work alone is not a blocker; continue authorized work and report operational limits
    truthfully.
