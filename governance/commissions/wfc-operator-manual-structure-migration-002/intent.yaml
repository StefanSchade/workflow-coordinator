task:
  title: Establish the modular Operator Manual and move the operator manual, operator guide, run-preparation and self-development content into it
  body: |
    ## Objective

    Create `docs/operator_manual/` and MOVE the content of five source
    documents into it as ONE modular manual. Moved means: the substance lives
    only in the manual afterwards; the old files keep only a short pointer. This
    Commission is structure, navigation and migration. It does NOT add new
    failure-recovery chapters, new failure-mode analysis, or a new end-to-end
    walkthrough (a later Commission does that).

    The scope is deliberately bounded so that the whole of it can be finished in
    this Hop. Do the work: read, restructure, write the files, verify, then
    report. Work mostly by moving existing sections with light editing
    (headings, flow, cross-references, duplicate removal); do not re-derive or
    re-research content.

    ## Sources to migrate (mandatory)

    1. `docs/wfc_operator_manual.adoc` (about 1360 lines)
    2. `docs/operator_guide/operator_guide.adoc`
    3. `docs/operator_guide/ch02_run_preparation.adoc`
    4. `docs/operator_guide/ch08_self_development.adoc`
    5. `docs/run-preparation.adoc`
    6. `docs/self-development.adoc`

    Out of scope, leave byte-identical: `docs/run-recovery-and-salvage.adoc` and
    `docs/successor_continuation_runbook_2026-10-10.adoc` (a later Commission
    consolidates recovery and successor handling). The manual's recovery-related
    sections that come from source 1 are migrated; where they refer to those two
    documents, link to them as the existing detailed references. Orientation
    only: `docs/README.adoc`, `docs/ai_info/` and the inventories in
    `docs/warm_storage/concepts/wfc_documentation_consolidation_plan.adoc`.

    ## Target structure

    ```text
    docs/operator_manual/
      operator_manual.adoc          assembles chapter wrappers
      ch01_<name>/
        _chapter.adoc               assembles the section files
        01_<name>.adoc
        02_<name>.adoc
      ch02_<name>/ ...
    ```

    Model: the Developer Guide of the sibling Core repository
    (`../core/docs/developer_guide/developer_guide.adoc` and `ch*/_chapter.adoc`;
    read-only; `include::...[leveloffset=+1]`). Conventions:
    `docs/ai_info/doc_conventions.adoc`. If the Core files cannot be read,
    follow doc_conventions and say so.

    Starting outline (adjust from the content; do not copy the old 22-section
    numbering): orientation (purpose, mental model, repositories, trust
    boundaries, identity); commissioning (inputs and ownership, authoring,
    rendering and source pins, semantic preflight, review breadth, Hop budget,
    anti-patterns); running a Run (prepare, launch, status, terminal states,
    successor pointer); evidence and archive; self-development (topology,
    ownership, Runtime promotion); troubleshooting (the existing entries);
    reference (quick-reference flow, what Harness v0 does not do, relation to
    higher orchestration, the existing worked example unchanged). Chapters of
    2-8 sections; ASCII lowercase file names without spaces.

    ## Required changes

    1. The manual tree. One canonical home per operational fact: where sources
       overlap (the operator guide chapters restate run-preparation and
       self-development; the manual restates both), keep the most complete
       explanation once and link from other places. Preserve every requirement,
       warning, example and failure-handling procedure. Keep the meaning of
       normative contracts unchanged and add no new operational claims. A
       statement that contradicts `src/` or `scripts/wfc_op.py` may be fixed only
       when the code is unambiguous; name each such fix in your `summary`.
    2. Replace the six migrated files IN PLACE with pointer stubs of at most 12
       lines each (header metadata, one sentence, link to the new canonical
       location, no moved content): the files listed under "Sources to migrate".
       Scripts, tests and immutable governance cite these paths, so they must
       remain. Do NOT delete or `git mv` any tracked file: commit admission
       compares Git's staged-path report with your CommitIntent, and rename
       detection reports a deleted file plus a similar new file only under the
       new name, which would fail admission. In-place modification does not.
    3. Navigation: update `docs/README.adoc` (index entries and the moved-path
       map rows for the six paths only), `docs/ai_info/_ai_info.adoc` (the
       operator row and links), `docs/project_memory.adoc` (links), and add at
       most ten lines to the "Current execution status" of
       `docs/warm_storage/concepts/wfc_documentation_consolidation_plan.adoc`
       (what this Commission did; recovery and successor documents and the new
       chapters remain). Create no map, inventory or history file; in your
       `summary` state which source sections were merged into others or dropped
       as duplicates, so the reviewer can check coverage against the originals.
    4. Do not touch backlog, cold storage, project memory JSON, `src/`,
       `scripts/`, `tests/`, `governance/`, Runtime or Evidence.

    ## Validation you perform (report results in `summary`)

    - `asciidoctor` (/usr/bin/asciidoctor): render `operator_manual.adoc` and each
      `_chapter.adoc` standalone to a location outside the repository
      (`-o /dev/null` works); fix errors and warnings you caused.
    - Every `include::` target exists; every `link:`/`xref:` you wrote or touched
      resolves (a throwaway script outside the repository is fine).
    - Every H2/H3 heading of the six originals (`git show HEAD:<path>`, read-only,
      before you modify) has its substance in the manual or is named in your
      `summary` as merged/dropped duplicate.
    - Commands and options you migrated or edited match `scripts/wfc_op.py
      --help` or the source.
    - You need not run the full test suite: the Coordinator runs
      `python -m pytest -q` itself after your commit. If a tool is missing or
      blocked, say so.

    ## Result and commit rules (read exactly)

    - Report `status: completed` ONLY when every acceptance criterion below is
      met by your own checks. Never report `completed` for unfinished work. Keep
      working until it is finished; the scope is sized for that. If, despite
      that, a criterion truly cannot be met, report `blocked` and name exactly
      which criterion and why; do not claim completion and do not add
      remainder lists to a `completed` result.
    - Never run Git write commands (`add`, `commit`, `mv`, `rm`, `stash`,
      `reset`); the Coordinator owns the commit. Read-only git is fine.
    - `commit_intent.subject`: one line, Conventional Commit syntax, containing
      the exact WorkItem ID `WI-WFC-OPERATOR-MANUAL-STRUCTURE-MIGRATION-002` and
      the actual current Hop ID from the invocation context as separate tokens,
      for example
      `docs(operator-manual): WI-WFC-OPERATOR-MANUAL-STRUCTURE-MIGRATION-002 H001 migrate operator documentation`
      (real Hop ID in any later Hop; confirm it from the invocation context).
    - `commit_intent.paths`: every changed leaf file as an exact, normalized,
      repository-relative path (forward slashes, no `./`, no duplicates), each new
      and modified file individually, never a directory. The set must equal the
      set of files whose worktree state differs from HEAD (new untracked files
      count). Leave no stray or scratch files in the repository.

    ## Independent reviewer

    Review the actual files for technical correctness and information
    architecture, against the acceptance criteria one by one. For coverage,
    compare headings and substance of the six originals (read-only
    `git show <commit before the Worker's first commit>:<path>`) with the manual
    and spot-check a meaningful sample for lost warnings, examples and
    procedures; confirm each fact has one home and the stubs hold no moved
    content; confirm out-of-scope files are untouched and no new failure-recovery
    chapter or walkthrough was introduced; judge whether a reader with no WFC
    history can navigate the manual. Open a blocking Finding only for a material
    defect (lost or altered operational content, broken assembly or links, a
    competing canonical source, out-of-scope change); editorial preferences are
    nonblocking and must not cause correction cycles. Do not make acceptance
    depend on tests, tools or evidence outside your authority or on
    provider/CLI diagnostics unrelated to documentation correctness; state what
    you could not check. Follow the ordinary Robust correction, focused
    re-review and renewed broad-review mechanics; final acceptance must come from
    a fresh broad review.

    Each review Hop must create or update ONLY its own declared durable review
    artifact (see `durable_artifacts`) with a section for that round (on a
    repeated review append a new dated round section so the file really changes)
    and propose a CommitIntent whose `subject` follows the rule above with the
    actual Hop ID and whose `paths` is exactly that one leaf file. Do not modify
    the manual or any other file.

  acceptance: |
    1. `docs/operator_manual/operator_manual.adoc` assembles `ch*/_chapter.adoc`
       wrappers that assemble section files; the entry document and each chapter
       render standalone with asciidoctor without include errors.
    2. Every include target and every link written or touched resolves.
    3. The substance of all six source documents is in the manual (every H2/H3
       heading either migrated or named as merged/duplicate), with every
       requirement, warning, example and failure-handling procedure preserved and
       each fact in one canonical place.
    4. The six sources are pointer stubs of at most 12 lines linking to the new
       location and holding no moved content; no tracked file is deleted or
       renamed; the recovery runbook and successor runbook are unchanged.
    5. `docs/README.adoc`, `docs/ai_info/_ai_info.adoc`, `docs/project_memory.adoc`
       and the consolidation plan status point to the manual; no map, inventory
       or history file was added.
    6. No new failure-recovery chapter, failure-mode analysis or end-to-end
       walkthrough was added.
    7. All changes are inside the declared scope; the Coordinator's `task-check`
       (`python -m pytest -q`) passes; the independent broad review accepts with
       no blocking Finding open.

  withheld_authority: |
    No new failure-recovery chapters, failure-mode analysis or end-to-end
    walkthrough. No change to `docs/run-recovery-and-salvage.adoc`, the successor
    continuation runbook, `src/`, `scripts/`, `tests/`, `governance/`, the Runtime
    or Evidence repositories, immutable workflow programmes, historical
    Commissions, archives or evidence (including
    wfc-operator-manual-consolidation-001, wfc-operator-manual-structure-migration-001
    and their Runs), backlog or cold-storage records, or repository policy. No
    change to the semantics of any normative contract. No new build framework.
    No Git write commands by an agent. No Runtime promotion, push, nested
    provider invocation outside WFC, or successor Run.

  escalation_default: |
    Escalate only for a genuine authority problem: a required change outside the
    declared scope, a normative contract whose meaning would have to change, or
    two authoritative sources that contradict each other where the code cannot
    decide (record it in `summary` and keep the code-verified statement). A
    missing local tool or sandbox-blocked diagnostic is a reported limitation.
    Unfinished work is not an authority escalation: finish it, or report
    `blocked` naming the unmet criterion (see "Result and commit rules").

