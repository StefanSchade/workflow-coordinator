work_item_id: WI-WFC-NESTED-CLAUDE-BWRAP-QUALIFICATION-001
authority_source: 'Maintainer directly authorizes, by explicit 2026-11-08 interactive
  instruction given outside ordinary WFC execution, Commission authoring, rendering,
  committing, `commission check`, preparation, and launch of the bounded technical
  qualification investigation described below: whether, and under which conditions,
  a nested Claude Code CLI invocation runs reliably inside WFC''s own outer `bwrap`
  namespace from `src/workflow_coordinator/execution_boundary.py`, including the external
  WFC scratch bind-mount at `/tmp/s`. This instruction explicitly authorizes launch
  (not merely authoring/commit), subject to all required preflight and authority checks
  passing; if any hard preflight or authority condition fails, preparation/launch
  stops and the blocker is reported rather than bypassed.

  Controlling backlog record: `docs/backlog/FTR-WFC-EXECUTION-TRUST-BOUNDARIES.adoc`
  records a new "2026-11-08 nested Claude-in-bubblewrap qualification authorization
  (an investigation, not an implementation)" section, committed at Development commit
  `bf1a980d85a6db8088bb920b36fa946e5f3e927e`, recording this exact authorization for
  this one investigation only. The active-work manifest, `docs/backlog/_open.adoc`,
  carries a matching "Nested Claude-in-bubblewrap qualification" entry under "Ready
  to commission" pointing at this Commission. This authorization does not lift deferral
  of the broader trust-boundary architecture, provider-dispatch wiring, credential
  brokers, network sidecars, elevated privileges, a general read-authority/classification
  model, any wiring into `operator.py` or either provider adapter, or any general
  loosening of the existing repository-only bind-source rule; all of those remain
  deferred exactly as the FTR records them.

  Motivating record: `docs/cold_storage/architecture/pre-0.1.0b1/workflow_coordinator_claude_adapter_development_retrospective_2026-11-08.adoc`
  section 12-13 (commit `da5b942c861bc63d6337807502f73a94a9118a8d`), which found an
  external bind-mount inside WFC''s own bwrap namespace mechanically compatible with
  the module''s private `/tmp` tmpfs for plain subprocesses, but left nested execution
  of Claude''s own sandbox inside that same boundary entirely unqualified -- "the
  single largest unknown standing between the current experimental findings and a
  security-oriented beta-1 release."

  Prior implementation baseline: the external scratch bind-mount primitive (`WI-WFC-BUBBLEWRAP-EXTERNAL-SCRATCH-001`)
  was independently accepted at Development commit `49a3562f2d136a9ddd1742669b16297bf43c3122`
  (implementation `455c258c...`), promoted to no Runtime change (not required for
  this extension), and this investigation builds on that accepted primitive exactly
  as committed, without modifying it.

  Provider-role note: this Commission''s Attempt executes every role -- worker, independent
  reviewer, and any correction/rereview -- with the Codex CLI adapter only. No role
  may be executed with Claude or any other provider; this keeps the investigation''s
  own execution identity distinct from the Claude-adapter mechanism it is qualifying.
  Role bindings for `prepare` are `worker=codex_cli:gpt-5.6-terra:high`, `independent_reviewer=codex_cli:gpt-5.6-sol:high`,
  and the same bindings for `correction`/`rereview`; both model/reasoning combinations
  are verified present in the local Codex model catalog (`~/.codex/models_cache.json`)
  before this Intent is rendered.

  Hop-ceiling note: `max_autonomous_hops: 10` is set directly at the `repository-standard@v1`
  policy basis''s own ceiling (no override attempted or required), per the maintainer''s
  current standing guidance (`docs/self-development.adoc`, "Commission Hop budget")
  and this Commission''s own explicit instruction to provide a reasonable correction
  margin rather than artificially tighten the budget to the two Hops the happy path
  is expected to need.

  Baseline verified against Git immediately before writing this Intent: Development
  `HEAD` is `bf1a980d85a6db8088bb920b36fa946e5f3e927e` (the backlog-authorization
  commit above); the working tree is clean. Runtime (`workflow-coordinator-runtime`)
  `HEAD` is `464aefe3d3438bc66b110725de68def316238ffa`, detached, clean, unchanged
  by this Commission. Every `source_commit` below pins this Development HEAD or, where
  a referenced path was last touched earlier, the exact commit that last touched that
  path.

  Runtime-promotion note: this investigation produces a report and small, explicitly-scoped
  test fixtures only; it does not touch any file Runtime executes, so Runtime promotion
  is not a prerequisite and is not authorized by this Commission.'
