task:
  title: Verify uncommitted archive retry against trusted Run and OPS sources
  body: 'Correct only the proven BP5 integrity gap in the placed-but-not-yet-committed archive retry path. Current
    main includes formally completed RUN-1a90bf114e9044adb5363e2b8da8bf98, review cde9b59, Evidence e850325; BP5
    product acceptance remains withheld by ac75baa and docs/backlog/beta1_productization.adoc. Do not modify historical
    Run records or review artifacts.


    The existing retry validates attempt, source paths, and copied files against their own manifest, but an altered
    file accompanied by a matching altered manifest digest, or falsified manifest facts, can still be committed.
    Before committing an existing placed uncommitted archive, verify that the placed file list, contents/digests/sizes
    and source provenance, derived facts and semantic payload correspond to the current authoritative Run/OPS inputs
    and intended semantic data. Investigate reuse of `_manifest_candidate` and `_manifests_match_ignoring_archived_at`;
    ensure the comparison covers actual identity and per-file provenance fields as well as content, facts and semantic
    payload, allowing only legitimate `archived_at` differences. Respect existing safe relative-path, duplicate,
    symlink-escape and identity checks. On mismatch or inability to validate, fail closed before commit without
    overwriting, deleting or repairing the placed archive. Safe disposable comparison material must respect existing
    containment and cleanup protections. No new signature, attestation or snapshot infrastructure. The trusted inputs
    are those the existing WFC trust model treats as authoritative; defending against privileged actors controlling
    both sources and WFC authority is not in scope.


    Tests in isolated disposable repositories must reproduce before correction and establish after it: (1) copied
    archive bytes and their own recorded digest/size changed consistently -> refusal, unchanged HEAD and placed
    data; (2) forged manifest facts.run_id and other material facts/semantic mismatches -> refusal with unchanged
    data/HEAD; (3) genuinely unchanged placed archive, including ordinary archived_at variation -> exactly one scoped
    commit; an identical already-committed archive remains a no-op. Verify preservation of all existing refusals:
    symlink and destination escapes, unsafe/duplicate manifest paths, mismatched digests, identity/source mismatch,
    unauthorized Git paths/staging. Cover fresh authoritative source content/fact changes between initial placement
    and retry, partial/missing input and invalid provenance so the underlying invariant, not just the listed examples,
    is tested. Protect source and destination from unintended mutation, including any temporary comparison cleanup.
    No claims of universal concurrency or adversarial source-control protection. Preserve existing ported conformance
    assertions and legacy comparison. If an old synthetic hand-placed success fixture is inconsistent with actual
    authoritative sources, adapt it to model a genuine interruption, preserving the intent and coverage of that
    test; do not weaken refusals.


    Use actual current `_manifest_candidate`, manifest entry structure and comparator: assess whether per-file `source`
    is compared, not merely path/hash/size; document any genuine existing observable behavior impact and timestamps.
    No user-facing provider prompts, no actual Evidence repository modifications, no BP4/BP6 work. Tests and reviews
    use disposable Git repositories; full Coordinator task-check is mandatory. New files and exact CommitIntent
    leaves must be in scope; never name a directory; agent performs no Git writes. Commit subject must include WI-WFC-BETA1-BP5-RETRY-INTEGRITY-001
    and actual Hop ID as separate tokens. Do not claim product acceptance in worker changes; update current backlog
    and Epic only after independently accepted completion.


    Opus High independently reviews the implementation and tests against the underlying agreed retry-integrity invariant,
    not just three test names. New material violations of that same invariant are blocking; speculative new threat
    models or unrelated quality goals are not automatic scope. A reproduced explicit acceptance violation is blocking.
    Identify nonblocking observations in the review artifact and summary; do not create unauthorized residual Finding
    transitions (`finding_authority: [resolve]`). Follow robust correction/focused/fresh broad review when needed.

    '
  acceptance: An uncommitted placed archive is committed only if its safely validated files, provenance, identity,
    facts and semantic payload match a newly derived manifest from authoritative current Run/OPS sources, ignoring
    only legitimate archived_at difference; altered file plus altered self-digest, falsified facts/semantic/source/identity,
    invalid paths or mismatched authoritative sources refuse without commit or loss of placed data; intact retry
    yields exactly one scoped commit, existing committed no-op remains unchanged; all existing safety and conformance
    regressions and full Coordinator task-check pass; independent review finds no blocking violations.
  withheld_authority: No general Git authority, reducer, provider, Runtime, workflow orchestration or program changes;
    no attestation/signature/snapshot infrastructure, threat-model expansion, unrelated hardening, test weakening,
    changes to historical Run Evidence, actual Evidence repository mutation, BP4a, extra Commission, Runtime promotion,
    push, merge or rebase.
  escalation_default: Escalate genuine need for new authority or design outside the already agreed retry integrity
    invariant; do not escalate ordinary implementation choices.
