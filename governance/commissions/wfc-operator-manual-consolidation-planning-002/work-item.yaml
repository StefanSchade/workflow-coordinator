authority_source: 'Maintainer instruction of 2026-11-11: commission one new planning
  Run that analyses the scattered WFC operator documentation and records an ordered,
  coherent series of FTRs in the backlog as the factual basis for later, separately
  authorized documentation-migration Commissions, with worker codex_cli:gpt-6.1-terra:high
  and independent_reviewer codex_cli:gpt-6.1-sol:high. The two earlier Operator Manual
  Commissions (wfc-operator-manual-consolidation-001, Run RUN-deb3a4f3765346c6ae247488c5efddae,
  and wfc-operator-manual-structure-migration-002, Run RUN-278851ab5c704354a1c4f089d27cd8cd)
  both stopped awaiting_human after one Hop without a change; their cause, the Worker-Hop
  product boundary, is recorded in docs/backlog/FTR-WFC-PROGRESSIVE-WORKER-EXECUTION.adoc.
  The maintainer authorizes exactly one robust@v1 Run of this Commission including
  its regular review and correction Hops. This Commission authorizes planning records
  only: no migration of any operator documentation, no later implementation Commission,
  no push, no Runtime promotion, no successor Run and no archiving before the maintainer
  has inspected the result.'
