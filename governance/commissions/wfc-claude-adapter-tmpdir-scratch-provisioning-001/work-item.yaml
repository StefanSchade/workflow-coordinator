work_item_id: WI-WFC-CLAUDE-ADAPTER-TMPDIR-SCRATCH-PROVISIONING-001
authority_source: 'Maintainer directly authorizes, by explicit 2026-11-09 interactive
  instruction given outside ordinary WFC execution, Commission authoring, commit,
  `commission check`, deterministic `wfc-op prepare`, and -- if every ordinary technical
  and semantic check passes -- one `wfc-op launch` of a single new Attempt of this
  Commission, including real provider execution. No automatic second Attempt or second
  Commission is authorized if preparation, provider execution, scope checking, or
  review fails; the maintainer-operator documents the actual outcome instead.

  Controlling record: `docs/backlog/BUG-WFC-CLAUDE-ADAPTER-SHORT-TMPDIR-RESOURCE-EXHAUSTION.adoc`
  (status: open; correction commissioned as this WorkItem). That record''s "Why it
  happened", "Required product behavior", "Follow-up live qualification (2026-11-07)",
  and "Second follow-up: short symlink to external scratch (2026-11-08)" sections
  are the controlling specification and evidentiary basis for this Commission''s task;
  this Commission does not restate their narrative, only their requirements.

  Baseline verified against Git immediately before writing this Intent: Development
  `HEAD` is `937d2058da6bb55241a0954976ec84d8177004c9`, working tree clean. Runtime
  (`workflow-coordinator-runtime`) `HEAD` is `464aefe3d3438bc66b110725de68def316238ffa`,
  detached, push disabled (`remote.origin.pushurl=DISABLED`), clean. Evidence (`workflow-coordinator-run-evidence`)
  `HEAD` is `43f38b37fd8ff1ba0f28743b8b36ec00cf0742ad`, clean. Every `source_commit`
  below pins this Development HEAD or an exact prior commit that last touched the
  referenced path, per established Commission-authoring practice.

  Established evidence, not to be re-investigated: the two live-qualification rounds
  recorded in the controlling record''s 2026-11-07 and 2026-11-08 sections (commits
  `d31d82c` and `bc0978e` among others) confirm, against the real, unmodified `ClaudeCliAdapter.execute()`
  and a real Claude CLI (`2.1.270`), that (a) a short `/tmp`-rooted symlink pointing
  at a dedicated external scratch subpath, combined with a scoped `sandbox.filesystem.allowRead`/`allowWrite`
  grant naming the real target (never the symlink), lets Claude Code''s own `AF_UNIX`
  session sockets and agent-launched `touch`/`mkdir`/ordinary-tool file operations
  succeed and physically land in the real external target, because the sandbox''s
  socket- path construction does not canonicalize `TMPDIR` before `bind()`; (b) an
  earlier apparent "TMPDIR-specific denial" and "session-wide cascade" are retracted,
  not merely downgraded -- a plain non-`TMPDIR` repository write was also denied in
  the same control round, isolating the actual confound to an `; echo "EXIT=$?"` idiom
  in the probe commands themselves, unrelated to `TMPDIR`, the symlink, or the sandbox
  grant; (c) a separate, narrower, unrelated observation -- an inline `python3 -c
  "<script performing file I/O>"` invocation was still denied while `python3 --version`
  succeeded -- does not refute or block the symlink direction and is explicitly out
  of scope for this Commission; it was never shown to depend on `TMPDIR`, the symlink,
  or the sandbox grant, and needs its own separate, not-yet-bounded investigation
  if ever pursued. Do not reopen any of (a)-(c) as an unresolved question; treat them
  as given.

  Available, already-generic mechanism to investigate and build on, not to be treated
  as a new design: `scripts/wfc_op.py`''s `prepare` command already establishes, for
  every WFC-operated repository (not a self-development- specific mechanism), a per-Attempt,
  large-filesystem, mode-0700 scratch directory (`create_attempt_scratch`, default
  root `$HOME/wfc-scratch`, overridable via `--scratch-root`, validated distinct from
  every repository/ OPS/STATE root) and exports it as the ambient `TMPDIR`/`TMP`/`TEMP`
  for the whole `launch.sh` process tree (`_scratch_environment`, `scripts/wfc_op.py:256-257,781-787`)
  -- the same large-filesystem relocation FD-08 (`WI-WFC-FD08-ATTEMPT-SCRATCH-001`)
  already performed for the Harness''s own `TMPDIR`. `ClaudeCliAdapter.execute()`
  today discards this ambient value unconditionally (`claude_adapter.py:149-150,166`,
  `_SHORT_TMP_ROOT = Path("/tmp")`) rather than reading it as the large- capacity
  target the short symlink should point beneath. Confirm this by reading the actual
  current code before relying on it as a design input; it is offered as a promising,
  already-portable, non-self-development-specific starting point, not a mandated final
  shape -- the worker may choose a technically better concrete design as long as it
  satisfies the "Required product behavior" and "Portability" sections of the controlling
  record and does not invent a new sandbox architecture.

  Known hazard, applies to this Commission''s own Hops: `docs/backlog/BUG-WFC-COMMIT-INTENT-DIRECTORY-PATH-RECONCILIATION.adoc`
  documents that `trusted_commit()` reconciles `CommitIntent.paths` by literal string
  equality against Git''s own leaf-file-only changed-path report, so any directory-shaped
  `CommitIntent.paths` entry with real content beneath it deterministically fails
  as `unexpected dirty path` / `commit intent path has no worktree mutation`, stopping
  the Run `awaiting_human` before independent review is ever reached. That BUG remains
  open and uncorrected; this Commission does not fix it. Every `CommitIntent.paths`
  entry produced by any Hop under this Commission must instead name only concrete,
  individually mutated leaf file paths -- never a directory or scope-prefix stand-in
  for the files beneath it, even though `scope`/`authorized_scope` itself does accept
  directory-shaped entries (a different, prefix-matching mechanism). This Commission''s
  own `scope` below is deliberately kept to exact leaf files, which also makes compliance
  with this constraint unambiguous.

  Out of scope by explicit 2026-11-09 maintainer product decision (restated here,
  not re-litigated): no additional provider-credential isolation; no credential broker;
  no integration of the whole Claude CLI into an outer Bubblewrap boundary as part
  of this Commission; no nested-Bubblewrap experiments; no change to internet/network
  policy; no change to workflow semantics, Result Contracts, or Trusted Commit; no
  change to `codex_adapter.py` unless the worker finds and records, in the broad-review
  durable artifact, a concrete, evidenced, necessary shared-interface requirement
  -- the default expectation is zero changes there, and this Commission''s own `scope`
  does not authorize editing it regardless.

  Execution-binding note (not part of this Commission''s authorized content; recorded
  here for traceability ahead of the separate `prepare` step this same maintainer
  instruction also authorizes): worker bound to `claude_cli:claude-sonnet-5` at `high`
  reasoning effort, independent reviewer bound to `claude_cli:claude-opus-5` at `high`
  reasoning effort. Verified immediately before writing this Intent: `/usr/local/bin/claude
  --version` reports `2.1.270 (Claude Code)`; `claude -p --help` documents `--model
  <model>` accepting "a model''s full name (e.g. ''claude-fable-5'')" and `--effort
  <level>` accepting `low|medium|high|xhigh|max`, consistent with the `<family>-<generation>`
  naming `claude-sonnet-5`/`claude-opus-5` already use; both bindings were already
  dispatched successfully in prior accepted Runs under this same promoted Runtime
  (`WI-WFC-CLAUDE-ADAPTER-ENVIRONMENT-ALLOWLIST-001`, `WI-WFC-EVIDENCE-FAILURE-DIAGNOSTICS-001`).
  No model name or CLI argument is invented here beyond what this verification and
  that prior precedent establish. `codex_cli` is not designated as a fallback for
  this Commission; if the Claude CLI binding proves unreliable during preparation
  or launch, the maintainer-operator stops and reports rather than silently substituting
  a different binding.

  Hop-ceiling note: `max_autonomous_hops: 10` uses the full `repository-standard@v1`
  policy-basis ceiling, consistent with `docs/self-development.adoc`''s "Commission
  Hop budget" guidance to prefer a generous provisional ceiling over a happy-path
  estimate.'
