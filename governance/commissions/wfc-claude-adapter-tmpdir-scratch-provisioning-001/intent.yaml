  independent_reviewer: "Adversarial reviewer of resource-isolation and cleanup correctness: verifying genuine host-portability, concurrency safety including stale-leftover handling, an exactly-scoped sandbox grant, and reliable symlink-plus-target cleanup across every outcome, with no scope creep into credential isolation, network policy, or the Codex adapter."

