authority_source: 'This is a separately authorized SUCCESSOR Commission to predecessor
  `WI-WFC-CLAUDE-CODE-ADAPTER-DESIGN-001` (Run `RUN-b0ce81b7489e4ef197690d0c25e1c282`),
  not a resume, retry, or replay of that Run. The predecessor stopped `awaiting_human_budget`
  (hop budget exhausted, not accepted) at its final committed Development HEAD `f4879bf623883059fdb617a70ddfcf8a25c4cd2c`
  ("docs: record Claude outcome assumption (WI-WFC-CLAUDE-CODE-ADAPTER-DESIGN-001
  H008)"), which is also this successor''s pinned source baseline: no predecessor
  work was dirty, uncommitted, or salvaged, so none of `docs/warm_storage/runbooks/successor_continuation_runbook_2026-10-10.adoc`''s
  CandidateSnapshot/salvage machinery applies here -- only its successor-Commission
  authoring guidance (its Step 7 and Core Invariant 3.1) does.

  Predecessor Current-Run Finding `F001` (the H002 broad-review blocking defect, disposed
  resolved by the H003 correction and reconfirmed through H004-H008) is resolved and
  is not reopened by this Commission. Predecessor Current-Run Finding `F002` (opened
  at H005/H006 on qualification feasibility, narrowed by the H007 correction, and
  left open by the H008 independent focused rereview, `docs/warm_storage/concepts/workflow_coordinator_claude_code_adapter_design_2026-11-01_focused_review.adoc`
  section 3.1, commit `f4879bf623883059fdb617a70ddfcf8a25c4cd2c`) remains open with
  exactly one bounded textual correction remaining, as that same H008 artifact''s
  section 3.1.3 ("Required correction") states. `F001` and `F002` are predecessor
  Run-local Finding identities; per the successor-continuation runbook''s Finding-locality
  rule, this successor Commission does not treat either label as a transferable identity
  of this new Run. Its own independent reviewer opens and disposes any Finding under
  its own fresh Run-local numbering, informed by -- but not bound to reuse -- the
  predecessor''s labels.

  The maintainer directly authorizes, by explicit 2026-11-01 interactive instruction
  given outside ordinary WFC execution, this narrow closure Commission under the existing
  `robust@v1` programme: the Worker corrects the one remaining unsupported assertion
  identified by the predecessor''s H008 review in the existing main design document,
  and a fresh independent reviewer verifies that predecessor F001 and F002 are substantively
  closed in the resulting design and that the design still satisfies the predecessor''s
  original acceptance mandate (`governance/commissions/wfc-claude-code-adapter-design-001/intent.yaml`''s
  `task.acceptance`). This authorizes documentation/design correction and its independent
  review only: no production-code, test, governance, schema, or kernel change; no
  Runtime promotion or Evidence mutation; no provider invocation of any kind; and
  no automatic authorization of a subsequent implementation WorkItem. As with the
  predecessor, `docs/backlog/_open.adoc`''s "Claude Code adapter / provider neutrality"
  NEXT row still states "No Commission is authorized by this row"; the authorizing
  act is this direct maintainer instruction, not that row, and this Commission does
  not claim the row as its authority.'
