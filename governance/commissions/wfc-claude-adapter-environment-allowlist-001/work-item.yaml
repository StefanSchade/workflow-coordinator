work_item_id: WI-WFC-CLAUDE-ADAPTER-ENVIRONMENT-ALLOWLIST-001
authority_source: 'Operator-session maintainer authorization (direct chat instruction)
  to author, commit, and preflight-check one bounded `robust@v1` correction Commission
  correcting `ClaudeCliAdapter`''s child-environment construction; `launch` itself
  remains separately withheld pending the maintainer''s explicit review of this rendered
  Commission''s scope and Hop budget. This authorization covers Commission authoring
  and deterministic `commission render`/`commission check` mechanics only; it is not
  authorization to `prepare` or `launch`, to implement the repair directly outside
  a WFC-dispatched Hop, to perform a nested authenticated Claude or Codex invocation,
  to change any governance limit, to promote Runtime, or to push.

  Baseline verified against Git immediately before writing this Intent: Development
  `HEAD` is `affc5799a6c2b2b4c0d5dcfd32ecc87e9a185fd6` ("docs(backlog): record execution-integration
  debt from bubblewrap/Claude CLI work"); the working tree is clean. Runtime (`workflow-coordinator-runtime`)
  `HEAD` is `7a5b736f3f56a95d5f0fc3f1975ca678efe3f9bb`, detached, clean. Evidence
  (`workflow-coordinator-run-evidence`) `HEAD` is `a28ccbd24ea8f30b5b547109ac1cb74354ca6a9f`,
  clean. Every `source_commit` below pins this Development HEAD.

  `WI-WFC-CLAUDE-ADAPTER-WRITE-PERMISSIONS-004` already corrected the write-tool denial
  recorded in `docs/backlog/BUG-WFC-CLAUDE-ADAPTER-WRITE-PERMISSION-MISMATCH.adoc`
  by adding `Write` to `permissions.allow`, while explicitly leaving `CLAUDE_CODE_SUBPROCESS_ENV_SCRUB=1`
  in place pending "an evidenced mechanism justification recorded in the durable review
  artifact" (that record''s own Security invariant section). `docs/backlog/FTR-WFC-SELF-DEVELOPMENT-EXECUTION-INTEGRATION-DEBT.adoc`
  §2 separately records, as an open evaluation question, correction-003''s distinct
  Bash-tool denial ("no approval surface ... denied automatically") under a `claude-closed-settings.json`
  byte-identical to correction-002''s.

  That evidenced justification now exists. An operator-session maintainer-run controlled
  A/B experiment (this session, outside any WFC Run, against a disposable throwaway
  Git repository, reusing the adapter''s own unmodified `argv()`/`_settings()`/`_short_subprocess_tmp_dir()`
  helpers with only the child-environment construction swapped to an explicit allowlist)
  reproduced correction-003''s exact failure twice over two real Claude CLI invocations:
  with `CLAUDE_CODE_SUBPROCESS_ENV_SCRUB=1` present, the CLI itself emitted "Permission
  mode forced to default -- CLAUDE_CODE_SUBPROCESS_ENV_SCRUB is set" and denied a
  previously-authorized Bash command with "no approval surface ... denied automatically"
  (independently confirmed: the command''s marker file was not created); with the
  identical allowlist and the variable omitted entirely, the same command succeeded
  (independently confirmed: the marker file existed with the expected content). This
  is now dynamic, reproducing evidence for the write-permission-mismatch record''s
  first suspected mechanism, supplementing its prior purely static source-inspection
  support.

  The maintainer separately corrected the scope of the intended fix beyond mere removal
  of the scrub line: `ClaudeCliAdapter.execute` currently builds the child environment
  as `{**os.environ, ...}`, which would keep inheriting the orchestrating process''s
  own `CLAUDE_CODE_*` session variables (and, unless the scrub line itself is removed
  with nothing replacing its effect, possibly other ambient variables) regardless
  of the scrub line''s removal. The corrected scope is: an explicit environment allowlist
  replacing `**os.environ`; no default `CLAUDE_CODE_SUBPROCESS_ENV_SCRUB=1`; a narrow,
  non-framework operator configuration point for additional variable names, usable
  without a new WFC release; the existing short-TMPDIR fix unchanged; deterministic
  tests for the effective constructed environment and for non-inheritance of Claude-session
  variables; and one targeted opt-in live regression test of the now-confirmed Bash
  functionality. A real WFC Hop under the corrected, promoted Runtime as integration
  proof is intended as a separate subsequent maintainer step after this Commission''s
  own acceptance and any Runtime promotion decision -- it is not part of this Commission''s
  own Hops and is not authorized by this Intent.'
