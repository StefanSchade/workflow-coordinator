authority_source: Maintainer authorizes exactly one fresh robust@v1 BP6c successor Run (after stopped RUN-6f9aeb02e304477092fc55a9214710de, Evidence 75acb72; decision on the Attempt identity given 2026-11-20) (archive, audit and consolidated report as a post-classification step of `wfc run`/`wfc resume`) on the accepted BP4a/BP4b/BP5/BP6a/BP6b products, up to ten Hops; no Runtime promotion, no push.
program:
  id: robust
  revision: v1
  source_commit: 8b5b7c6320cc67860146aceb16955c893d9f6e74
task:
  title: Wire archive, audit projection and report into the installed lifecycle after classification
  body: |
    Implement BP6c: after `wfc run`/`wfc resume` has recorded `classified` (and run the pending BP4b preservation step), archive the Attempt into the configured Evidence repository with the configured raw retention, project `audit.json`, and print the consolidated report. Governing text: BP6 in docs/backlog/beta1_execution_plan.adoc and docs/backlog/beta1_productization.adoc (including the 2026-11-20 package-boundary paragraphs), the second-pass review sections `Lifecycle` (exit codes, resume table), `Commit ownership, idempotency and integrity`, `contract-report`; read the BP4a, BP4b, BP5, BP6a and BP6b limitations records and review artifacts and the code of frontdoor/lifecycle.py, journal.py, preservation.py, archive.py, audit.py, report.py, config.py first. The accepted BP4a/BP4b products are FROZEN: their records, classifications, exit codes, transitions and preservation behavior do not change.

    SUCCESSOR CONTEXT. A first BP6c Run (`RUN-6f9aeb02e304477092fc55a9214710de`, `awaiting_human`, Evidence `75acb72`) delivered a near-complete uncommitted candidate in one Hop and stopped on a Scope question: the engine state root of every Run is `<checkout_dir>/engine-state`, and `archive.derive_attempt_id` takes the Attempt identity from the state-root basename, so EVERY Run of a consumer archives to the same destination `.../engine-state`; only the first would ever succeed. The maintainer decided (Option 1): the Attempt identity is derived stably from the RUN identity, never from the state-root directory name. That candidate is preserved as a NON-AUTHORITATIVE salvage: the commit `07ac5324dc4316de945c75b27a8123a966661ab5` (ref `refs/wfc/preserved/bp6c-h001`, parent = the baseline HEAD). It is read-only starting material, not a trusted predecessor: inspect it with `git diff HEAD 07ac532 --stat` and `git show 07ac532:<path>`, take over what is correct, and own and re-verify every line yourself; it carries no review, test or acceptance credit.

    Identity decision, binding: (a) the product lifecycle passes an explicit Attempt identity to the archive, derived from the Consumer Config repository name and the Run id (suggested shape `<repository_name>-<run_id>`, lower-cased, restricted to a safe character set, validated, deterministic, stable across `resume` and repeated archiving); (b) `archive_run` gains an additive explicit-attempt-identity parameter used only by the product path; with `raw_retention=None` and without that parameter, today's `derive_attempt_id` behavior and bytes stay exactly as they are (Self-Development and all BP5 tests unchanged); the cross-source agreement checks of the archive stay in force (record the identity consistently in the manifest facts and in `audit.json`); (c) the BP4a `engine-state` naming and the BP4a/BP4b frozen surfaces are NOT changed; (d) the frozen BP4a/BP4b lifecycle, crash-matrix and preservation test files that call `wfc init` without an isolated Evidence repository are adapted ONLY to pass an isolated `--evidence-repository` (test isolation, no weakened assertion; every pinned exit code stays pinned), in addition to the new tests. Required regression test: TWO different Runs of the same consumer (same repository name, the same shared default Evidence repository, distinct Run ids) both archive without collision, each exactly once, each in its own destination with its own audit.json, and a repeated `run`/`resume` of either is a no-op (idempotent, no second commit); also cover resume after a crash between archive commit and result record keeping the same identity.

    Decisions already made (do not reopen): the Evidence repository is a configurable archive destination, never an engine state root; the STATE root stays where the engine wrote it and is only READ by the archive; `evidence.raw` is `local` (default) | `commit` | `discard`; nothing is ever pushed; Level-1 style intervention inside a live Run is not part of the design; the lifecycle controller adds steps AFTER the engine ended and never reinterprets the engine outcome.

    Deliver:
    1. New `frontdoor/postrun.py` and minimal additive hook calls in lifecycle.py: after `classified` and after `run_pending_preservation`, `run`/`resume` execute ONE pending post-run step per checkout, idempotent and crash-safe: (a) read the Consumer Config from the checkout's cached authorized materials; resolve the Evidence settings with `config.resolve_evidence`; (b) for classifications that have engine state (completed, awaiting_human, awaiting_human_budget, reconcile_required, stopped, interrupted) archive from the engine state root with `archive.archive_run(..., raw_retention=settings.raw)`; never for `engine_exited_before_state` (no state) or for non-terminal/refusal classifications; (c) when the Evidence repository does not exist, record `ext.archive.skipped{reason: "evidence_repository_absent"}` and print a loud `ARCHIVE SKIPPED` line naming the configured location and `wfc init`; this is NOT a failure and does not change the exit code; (d) project the audit with the lifecycle facts supplied: the BP4a classification and the latest BP4b `ext.preservation.*` fact (result | refused with reason code | not_needed), then print the consolidated report (text) built from the audit; (e) a second `run`/`resume` after success is a no-op (no second archive commit, no second report side effect other than the read-only print).
    2. Journal records, all opaque `ext.*` per the BP4a contract and ignored by BP4a decisions: `ext.archive.intent` before the archive effect, `ext.archive.result{outcome, commit, destination_relative, retention}` , `ext.archive.refused{reason_code}`, `ext.archive.skipped{reason}`; a crash between archive commit and result record is resolved by the archive's own idempotent no-op detection (no second commit). No free-text provider prose or absolute path in any record.
    3. Exit codes: BP4a EXIT_CODES values are unchanged and still returned for every outcome in which the post-run step succeeded or was skipped. Additive new codes only: `archive_failed` (a refusal or failure of the archive/audit step: the engine outcome stands, the classification is unchanged and printed, `wfc resume` retries the step) with a documented unused code number; the step never converts a stopped Run into a success or a completed Run into a failure of the engine outcome.
    4. `wfc status` stays strictly read-only and reports the latest `ext.archive.*` facts next to the preservation facts; `wfc run`/`resume` never modify the STATE root, OPS or scratch.
    5. Privacy false-refusal fix (from a BP6b review observation): the audit privacy guard's known-private-string matching must not refuse because a SHORT OS user name (for example `ci` or `ops`) occurs as a substring of an unrelated allowed value. Match the user name only as a whole path component or whole token; the home directory, state, ops and scratch paths keep substring matching. Keep a mutation-sensitive test that a real leak of the user name as a path component is still refused. Minimal change in audit.py/archive.py only for this.
    6. Developer-facing limitations record: what the post-run step does and does not prove, that the Evidence destination is not a state root, that raw `local` files are not backed up by Git, no push, `ARCHIVE SKIPPED` semantics, retry via `wfc resume`, and that BP7 (cutover and the self-development Evidence configuration) is not part of this package.

    Hard rules: no engine change; no change to the BP4a/BP4b behavior, records, classifications or exit-code values; no change to git_facts.py, preservation.py's capture logic, journal record formats (only new opaque ext.* kinds), reducer, Finding, review, routing, adapter or admission; no change to the audit schema/field list or the archive retention semantics beyond item 5; no repository-local destination; no push, remote, network or pip; Python 3.10-3.13 stdlib plus existing PyYAML; kernel modules never import frontdoor; no operator-manual or backlog edits; no `.wfc/config.yaml` for this repository (BP7). CommitIntent: name every changed/new/deleted leaf individually, never directories; avoid rename-shaped changes. Deliver ONE complete candidate in the first Worker Hop; subject must contain WI-WFC-BETA1-BP6C-LIFECYCLE-ARCHIVE-WIRING-002 and the actual Hop ID. No Git writes by the agent. A Worker NEVER reports a Finding operation (`resolve` or any delta that closes a Finding): only the independent reviewer opens and resolves Findings; a correction Hop reports what it changed and nothing else about Finding state.

    Edge-case rule for Worker and reviewer: for security-flavoured edge cases, apply the principle once at every boundary the acceptance list names (paths and strings in ext.* records, config values, Git output) instead of one instance at a time; a further exotic instance outside the acceptance list is a non-blocking observation, not a Finding.

    Reviewer (fresh, adversarial): evaluate the ENTIRE product against the baseline and this task. Verify that the BP4a/BP4b frozen surfaces are unchanged (diff), every acceptance case with a mutation-sensitive test, idempotency and crash resume of the post-run step (crash after archive commit before the result record; crash before the archive), that a stopped/interrupted Run is archived and reported truthfully and never shown as success, that exit codes of the engine outcome are unchanged, read-only `wfc status`, no STATE/OPS/scratch mutation, and the privacy false-refusal fix without weakening the real-leak refusal. Blocking = a reproduced violation of an explicit acceptance case, of the frozen contract, of the privacy/retention property, or a crash on a plausible input; other exotic inputs are non-blocking observations. `finding_authority: [resolve]` does not authorize residual transitions: report non-blocking observations only in the review artifact and summary. Coordinator full task-check is mandatory.
  acceptance: |
    Each case has a mutation-sensitive test: (1) completed Run: archived once with the configured retention, audit.json in the same single commit, report printed, exit code 0 as before; (2) stopped (awaiting_human, awaiting_human_budget, reconcile_required, stopped) and interrupted Runs: archived and reported with their own classification and unchanged BP4a exit code, never as success; (3) `engine_exited_before_state` and non-terminal classifications: no archive; (4) Evidence repository absent: `ext.archive.skipped`, loud ARCHIVE SKIPPED line, exit code unchanged, nothing created; (5) archive/audit failure or privacy-guard refusal: `ext.archive.refused`, additive `archive_failed` exit code, engine classification unchanged, `wfc resume` retries and succeeds once the cause is removed; (6) idempotency: a second run/resume produces no second commit; crash after commit before result record and crash before the archive both resume correctly; (7) the audit carries the BP4a classification and the BP4b preservation fact (result, refused, not_needed); (8) `wfc status` read-only and reports the archive facts; STATE root, OPS and scratch byte-identical before/after the post-run step; (9) all three retention modes through the lifecycle (git ls-files per mode); (10) ext.* archive records contain no absolute path or provider prose; (11) short user-name substring no longer causes a false refusal, a real user-name path-component leak is still refused; (12) BP4a/BP4b/BP5/BP6a/BP6b tests, the architecture import-direction guard and the existing suite pass unchanged; (13a) two Runs of one consumer in one shared Evidence repository archive without collision, each once, idempotent on repeat/resume, identity derived from the Run identity and never from the state-root directory name; (13) BP4a exit-code values and the `classified` record fields unchanged; (14) a BP6c limitations record states the semantics and limits. Independent review with no blocking Findings; Coordinator full task-check passes; completed Run.
  withheld_authority: No change to BP4a/BP4b behavior, records, classifications or exit-code values, no engine change, no change to git_facts.py, the audit schema, archive retention semantics (except item 5), reducer, Finding, review, routing, adapter or admission, no repository-local destination, no push or remote, no `.wfc/config.yaml` for this repository, no operator-manual or backlog edits, no test weakening, no historical Run or Evidence edit, no extra Commission, Runtime promotion, push, merge or rebase.
  escalation_default: Escalate a genuine need for new authority or design, any conflict with the frozen BP4a/BP4b contract or the recorded decisions, any need to change the audit schema, or inability to meet the matrix without changing engine or lifecycle classification behavior.
