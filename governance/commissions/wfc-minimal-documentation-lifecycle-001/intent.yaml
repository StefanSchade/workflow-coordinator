task:
  title: Simplify documentation and backlog lifecycle
  body: 'Deliver a complete, small and practical candidate in H001. Investigate current docs/ai_info/doc_conventions.adoc,
    docs/README.adoc, docs/backlog/README.adoc and docs/backlog/_open.adoc, the current Operator Manual and old compatibility
    shims, the recent backlog consolidation and independent review, and relevant previous documentation decisions. Distinguish
    current requirements and history; do not rewrite accepted historical Commissions, reviews or Git history.


    Critically assess actual utility of Maturity::, Authority::, Owns::, Updated:: and supersession attributes. Simplify as
    far as practical: not every document needs identical headers and no redundant central-index and document metadata maintenance
    without concrete need. Keep a clear distinction between binding current contracts, explanatory documentation, open concepts
    and historical sources with minimal mechanism. Delete obsolete/redundant rule text instead of appending another layer.
    Overall text should be simpler and as short as practicable. Retain practical AsciiDoc and navigation guidance and preserve
    existing links and anchors where applicable.


    Define a minimal actionable lifecycle with responsible actor and trigger, without new approval roles, state machines or
    forms: the implementer updates affected canonical documents in the same WorkItem when documented behavior changes, within
    authorized scope; operating/usage changes particularly affect Operator Manual; no artificial doc work when no documentation
    impact; if a necessary doc update is outside scope make the specific follow-up visible without unauthorized scope expansion.
    Update controlling BUG/FTR at actual implementation, independent acceptance and product closure milestones; do not conflate
    them or imply acceptance/closure automatically. _open.adoc remains sole current priority and work overview. Respect authority
    and actual WorkItem scope: no requirement for agent to edit an out-of-scope record or override configured Coordinator/review
    rules; make concrete follow-up visible to responsible maintainer when scope prevents it.


    Replace implied indefinite retention of old documentation paths with need-based rule: retain an old path only if a current
    technical consumer needs it; historical Git references alone insufficient. A shim may be removed once content is canonically
    available, current references are updated and no current functional consumer demonstrably depends on it. Historical Commissions
    and accepted reviews untouched. Investigate docs/wfc_operator_manual.adoc specifically, inventory current links and code/tests/scripts/build
    references and classify historical references separately. Assess concrete old top-level documentation candidates for later
    cleanup, conditions and remaining current references; do not assert absence without evidence. No legacy file removal in
    this task. Include this factual assessment in the review artifact for final reporting rather than creating a new tracker.


    Modify only docs/ai_info/doc_conventions.adoc, docs/README.adoc and docs/backlog/README.adoc as necessary. No new governance
    file, tracker, mass update of 48 BUG/FTR records, source code, Runtime, Evidence, historic sources or functional model
    changes. Review artifacts belong only to their review phases. Worker and Reviewer must not perform mutating Git operations;
    Coordinator owns trusted publication. CommitIntent lists exactly all actual changed repository-relative leaves and subject
    is one Conventional Commit line containing WI-WFC-MINIMAL-DOCUMENTATION-LIFECYCLE-001 and actual Hop ID as separate tokens.
    A blocked result carries no CommitIntent.


    Validate standalone/appropriate assembled AsciiDoc rendering, links and fragments affected by edits, actual reference
    dependencies and git diff --check; identify any unalterable references and preserve link targets. Independent H002 broad
    review checks all sources and the complete candidate, especially: sufficient practical upkeep, consistent responsibilities/status
    terms, concrete benefit for each remaining obligation, real removal of redundant rules, no new implicit approval barriers,
    size and usability, scope and factual shim audit. Material findings block acceptance; use correction hops only for relevant
    findings and configured focused/fresh broad review. Completion requires Coordinator trusted task-check and independent
    acceptance. Report rules removed, triggers, implementation versus acceptance versus closure, shim conditions and concrete
    old top-level candidates and remaining dependencies. No second Commission, Run, push or automatic follow-on.'
  acceptance: Three existing documentation surfaces form a coherent, materially simpler practical lifecycle; scope and history
    remain intact, actual shim dependencies and later candidates assessed, links and AsciiDoc rendering pass. Coordinator
    trusted task-check and independent fresh broad review accept without open blocking findings.
  withheld_authority: No legacy deletions, new BUG/FTR, mass record edits, new governance other than Commission, source, tests,
    scripts, Runtime, Evidence, historical Commissions/reviews, functional model, push, agent Git writes, extra Commission
    or Run. Review artifacts are phase-reserved.
  escalation_default: Escalate only a concrete authority obstacle or unresolved contradiction; continue authorized work otherwise.
