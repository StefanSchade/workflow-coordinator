schema_version: 3
policy_id: repository-standard
revision: v1
scope:
- workflow-coordinator
governance_paths:
- governance
work_item_scope_ceiling:
- src/workflow_coordinator
- tests
- docs/operator_manual
- docs/technical_model
- docs/backlog/BUG-WFC-SEC-03-GIT-SCOPE-COMMIT-AUTHORITY.adoc
