authority_source: 'Maintainer directly authorizes, by explicit 2026-11-07 interactive
  instruction given outside ordinary WFC execution, Commission authoring, rendering,
  committing, and `commission check` of the bounded correction recorded in `docs/backlog/BUG-WFC-EVIDENCE-FAILURE-DIAGNOSTICS.adoc`.
  That instruction authorizes authoring and committing this Commission only; preparation
  and launch of the resulting Attempt remain a separate, explicit maintainer decision
  not made by this Commission.

  Controlling record: `docs/backlog/BUG-WFC-EVIDENCE-FAILURE-DIAGNOSTICS.adoc` (status:
  open; correction commissioned as this WorkItem). That record''s own "Desired direction
  (commissioned)" and "Non-scope" sections are the controlling specification for this
  Commission''s task; this Commission does not restate their rationale, only their
  requirements.

  Discovery context (background, not itself authorizing anything beyond the BUG record
  above): Run `RUN-b435ab0c7e394eb5912330c38b5eca5b`, `WI-WFC-CLAUDE-ADAPTER-ENVIRONMENT-ALLOWLIST-001`,
  exhausted its 10-Hop budget despite five independent reviews finding no blocking
  implementation defect; its five `task-check` trusted evidence observations (Hops
  H002/H004/H006/H008/H010) each persisted identical exit classification and byte-count
  but five different content digests, with no durable way to localize the difference.
  Preserved in `workflow-coordinator-run-evidence`''s `project_memory/run_ledger.adoc:1743-1764`
  (a sibling repository this Run and its agents cannot read; no Hop executed under
  this Commission may cite that ledger directly -- only the facts the BUG record above
  and this Commission''s own task text restate).

  Separately decided by the maintainer and not reopened by this Commission: the distinct
  correction-cycling-with-idle-worker observation from the same Run; the Claude adapter
  environment-allowlist Runtime promotion (decided and executed outside this Commission);
  and any change to `scripts/archive_run.py` or any other file in the sibling `workflow-coordinator-run-evidence`
  repository, which lies outside this repository''s self-development scope entirely.

  Hop-ceiling note: `max_autonomous_hops: 10` uses the `repository-standard@v1` policy
  basis''s own ceiling (no override attempted or required), consistent with the maintainer''s
  standing guidance (`docs/self-development.adoc`, "Commission Hop budget") to prefer
  a generous provisional ceiling over a happy-path estimate.

  Execution-binding note (not part of this Commission''s authorized content; recorded
  here only for traceability ahead of a later, separate Run preparation step): the
  maintainer''s stated preference for the eventual Attempt is worker bound to `claude_cli:claude-sonnet-5`
  at `high` reasoning effort and independent reviewer bound to `claude_cli:claude-opus-5`
  at `high` reasoning effort, both qualified by a 2026-11-07 live run against this
  repository''s current Development HEAD (two existing opt-in live smoke tests, plus
  a minimal live probe of each role''s exact model/reasoning-effort pair) following
  the promotion of `WI-WFC-CLAUDE-ADAPTER-ENVIRONMENT-ALLOWLIST-001`''s sole implementation
  commit to Runtime. `codex_cli` remains an available fallback execution binding,
  to be used only if the Claude CLI binding proves unreliable during actual preparation/launch.
  None of this binds any Hop executed under this Commission; it governs only the not-yet-taken
  preparation step.'
