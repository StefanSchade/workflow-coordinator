schema_version: 3
policy_id: repository-standard
revision: v1
scope:
- workflow-coordinator
governance_paths:
- governance
work_item_scope_ceiling:
- tests/fixtures/offline-test-inputs
- docs/developer_guide
- docs/backlog/BUG-WFC-NESTED-PREPARE-OFFLINE-BUILD-ISOLATION.adoc
- docs/warm_storage/concepts/wfc_offline_test_inputs_p1_profile_handoff.adoc
- docs/warm_storage/concepts/wfc_offline_test_inputs_p1_001_broad_review.adoc
- docs/warm_storage/concepts/wfc_offline_test_inputs_p1_001_focused_review.adoc
max_autonomous_hops: 10
actions:
- edit
- commit
- review
evidence_commands:
  task-check:
    argv:
    - python
    - -m
    - pytest
    - -q
    timeout_seconds: 900
