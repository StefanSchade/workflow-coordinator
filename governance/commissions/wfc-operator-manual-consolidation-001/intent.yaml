task:
  title: Consolidate the fragmented WFC operator documentation into one modular Operator Manual
  body: |
    ## Objective

    Replace the fragmented operator documentation with ONE coherent, readable,
    modular Operator Manual whose entry point is
    `docs/operator_manual/operator_manual.adoc`:

    ```text
    docs/operator_manual/
      operator_manual.adoc          (assembles chapter wrappers)
      ch01_<name>/
        _chapter.adoc               (assembles the section files)
        01_<name>.adoc
        02_<name>.adoc
      ch02_<name>/ ...
    ```

    Use the Developer Guide of the sibling Core repository
    (`../core/docs/developer_guide/`, read-only reference: its entry file,
    `_chapter.adoc` wrappers, `leveloffset` includes) as the structural
    model, and `docs/ai_info/doc_conventions.adoc` as the local writing and
    metadata convention. Choose chapters and sections from the actual content
    and from the operator's real work sequence; do not copy the old 22-section
    numbering. The result must read like a professional technical manual
    (clear prose, realistic examples, concise explanations), not like
    accumulated governance notes or one giant checklist. Avoid repeated
    disclaimers, deep heading nesting, huge tables and duplicated
    requirements. Use ASCII lowercase file names without spaces.

    This is documentation consolidation, not product refactoring. Moving text
    does not change its meaning or authority: preserve the semantics of every
    existing normative operational contract.

    ## Sources to examine (live files, not memory)

    `docs/wfc_operator_manual.adoc`, `docs/operator_guide/`,
    `docs/run-preparation.adoc`, `docs/self-development.adoc`,
    `docs/run-recovery-and-salvage.adoc`,
    `docs/successor_continuation_runbook_2026-10-10.adoc`, `docs/README.adoc`,
    `docs/ai_info/`, and
    `docs/warm_storage/concepts/wfc_documentation_consolidation_plan.adoc`
    (reuse its findings and inventories; do not start another planning
    project). Verify commands, options and contracts against the actual
    source (`src/`, `scripts/wfc_op.py`) and the relevant tests; read them
    only, never edit them. Technical-model documents under `docs/technical_model/`
    stay the detailed implementation references: link to them, do not
    duplicate their narratives.

    ## Manual-content requirements

    A competent engineer with no WFC history must be able to progress
    through: repositories, authority and execution model; authoring and
    validating a Commission (including the Intent renderer and source-pin
    rule); preparing and launching a Run; monitoring, reading evidence and
    accepting results; archiving; understanding and recovering from
    unsuccessful Runs (reconcile, salvage, successor Run); operating in
    self-development mode; diagnosing common failures.

    One authoritative home per operational fact. MOVE information rather than
    copying it; where several documents describe the same procedure, keep one
    canonical explanation and make every other place link to it. Preserve all
    materially relevant operational content (requirements, warnings,
    examples, failure handling). Do not create a second competing manual and
    do not leave the old full documents in place beside the new one.

    The manual must explain, accurately against the current contracts, the
    failure modes seen in the Claude Haiku smoke Attempts of 2026-11-10
    (Commissions `wfc-claude-haiku-live-smoke-001`..`003`; Attempts -01 and
    -02 stopped `awaiting_human` after a failed commit admission and left a
    dirty worktree; -03 completed):

    - unsatisfiable or unnecessarily strict Worker acceptance criteria;
    - `blocked` versus `completed`, and why a CommitIntent is admitted only
      for a `completed` result (or a gate's `changes_required` committing only
      its own review artifact) -- Attempt -01's "commit intent is not
      permitted for this result disposition";
    - exact CommitIntent subject rules: Conventional Commit syntax plus the
      WorkItem ID and Hop ID as separate identity tokens -- Attempt -02's
      "commit subject lacks WorkItem/Hop identity"
      (`src/workflow_coordinator/git_facts.py`, `commit_subject_error`);
    - exact leaf-file path rules for `CommitIntent.paths` (never a directory;
      normalized repository-relative paths; every path must have a worktree
      mutation and be inside scope; behavior for newly created and for deleted
      files; and that Git rename detection can report a deleted-plus-added
      similar file only under its new name, so a pure file move in one commit
      can fail `staged paths differ from commit intent` -- state precisely
      what the code and Git actually do, and how to avoid it);
    - the Coordinator rejecting a candidate although the provider invocation
      succeeded, and the resulting dirty-worktree anomaly after a failed
      commit admission, with the operator's handling steps;
    - non-interactive provider permission denials; model/CLI compatibility and
      the difference between "executable exists" and "effective provider
      behavior"; limitations of provider evidence when tool transcripts are not
      persisted; `TMPDIR` and external-scratch behavior
      (see `docs/backlog/BUG-WFC-CLAUDE-ADAPTER-*` records);
    - recovery and successor-Run preparation.

    Include ONE complete, concise, implementation-accurate walkthrough from
    Commission authoring to archive. Use the successful native-Claude Attempt
    `wfc-claude-haiku-live-smoke-20261110-03` and its governing inputs
    (`governance/commissions/wfc-claude-haiku-live-smoke-003/`, Development
    commit `aac9ae5c`, whose subject was
    `test(smoke): WI-WFC-CLAUDE-HAIKU-LIVE-SMOKE-003 H001 verify native Claude CLI`
    and whose two changed leaf paths were
    `docs/qualification/claude-haiku-20261110/fixture.txt` and
    `docs/qualification/claude-haiku-20261110/nested/results.txt`) as the
    reference; it must show an actually valid CommitIntent with subject and
    path representation, and be usable without historical archaeology.

    ## Migration rules

    - Keep a short pointer stub (a few lines: one sentence plus a link to the
      new canonical location) at each of these existing paths, because
      scripts, tests and immutable governance cite them:
      `docs/wfc_operator_manual.adoc`, `docs/run-preparation.adoc`,
      `docs/self-development.adoc`, `docs/run-recovery-and-salvage.adoc`,
      `docs/successor_continuation_runbook_2026-10-10.adoc`, and the three
      files under `docs/operator_guide/`.
    - Do NOT delete or `git mv` any tracked file. Replace a superseded file in
      place with its pointer stub (a plain modification). Reason: trusted
      commit staging compares Git's staged-path report with your CommitIntent,
      and a deleted file plus a similar new file is reported only under the new
      name, which would make admission fail. Do not leave moved content
      duplicated in the stub.
    - Update navigation and links in `docs/README.adoc` (index and moved-path
      map), `docs/ai_info/_ai_info.adoc`, and `docs/project_memory.adoc`, and
      the plan's status section in
      `docs/warm_storage/concepts/wfc_documentation_consolidation_plan.adoc`.
      Add one concise dated entry to
      `docs/cold_storage/project_history/README.adoc` as that router requires;
      append only, rewrite nothing there.
    - Do not edit historical Commissions, archives, backlog records, cold
      storage records (other than the one history entry), project-memory JSON,
      or anything under `src/`, `scripts/`, `tests/`, `governance/`, or the
      Runtime and Evidence repositories; links from those to the four old paths
      keep working through the stubs.

    ## Validation (agent-side; Coordinator trusted evidence is separate)

    Use tools already in the environment; introduce no build framework.
    Render `operator_manual.adoc` and each chapter standalone with
    `asciidoctor` where available and report any warnings; check every include
    path and cross-reference and every link you touched; confirm every
    operator command and option you document against `scripts/wfc_op.py` and
    the source; confirm no operational procedure was lost and no substantial
    text is duplicated. You may run focused tests, but you are not required to
    show the full suite green before reporting `completed`: the Coordinator
    runs `python -m pytest -q` itself after your commit. If a local tool is
    missing or the sandbox blocks a check, say so in your summary and continue.

    ## Result and commit rules (read exactly)

    - Report `status: completed` when your bounded documentation work is done.
      Use `blocked` only if this Hop genuinely lacks authority, scope or a
      capability it needs. A `blocked` result carries no CommitIntent, so
      uncommitted work would be stranded.
    - Never run Git write commands (`add`, `commit`, `mv`, `rm`, `stash`,
      `reset`). The Coordinator owns the commit. Read-only `git` is fine.
    - Supply a `commit_intent` whose `subject` is a single line in Conventional
      Commit syntax containing the exact WorkItem ID
      `WI-WFC-OPERATOR-MANUAL-CONSOLIDATION-001` and the ACTUAL current Hop ID
      from the invocation context as separate tokens, for example
      `docs(operator-manual): WI-WFC-OPERATOR-MANUAL-CONSOLIDATION-001 H001 consolidate operator manual`
      (replace `H001` with the real Hop ID in any later Hop; confirm it from
      the invocation context rather than assuming it).
    - `commit_intent.paths` must list every changed leaf file as an exact,
      normalized, repository-relative path (forward slashes, no `./`, no
      duplicates): every new, modified and (if any) deleted file, each
      individually. Never list a directory. The list must equal the set of
      files whose worktree state differs from HEAD (new untracked files count).
      Leave no stray edits outside that list.
    - Leave no editor, build or scratch files in the repository.

    ## Independent reviewer

    Review the actual files, both technical correctness and information
    architecture. Challenge whether a person with no WFC history can really
    use the manual: lost instructions, stale references, competing canonical
    sources, duplicated explanations, hidden prerequisites, overstructured
    presentation, commands that do not match the source, and failure-mode
    coverage against the list above. Record a blocking Finding only for a
    material defect (wrong or lost operational content, broken
    structure/links, a competing source, an inaccurate example); editorial
    preferences are nonblocking and must not cause correction cycles. Do not
    make acceptance depend on tests, tools or evidence outside your authority
    or on external Provider/CLI diagnostics that are not needed to establish
    documentation correctness; state what you could not check instead.
    Follow the ordinary Robust correction, focused re-review and renewed
    broad-review mechanics. A final acceptance must come from a fresh broad
    review.

    Each review Hop must create or update ONLY its own declared durable review
    artifact (broad vs focused path, see `durable_artifacts`) with a section
    for that round -- on a repeated review append a new dated round section so
    the file really changes -- and propose a CommitIntent whose `subject`
    follows the rule above with the actual Hop ID and whose `paths` is exactly
    that one leaf file. Do not modify the manual or any other file.

  acceptance: |
    `docs/operator_manual/operator_manual.adoc` assembles chapter wrappers
    (`ch*/_chapter.adoc`) that assemble section files; the assembly and each
    chapter render standalone without include or reference errors. The manual
    covers the operator workflow, the listed Haiku failure modes and the
    complete Commission-to-archive walkthrough with a valid CommitIntent
    example. Each operational fact has one canonical home; superseded
    documents are short pointer stubs at the paths listed in the task, no
    second full manual remains, and no material operational content was lost.
    Navigation and links in the touched entry documents resolve. Changes
    are confined to the declared scope. The Coordinator's `task-check`
    (`python -m pytest -q`) passes, and the independent broad review accepts
    with no blocking Finding open.

  withheld_authority: |
    No change to `src/`, `scripts/`, `tests/`, `governance/`, the Runtime or
    Evidence repositories, immutable workflow programmes, historical
    Commissions or archives, backlog or other historical records (apart from
    the single appended project-history entry), or repository policy. No new
    build framework. No change to the semantics of any normative operational
    contract. No Git write commands by an agent. No Runtime promotion, push,
    nested provider invocation outside WFC, or successor Run.

  escalation_default: |
    Escalate only if a required change lies outside the declared scope, a
    normative contract's meaning would have to change, or two authoritative
    sources contradict each other in a way that cannot be resolved by
    verifying the source code (then record the contradiction and keep the
    code-verified statement). A missing local tool or a sandbox-blocked
    diagnostic is a reported limitation, not a reason to stop.

