task:
  title: Implement Claude ordinary public web and Bash configuration P2
  body: 'Implement only the authorized P2 package in docs/backlog/FTR-WFC-AGENT-PUBLIC-INTERNET-CAPABILITY.adoc.
    Inspect that controlling FTR and its P2 section, execution trust-boundaries FTR, Claude write-permission and
    short-TMPDIR BUGs, src/workflow_coordinator/claude_adapter.py, tests/unit/test_claude_adapter_conformance.py,
    directly relevant fake-transport, architecture and sandbox regression tests, accepted Claude adapter design
    and qualification records, current Development and accepted Runtime. Ordinary public internet is a regular development-agent
    capability; avoid unjustified WFC blanket denial, preserve existing authority and filesystem/trust boundaries.


    Before implementing, determine the actual installed Claude CLI executable and version relevant for future WFC
    binding, using read-only offline evidence and without changing or upgrading it. Operator observed /home/stefan/.local/bin/claude
    -> /home/stefan/.local/share/claude/versions/2.1.322, reporting 2.1.322; historical /usr/local/bin/claude is
    absent. Confirm independently. Worker and Reviewer for this Commission are Codex, so the Claude executable is
    an inspected target, not a claimed provider binding for this Run. Use offline help, installed version-specific
    materials or source and version-compatible vendor evidence. The supplied current vendor lead https://code.claude.com/docs/en/sandboxing
    and https://code.claude.com/docs/en/settings are not by themselves proof of exact installed-version behavior.
    No authenticated Claude invocation, live network test, credentials or managed-config inspection.


    Establish separately and traceably the actual selected version''s --tools selection for WebFetch/WebSearch;
    permissions.allow/deny and noninteractive behavior with --permission-mode acceptEdits and --permission-prompts
    none; sandbox network configuration for ordinary public Bash HTTP/DNS; meaning and matching of domains, defaults
    or wildcards; --restricted, --safe-mode and relevant managed-policy limitations. Fake executable accepting arbitrary
    settings, a guessed wildcard, or unversioned vendor docs alone are not sufficient version-specific compatibility
    evidence. If support for a network-only configuration cannot be established while preserving boundaries, stop
    with a precise compatibility/design blocker rather than guessing, bypassing sandbox or silently changing provider.


    If supported, make the smallest coordinated correction: include WebFetch and WebSearch via supported built-in
    tool selection, remove unconditional WFC denies, provide coherent narrowly scoped noninteractive permission
    grants, and request ordinary public Bash networking through the supported sandbox interface without WFC-owned
    proxies, domain catalog, sidecar, profile or schema. Do not authorize access to private/internal/localhost services
    merely by documenting public access. Preserve sandbox enabled, failIfUnavailable and no unsandboxed fallback,
    restricted/safe execution, existing filesystem, repository/scratch and credential boundaries, child environment
    and explicit extra environment rules, model/effort, result correlation and validation, authorized Write/Edit,
    repository-relative permissions, short invocation TMPDIR and cleanup. Do not introduce CLAUDE_CODE_SUBPROCESS_ENV_SCRUB
    or broaden env forwarding. Static settings are not live success; managed policy/account and provider behavior
    may restrict it.


    Extend existing directly affected deterministic Claude conformance/fake-transport tests: exact argv/settings,
    web tool selection and permissions without contradictory denials, justified supported public network request,
    sandbox and no bypass, no unrelated grants, filesystem/scratch/environment and result/failure/cleanup regression.
    Include meaningful malformed/conflicting cases when appropriate. Run affected Claude and relevant architecture/sandbox
    regressions offline; no mandatory live tests. Document installed-version support and uncertainty in the controlling
    FTR; only necessary _open navigation. H001 records candidate only, never anticipates independent acceptance
    or Coordinator task-check. Keep live Claude write/negative-write and promoted Runtime scratch qualifications
    outstanding, as well as separate future Claude P3. Current accepted Runtime is separate; no promotion. Render
    changed AsciiDoc, validate links and diff hygiene. Agent-local tests do not substitute trusted evidence.


    No agent-owned Git writes; exact CommitIntent lists each changed leaf once only, Conventional Commit subject
    includes WI-WFC-AGENT-PUBLIC-INTERNET-CLAUDE-P2-001 and actual Hop ID as separate bounded tokens. Review artifacts
    reserved to their phases.


    Fresh independent broad reviewer must inspect full candidate, actual installed CLI/version and concrete interface
    evidence, tool selection/permissions/network interactions, deterministic noninteractive behavior, existing Write/Edit,
    scratch, filesystem, environment, credential, Git and evidence boundaries, tests and scope. Reject unsupported
    wildcard semantics, contradictory permissions, sandbox bypass and broad unrelated grants; do not demand live
    internet. Check source-grounded limitations and absence of premature acceptance/promotion claims. Block material
    defects only; use normal robust correction/focused review and renewed broad review routing if necessary.'
  acceptance: Version-supported coordinated Claude web-tool and ordinary Bash network configuration with established
    deterministic boundaries and meaningful offline tests; fresh independent broad review without blocking Findings
    and Coordinator trusted task-check pass. Effective connectivity, Claude write/scratch live qualifications and
    Runtime promotion remain separate.
  withheld_authority: No authenticated Claude network or permissions qualification, provider upgrade, Claude P3
    live Run, Codex adapter, Runtime, policy/program/schema, host/firewall/proxy/VPN/network changes, private/internal/localhost
    probes, credential access or transmission, filesystem sandbox weakening, unrelated BUG closure, agent Git writes,
    extra Commission, push or Runtime promotion.
  escalation_default: If actual version-compatible semantics cannot establish supported ordinary public networking
    without weakening existing boundaries, report precise blocker; do not guess wildcard syntax, change provider/version
    or bypass checks.
