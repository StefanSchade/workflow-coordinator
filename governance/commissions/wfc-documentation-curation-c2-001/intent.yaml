task:
  title: Implement documentation curation C2 present-system models
  body: 'Implement only C2 — Distil present-system knowledge into the three models — from docs/backlog/FTR-WFC-DOCUMENTATION-CURATION.adoc,
    particularly its C2 section, source pointers, dependencies, untouched scope and acceptance. Inspect actual current
    code, workflow-program configuration and relevant tests before material claims: src/workflow_coordinator/{model,reducer,serialization,operator,commissioning,adapter,codex_adapter,claude_adapter,prompt,evidence,persistence,git_facts}.py,
    structured_result_schema.py, package resources, governance/workflow-programs/*/v1.yaml, relevant tests; the
    root projected-result-contract concept and accepted references; current manual, backlog and Beta-1 planning.
    Sample as needed, not a completeness census. Ground current facts in implemented source or owning contracts;
    distinguish actual implementation, accepted design, draft and future product intentions. Retain authority hierarchy
    and historical reasoning at original paths. Do not implement product or program behavior.


    Improve in place: docs/functional_model/workflow_program_use_cases.adoc explains WFC purpose, goals, non-goals,
    requirements and use cases, separating present capability from proposed product behavior and open Beta-1 questions.
    docs/semantic_model/workflow_execution_semantics.adoc explains Commission, Program, Run, Hop, Finding, Evidence,
    Route and relevant execution states, distinguishing phase versus route authority, Finding identity versus disposition,
    and provider result versus Coordinator-trusted evidence. docs/technical_model/workflow_program_architecture.adoc
    explains implemented admission, projection, reduction, persistence, adapters and evidence processing, distilling
    implemented P1–P3 Projected Result Contracts without promoting unfinished P3.5/P4/P5. docs/architecture.md remains
    a concise stable-path overview of current responsibility boundaries, deterministic core and effectful execution,
    correcting the stale Robust review status while retaining direct''s qualified outcome. Keep small Semantic and
    Technical Models as single files, existing entry paths and useful anchors; provide meaningful headings and cross-references.
    Link to Operator Manual for procedures rather than duplicating normative text. Current knowledge precedes labelled
    proposals and no documentation can grant authority. Record a short source-to-home account of conclusions actually
    distilled, sufficient for later C4, in the scoped controlling backlog record or appropriate model; no historical
    completeness inventory.


    C1 is a verified prerequisite: Run RUN-776d909cec5d437b917e55cfe836d28c completed; Worker dc8b575; independent
    broad review a01c09c accepted without blocking Findings; Coordinator task-check pass exit 0. Verify against
    existing review/persisted state if available. Minimally correct the current claims in docs/backlog/FTR-WFC-DOCUMENTATION-CURATION.adoc
    and docs/backlog/_open.adoc that C1 review and trusted evidence remain pending; preserve C1 review and historical
    bodies. Record only milestones actually established. If recording C2 implementation during Worker publication,
    say independent acceptance and Coordinator check remain pending; do not claim future outcomes. C3 and C4 remain
    separately authorized future work.


    Render modified AsciiDoc model entries, verify navigation, relevant local links and fragments and Markdown references,
    preserve useful existing knowledge and check diff hygiene. Report diagnostic validation and limitations. Agent-local
    checks are diagnostic; downstream Coordinator evidence follows publication, so do not block merely because that
    gate has not yet run. Exact CommitIntent must name each actually changed repository-relative leaf once, no unchanged
    paths, and a Conventional Commit subject including WI-WFC-DOCUMENTATION-CURATION-C2-001 and actual Hop ID as
    separate bounded tokens. No agent Git writes. Review artifacts are reserved to review phases.


    A fresh independent broad reviewer must inspect the entire candidate against actual current source, programs,
    tests and controlling contracts, not merely Worker summary. Check false/outdated claims; draft designs presented
    as delivered; semantic/technical/operating boundaries; authority and trust; gaps that materially prevent understanding;
    navigation and lost knowledge; unnecessary scope or duplication. Check P1–P3 versus P3.5/P4/P5 and C1 milestone
    reconciliation. Write the configured durable review artifact. Only concrete material defects warrant blocking
    Findings; avoid cosmetic correction loops. Normal correction and focused review routing applies, followed by
    renewed broad review as configured.'
  acceptance: Source-grounded current Functional, Semantic and Technical Models and concise architecture overview
    satisfy C2, C1 milestone is accurately reconciled, model rendering and navigation/reference checks performed,
    independent fresh broad review accepts without blocking Findings, and Coordinator trusted task-check passes.
  withheld_authority: No Python implementation or tests, Runtime, Workflow Programs, productization, network-access
    changes, Gondolin adoption, C3/C4, bulk cold-storage moves, historical reviews, Project History, semantic Run
    Ledger, product requirement or proposal acceptance, P3.5 guard/predicate changes, new governance, metadata requirements
    or tracking mechanisms; no branch merges, agent Git writes, successor, extra Commission, push or Runtime promotion.
    Review artifacts reserved to review phases.
  escalation_default: Escalate only for a concrete obstacle requiring authority or a genuinely Maintainer-owned
    decision; incomplete work or pending downstream evidence alone is not blocked.
