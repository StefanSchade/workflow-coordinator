task:
  title: Research context sculpting and knowledge lifecycle
  body: 'Conduct a small research and documentation task, not feature design or implementation. Inspect existing
    sources first: docs/backlog/FTR-WFC-EXECUTION-TRUST-BOUNDARIES.adoc, FTR-WFC-AGENT-PUBLIC-INTERNET-CAPABILITY.adoc,
    relevant execution isolation, knowledge context, MCP and retrieval backlog, existing Bubblewrap implementation
    and its integration status, docs/ai_info/_ai_info.adoc and doc_conventions.adoc, cold_storage/README.adoc, research/README.adoc
    and relevant archived concepts especially Level-1/capability composition. Search actual repository for MCP sidecars
    and retrieval services, indexing, RAG, embeddings, selective repository paths, external read-only reference
    repositories, and Commission-scoped filesystem or execution contexts. Distinguish established design intentions
    from new suggestions; cite existing backlog ownership without duplication. If no dedicated knowledge-retrieval
    sidecar record exists, state the finding without creating one.


    Create docs/research/context_sculpting_and_knowledge_lifecycle.adoc, approximately 120–200 lines, covering motivation
    and relationship to existing research; Commission-scoped context sculpting; current, warm and cold lifecycle;
    possible mediated retrieval; implementation and backlog anchors; open questions and deferred possibilities.
    Separate established, prepared but unintegrated, and envisioned. Record that execution isolation constrains
    filesystem, writes, Git surfaces, processes and execution capabilities, while context sculpting deliberately
    constructs a Commission-specific information environment and was an important original motivation, not an incidental
    later benefit. Conceptually consider hiding .git and sensitive/inappropriate paths, selected read-only/read-write
    repository paths, read-only external references such as an ASE checkout, hiding inactive documentation, adequate
    binaries/libraries and writable temp, and varying contexts by Commission or potentially phase. These are intentions,
    not assertions of current capabilities; Commission requests cannot independently grant authority, which is constrained
    by trusted policy. No schema, mount compiler, permission framework or implementation design.


    Describe current models and operational docs as distilled durable knowledge for understanding, development and
    operation; warm storage as investigation and development knowledge including concepts and reviews awaiting distillation
    or retirement; cold storage as inactive knowledge outside normal working context, not necessarily obsolete,
    invalid or merely historical. A valid idea may become cold through current irrelevance; archived information
    may be selectively retrieved and reactivated without automatic current authority. When a concept is implemented,
    distill durable functional, semantic, technical and operational conclusions into appropriate current docs, preserve
    reasoning, rejected alternatives, development and provenance in cold storage, and retire unneeded working concepts
    from normal active context. Distillation is not deletion.


    Record longer-term possibility that normal agent filesystem view excludes cold storage while a controlled separate
    retrieval service makes it available on demand, potentially via MCP; metadata, full-text and semantic search/embeddings/RAG
    are possible discovery approaches, with no selection or service design. Distinguish task retrieval from permanent
    reactivation in warm/current knowledge. State explicitly filesystem isolation is not fully integrated into WFC
    provider execution; no current context boundary claim. Git objects, symlinks, alternate paths and external repositories
    are deferred technical concerns. A retrieval MCP interface might conceivably overlap with other capabilities
    such as Front Door, but defer the question: current CLI Front Door direction suffices for foreseeable needs
    and retrieval versus authoritative operations have different trust implications. No MCP server, Front Door redesign,
    or new FTR.


    Make only concise orientation updates to docs/ai_info/doc_conventions.adoc and docs/ai_info/_ai_info.adoc linking
    the report and conveying: distill active durable knowledge into current models; preserve inactive provenance
    in cold storage; archival does not judge validity. Add a short entry to docs/research/README.adoc as current
    research index. If docs/cold_storage/README.adoc defines cold too narrowly as historical or obsolete, minimally
    correct it and link the report. No reorganizing or moving files; no documentation cleanup. No changes to source,
    tests, Runtime, adapters, Bubblewrap, compiler, Front Door, backlog lifecycle, historical concepts/reviews/Run
    records, models, or warm/cold locations. Report backlog gaps for later Maintainer disposition, no new governance
    or mandatory metadata.


    Render changed AsciiDoc files and check links/references; verify backlog ownership, unintegrated execution status,
    visibility versus mutation/execution authority, broad meaning of cold, and deferred MCP/Front Door. Report checks
    and limitations. CommitIntent must list actual changed repository-relative leaves exactly and Conventional Commit
    subject includes WI-WFC-CONTEXT-SCULPTING-KNOWLEDGE-LIFECYCLE-001 and actual Hop ID as separate tokens; no agent
    Git writes. Independent reviewer must check all scope and acceptance, especially unnecessary expansion, duplicate
    backlog concepts and accidental normative claims, perform meaningful independent checks, and write only its
    configured review artifact with a leaf-exact CommitIntent. Blocking defects require correction and focused review
    as required; final acceptance needs fresh broad review without open blocking findings.'
  acceptance: Deliver the specified bounded research and minimal navigation/orientation updates with accurate evidence
    and status distinctions, no scope expansion or duplicate backlog, successful AsciiDoc renders and reference
    checks, Coordinator trusted task-check, and independent fresh broad review accepting without open blocking findings.
  withheld_authority: No source, tests, Runtime, provider adapters, Bubblewrap, compiler, Front Door, FTR/BUG lifecycle,
    historical records, models, file moves, cleanup, new FTR, agent Git writes, provider calls outside WFC, push,
    Runtime promotion, successor or extra Commission. Review artifacts reserved to their configured review phases.
  escalation_default: Escalate only for concrete obstacle requiring authority or unresolved contradiction; incomplete
    work alone is not blocked.
