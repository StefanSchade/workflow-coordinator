task:
  title: Implement documentation curation C3 Developer Guide
  body: 'Implement only C3 — Establish a proportionate Developer Guide — from docs/backlog/FTR-WFC-DOCUMENTATION-CURATION.adoc,
    especially C3''s scope, source pointers, dependencies and acceptance. Inspect the actual README.md, Makefile,
    pyproject.toml, tests/conftest.py and representative tests, src/workflow_coordinator/, docs/architecture.md,
    the Functional, Semantic and Technical Models, the Operator Manual and the November documentation consolidation
    plan''s useful engineering principles. Verify commands and present behavior against configuration and source,
    not historical assumptions. No dependency installation, live provider invocation or provider Run is required
    for documentation acceptance.


    Create exactly these useful guide leaves together: docs/developer_guide/developer_guide.adoc (entry and assembled
    guide), ch01_development.adoc (development setup and tests), ch02_code_navigation.adoc (code/test organization,
    key execution paths and debugging), ch03_engineering_conventions.adoc (engineering principles and maintainability).
    Use the Operator Manual''s guarded AsciiDoc include pattern so each chapter renders usefully standalone with
    visible local standing, and the assembled guide has correct include paths and heading levels. No empty future
    chapters or additional indexes. Explain real setup commands and test selection; pytest scratch precedence and
    limitations from tests/conftest.py; debugging using persisted Run observations; code/test navigation; local
    readability, affected-contract testing, producer/consumer seams, deterministic-core/effect-shell boundaries.
    Adapt useful earlier principles as guidance, not new mandates, compliance checklists or a Domain Maintainer
    Contract. Developer Guide owns development/testing/navigation/debugging/maintenance; link to the Operator Manual
    for operation, preparation, launch, evidence and recovery and to model/architecture owners for purpose, semantics
    and mechanisms. Do not duplicate normative operating instructions.


    Update README.md, docs/README.adoc and docs/ai_info/_ai_info.adoc through existing navigation to expose the
    guide, retain root quickstart, paths and useful anchors. Address C2 review''s observation that the latter two
    entries understate the Semantic and Technical Models'' substantial current implemented-system explanations;
    accurately distinguish their current sections and labelled proposals. Do not modify models. Do not create mandatory
    metadata, governance rules or tracking machinery.


    C2 prerequisite is established: Run RUN-771be85a840f473fa1b5ecdb8d44b0cf completed; H001 candidate 1f23429;
    H002 independent broad review 2184d78 accepted without blocking Findings; Coordinator task-check pass exit 0.
    Inspect persisted state and review when available, then update only current milestone descriptions in docs/backlog/FTR-WFC-DOCUMENTATION-CURATION.adoc
    and docs/backlog/_open.adoc. Preserve historical C2 review. Record only established milestones: a Worker may
    record its C3 implementation with independent review and Coordinator evidence pending, never claim future acceptance.
    C4 remains separately authorized future work.


    Render the assembled AsciiDoc entry and each standalone chapter, verify includes, heading levels, visible standing,
    local references and useful existing anchors, compare documented commands with actual repository configuration
    and check diff hygiene. Report local checks and limits. Coordinator task-check follows publication independently;
    never block merely because downstream evidence has not run. Exact CommitIntent lists each actually changed repository-relative
    leaf exactly once and no unchanged paths; Conventional Commit subject includes WI-WFC-DOCUMENTATION-CURATION-C3-001
    and actual Hop ID as separate bounded tokens. Agents do not write Git commits. Review artifacts are reserved
    to review phases.


    Fresh independent broad reviewer must inspect the complete candidate, actual guide and actual repository configuration
    and sources, not just Worker summary. Assess executable setup and tests, scratch behavior, accurate navigation/debugging,
    standalone and assembled rendering, Developer/Operator responsibility separation, correct model references,
    proportionate engineering guidance, accurate C2 milestones and navigation, and bounded scope. Write the configured
    durable artifact. Block only material defects, not stylistic preferences; use normal correction/focused review
    routing and renewed broad review as configured.'
  acceptance: A concise, source-grounded modular Developer Guide and updated navigation satisfy C3, C2 milestones
    are accurately reconciled, assembled/standalone rendering and relevant reference checks are performed, fresh
    independent broad review accepts without blocking Findings, and Coordinator trusted task-check passes.
  withheld_authority: No Python source or test changes, Runtime or Workflow Program changes, branch merges, Gondolin
    adoption, network-access changes, historical rewrites, cold-storage migration, C4, new indexes, mandatory documentation
    metadata, governance rules, placeholder chapters or migration records. No agent Git writes, successor, extra
    Commission, push or Runtime promotion. Review artifacts reserved to review phases.
  escalation_default: Escalate only for a concrete obstacle requiring authority or a genuinely Maintainer-owned
    decision; incomplete work or pending downstream evidence alone is not blocked.
