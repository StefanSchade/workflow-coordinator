authority_source: >-
  Maintainer directly authorizes, by explicit 2026-11-08 interactive
  instruction given outside ordinary WFC execution, Commission authoring,
  rendering, committing, `commission check`, preparation, and launch of the
  bounded extension to `src/workflow_coordinator/execution_boundary.py`
  described below: one dedicated, caller-designated external WFC scratch
  bind-mount, coexisting with the existing private `/tmp` tmpfs scratch.
  This instruction explicitly authorizes launch (not merely
  authoring/commit), subject to all required preflight and authority checks
  passing; if any hard preflight or authority condition fails,
  preparation/launch stops and the blocker is reported rather than bypassed.

  Controlling backlog record: `docs/backlog/FTR-WFC-EXECUTION-TRUST-BOUNDARIES.adoc`
  records a new "2026-11-08 narrow slice authorization (extends, does not
  widen, the 2026-11-06 slice)" section, committed at Development commit
  `19d96d10b2b811d7acbbdc53ab59c7b7954c8ff3`, recording this exact
  authorization for this one extension only. The active-work manifest,
  `docs/backlog/_open.adoc`, carries a matching "Bubblewrap external scratch
  bind-mount" entry under "Ready to commission" pointing at this
  Commission. This authorization does not lift deferral of the broader
  trust-boundary architecture, nested Claude-in-bubblewrap qualification,
  Claude/Codex provider wiring, credential brokers, network sidecars,
  elevated privileges, a general read-authority/classification model, any
  wiring into `operator.py` or either provider adapter, or any general
  loosening of the existing repository-only bind-source rule beyond this
  one designated exception; all of those remain deferred exactly as the FTR
  records them.

  Motivating record: `docs/backlog/BUG-WFC-CLAUDE-ADAPTER-SHORT-TMPDIR-RESOURCE-EXHAUSTION.adoc`
  (status: open) and
  `docs/cold_storage/architecture/pre-0.1.0b1/workflow_coordinator_claude_adapter_development_retrospective_2026-11-08.adoc`
  (commit `da5b942c861bc63d6337807502f73a94a9118a8d`), which found a short
  `/tmp` symlink to external scratch functionally adequate but mechanically
  incompatible with this module's own `--tmpfs /tmp`, and identified an
  external bind-mount inside the same bubblewrap namespace as the preferred
  target direction (retrospective section 12), not yet designed into
  `execution_boundary.py`'s validation model.

  Feasibility baseline: unprivileged `bwrap` is present and functional on
  this machine (consistent with the 2026-11-06 slice's own feasibility
  check); the retrospective separately confirmed, by live experiment, that
  `bwrap --bind <external-scratch> /tmp/s` successfully provides a
  short-path external bind under a tmpfs-backed `/tmp` (retrospective
  section 13).

  Hop-ceiling note: `max_autonomous_hops: 10` is set directly at the
  `repository-standard@v1` policy basis's own ceiling (no override
  attempted or required), consistent with the maintainer's current standing
  guidance (`docs/self-development.adoc`, "Commission Hop budget") and this
  Commission's own explicit instruction to use the standard bounded 10-Hop
  budget.

  Baseline verified against Git immediately before writing this Intent:
  Development `HEAD` is `19d96d10b2b811d7acbbdc53ab59c7b7954c8ff3` (the
  backlog-authorization commit above); the working tree is clean. Runtime
  (`workflow-coordinator-runtime`) `HEAD` is
  `464aefe3d3438bc66b110725de68def316238ffa`, detached, clean. Evidence
  (`workflow-coordinator-run-evidence`) `HEAD` is
  `95246cb7556f1a67746c48e4763f06d1b524bc99`, clean. Every `source_commit`
  below pins this Development HEAD.

  Runtime-promotion note: this extension is not wired into the live
  provider execution path and changes no existing Coordinator/adapter
  dispatch behavior, so promoting Runtime to the latest Development commit
  is not a technical prerequisite for this Attempt; the pinned Runtime
  already executes `robust@v1` Claude-adapter Attempts (most recently
  `WI-WFC-EVIDENCE-FAILURE-DIAGNOSTICS-001`) against this exact Runtime
  `HEAD`.

