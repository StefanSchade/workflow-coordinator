authority_source: 'Maintainer directly authorizes, by explicit 2026-11-01 interactive
  instruction given outside ordinary WFC execution, Commission authoring (render +
  commit + `commission check` only, no launch) of a fresh successor Run completing
  and independently reviewing the Claude Code adapter implementation whose predecessor
  Run stopped short of trusted acceptance. This authorization is for successor Commission
  authoring only; it is not authorization to implement code directly or to launch
  WFC.

  Predecessor facts, verified against Git and `wfc_op.py status` before writing this
  Intent: Commission `wfc-claude-code-adapter-implementation-001` (`WI-WFC-CLAUDE-CODE-ADAPTER-IMPLEMENTATION-001`),
  Run `RUN-5740ace2e87549228609e6e5cc225996`, attempt `wfc-claude-code-adapter-implementation-001-20261101-01`,
  stopped at H001 with `run_status: awaiting_human` and `stop_reason: mechanical_preemption:dirty
  tracked state; non-ignored untracked state; post-evidence worktree is not clean
  with resolved submodules; trusted_commit:commit intent path has no worktree mutation:
  tests/unit/test_codex_adapter_conformance.py`. The agent''s own invocation exited
  0 and reported passing focused tests, but the Coordinator''s trusted commit operation
  and the full repository `task-check` evidence gate were never reached, so no trusted
  implementation commit exists for that Run. `final_head` for that attempt and the
  Development repository''s current `HEAD` both verify as `bafb70f96d01e459fb8029498f59c775143f79d4`.

  The maintainer manually preserved the exact dirty H001 candidate, outside ordinary
  Development history, as commit `3a127f64498b7e277d11f5ea23d8806cb5666bd4` at ref
  `refs/wfc/candidates/RUN-5740ace2e87549228609e6e5cc225996/H001`, whose sole parent
  is verified as the original trusted baseline `bafb70f96d01e459fb8029498f59c775143f79d4`.
  `git diff --stat` between that baseline and the candidate verifies exactly nine
  changed paths -- `src/workflow_coordinator/claude_adapter.py` (new), `src/workflow_coordinator/structured_result_schema.py`
  (new), `src/workflow_coordinator/codex_adapter.py`, `src/workflow_coordinator/operator.py`,
  `src/workflow_coordinator/serialization.py`, `tests/unit/test_claude_adapter_conformance.py`
  (new), `tests/unit/test_operator.py`, `tests/unit/test_serialization.py`, and `tests/unit/test_wfc_op.py`
  -- notably excluding `tests/unit/test_codex_adapter_conformance.py`, confirming
  that file had no worktree mutation and was wrongly named in H001''s own `commit_intent`.
  The preservation commit was never merged onto `main`; `main` is verified at `bafb70f96d01e459fb8029498f59c775143f79d4`,
  identical to the original baseline.

  This candidate is untrusted, unreviewed implementation material. It is neither an
  accepted WFC commit nor a predecessor Finding disposition; per `docs/run-recovery-and-salvage.adoc`''s
  central invariant, salvage preserves work, not authority. The candidate ref itself
  is not mutated, deleted, or treated as accepted history by this Intent or by anything
  it authorizes.

  Archive check: `wfc_op.py archive wfc-claude-code-adapter-implementation-001-20261101-01
  --dry-run` refuses with "archive destination already exists, refusing to overwrite
  it: archive/unclassified/wfc-claude-code-adapter-implementation-001-20261101-01",
  proving the predecessor Run was already mechanically archived before this Intent
  was authored. The existing Evidence commit is verified as `ae000ff591b151be86800c588d295e79b724fa32`
  in `workflow-coordinator-run-evidence` (`archive/unclassified/wfc-claude-code-adapter-implementation-001-20261101-01`,
  containing `manifest.json`, `ops`, and `run`), with that repository''s worktree
  clean at that HEAD. No new archive action, semantic ledger curation, or push was
  performed or is authorized by this Intent.

  This is a fresh successor Run under `docs/run-recovery-and-salvage.adoc` outcome
  2 ("maintainer salvage + fresh successor Run"), not a retry, resume, or replay of
  the stopped predecessor Attempt. The predecessor Run, its Hop, and its governing
  bundle remain frozen historical truth and are not mutated, retargeted, or retrofitted
  by this successor. The successor inherits the original implementation''s functional
  acceptance mandate -- the accepted design `docs/warm_storage/concepts/workflow_coordinator_claude_code_adapter_design_2026-11-01.adoc`
  remains the controlling implementation specification, independently accepted in
  `docs/warm_storage/concepts/workflow_coordinator_claude_code_adapter_design_closure_2026-11-01_broad_review.adoc`
  (outcome accept, Run `RUN-8286350f443a425e9f848913ca62f7c9`, Invocation `INV-5293b336b01041709f4872af9cb46ee8`,
  closure HEAD `4c16884e5b2e747bd0f90e60660d7f74d02ef943`) -- but receives its own
  new execution authority and must earn its own independently reviewed trusted result;
  the candidate''s historical provenance provides no correctness or acceptance credit.
  This Commission does not authorize launch, Runtime promotion, Evidence mutation,
  a push, or any provider invocation; it authorizes only authoring, rendering, and
  committing the governing bundle and validating it with `commission check`.'
