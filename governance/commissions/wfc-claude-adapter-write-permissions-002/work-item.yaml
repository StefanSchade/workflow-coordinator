authority_source: 'Maintainer directly authorizes Commission authoring (render + commit
  + `commission check`) and deterministic preparation through `prepare` and provider-free
  preflight, reaching and halting at `PREPARED / NOT LAUNCHED`, for a bounded `robust@v1`
  correction for the live permission mismatch recorded in `docs/backlog/BUG-WFC-CLAUDE-ADAPTER-WRITE-PERMISSION-MISMATCH.adoc`.
  Role bindings for `prepare` are `worker=codex_cli:gpt-6.1-terra:high` and `independent_reviewer=codex_cli:gpt-6.1-sol:high`;
  both model/reasoning combinations are verified present in the local Codex model
  catalog (`~/.codex/models_cache.json`) before this Intent is rendered. This authorization
  is for Commission authoring and deterministic preparation only; it is not authorization
  to `launch`, to invoke an authenticated provider, or to implement the fix directly
  outside a WFC-dispatched Hop.

  Baseline verified against Git immediately before writing this Intent: Development
  `HEAD` is `cce2153c597c9ca48e54bdcf8d62ed21b0161d6a` ("docs: update architecture
  WI-WFC-ARCHITECTURE-DOC-UPDATE-001 H001"); the working tree is clean. Runtime (`workflow-coordinator-runtime`)
  HEAD is `5cf0fe1a3687e74834586e27fb9473ad543f80f9`, unchanged since the bug record
  and since the predecessor Commission below. Evidence (`workflow-coordinator-run-evidence`)
  HEAD is `45e1345af9892c6826fe1bbe3ba1d229c4ccf134`. Every `source_commit` in this
  Intent pins the verified current Development `HEAD` above.

  Bug record used: `docs/backlog/BUG-WFC-CLAUDE-ADAPTER-WRITE-PERMISSION-MISMATCH.adoc`.
  It documents two live qualification attempts under Commission `wfc-simple-v1-maintainer-principles-001`
  against Claude Code CLI `2.1.270` (confirmed still installed and reporting the same
  version at this Intent''s authoring time) and Runtime commit `5cf0fe1a`: the first,
  `wfc-claude-opus-simple-20261102-01`, failed before agent execution on a since-resolved
  missing-`socat` local dependency and is not this record''s subject; the second,
  `wfc-claude-opus-simple-20261102-02`, ran successfully at the provider-transport
  level (CLI exit 0, a valid correlated structured result, no timeout, `task-check`
  passing, no Git change) but had `Write` to the WFC-authorized, not-yet-existing
  `docs/developer_guide/maintainer_principles.adoc` and `Bash mkdir -p docs/developer_guide`
  both denied by the Claude Code CLI''s own permission layer, with no interactive
  approval surface, inside the exact scope (`docs/developer_guide`) that Commission
  `wfc-simple-v1-maintainer-principles-001`''s rendered `profile.yaml` explicitly
  authorized. WFC''s own scope/Finding mechanics behaved correctly throughout; the
  bug record classifies this as a provider-adapter effective-permission gap, not a
  Coordinator authority defect, and records two unconfirmed mechanism hypotheses --
  permission-mode override under `CLAUDE_CODE_SUBPROCESS_ENV_SCRUB` forcing the CLI''s
  interactive-default permission mode back on while `--permission-prompts none` converts
  every resulting ask into an outright denial; and the generated settings JSON defining
  no write-scope-equivalent field at all -- neither confirmed, both requiring investigation
  before correction.

  Directly relevant prior-attempt provenance (this Intent''s primary reason for existing):
  a predecessor Commission authored and committed for this same bug, `wfc-claude-adapter-write-permissions-001`
  (committed `841a1a6`..`bbc303c14d03241cd0f3a2f6240098ed49a7691a`), was prepared
  and launched as `RUN-dcdf990244dd4e9cba19e40dea2d2400` (`~/wfc-state/wfc-claude-adapter-write-permissions-001-20261102-01`,
  worker/reviewer `codex_cli` `gpt-5.6-terra`/`gpt-5.6-sol` at `high`). That Run executed
  exactly one Hop (`H001`, `implement`, worker), made no Git change (`worktree_clean:
  true`, no commits, no changed paths), and resolved into a mechanical/semantic stop:
  `run_status: awaiting_human`, `stop_reason: mechanical_preemption:human_authority:prerequisite`,
  with the recorded `human_question` asking whether a separately scoped, authenticated
  real-Claude integration qualification could be authorized to establish the provider-owned
  effective-permission behavior, since "the current request exposes only the repository
  root" and a repository-root write grant could not preserve the bug record''s phase-scope
  invariant. That Run''s own mandate (mirrored from the bug record) explicitly withheld
  authority for exactly that live authenticated invocation, so the Worker''s stop
  was the mandate operating as designed, not a defect; the predecessor Commission,
  its Run, and its clean `awaiting_human` state are left untouched and unrelaunched
  by this Intent -- per `run-recovery-and-salvage.adoc`''s outcome taxonomy, no uncommitted
  candidate work exists to salvage (worktree was clean throughout), so this is fresh
  Commission authoring against the same bug record, not a same-Run resume or a SuccessorProvenance
  continuation of H001.

  This successor Intent is deliberately narrowed relative to its predecessor in exactly
  one respect, to let the Worker resolve the mandate without repeating that same prerequisite
  stop: it explicitly authorizes, as ordinary code-level investigation evidence (never
  as a provider invocation and never requiring authentication), running the already-
  installed `claude` executable''s own self-describing, side-effect-free introspection
  surface from within the Hop''s existing sandboxed working directory -- for example
  `claude --version` and `claude --help` and any subcommand `--help` text -- to check
  the adapter''s assumed flag/ environment-variable contract (`--permission-mode`,
  `--permission-prompts`, `--restricted`, `--safe-mode`, `CLAUDE_CODE_SUBPROCESS_ENV_SCRUB`)
  against what the installed CLI itself documents, strictly distinguishing verified
  documented behavior from assumption. This is categorically distinct from, and does
  not authorize, the still-withheld nested authenticated `claude` invocation (any
  flow that opens a session, reads/writes a file, or otherwise exercises the permission
  engine against real content). Network access remains unauthorized in this Hop''s
  sandbox (`network.allowedDomains` is empty); if the installed executable''s own
  `--help`/`--version` output and the already-cited accepted design sources are insufficient
  to confirm official documented behavior, the Worker must say so explicitly rather
  than fetching external documentation, and must proceed on the strongest evidence
  actually available exactly as `escalation_default` below describes.'
