authority_source: Maintainer authorizes exactly one robust@v1 self-development Run for bounded C4 documentation
  retirement, worker and fresh independent reviewer codex_cli:gpt-6.1-sol:high, at most ten Hops; no C5, successor,
  extra Commission, push or Runtime promotion.
program:
  id: robust
  revision: v1
  source_commit: 8b5b7c6320cc67860146aceb16955c893d9f6e74
task:
  title: C4 selective retirement of completed documentation bundles
  body: 'Implement only C4 — Retire selected completed bundles and finish their live references — under docs/backlog/FTR-WFC-DOCUMENTATION-CURATION.adoc,
    especially C4 and the four-way retirement assessment, and the Maintainer''s current authorization. C3 is accepted
    through combined evidence recorded at bc30f15: original Run RUN-3c6db523e1e64755b04b678f402aa563 published candidate
    9930622 and independent review ed212d2 accepted without blocking Findings, but its trusted task-check timed
    out and it stopped awaiting_human; separate verification Run RUN-d776734b22584592a9c49fe70371449a completed
    cleanly with no mutation and its own trusted task-check pass. Do not conflate these Runs or rewrite either''s
    evidence.


    Inspect the actual source/destination trees, docs/README.adoc, docs/ai_info/_ai_info.adoc and doc_conventions.adoc,
    backlog overview and controlling plan, assembled Operator Manual and affected sections, cold conventions, representative
    manual FTRs/plans/reviews, November consolidation plan, current guide/models and Git history. C4''s selected
    first bundle is the completed manual consolidation charter and FTR01–10, applicable completed warm plans/reviews,
    and superseded wfc_documentation_consolidation_plan.adoc. Assess each selected bundle before retiring: conclusions
    already incorporated in current owners; useful conclusions still requiring narrowly scoped distillation; historical
    alternatives, rejected approaches, stopped runs, evidence and reasoning to preserve; and sources supporting
    still-active work which must remain warm. This is a targeted assessment, not an exhaustive historical inventory.
    Retire only eligible materials, and retain/report concrete unresolved dependencies rather than expanding scope.
    Do not migrate adjacent Beta-1, P3.5/P4/P5, security/Gondolin or active product work. Cold means inactive long-term
    memory, not invalid; pre-0.1.0b1 does not establish a beta release.


    For eligible manual records and completed warm sources use docs/cold_storage/backlog/pre-0.1.0b1/operator-manual-consolidation/
    with the exact source/destination leaf pairs in scope; move the superseded November documentation plan to the
    existing documentation-information-architecture group. Use the scoped existing or group README for navigation,
    no additional index beyond group README. Compare archived bodies against exact originals; preserve historical
    substance, stopped outcomes, alternatives and actual temporal standing. Only minimal relative-link repairs and
    dated current orientation/status for manual charter/FTR01–10 are authorized; reconcile their delivery and independent
    acceptance against actual history without inferring Runtime promotion, unrelated product closure or beta release.
    Preserve reviews'' substantive bodies. Distill only conclusions clearly needed in an admitted current owner;
    do not duplicate operating contracts or invent new governance. Record a concise four-way assessment in the existing
    controlling backlog handoff.


    Review all actual consumers before deleting or modifying compatibility paths: five root pointers docs/wfc_operator_manual.adoc,
    docs/run-preparation.adoc, docs/self-development.adoc, docs/run-recovery-and-salvage.adoc, docs/successor_continuation_runbook_2026-10-10.adoc
    and three docs/operator_guide files in scope. Distinguish current functional readers, includes, scripts and
    tests from current navigation, historical textual references and frozen provenance. Preserve necessary shims
    and fragments with named concrete consumers, correct live references where within scope, and remove an obsolete
    shim only after verifying no actual consumer needs it. Never alter Python/tests or frozen evidence to force
    retirement. If a consumer cannot be addressed under this scope, retain a working bridge and report it. The accepted
    Runtime''s trusted-commit check may report only a rename destination for staged similar add/delete pairs and
    reject the exact changed-leaf set; consult docs/operator_manual/ch04_evidence/01_acceptance.adoc. Do not change
    Git settings or perform agent Git writes. Where necessary preserve source-path compatibility stubs and add cold
    leaves in the same Hop; explain temporary technical bridges and avoid presenting them as permanently required.
    Do not rewrite historical observations to eliminate textual matches.


    Update only scoped current navigation, backlog and affected manual links as needed; link current durable conclusions
    to their actual owners without requiring cold reading. Inspect active citations to distinguish current readers
    from dated provenance. Preserve active unrelated issue ownership, project memory, Run Ledger, historical Run
    evidence, source/test/governance, Runtime and Workflow Programs. All CommitIntent paths must list every actually
    changed repository-relative leaf exactly once, including additions and deletions, with a Conventional Commit
    subject containing WI-WFC-DOCUMENTATION-CURATION-C4-001 and the actual Hop ID as separate bounded tokens. No
    agent Git writes; review artifacts are reserved for review phases.


    Render changed AsciiDoc entries and assembled Operator Manual, check includes, fragments, local links and relevant
    incoming consumers, compare historical source/cold bodies with originals and run diff hygiene. Report what moved,
    remained, required distillation or bridges and validation limits. Agent-local tests are diagnostic; Coordinator
    task-check executes independently after publication, so do not block merely because downstream evidence has
    not yet run.


    A fresh independent broad reviewer must inspect the complete candidate and actual original Git sources, consumer
    references and historic records, not merely Worker summary. Check eligibility, current knowledge, historical
    meaning and stopped outcomes, authority, navigation/links/includes/fragments, real compatibility consumers,
    FTR completion evidence, and exact C4 boundaries. Compare archived bodies to original sources. Write the configured
    durable broad-review artifact. Raise only material blocking Findings; normal robust correction/focused review
    and renewed broad review apply. No extra Hops for cosmetic polish.'
  acceptance: Eligible selected bundles are selectively retired with historical meaning and current knowledge preserved,
    justified compatibility and current navigation, accurate evidence-qualified manual delivery status, validated
    AsciiDoc and links, fresh independent broad review accepting without blocking Findings, and Coordinator trusted
    task-check passing. Retain and report concrete unresolved dependencies rather than exceed scope.
  withheld_authority: No Python or tests, Runtime, Workflow Programs, Front Door, policies, governance contracts
    or machinery, Project Memory canonical data, Run Ledger or persisted evidence, active unrelated BUG/FTR ownership,
    P3.5/P4/P5 concepts, Gondolin/security investigations, active Beta-1 implementation, salvage branches or historical
    commits. No agent Git writes, extra Commission, C5, successor, push or Runtime promotion. Review artifacts reserved
    to review phases.
  escalation_default: Escalate only for a concrete obstacle requiring authority or genuinely Maintainer-owned decision;
    partial bounded retirement and pending downstream evidence alone are not blocked.
