task:
  title: Architecture design for the Level-0 MVP `simple` workflow capability
  body: |
    Design, for later separate implementation authorization, an
    implementable and deliberately SMALL architecture for the newly
    approved `simple` workflow capability (one bounded Worker invocation,
    self-check within that same invocation, no mandatory second agent
    invocation, no independent semantic reviewer, no correction/review
    loop disguised as simple execution, Coordinator-owned mechanical
    validation/provenance/fail-closed trust boundaries mandatory).
    `simple` is distinct from both `direct` and `robust`.

    Required reading before drafting, in full, as grounding fact rather
    than assumption:

    - docs/warm_storage/concepts/workflow_coordinator_program_capabilities_and_version_lifecycle_decisions_2026-10-31.adoc
      (the MVP scope decision and programme-capability/revision/schema/
      Runtime dimension distinction).
    - docs/backlog/_open.adoc (current backlog status and ordering).
    - docs/warm_storage/concepts/workflow_coordinator_level0_mvp_planning_decisions_2026-10-21.adoc.
    - docs/warm_storage/concepts/workflow_coordinator_front_door_commission_contract_design_2026-10-28.adoc
      (the Commission Intent/Compiler contract; sections 2.1, 4, 5.1, 5.2
      are the closed direct@v1/robust@v1 program grammar this design must
      extend without reopening).
    - docs/backlog/BUG-WFC-SELF-DEVELOPMENT-GATE-FINDING-AUTHORITY.adoc,
      including its FD-08 Direct-v1 dogfood section (RUN-82bf462135524ead8afa5c9c5ecd29e2):
      H002 opened blocking F001; H004 requested accept after correction
      with `finding_authority: []` and no authorized disposition path;
      the Coordinator correctly stopped `awaiting_human`. Treat this as
      the precise authority-composition shape `simple` must not reproduce.
    - docs/warm_storage/concepts/workflow_coordinator_p35_finding_reachability_design_2026-10-18.adoc
      (DRAFT, not accepted as implementation authority, but the current
      authoritative description of Finding-creation vs. disposition
      authority, the static reachability property, and exactly which
      current reducer.py/model.py/serialization.py lines implement each
      piece). Do not implement P3.5 or silently require it as a
      `simple` prerequisite.
    - governance/workflow-programs/direct/v1.yaml and
      governance/workflow-programs/robust/v1.yaml (the only two closed
      programme catalogue records the compiler currently accepts).
    - The existing, successfully executed compiled Robust-v1 Commission at
      governance/commissions/wfc-doc-authority-index-001/ (intent.yaml,
      profile.yaml, policy.yaml, task.md, work-item.yaml,
      render-manifest.json) as the primary schema and authoring precedent
      for how a programme is rendered and admitted.

    Use source inspection, not assumption, to establish what the current
    implementation actually supports, citing exact file/function/line
    locations, for:

    - Commission Intent parsing and compilation
      (src/workflow_coordinator/commissioning.py). Note as a starting
      fact, to verify and cite precisely: `_load_sources`'s
      `program_specs` mapping and `commission_intent_from_yaml`'s
      `required_personas` mapping both currently hardcode exactly the
      two pairs `("direct","v1")` and `("robust","v1")`; no `simple`
      catalogue path, template, or Intent persona requirement exists
      anywhere in that module today.
    - Operator preflight and phase admission
      (src/workflow_coordinator/operator.py, especially `_preflight`,
      `_admit_a1`, `_admit_evidence_disposition`, `_selected_evidence_names`).
    - Result projection and terminal routes
      (src/workflow_coordinator/model.py `select_result_contract`,
      `result_contract_version`, `RouteEffect`; reducer.py `_apply_route`,
      `_has_open_blocker`).
    - Trusted evidence scheduling and execution (operator.py's evidence
      dispatch and `_binding_evidence`/`_prepared_evidence_plan`, and
      reducer.py's evidence-failure routing via
      `failed_evidence_route`/`_admit_evidence_disposition`).
    - Run-native Finding creation and disposition (reducer.py
      `_finding_operation`, `_may_dispose`, `_apply_finding_deltas`,
      `_apply_legacy_finding_deltas`, `_apply_v2_finding_deltas`,
      `_apply_v3_finding_deltas`; model.py `FindingAuthority`,
      `ReviewDescriptor.finding_authority`).
    - Hop budgeting and completion rules (model.py `new_run`,
      `record_hop`, `Run.hop_remaining`; operator.py's
      `COORDINATOR_HARD_MAX_AUTONOMOUS_HOPS` ceiling; reducer.py's
      `AWAITING_HUMAN_BUDGET` dispatch-time enforcement).

    Do not treat the P3.5 design document's own line-number citations as
    still exact without independently re-verifying them against the
    actual Development HEAD read during this Run: cite only what you
    have yourself confirmed in the current source tree.

    ### Architecture design objective

    Produce one implementable, deliberately small design satisfying
    exactly the binding 2026-10-31 maintainer contract: exactly one
    Worker agent invocation during ordinary execution; the Worker
    performs its own self-check within that same invocation; no
    independent reviewer; no second agent invocation disguised as
    verification; no internal agentic correction loop; Coordinator-owned
    mechanical validation, provenance, and fail-closed trust boundaries
    remain mandatory; failed mandatory evidence or failed execution must
    not be silently accepted. It is acceptable for the Coordinator to run
    deterministic commands after the Worker invocation -- those are not
    agent invocations. The design must not assume the current runtime
    already supports this contract, and must not equate programme
    identity, programme revision, technical schema version, and Runtime
    revision (they are four distinct dimensions, per the 2026-10-31
    decision record section 5).

    Within that objective, the design document must work through:

    1. *Current implementation constraints.* Identify the exact locations
       where the current implementation requires or assumes: a review
       Gate for evidence execution; a second phase for successful
       completion; agent-produced routing outcomes; phase-specific result
       schemas; Findings and authorized Finding disposition; phase-based
       correction loops. Explain the minimum necessary changes to support
       a truly one-invocation programme.

    2. *One-invocation terminal semantics.* Define the permitted outcomes
       of a Simple run, at minimum distinguishing: Worker success and
       mechanical acceptance; Worker-reported failure; mechanical
       admission/commit/scope failure; failed mandatory trusted evidence;
       escalation requiring human authority; provider interruption or
       infrastructure failure. Determine whether current terminal/stop
       primitives can be reused unchanged; avoid inventing new statuses
       unless a concrete gap requires them. A Worker declaring success
       must not by itself override failed evidence or mechanical
       invariants.

    3. *Trusted evidence after the Worker.* This is a central design
       question. Evaluate concrete minimal alternatives, at least: (A) a
       post-Worker Coordinator-owned evidence check within the same Hop,
       requiring no agent dispatch; (B) reusing an existing supported
       execution/reduction seam with a non-agent terminal operation, if
       mechanically and semantically sound; (C) a narrower MVP contract
       with only certain evidence types initially supported, if that is
       the only safe incremental solution. Compare actual implementation
       impact, provenance, recovery behavior, and compatibility with the
       current profile/result contracts. Recommend exactly one smallest
       viable design with explicit reasons. Do not create a general
       evidence pipeline or new orchestration subsystem.

    4. *Finding semantics.* Analyze the FD-08 Direct-v1 defect
       (RUN-82bf462135524ead8afa5c9c5ecd29e2) precisely. For `simple`,
       define whether Run-native Findings are: disallowed by the
       execution contract; permitted only with constrained
       terminal/escalation semantics; or supported through some
       genuinely reachable disposition mechanism that does not require a
       second agent invocation. Trace the actual current reducer/result
       contract and identify exactly where enforcement would occur.
       Recommend the smallest coherent design; do not merely assume that
       a worker with no review descriptor cannot open Findings -- source
       inspection (`_finding_operation`/`_apply_legacy_finding_deltas`)
       is required to settle this. Do not implement P3.5 or silently make
       it a `simple` prerequisite.

    5. *Front Door/compiler integration.* Describe the minimum closed
       `simple@v1` programme catalogue record and Commission Intent
       bindings needed. Reuse existing compiler, policy, and component
       mechanisms. Clearly separate programme-declared behavior,
       maintainer-authored Commission inputs, and runtime-enforced
       invariants. No editable workflow DSL, generic agent framework,
       capability registry, or historical profile migration.
       `direct@v1` and `robust@v1` behavior must remain unchanged unless
       a genuinely shared, backward-compatible correction is technically
       essential and justified.

    6. *Verification strategy.* Specify focused positive and negative
       tests proving: exactly one agent invocation; success when all
       required conditions hold; evidence failure cannot be accepted;
       unauthorized changed paths cannot be accepted; provider failure
       does not fabricate completion; no stuck Run-native blocking
       Finding can be silently terminally accepted; source/provenance and
       executable identity remain correct; existing Direct-v1 and
       Robust-v1 behavior is not regressed. Tests must distinguish agent
       invocation count from Coordinator-owned subprocess/evidence-command
       count. The eventual first dogfood should be a small but real
       maintenance task, not a synthetic success-only fixture.

    ### Required design document contents

    Write the main architecture design document with exactly these
    twelve elements, identifiably structured (e.g. as numbered sections):

    1. Requirements and explicit non-goals.
    2. Current-code assessment with source references (file/function/line).
    3. Proposed Simple programme and finite execution lifecycle.
    4. Exact one-invocation contract.
    5. Trusted evidence scheduling and failure behavior.
    6. Findings and terminal-state semantics.
    7. Required minimal schema/compiler/operator/reducer changes, if any.
    8. Comparison of alternatives and rationale for the chosen design.
    9. Trust-boundary and provenance preservation.
    10. Focused test and real dogfood acceptance plan.
    11. A proposed bounded implementation WorkItem with candidate file
        scope.
    12. Unresolved decisions requiring maintainer authority.

    Avoid a broad multi-slice implementation roadmap. The aim is one
    small, implementable vertical slice, not a platform.

    ### Independent review mandate

    The independent reviewer must challenge the design, not summarize
    it, and must specifically test and record findings on whether: the
    proposed Simple path truly invokes the agent exactly once; any
    failure requires an undocumented second invocation; evidence runs at
    the correct lifecycle boundary; the proposed result/route contract is
    representable and enforceable against the actual current model/
    reducer/serialization code; Finding creation cannot produce another
    unresolvable governance dead end of the FD-08/BUG-WFC-SELF-DEVELOPMENT-GATE-FINDING-AUTHORITY
    shape; the Coordinator does not silently treat an agent's
    self-assessment as trusted evidence; scope, Git, executable
    provenance, and trust invariants remain intact; the proposed changes
    are genuinely minimal; the design leaves P3.5 deferred and existing
    programme revisions untouched; and the negative regression tests
    (element 10 above) are sufficiently concrete. Do not weaken the
    review to obtain acceptance; disposition any Finding you open using
    the authority this Commission's rendered profile actually grants you.

    ### Scope note (known, unrepaired limitation)

    You (the Worker) are instructed to create or correct ONLY the main
    architecture design document listed in this Commission's scope,
    even though the rendered Robust-v1 worker-phase `authorized_scope`
    is mechanically broader and also contains both review-artifact
    paths (see docs/backlog/FTR-WFC-PHASE-WRITE-SCOPE-ARTIFACT-ISOLATION.adoc).
    Reviewer-authored artifacts are reserved for the independent
    reviewer. Do not attempt to repair that separate, already-recorded
    scope-isolation limitation in this Commission; it is out of scope
    here.

  acceptance: |
    The main architecture design document exists at the path this
    Commission's scope and durable-artifact bindings designate and
    contains all twelve required elements listed in the task body,
    identifiably structured. The broad and focused review artifacts
    exist at their designated paths and record a genuine independent
    adversarial review against the nine-point mandate in the task body,
    with any Finding disposed using only the authority this Commission's
    rendered Robust-v1 profile actually grants, and with no blocking
    Finding left open at completion. The design: maps the exact current
    implementation constraints with file/function/line citations rather
    than assumption; defines one-invocation terminal semantics reusing
    current primitives wherever sufficient; recommends exactly one
    smallest-viable trusted-evidence design among concrete alternatives;
    resolves Finding semantics for a review-less single invocation by
    source inspection, not inference; proposes the minimum closed
    `simple@v1` catalogue/compiler/Intent surface without a workflow DSL
    or capability registry; and leaves `direct@v1`, `robust@v1`, and
    P3.5 entirely unchanged and undecided beyond what this Commission
    authorizes. The design is one small implementable vertical slice,
    not a multi-slice roadmap.

  withheld_authority: |
    No production implementation, source-code edit, test, governance
    change, kernel change, new schema, Runtime promotion, Evidence
    mutation, cleanup, nested WFC invocation, external push, or P3.5
    implementation. No new programme catalogue entry is created by this
    Run; only the design document and its two review artifacts may be
    written. All code, tests, governance, backlog, programme
    definitions, and other documents outside this Commission's scope are
    read-only investigation inputs. The Worker must touch only the main
    design document; the two review-artifact paths are reserved for the
    independent reviewer, notwithstanding the Robust-v1 worker-phase
    scope-isolation limitation noted in the task body, which this
    Commission does not attempt to repair. No automatic authorization of
    a subsequent implementation WorkItem is granted by completing this
    design.

  escalation_default: |
    Stop and request maintainer authority if: the required analysis
    cannot be completed without modifying production code, tests, or
    governance inputs; accurately mapping a current implementation
    constraint would require assuming unverified runtime behavior that
    cannot be confirmed by reading the pinned source tree; no design
    satisfying the exact one-invocation contract can be produced without
    a kernel change broader than what the current-implementation-
    constraints analysis concretely identifies as necessary; or a
    reviewer-opened Finding cannot be disposed within this Commission's
    own granted Finding authority and ordinary Robust-v1 correction flow.

