task:
  title: Document the Direct-v1 Commission quickstart
  body: |
    Extend docs/wfc_operator_manual.adoc with a concise,
    reproducible quickstart for the new Commission CLI.

    Explain commission render, commission check, source pins,
    the rendered governing artifacts, and the required Git
    commit between rendering and checking.

    Distinguish non-authoritative rendering, canonical
    admission, and separately authorized launching.

    Reuse the existing documentation. Avoid duplicating
    unrelated sections or redesigning the workflow.

  acceptance: |
    The manual contains one accurate and compact quickstart
    showing the actual CLI syntax and the operator sequence.
    The AsciiDoc remains valid. No unrelated files change.

  withheld_authority: |
    No changes outside docs/wfc_operator_manual.adoc.
    No production code, tests, governance modifications,
    Runtime promotion, external push, or WFC launch.

  escalation_default: |
    Stop and request maintainer authority if the requested
    documentation cannot be completed within the scope.

