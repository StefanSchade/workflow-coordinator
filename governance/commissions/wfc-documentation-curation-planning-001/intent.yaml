task:
  title: Plan documentation curation for Beta-1 and beyond
  body: 'Inspect the actual repository selectively before planning: docs/README.adoc, docs/ai_info/_ai_info.adoc
    and doc_conventions.adoc, operator_manual/, functional_model/, semantic_model/, technical_model/, developer_guide/,
    architecture.md, backlog/README.adoc and _open.adoc, warm_storage/, cold_storage/, research/context_sculpting_and_knowledge_lifecycle.adoc,
    warm_storage/concepts/wfc_documentation_consolidation_plan.adoc, relevant recent Development commits and existing
    Beta-1 backlog consolidation. Sample representative documents and tree, not every historical file. The modular
    Operator Manual is the principal structural precedent. Check implemented work and prior Maintainer decisions;
    do not simply restart old batches. Gondolin feasibility is exploratory and in review, inspect read-only if useful;
    do not merge it or promote its authority. Bubblewrap salvage is not a migration source to silently adopt.


    Produce an implementation-ready, current backlog plan with 2–6 coherent ordered packages, preferably about four,
    for later separately authorized Commissions; do not execute them. First check whether an existing active backlog
    record owns this work; reuse it if appropriate within scope, otherwise create at most one umbrella record docs/backlog/FTR-WFC-DOCUMENTATION-CURATION.adoc,
    linked from _open.adoc. The old consolidation plan currently claims ownership: update only its current orientation/status
    to hand over clearly to the controlling backlog record, preserving its historical execution narrative, analysis
    and decisions. Update the agent-facing router only if needed for unambiguous entry. No redundant index. Each
    package must specify purpose and improvement, concrete source and destination areas and document types, dependencies
    and sequence, what remains untouched, practical acceptance checks and risks (knowledge loss, broken links, incorrect
    authority). Packages should be substantial yet bounded, maintain an understandable intermediate state, and enable
    separate Maintainer authorization without pre-authorizing future Runs.


    Plan complementary responsibilities for Operator Manual, Developer Guide, architecture overview and current
    Functional, Semantic and Technical Models. Give durable present-system knowledge clear entry points, meaningful
    hierarchy and subject ownership, manageable chapters as appropriate, cross-references, minimal loose top-level
    growth and natural future homes. Do not split small documents unnecessarily or enforce uniform chapter counts.
    Classify representative root-level and loose documents as canonical entry, chapter, active working document,
    compatibility pointer or inactive long-term material; preserve useful stable links without permanent obsolete
    aliases.


    Current knowledge contains durable conclusions needed to understand, maintain, develop and operate the present
    system. Warm holds relevant investigations, unresolved alternatives, active planning and developing concepts.
    Cold is long-term memory outside normal active context, not a graveyard of invalid work: preserve earlier understanding
    and history, original concepts and rationale, alternatives and rejected approaches, completed reviews and investigations,
    valid but currently irrelevant ideas, parked plans and provenance. Inactivity does not imply invalidity; selective
    retrieval does not automatically grant current authority. Make this unmistakable in proposed durable conventions
    and orientation using existing governance, no new metadata or lifecycle states. Before moving completed warm
    material to cold, distinguish conclusions already incorporated in canonical sources, conclusions still needing
    distillation, historical/exploratory reasoning to preserve and concepts that should stay warm. Do not propose
    wholesale migration by age or location or exhaustive historical reading.


    Provide a coherent pre-Beta-1 historical boundary using established pre-0.1.0b1 grouping, considering completed
    FTRs and BUGs, reviews, old backlog, design discussions and provenance. Retain genuinely active backlog under
    current ownership. Historical completion is not evidence of Runtime promotion or trusted acceptance; do not
    imply Beta-1 has released. Distinguish authority, knowledge and historical evidence; preserve Project History
    and semantic Run Ledger as temporally situated evolution, not rewritten to reconcile earlier observations with
    later knowledge. Correct factual mistakes only where appropriate. The deterministic trust/execution contract
    remains narrow; no governance expansion, extra approvals, mandatory metadata, statuses, exhaustive completeness
    checks, one record per migration, indiscriminate blockers or repeated contract text. Practical consolidation,
    not a governance initiative.


    Render changed AsciiDoc entry points and check relevant includes, links, scope and diff hygiene; report diagnostic
    limitations. Coordinator-required task-check is independent and follows publication; do not block merely because
    downstream evidence has not yet run or an agent-side check is unavailable. CommitIntent must contain every actual
    changed repository-relative leaf exactly once and a Conventional Commit subject with WI-WFC-DOCUMENTATION-CURATION-PLANNING-001
    and actual Hop ID as separately bounded tokens; agents do not write Git commits. Review artifacts are reserved
    for review phases.


    Fresh independent broad reviewer must inspect the entire candidate against actual repository contents, not just
    Worker summary, and write the configured durable artifact. Check: future destinations for durable content; cold
    as inactive long-term memory; distillation before retirement; actionable, ordered, bounded packages; reuse of
    consolidation and governance; authority/knowledge/evidence boundaries; proportionality; unambiguous backlog
    ownership and future authority; proposed moves and archive boundaries against actual tree; only genuinely Maintainer-owned
    open questions. Identify concrete blocking Findings and route correction normally; do not spend Hops polishing
    adequate prose. Focused review handles corrections, followed by renewed broad review as configured.'
  acceptance: A source-grounded, actionable controlling backlog plan with 2–6 ordered bounded packages, unambiguous
    handover and navigation, independently accepted broad review without open blocking Findings and Coordinator
    trusted task-check; no cleanup implementation or governance expansion.
  withheld_authority: No actual restructuring or bulk moves, large-scale distillation, Python or tests, Runtime
    or Workflow Programs, canonical Run evidence, Project History or semantic Run Ledger, migration Commissions,
    salvage resolution, branch merging, MCP/RAG/embeddings/context sculpting implementation, new governance framework
    or historical inventory requirements. No agent Git writes, outside-WFC provider calls, successor, extra Commission,
    push or Runtime promotion. Review artifacts reserved to review phases.
  escalation_default: Escalate only for a concrete obstacle requiring authority or a genuinely Maintainer-owned
    decision; incomplete work alone is not blocked.
