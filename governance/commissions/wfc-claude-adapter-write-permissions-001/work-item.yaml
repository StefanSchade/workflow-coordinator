authority_source: 'Maintainer directly authorizes Commission authoring (render + commit
  + `commission check` only; no `prepare`, no `launch`, no provider invocation) of
  a bounded `robust@v1` correction for the live permission mismatch recorded in `docs/backlog/BUG-WFC-CLAUDE-ADAPTER-WRITE-PERMISSION-MISMATCH.adoc`.
  This authorization is for Commission authoring only; it is not authorization to
  implement the fix directly, to launch WFC, or to invoke an authenticated provider.

  Baseline verified against Git immediately before writing this Intent: Development
  `HEAD` is `9f4dcfc0184e689e15066c7d272fccb66e8d859a` ("docs(backlog): record Claude
  adapter write-permission mismatch"), one commit ahead of `a152ad2` ("docs(commission):
  prepare first Claude Opus simple@v1 qualification run"); the working tree is clean.
  `a152ad2` is therefore stale as a current-baseline reference and is not used for
  any source pin below; every `source_commit` in this Intent instead pins the verified
  current `HEAD`, `9f4dcfc0184e689e15066c7d272fccb66e8d859a`.

  Bug record used: `docs/backlog/BUG-WFC-CLAUDE-ADAPTER-WRITE-PERMISSION-MISMATCH.adoc`,
  committed at `9f4dcfc0184e689e15066c7d272fccb66e8d859a` together with its `docs/backlog/_open.adoc`
  card (status `NOW`). That record documents two live qualification attempts under
  Commission `wfc-simple-v1-maintainer-principles-001` against Claude Code CLI `2.1.270`
  and Runtime commit `5cf0fe1a`: the first, `wfc-claude-opus-simple-20261102-01`,
  failed before agent execution on a since-resolved missing-`socat` local dependency
  and is not this record''s subject; the second, `wfc-claude-opus-simple-20261102-02`,
  ran successfully at the provider-transport level (CLI exit 0, a valid correlated
  structured result, no timeout, `task-check` passing, no Git change) but had `Write`
  to the WFC-authorized, not-yet-existing `docs/developer_guide/maintainer_principles.adoc`
  and `Bash mkdir -p docs/developer_guide` both denied by the Claude Code CLI''s own
  permission layer, with no interactive approval surface, inside the exact scope (`docs/developer_guide`)
  that Commission `wfc-simple-v1-maintainer-principles-001`''s rendered `profile.yaml`
  explicitly authorized (`authorized_actions: [edit, commit]`, `authorized_scope:
  [docs/developer_guide]`). WFC''s own scope/Finding mechanics behaved correctly throughout
  (clean `awaiting_human` stop, no Git change); the bug record itself classifies this
  as a provider-adapter effective-permission gap, not a Coordinator authority defect,
  and records two unconfirmed mechanism hypotheses -- permission-mode override under
  `CLAUDE_CODE_SUBPROCESS_ENV_SCRUB` forcing the CLI''s interactive default permission
  mode back on while `--permission-prompts none` converts every resulting ask into
  an outright denial; and the generated settings JSON defining no write-scope-equivalent
  field at all -- neither confirmed, both requiring investigation before correction.
  The run evidence directories under `~/wfc-state/wfc-claude-opus-simple-20261102-01`
  and `-02` are maintainer-local and are not a dependency of this Commission''s worker:
  every reproduction fact the worker needs is already recorded in the bug record and
  reiterated in the rendered task below.

  This Intent authorizes only the bounded investigation-then-correction described
  in the rendered task: establishing the actual causal mechanism from the two hypotheses
  above (or another the Worker independently finds), implementing the narrowest correction
  such investigation actually supports, and having it independently reviewed -- never
  adoption of either hypothesis as an established root cause without the Worker''s
  own evidence, never a nested or independently initiated live authenticated provider
  invocation by either agent (as distinct from the normal WFC-managed Codex `worker`/`independent_reviewer`
  dispatch that this Commission''s own subsequent, separately authorized `prepare`/
  `launch` explicitly intends and would authorize), and never promotion to Runtime
  or a WFC launch from this authoring act itself.'
