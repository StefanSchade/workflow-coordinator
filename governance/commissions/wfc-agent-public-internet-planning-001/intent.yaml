task:
  title: Plan the agent public internet capability
  body: 'Planning and documentation only: investigate and update the existing controlling docs/backlog/FTR-WFC-AGENT-PUBLIC-INTERNET-CAPABILITY.adoc
    and current planning navigation in docs/backlog/_open.adoc. First inspect that FTR, FTR-WFC-EXECUTION-TRUST-BOUNDARIES.adoc,
    Functional Model GOAL-WFC-004, backlog overview, actual accepted Runtime source at the separately pinned Runtime
    checkout and current Development src/workflow_coordinator/{claude_adapter,codex_adapter,adapter,evidence,execution_boundary}.py,
    their conformance/integration tests, relevant Claude live qualification and nested-bwrap investigations, and
    provider-independent sandbox/bubblewrap research. Distinguish Runtime-N from Development-N+1 and source/configuration
    from observed effective behavior; inspect representative material, not all historical files. Preserve the November
    9 Maintainer decision: ordinary public internet is a regular development-agent capability; WFC must not impose
    an unjustified blanket restriction by default. Do not replace it with blanket deny plus per-request permission.
    The Maintainer now explicitly authorizes this planning-only investigation before Claude adapter completion,
    even if still outstanding; update the FTR''s current scheduling orientation and backlog navigation to state
    this change without erasing the historical decision. This does not waive outstanding adapter qualification,
    change its status, or authorize implementation.


    Provide a source-grounded current-state/gap analysis covering Claude generated network.allowedDomains, WebFetch/WebSearch
    permissions, tool availability and shell-based network behavior; Codex CLI actual sandbox arguments and effective
    network configuration; distinguish provider authentication transport, agent-initiated public web, localhost
    APIs, package downloads and Coordinator-owned evidence. Do not infer actual network behavior merely from configuration,
    or equate provider traffic with agent shell traffic. Investigate whether each limitation is WFC-authored, provider
    default, host/nested sandbox, provider/version behavior or still unknown. Separate provider-documented capabilities,
    directly evidenced current code/configuration, assumptions and questions; identify exact file/line or stable
    section and version where possible. No live authenticated provider-network experiment, no private networks,
    internal services or secrets; no modifications to configuration or host networking.


    Evaluate a bounded implementation direction and alternatives, including provider-supported configuration alone
    versus WFC-owned mechanisms only where evidence warrants. Preserve filesystem boundaries, credential protection,
    trusted Git mutation and independent Coordinator evidence. Address sensitive/protected-context needs proportionately
    under existing FTR-WFC-EXECUTION-TRUST-BOUNDARIES without silently expanding to DLP, full information-flow policy,
    credential broker or new governance. Consider nested sandboxes and future WFC-owned bubblewrap without claiming
    current provider-dispatch integration. Do not presume domain allowlists, network proxies, sidecars, per-task
    permission profiles or new Commission schemas. Distinguish desired regular ordinary access from context-specific
    constraints and the existing governed authority envelope; no implementation is authorized.


    Provider documentation leads supplied by operator''s read-only retrieval on 2026-11-16: https://code.claude.com/docs/en/sandboxing
    describes sandbox allowedDomains as governing sandboxed Bash domains, while in-process tools use permission
    rules; https://developers.openai.com/codex/config-reference documents sandbox_workspace_write.network_access
    as controlling outbound access inside workspace-write. These are current vendor documentation leads, not proof
    of the installed version''s effective settings, compatibility, or actual network access. If accessible verify
    against vendor sources/version and cite them, and if unavailable label them explicitly as supplied documentation/uncertainty;
    do not introduce a live-network qualification requirement or block because an agent sandbox cannot browse. Avoid
    claiming an empty allowedDomains entry alone proves all shell/localhost traffic is blocked. Provider docs may
    describe newer CLI versions; distinguish that from pinned implementation and future qualification.


    In the existing FTR, provide a minimal ordered set of separately acceptable implementation/qualification packages,
    each with purpose, bounded deliverable, dependencies (including unfinished Claude qualification), acceptance
    and deterministic offline test strategy plus separately authorized live integration tests where truly needed.
    State the smallest useful first implementation slice and what can/cannot be concluded without live access. No
    fixed package count. Do not duplicate the controlling FTR with an umbrella. Only create a subordinate record
    if genuinely justified by distinct delivery and independent acceptance, using one of the exact scoped candidate
    leaves; otherwise keep packages in the controlling FTR. Optional focused technical analysis may use only the
    scoped warm leaf if it materially reduces duplication. Update only the relevant current planning summary/navigation
    in _open.adoc; preserve unrelated priorities and distinguish the planning-in-advance authorization from implementation
    readiness. Future implementation Commissions are recommendations, not pre-authorized.


    Render changed AsciiDoc and check relevant local links, source references, scope and diff hygiene. Report local
    diagnostics and limitations. Coordinator task-check follows publication independently; do not block merely because
    downstream evidence has not run or an agent sandbox cannot access external websites. CommitIntent must list
    each actually changed repository-relative leaf exactly once with no unchanged files; Conventional Commit subject
    includes WI-WFC-AGENT-PUBLIC-INTERNET-PLANNING-001 and actual Hop ID as separate bounded tokens. No agent-owned
    Git writes. Review artifacts reserved to review phases.


    Fresh independent broad reviewer must inspect entire candidate against actual source, accepted Runtime, existing
    records and provider-documentation evidence, not just Worker summary. Verify ordinary internet decision, actual
    versus hypothetical constraints, planning scheduling and Claude qualification, existing trust-boundary ownership,
    package deliverables/dependencies/acceptance, source and documented-versus-unknown claims, no unnecessary permissions/proxies/policy
    machinery, and no implied implementation authority. Examine evidence behind specific configuration semantics
    and reject overly broad statements not supported by actual sources. Write configured durable broad-review artifact.
    Block material defects only; normal robust correction/focused review and renewed broad review apply.'
  acceptance: Source-grounded current state, qualified provider documentation, bounded ordered implementation/qualification
    packages and smallest first slice in the existing controlling FTR, scheduling clarification and current backlog
    navigation, fresh independent broad review without blocking Findings and Coordinator trusted task-check pass.
    No implementation or network qualification.
  withheld_authority: No source, tests, adapter settings, provider execution configuration, Runtime, Workflow Programs,
    Commission schemas, policy or execution boundaries, network/firewall/host configuration, Project Memory, Run
    Ledger, persisted evidence, historical reviews or frozen Commissions. No authenticated provider-network experiment
    beyond WFC invocations, live network qualification, private/internal network or secrets probing, agent Git writes,
    extra Commission, successor, push or Runtime promotion. Review artifacts reserved to their review phases.
  escalation_default: Escalate only for a concrete obstacle requiring authority or a genuinely Maintainer-owned
    decision; unavailable external browsing and pending downstream trusted evidence alone are not blockers.
