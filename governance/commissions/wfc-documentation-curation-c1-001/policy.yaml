schema_version: 3
policy_id: repository-standard
revision: v1
scope:
- workflow-coordinator
governance_paths:
- governance
work_item_scope_ceiling:
- docs/README.adoc
- docs/ai_info/_ai_info.adoc
- docs/ai_info/doc_conventions.adoc
- docs/backlog/README.adoc
- docs/cold_storage/README.adoc
- docs/backlog/FTR-WFC-DOCUMENTATION-CURATION.adoc
- docs/backlog/_open.adoc
- docs/warm_storage/concepts/wfc_documentation_curation_c1_001_broad_review.adoc
- docs/warm_storage/concepts/wfc_documentation_curation_c1_001_focused_review.adoc
max_autonomous_hops: 10
actions:
- edit
- commit
- review
evidence_commands:
  task-check:
    argv:
    - python
    - -m
    - pytest
    - -q
    timeout_seconds: 900
