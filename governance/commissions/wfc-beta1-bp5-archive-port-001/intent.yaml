task:
  title: Port the existing mechanical Evidence archiver into WFC
  body: 'Implement only BP5 of docs/backlog/beta1_execution_plan.adoc. BP3 is product accepted in RUN-6538d0568bce47a899dab7677ea9c2e1,
    review 44f4cfe, evidence bc65ff7. Port the existing canonical Evidence archiver and wrapper to installed `wfc
    archive`; preserve its bounded allowlist, mechanical facts, digest verification, identity and destination confinement,
    no-clobber rules and scoped commit. Reuse accepted `git_facts.bounded_path_commit` without changing its semantics;
    no Git hooks, uncontrolled staging or writes to sources. Integrate staging/atomic placement and safe retry: a
    kill between copy and commit yields exactly one commit with identical archive; a completed identical repeat is
    a no-op, and interrupted/partial placement cannot silently overwrite mismatching material. Unrelated dirty paths
    must remain untouched under the narrow permitted cleanliness rules, and unauthorized staging, destination escapes,
    symlink escapes and inconsistent identities must be refused. No changes to the actual Evidence repository except
    normal separately orchestrated archive of this Run.


    DG-2 maintainer decision: ship the separate Git Evidence repository first in Beta 1. Repository-local archive
    is an explicit post-Beta follow-up owned by Maintainer at first post-Beta planning; do not implement it in BP5
    or confuse it with raw retention. Do not rewrite DEC-WFC-023 or implement BP6 projection/retention.


    The exact legacy files and real retained Run are staged read-only for reference in `build/wfc/bp5-evidence-inputs/`,
    with source commit bc65ff777bb75602792e416519a7a3025d723c67 and SHA-256 provenance: `scripts/archive_run.py`,
    `scripts/archive_proof.py`, `scripts/wfc-archive-run`, both `tests/test_archive_helpers.py` and `tests/test_wfc_archive_run.py`,
    and archived RUN-6538d0568bce47a899dab7677ea9c2e1. Treat these as input, never mutate the Evidence repository.
    Copy the old implementation and conformance tests semantically into scoped product/tests, preserving all applicable
    checks and documenting any unavoidable non-applicable legacy-proof case; do not invent a replacement smaller suite.
    Committed tests must be portable and not require the ignored staging path.


    Demonstrate old-vs-new on the same real retained Run into two disposable Git Evidence repositories using the established
    old wrapper/archiver and new installed module. Compare all copied-file SHA-256 values and archive facts exactly,
    allowing only the plan''s documented archived_at timestamp difference. Old wrapper requires state-root/OPS location
    match; if sandbox isolation requires relocating archived state, make a disposable working copy, document and restrict
    any path metadata relocation, verify source provenance, use exactly the same resulting state root and OPS inputs
    for both archivers, and report it explicitly; never modify the canonical archive, fabricate run facts or weaken
    the comparisons. If a trustworthy real-run equivalence cannot be performed under these boundaries, stop and escalate
    rather than claim it passed. Prove idempotence, interruptions/retry and one destination-only commit in disposable
    Git repositories; test scope/identity/conflict refusals. Record exact comparison commands, output, source provenance
    and exceptions in review evidence.


    Preserve all existing regression assertions, use offline inputs, no network dependency, no self-development runtime
    change. Coordinator task-check is mandatory. Worker produces scoped product, test and only necessary operator/developer
    documentation, no premature acceptance claims. Independent Opus review must inspect actual code and tests, verify
    equivalence against the existing implementation and conformance coverage, retry safety and Git boundaries. A reproduced
    explicit acceptance violation is a blocking Finding; use correction/focused/fresh broad review as configured.
    `finding_authority: [resolve]` does not authorize `residual`; put new nonblocking observations in review artifact
    and summary, not unauthorized authoritative Finding transitions. Exact CommitIntent paths and conventional subject
    containing WI-WFC-BETA1-BP5-ARCHIVE-PORT-001 and the actual Hop ID. No agent Git writes.'
  acceptance: Installed wfc archive ports canonical behavior and existing applicable conformance tests; same real
    retained Run produces identical copied-file digests and facts between old and new except archived_at; idempotent
    repeat and interrupted copy-to-commit retry produce exactly one scoped commit; negative confinement, identity,
    unauthorized staging and unrelated dirty-path tests pass; independent review and full Coordinator task-check pass.
  withheld_authority: No BP4 lifecycle, BP6 projection/retention, local-destination implementation, changes to actual
    Evidence repository or its source scripts, runtime, provider, reducer, compiler, programs, BP3 trusted Git primitive,
    extra Commissions, push, merge or rebase.
  escalation_default: Escalate inability to obtain real-run equivalence, missing source/test access, real task/scope
    conflict or a need to change an excluded authority boundary.
