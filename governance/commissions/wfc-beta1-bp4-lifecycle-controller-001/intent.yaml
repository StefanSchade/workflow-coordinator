  id: robust
  revision: v1
  source_commit: 8b5b7c6320cc67860146aceb16955c893d9f6e74
task:
  title: Add the installed autonomous lifecycle controller (wfc run, resume, status)
  body: |
    Implement BP4a, the Beta-1 lifecycle controller, in the installed Front Door. Baseline is the current Development HEAD; BP1-BP3 and BP5 are present. Governing decisions: DG-3 Variant B and the "Package boundary and detail decisions, 2026-11-19" paragraph in docs/backlog/beta1_productization.adoc (BP4); BP4 in that file and BP4a in docs/backlog/beta1_execution_plan.adoc. Read them and the existing BP2b/BP3 modules (frontdoor/config.py, request.py, verify.py, plan.py, git_facts.bounded_path_commit); reuse, do not reimplement them. No Linux subreaper, no supervising host, no process-tree supervision, no `wfc stop`. Candidate preservation is NOT part of this Commission (BP4b).

    Boundary: the controller is a thin driver ABOVE the unchanged engine. It starts the existing operator entry as a separate process (the legacy bare-flag path of the installed package) with a fresh external state root and an execution-bindings file written outside the repository. It must not duplicate or modify reducer, Finding, review, routing, adapter, admission (operator.admit_parsed) or trusted_commit logic, and may only READ persisted engine facts (run.json, checkpoint.json, operator-summary.json, checkout-association.json, operator-plan.json) for classification.

    Engine start/persistence contract (verified in source, rely on it and document it): the engine process first runs read-only preflight, then creates the state root with an exclusive mkdir, writes operator-plan.json, registers the checkout, and only then, per Hop, writes run.json and a dispatch marker BEFORE any provider invocation. Consequently an absent state root means no provider dispatch is recorded, but it does NOT prove that no engine process was ever started, or is not still in its pre-state phase.

    Deliver (installed package, no consumer-specific code):
    1. `wfc run` / `wfc resume` / `wfc status` dispatched from frontdoor/cli.py. The legacy operator subcommand `wfc status --state-root ...` must keep working unchanged: the new status is dispatched only when `--state-root` is absent; both paths covered by tests. `wfc plan`, `wfc init`, `wfc archive` and the bare-flag preflight are not modified.
    2. Lifecycle order, each step journaled write-ahead (intent record fsynced before the effect, completion record after): compile and compute the Commission digest (compiled files plus the request file) and the execution-envelope digest; ONE authorization of both digests, interactive or `--yes` (no TTY and no `--yes` exits promptly as refused with no side effect); pre-launch checks (provider executable exists/is executable with sha256 and path recorded, package implementation identity recorded, clean tree at expected HEAD, journal root disjoint from the repository, no active lifecycle for this checkout, fresh engine state root); baseline probe (the configured evidence command once on the clean baseline, ONLY after authorization and BEFORE the Commission commit; failure, timeout, unresolvable executable or any tree mutation is refused honestly, reported as "no provider ran", never auto-cleaned, and creates no Commission commit); Commission commit via git_facts.bounded_path_commit (compiled files plus the request file as new exact leaves; the Consumer Config must already be committed and is never initialized implicitly); verify_commission at the new HEAD; engine launch; wait; classification. Later execution stays bound to the authorized digests and recorded identities.
    3. Durable lifecycle journal under `$XDG_STATE_HOME/wfc` (fallback `~/.local/state/wfc`), append-only JSON lines with per-record length and digest, fsync, a stable identity per canonical checkout (hash of the resolved top-level and git common dir, so symlinked paths map to one identity), refusal if the root is equal to, inside or containing the repository or its git dir. A torn final record is ignored; any other corruption refuses. Journal schema v1 reserves the record-kind namespace `ext.*`: such records may follow the final `classified` record, are digest-verified, are treated as opaque and ignored for every decision, and are shown only as a count by status. This is the extension point BP4b will use; do not implement preservation.
    4. Ownership lock: a plain exclusive `flock` per canonical checkout, taken before any lifecycle effect, handed to the engine child alone via pass_fds so that a still-running engine keeps holding it after the controller dies (provider descendants must not inherit it; they are spawned with close_fds by the engine). A held lock means "something launched by this lifecycle may still run"; a free lock means no holder remains. This is ownership evidence only: not supervision, not a quiescence proof, not proof that the engine never started. Expose a small lock-query function for BP4b. Test the inheritance with real processes (kill -9 the controller, engine survives, lock still held).
    5. Launch records: `launch_intent` (fsynced before spawn), then `launch_spawned{pid, start time}` after Popen returns, or `launch_failed_no_engine` only when the spawn call itself failed synchronously (this alone proves no engine exists). `resume` never launches after any launch_intent unless the latest record is launch_failed_no_engine (then at most 3 launch attempts in total, each journaled). A launch_intent without spawned/failed record, or any other ambiguity, is `uncertain_launch`: refuse, no spawn, regardless of lock or state-root status. launch_spawned with lock free and absent state root is `engine_exited_before_state` (no relaunch; truthfully "no provider dispatch recorded"). Lock held is `engine_active` (poll only).
    6. `resume`: finishes mechanics from the journal only. Never recommits (adopt an existing commit only if parent, subject, exact paths and tree match the journaled digests, else refuse), never resumes or repairs a Run, Hop or session, never reconciles. After `classified` it is a no-op that prints the recorded classification.
    7. Classification from persisted engine facts, never from process exit code or summary-file existence alone: `completed` requires run.json completed AND a consistent summary AND a clean worktree; `awaiting_human`, `awaiting_human_budget`, `reconcile_required`, `stopped` are reported as recorded; engine not running (lock free) with a non-terminal run.json (including a pending dispatch marker) is `interrupted`; contradictions are `inconsistent` (refuse, no effect). The `classified` record carries Run ID, run status, end head, state root and checkout state paths (BP4b will read them). Distinct, documented exit codes. The controller itself never mutates the repository during classification.
    8. Tests: fake provider and fake engine fixtures; crash injection at every step boundary; real fork/kill tests for lock inheritance; legacy/new status dispatch; `wfc plan` still executes no project command. Document the Beta-1 limitations (Coordinator crash and surviving provider processes, no quiescence proof, one adapter per Run, uncertain launch refusal) in a developer-facing limitations record, not the operator manual (BP7 owns it).

    Hard rules: no preservation (git_facts.py and bounded_path_commit/trusted_commit are NOT modified); no archive or report integration (BP6); no same-Run Hop recovery, continuation, lineage or successor logic; no new supervision; no engine change; no global Git configuration change; execution bindings never enter the Commission bytes; no network, no pip, no provisioning of project environments; Python 3.10-3.13 stdlib only; kernel modules never import frontdoor. CommitIntent: name every changed/new/deleted leaf individually, never directories; avoid rename-shaped changes (BUG-WFC-TRUSTED-COMMIT-RENAME-RECONCILIATION). Deliver ONE complete candidate in the first Worker Hop; subject must contain WI-WFC-BETA1-BP4-LIFECYCLE-CONTROLLER-001 and the actual Hop ID. No Git writes by the agent.

    Reviewer (Opus High, fresh, adversarial): evaluate the ENTIRE resulting product against the baseline and this task: engine/controller boundary (no second reducer/Finding/review logic, no engine change), each matrix case reproduced by an actual test that fails against a mutation of the guarded behavior, the launch-uncertainty rules (no claim stronger than proved), lock inheritance with real processes, legacy status path, import direction, BP4b independence (the lock query, `classified` record and `ext.*` records suffice for preservation without changing any BP4a transition). A reproduced explicit acceptance violation is blocking regardless of presumed risk. `finding_authority: [resolve]` does not authorize residual transitions: report non-blocking observations in the review artifact and summary only. Coordinator full task-check is mandatory and not replaceable by agent-side tests.
  acceptance: |
    Each case below is covered by a test asserting its expected journal transition and safety invariant. (1) authorization refused / no TTY without --yes: refused_unauthorized, HEAD/index/worktree/journal root unchanged, no provider; (2) digest drift between plan and authorization: refused before any commit; (3) pre-launch check fails (executable, dirty tree, moved HEAD, journal root not disjoint, existing state root, active lifecycle): refused_prelaunch, no commit, no provider; (4) baseline probe fails/times out/unresolvable: refused_probe, no Commission commit, "no provider ran"; (5) probe mutates the tree: refused, paths reported, tree not cleaned, no commit; (6) crash before Commission commit: resume commits exactly once; (7) crash after commit before journal record: resume adopts only a matching commit, otherwise refuses, never a second commit; (8) crash after commissioned before launch_intent: resume continues with no recommit; (9) launch_intent without spawned/failed record: uncertain_launch, resume refuses and spawns nothing even with free lock and absent state root; (9b) synchronously observed spawn failure: launch_failed_no_engine, bounded relaunch (max 3 attempts, each journaled), never after any ambiguity; (10) launch_intent with lock held: engine_active, poll only, no spawn; (11) controller killed while the real engine child runs: lock still held, resume reports engine_active, no second engine, no second state root; (11b) launch_spawned, lock free, state root absent: engine_exited_before_state, no relaunch; (12) engine killed mid-Hop: lock free, non-terminal run.json/dispatch marker: interrupted, not relaunched, not called completed, repository untouched by the controller; (13) state/journal contradiction or unexpected state root: inconsistent, refuse, no effect; (14) each recorded terminal status classified from run.json with its documented exit code; summary-file existence alone never proves completion; (15) executable sha256 or package identity changed after authorization: refused before any effect; (16) concurrent lifecycle on the same checkout refused at once, first lifecycle untouched; (17) resume after classified is a no-op; an ext.* record after classified is accepted as opaque and ignored; (18) torn final journal record ignored, mid-journal corruption refused; (19) legacy `wfc status --state-root` and bare-flag preflight behave as before, new status dispatched only without --state-root, `wfc plan` still runs no project command; (20) journal root identity stable across symlinked paths, distinct across checkouts, root inside the repository refused. Also: a scripted `--yes` run with a fake provider reaches a classified outcome with no further prompt; the existing suite and the architecture import-direction guard pass; independent review with no blocking Findings; Coordinator full task-check passes; completed Run.
  withheld_authority: No candidate preservation (BP4b), no BP6 archive/report integration, no `wfc stop`, subreaper, supervising host or process-tree supervision, no same-Run Hop recovery,
    automatic continuation, lineage or successor logic, no engine change, no change to reducer, Finding, review, routing, adapter, admit_parsed, git_facts trusted_commit or
    bounded_path_commit, no local evidence destination, no operator-manual or backlog edits,
    no test weakening, no global Git configuration change, no historical Run or Evidence edit, no extra Commission, Runtime promotion,
    push, merge or rebase.
  escalation_default: Escalate a genuine need for new authority or design, any conflict between DG-3 Variant B and a required mechanism, any launch situation whose outcome cannot be
    proved by journal plus filesystem facts (refuse and ask, never invent an exactly-once guarantee), or inability to meet the matrix with the engine unchanged.
