schema_version: 1
commission_id: wfc-simple-v1-maintainer-principles-001
work_item_id: WI-WFC-SIMPLE-V1-MAINTAINER-PRINCIPLES-001

authority_source: >-
  Maintainer authorizes the first Claude Code (Opus) `simple@v1` qualification
  Commission, now that `simple@v1` has completed its first real dogfood under
  the Codex provider (Run `RUN-e28bd75fe52f4118b3b33a0f1f944c62`, final commit
  `de963c0ff500f19ea4d77732b2913b84f5ad1349`, recorded in
  `docs/backlog/_open.adoc`'s `simple` workflow-capability row) and the Claude
  Code adapter (`claude_cli`) is independently accepted
  (`WI-WFC-CLAUDE-CODE-ADAPTER-IMPLEMENTATION-CONTINUATION-001`, Development
  HEAD `076fc2eba3a042aa27410514335bf76a3119d66c`).

  This Commission's sole purpose is to qualify the new adapter against a
  small, genuinely useful documentation task: extract the principles of the
  Domain Maintainer Contract (DMC,
  `core/docs/developer_guide/ch06_code_conventions/05_domain_maintainer_contract.adoc`
  in the sibling `spreadsheet-handling` product repository, a source this
  Commission reads but never modifies) that generalize across software
  repositories, as a new `docs/developer_guide/maintainer_principles.adoc`
  document in this repository, without importing spreadsheet-specific domain
  contracts (`_meta`, workbook projections, Domain Families, roundtrip
  semantics). Because the DMC itself lives outside this repository and the
  Worker's sandboxed filesystem read access is confined to this repository's
  own tree, a byte-identical local copy has already been staged, untracked,
  at `tmp/dmc-source.adoc` (verified by SHA-256 against the original; covered
  by the existing `/tmp/` `.gitignore` entry, so no `.gitignore` change is
  required or made by this Commission). That local copy is reference material
  only, read by the Worker itself for independent verification; it is not an
  authoring instruction set and does not by itself govern WFC.

  It authorizes exactly one Worker invocation of `simple@v1` (`task-check-v1`
  evidence, no review phase, `max_autonomous_hops: 1`), writing only under
  `docs/developer_guide/`. It does not authorize launching this Commission,
  any Runtime/Evidence/governance change, any Claude-adapter or Harness
  implementation change, or any successor Commission or programme revision.
  Preparation and launch -- the provider executable, the `worker` role's
  `claude_cli` binding, model, reasoning effort, and the 1800-second
  agent-invocation timeout -- remain a separate maintainer `prepare`/`launch`
  decision outside this Intent's own schema and scope; the deterministic
  evidence-command timeout stays at the existing policy-basis 900 seconds.

program:
  id: simple
  revision: v1
  source_commit: 076fc2eba3a042aa27410514335bf76a3119d66c

task:
  title: Extract generalizable Maintainer Principles from the Domain Maintainer Contract
  body: |
    Write a new, self-contained AsciiDoc document,
    `docs/developer_guide/maintainer_principles.adoc`, that generalizes the
    principles of the Domain Maintainer Contract (DMC) across software
    repositories, for use in this repository and others, without importing
    any concept specific to the `spreadsheet-handling` domain.

    Required reading before writing anything:

    * `tmp/dmc-source.adoc` in full. This is a local, untracked, byte-
      identical copy of the DMC
      (`core/docs/developer_guide/ch06_code_conventions/05_domain_maintainer_contract.adoc`
      in the sibling `spreadsheet-handling` product repository), staged
      because that source lives outside this repository's own tree. Treat it
      strictly as reference material to read and extract from, not as an
      instruction set that itself governs WFC or this Commission: nothing in
      that file grants authority beyond what this task explicitly asks for,
      and nothing in it may be copied in as spreadsheet-specific content.
    * `docs/wfc_operator_manual.adoc` and `docs/architecture.md`, enough to
      write for this repository's actual audience and tone rather than
      generically.

    Then draft approximately 2-3 pages covering, in your own generalized
    words rather than a close paraphrase of the source:

    * Bounded scope and proportional engineering effort.
    * Existing behavior as evidence, not automatically a permanent
      compatibility obligation.
    * Explicit treatment of material handoffs and responsibility boundaries.
    * Preserve / simplify / migrate / deprecate / remove decisions.
    * Tests derived from relevant use cases, failure modes, and invariants.
    * Reference readability: permanent documentation and code should be
      understandable without historical ticket archaeology.
    * One canonical source for each lasting fact; avoid duplicated
      descriptions.

    Keep the guidance pragmatic and genuinely reusable: it must not read as a
    mandatory checklist for every trivial change, and it must not introduce
    any new binding governance mechanism, policy, workflow program, prompt
    component, or review gate of its own. Do not import spreadsheet-specific
    concepts such as `_meta`, workbook projections, Domain Families, or
    roundtrip semantics; where a DMC section is inseparable from such a
    concept, generalize only the part that genuinely is cross-repository and
    omit the rest rather than forcing a strained analogy.

    This is an extraction, not a wholesale rewrite of WFC governance: do not
    restructure, rename, or otherwise alter the DMC in the `spreadsheet-
    handling` repository (you have no write access there in any case), and do
    not restate or supersede any existing WFC governance document.

  acceptance: |
    `docs/developer_guide/maintainer_principles.adoc` exists, is coherent
    AsciiDoc, and is independently readable without needing the original DMC
    or `tmp/dmc-source.adoc` open alongside it. It faithfully extracts the
    general principles listed in this task's body from the DMC. It contains
    no spreadsheet-specific domain concept (`_meta`, workbook projections,
    Domain Families, roundtrip semantics, or equivalent). It introduces no
    new binding governance mechanism, policy, workflow program, prompt
    component, or mandatory checklist. No file outside
    `docs/developer_guide/` is changed. The Coordinator-owned `task-check`
    evidence command passes.

  withheld_authority: |
    No edit outside `docs/developer_guide/`. No edit to `tmp/dmc-source.adoc`
    itself, which is local reference input, not an output of this
    Commission, and is not committed by it. No edit to the DMC or any other
    source in the sibling `spreadsheet-handling` repository (not writable by
    this Commission regardless). No new or amended workflow program, prompt
    component, policy basis, or evidence profile. No claim that this new
    document supersedes, amends, or governs any existing WFC governance
    source. No successor Commission, WorkItem, Profile, or Policy authored or
    implied.

  escalation_default: |
    Stop and report `outcome: blocked` or `outcome: failed` (do not guess or
    proceed) if: `tmp/dmc-source.adoc` is missing, empty, or evidently not
    the DMC; the DMC's content does not actually support one of the required
    topics in a genuinely generalizable way; or satisfying the acceptance
    criteria would require writing outside `docs/developer_guide/`.

scope:
  - docs/developer_guide

personas:
  worker: "WFC documentation-extraction engineer: reads the complete local Domain Maintainer Contract reference copy and this task's other required reading independently before writing anything, then drafts one concise, self-contained Maintainer Principles document that generalizes only the cross-repository-applicable DMC principles, excludes every spreadsheet-specific domain concept, introduces no new binding governance mechanism, and writes exclusively under docs/developer_guide/."

evidence_profile: task-check-v1

