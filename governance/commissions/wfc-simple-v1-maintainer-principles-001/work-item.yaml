authority_source: 'Maintainer authorizes the first Claude Code (Opus) `simple@v1`
  qualification Commission, now that `simple@v1` has completed its first real dogfood
  under the Codex provider (Run `RUN-e28bd75fe52f4118b3b33a0f1f944c62`, final commit
  `de963c0ff500f19ea4d77732b2913b84f5ad1349`, recorded in `docs/backlog/_open.adoc`''s
  `simple` workflow-capability row) and the Claude Code adapter (`claude_cli`) is
  independently accepted (`WI-WFC-CLAUDE-CODE-ADAPTER-IMPLEMENTATION-CONTINUATION-001`,
  Development HEAD `076fc2eba3a042aa27410514335bf76a3119d66c`).

  This Commission''s sole purpose is to qualify the new adapter against a small, genuinely
  useful documentation task: extract the principles of the Domain Maintainer Contract
  (DMC, `core/docs/developer_guide/ch06_code_conventions/05_domain_maintainer_contract.adoc`
  in the sibling `spreadsheet-handling` product repository, a source this Commission
  reads but never modifies) that generalize across software repositories, as a new
  `docs/developer_guide/maintainer_principles.adoc` document in this repository, without
  importing spreadsheet-specific domain contracts (`_meta`, workbook projections,
  Domain Families, roundtrip semantics). Because the DMC itself lives outside this
  repository and the Worker''s sandboxed filesystem read access is confined to this
  repository''s own tree, a byte-identical local copy has already been staged, untracked,
  at `tmp/dmc-source.adoc` (verified by SHA-256 against the original; covered by the
  existing `/tmp/` `.gitignore` entry, so no `.gitignore` change is required or made
  by this Commission). That local copy is reference material only, read by the Worker
  itself for independent verification; it is not an authoring instruction set and
  does not by itself govern WFC.

  It authorizes exactly one Worker invocation of `simple@v1` (`task-check-v1` evidence,
  no review phase, `max_autonomous_hops: 1`), writing only under `docs/developer_guide/`.
  It does not authorize launching this Commission, any Runtime/Evidence/governance
  change, any Claude-adapter or Harness implementation change, or any successor Commission
  or programme revision. Preparation and launch -- the provider executable, the `worker`
  role''s `claude_cli` binding, model, reasoning effort, and the 1800-second agent-invocation
  timeout -- remain a separate maintainer `prepare`/`launch` decision outside this
  Intent''s own schema and scope; the deterministic evidence-command timeout stays
  at the existing policy-basis 900 seconds.'
