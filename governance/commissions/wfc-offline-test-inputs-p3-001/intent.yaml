task:
  title: P3 real-install coverage and offline qualification
  body: 'Implement P3 of docs/warm_storage/concepts/wfc_offline_test_infrastructure_implementation_plan_001.adoc. The
    plan is READ-ONLY REFERENCE and must not be edited. Read the versioned P1 profile/fixture inventory/handoff and P2
    result docs/warm_storage/concepts/wfc_offline_test_inputs_p2_handoff.adoc, implementation and independent review.
    Verify actual predecessor outcomes and archives insofar as the sandbox permits; operator has verified P1 and P2 completed
    and archived as stated in authority. P2 real Claude worker and independent reviewer each verified pinned staged wheels
    and performed real local WFC isolated PEP-517 installs with explicit exec-controlled pip configuration under unchanged
    sandbox. The Coordinator task-check passed with inherited explicit bundle/profile. Literal VAR=x shell assignment
    was denied in Claude but exec child config worked. P2 did not establish actual network denial or P3 timing. Original
    wheelhouse remains untouched, use the operator-staged build/wfc/offline-p2-staged after independent verification
    against committed profile. P1–P2 qualify Linux x86-64/CPython 3.13 only; ARM not qualified. Product boundary C/P4
    separate.


    Implement P3 as bounded test/packaging development work only. Add genuine isolated sdist and wheel builds, build
    wheel from sdist, clean fresh wheel installation into a separate venv from a clean exported local WFC source (avoid
    stale ignored build/lib noted by P2), check packaged resources/CLI and installed imports from outside checkout with
    source overrides cleared and isolated interpreter; ensure mutation/missing resources/source-import leakage fails.
    Retain real PEP-517 build isolation and dependency resolution; no --no-deps or --no-build-isolation shortcuts. Preserve
    existing tests and add mechanical guard proving the required real prepare/install node IDs are selected AND ran successfully:
    demonstrate that disabling one makes the guard fail, account for collection count/skips; no silent deselection or
    skip. Keep all six real prepare scenarios and actual pinned-runtime checks intact; no blanket stubbing. Include negative
    missing build dependency, missing transitive, corruption, unexpected artifact, incompatible toolchain/profile and
    hostile pip settings; validate explicit errors and no fallback or cache. P2 tool fixes only if required by concrete
    P3 findings and remain narrowly scoped with tests; no product source or change of policy.


    Add provider-free non-Python consumer scenario at today''s real raw engine/evidence admission seam: disposable Git
    repository with text and shell check, no Python project, actual literal production evidence runner in repository
    cwd with supplied sh; fake provider if needed. Do not use legacy self-development Harness prepare on consumer or
    claim unimplemented Beta-1 lifecycle/compiler or generic dependency manager. Consumer stack neutrality remains a
    product requirement, not a claim of product readiness.


    QUALIFICATION IS MANDATORY and must be empirical: from fresh HOME/cache and separately supplied verified bundle,
    exercise prepare and launch with explicit configuration and real tests. Perform three COMPLETE required-suite runs
    on the reference host, each less than 450 seconds, with all required tests and counts/skip/deselection/time, while
    outbound network is demonstrably unavailable via an EXISTING permitted isolation facility. Record exact commands/context,
    host/interpreter/profile, timing, network-denial proof (e.g. valid negative network probes), full output references,
    selected required node guard and independent result. PIP_NO_INDEX alone does not prove network denial. Avoid any
    unauthorized sandbox/network change or new security privilege: existing ability to restrict outbound network is allowed,
    no broadening permission. Differentiate this agent shell, host/Coordinator and actual paths; no agent claim replaces
    Coordinator trusted task-check. The three timed runs must be full required suite without partial mode. If real denied-network
    execution or three acceptable measurements cannot be performed under existing permissions, record concrete blocker
    and actual evidence and return blocked with no CommitIntent; do not claim qualification. Do not alter Runtime, evidence
    policy or safety constraints to make tests pass. Document if current environment makes a test impossible, do not
    mark unavailable tests as passed.


    Verify actual Codex sandbox access/use of staged profile through fresh venv real isolated install, and ensure P2
    actual Claude evidence is carried forward without repeating fictitious claims. Record qualified dependency/artifact
    provenance, time, negative tests, offline proof and limitations in docs/warm_storage/concepts/wfc_offline_test_inputs_p3_handoff.adoc
    for operator and BUG disposition. Update developer guide only for accurate P3 test guidance. No Operator Manual normative
    changes. BUG closure remains maintainer/operator step after all closure criteria, never infer from local P3 alone.
    Original wheelhouse remains available until full acceptance. P1–P2 source artifacts and implementation plan are read-only
    except narrowly justified P2 input verification fixes; no historical evidence mutation.


    Independent reviewer must adversarially test source import leakage, clean build and missing resources, real selected/executed
    node guard and mutation, actual network-denied context versus no-index, timing/skip counts, negative cases, neutral
    consumer scope, exact predecessors and security boundaries. Do not merely repeat worker''s installations or rely
    on untrusted declarations. Normal Coordinator task-check separately required. Conventional CommitIntent subject includes
    WI-WFC-OFFLINE-TEST-INPUTS-P3-001 and Hop ID as separate tokens, exact changed leaf paths; no agent Git commits.
    Blocked results contain no CommitIntent. No provider substitution or scope expansion.'
  acceptance: Independently reviewed real clean sdist/wheel/installation and no-source-import tests; non-Python consumer
    at real evidence seam; meaningful required-real-node execution guard; controlled negative cases; actual Codex and
    prior Claude qualification; three complete suite measurements each under 450 s with verified denied outbound networking
    and reported counts on reference profile; Coordinator task-check passes and versioned handoff is honest.
  withheld_authority: Plan, Runtime/product source, adapters, security/network grants, general dependency declarations,
    governance/evidence policy and normative Operator Manual remain unchanged. No new rights, new commission, ARM qualification,
    Beta-1 C/P4 implementation, promotion or push. Do not alter original wheelhouse or historical evidence.
  escalation_default: Stop on genuine inability to qualify actual denied networking, required timing or test coverage
    or on security/architecture/authority conflict; report exact evidence and no CommitIntent if blocked. No model substitution.
