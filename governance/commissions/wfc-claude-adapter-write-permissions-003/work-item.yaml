work_item_id: WI-WFC-CLAUDE-ADAPTER-WRITE-PERMISSIONS-003
authority_source: 'Maintainer directly authorizes Commission authoring (render + commit
  + `commission check`), deterministic preparation through `prepare`, and `launch`
  for a bounded `robust@v1` correction for the live permission mismatch recorded in
  `docs/backlog/BUG-WFC-CLAUDE-ADAPTER-WRITE-PERMISSION-MISMATCH.adoc`. Role bindings
  are `worker=codex_cli:gpt-6.1-terra:high` and `independent_reviewer=codex_cli:gpt-6.1-sol:high`;
  both model/reasoning combinations are verified present in the local Codex model
  catalog (`~/.codex/models_cache.json`) before this Intent is rendered. `max_autonomous_hops:
  10` stays within the unchanged hard Coordinator ceiling of 20 (`DEC-WFC-007`/`DEC-WFC-008`)
  and is not itself a governance change. This authorization covers Commission authoring,
  deterministic preparation, and launch; it is not authorization to implement the
  fix directly outside a WFC-dispatched Hop, to resume or relaunch any predecessor
  Run, to perform a nested authenticated Claude smoke, to change any governance limit,
  to promote Runtime, or to push.

  Baseline verified against Git immediately before writing this Intent: Development
  `HEAD` is `36089fbf00778d20d7a42428362d62f909ae1527` ("docs(architecture): generalize
  provider-containment disclaimer; clarify self-development Commission authoring");
  the working tree is clean. Runtime (`workflow-coordinator-runtime`) `HEAD` is `5cf0fe1a3687e74834586e27fb9473ad543f80f9`,
  unchanged since the bug record and since both predecessor Commissions below. Evidence
  (`workflow-coordinator-run-evidence`) `HEAD` is `95c65df18faf97dc09b260997f95e79111d1b070`.
  Every `source_commit` in this Intent pins the verified current Development `HEAD`
  above.

  Bug record used: `docs/backlog/BUG-WFC-CLAUDE-ADAPTER-WRITE-PERMISSION-MISMATCH.adoc`.
  It documents two live qualification attempts under Commission `wfc-simple-v1-maintainer-principles-001`
  against Claude Code CLI `2.1.270` and Runtime commit `5cf0fe1a`: the first, `wfc-claude-opus-simple-20261102-01`,
  failed before agent execution on a since-resolved missing-`socat` local dependency
  and is not this record''s subject; the second, `wfc-claude-opus-simple-20261102-02`,
  ran successfully at the provider-transport level (CLI exit 0, a valid correlated
  structured result, no timeout, `task-check` passing, no Git change) but had `Write`
  to the WFC-authorized, not-yet-existing `docs/developer_guide/maintainer_principles.adoc`
  and `Bash mkdir -p docs/developer_guide` both denied by the Claude Code CLI''s own
  permission layer, with no interactive approval surface, inside the exact scope (`docs/developer_guide`)
  that Commission `wfc-simple-v1-maintainer-principles-001`''s rendered `profile.yaml`
  explicitly authorized. WFC''s own scope/Finding mechanics behaved correctly throughout.
  The bug record''s two recorded mechanism hypotheses, both still unconfirmed by any
  reproducing authenticated test, remain: (1) permission-mode override under `CLAUDE_CODE_SUBPROCESS_ENV_SCRUB=1`
  forcing the CLI''s interactive-default permission mode back on despite `--permission-mode
  acceptEdits`, with `--permission-prompts none` then converting every resulting ask
  into an outright denial; and (2) the generated settings JSON (`ClaudeCliAdapter._settings`)
  defining no write-scope-equivalent field at all, independent of permission mode.

  Directly relevant prior-attempt provenance (this Intent''s primary reason for existing,
  read in full before anything else): two predecessor Commissions were already authored
  and committed for this same bug and neither produced any Git change.

  `wfc-claude-adapter-write-permissions-001` (committed `841a1a6`..`bbc303c14d03241cd0f3a2f6240098ed49a7691a`)
  was prepared and launched as `RUN-dcdf990244dd4e9cba19e40dea2d2400`. Its single
  Hop (`H001`, `implement`, worker) made no Git change and stopped `awaiting_human`
  on a `mechanical_preemption:human_authority:prerequisite` semantic stop, asking
  whether a separately scoped, authenticated real-Claude integration qualification
  could be authorized, since the adapter''s own request exposes only the repository
  root and a repository-root write grant could not, at that time, be reconciled with
  the bug record''s phase-scope invariant. That mandate explicitly withheld authority
  for exactly that live authenticated invocation, so the stop was the mandate operating
  as designed, not a defect.

  `wfc-claude-adapter-write-permissions-002` (committed `1897ab6a12c1169bbd4ec1dfaf9257fcecfd78a8`)
  narrowed the predecessor by additionally authorizing side-effect-free `claude --version`/`--help`
  introspection, to let the Worker resolve the same question without re-asking it.
  It was prepared and launched as `RUN-878fbc45e9454cef93cccea7423475ee` (archived
  evidence: `workflow-coordinator-run-evidence/archive/unclassified/wfc-claude-adapter-write-permissions-002-20261104-01`).
  Its single Hop (`H001`, `implement`, worker) again made no Git change and stopped
  `awaiting_human` on a `mechanical_preemption:human_authority:semantic_authority`
  stop, with the recorded `human_question`: "The bug''s security invariant requires
  provider writes to remain within the phase-authorized scope, while the task also
  permits a write setting bounded by the repository root. `AgentExecutionRequest`
  carries no phase paths, so the adapter cannot distinguish a narrower phase scope.
  Should the provider-side boundary be permitted at the repository root with WFC''s
  post-Hop scope validation enforcing the narrower scope, or should a separately scoped
  change supply phase paths?" -- again a correct, well-reasoned stop under that Commission''s
  own mandate, not a defect.

  Both predecessor Runs, their Git history, and their `awaiting_human` state are left
  untouched, unreplayed, and unrelaunched by this Intent. Per `run-recovery-and-salvage.adoc`''s
  outcome taxonomy, no uncommitted candidate work exists to salvage from either (both
  worktrees were clean throughout), so this is fresh Commission authoring against
  the same bug record, not a same-Run resume or a SuccessorProvenance continuation
  of either H001.

  The exact question `wfc-claude-adapter-write-permissions-002`''s Run stopped on
  is now resolved by committed maintainer documentation, not by this Intent''s own
  judgment: commit `36089fbf00778d20d7a42428362d62f909ae1527` ("docs(architecture):
  generalize provider-containment disclaimer; clarify self-development Commission
  authoring") generalizes `docs/architecture.md`''s containment disclaimer, states
  that WFC''s present core responsibility is repository-acceptance integrity (its
  own post-Hop Git/filesystem/scope observation), that this is distinct from execution-environment
  containment, that WFC does not require a provider sandbox to preventively enforce
  a phase''s `authorized_scope` -- the Coordinator''s own post-Hop observation is
  the authoritative enforcement of that scope -- and that a WFC-owned, provider-independent
  execution-isolation layer (a future bubblewrap-based layer) is a possible future
  direction tracked by `docs/backlog/FTR-WFC-EXECUTION-TRUST-BOUNDARIES.adoc`, not
  current V1 functionality and explicitly **not part of this Commission''s repair**.
  The same commit adds a Commission-authoring section to `docs/self-development.adoc`
  requiring a self-development Commission to distinguish executing (Runtime) authority,
  Development payload, and future architectural intent, and requiring any stated security
  requirement to name its enforcement layer (the provider''s own sandbox/permission
  request -- operational, provider-owned, not Coordinator-verified, `DEC-WFC-009`
  -- or WFC''s own deterministic post-Hop Git/scope observation -- Coordinator-owned,
  authoritative). This Intent''s own task below is authored to that requirement, and
  answers predecessor Run `RUN-878fbc45e9454cef93cccea7423475ee`''s `human_question`
  directly: the provider-side write boundary may be permitted at the resolved repository
  root (matching the existing `sandbox.filesystem.allowRead` grant already scoped
  there), because WFC''s own post-Hop Git/scope observation, not the provider''s permission
  profile, is the authoritative enforcement of the Commission''s actual (narrower)
  `authorized_scope`. The Worker must not re-ask this question; it must instead implement
  against this resolved answer, or escalate only if a genuinely new consideration
  -- not already covered by this resolution -- is found.

  This Commission additionally authorizes two deliverables neither predecessor Commission
  was scoped to reach, both to be done only after the diagnosis and code-level correction
  below are established: (a) correcting the specific misleading scope wording in `docs/backlog/BUG-WFC-CLAUDE-ADAPTER-WRITE-PERMISSION-MISMATCH.adoc`
  itself -- its "Acceptance criteria" and "Classification" sections currently read
  as if no correction for this bug may ever be considered acceptable without a prior
  real, authenticated Claude Code integration test, which both conflates the provider''s
  operational permission layer with WFC''s own authoritative security boundary (contrary
  to the clarification above) and contradicts the fact that a bounded, evidence-based
  correction is independently commissionable now, as this very Commission demonstrates;
  and (b) documenting the adapter''s actual behavior and this investigation''s findings
  in a new provider-adapter section of `docs/technical_model/workflow_program_architecture.adoc`,
  without changing that document''s existing `draft`/`exploratory` classification
  in `docs/README.adoc`''s authority index.'
