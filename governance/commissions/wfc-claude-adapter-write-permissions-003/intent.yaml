task:
  title: Diagnose and correct the Claude Code adapter's write-permission mismatch; correct the BUG record's misleading acceptance wording; document findings in the Technical Model (successor to H001/H001's two prerequisite/semantic-authority stops)
  body: |
    Diagnose, then correct, the gap recorded in
    `docs/backlog/BUG-WFC-CLAUDE-ADAPTER-WRITE-PERMISSION-MISMATCH.adoc`:
    a live, noninteractive Claude Code worker process could not perform a
    `Write` or a directory-creating `Bash mkdir -p` inside the exact scope
    (`docs/developer_guide`) its WFC Commission profile authorized
    (`authorized_actions: [edit, commit]`), with both operations denied by
    the Claude Code CLI's own permission layer and no approval surface
    available to resolve either denial. WFC's own scope/Finding mechanics
    are not the defect; `ClaudeCliAdapter`'s effective permission
    configuration is. Beyond the code fix, this Commission also corrects
    the bug record's own misleading acceptance wording and documents the
    investigation in the Technical Model. Do all three in that order:
    diagnosis and correction first, then the BUG-record wording fix, then
    the Technical Model documentation -- each later step cites the
    established facts from the step before it.

    ### Predecessor attempts -- read before anything else

    Two predecessor Commissions for this exact bug were already launched
    and both made no Git change:

    - `wfc-claude-adapter-write-permissions-001`
      (`RUN-dcdf990244dd4e9cba19e40dea2d2400`): single Hop, stopped
      `awaiting_human` asking whether a separately scoped authenticated
      real-Claude integration qualification could be authorized. That
      mandate withheld authority for exactly that invocation; the stop was
      correct, not a defect. Do not re-ask this question; it is not
      authorized by this Commission either (see "Note on provider
      invocation" below).
    - `wfc-claude-adapter-write-permissions-002`
      (`RUN-878fbc45e9454cef93cccea7423475ee`): single Hop, stopped
      `awaiting_human` asking whether the provider-side write boundary may
      be permitted at the repository root (with WFC's post-Hop scope
      validation enforcing the narrower phase scope) or whether a
      separately scoped change must supply phase paths through
      `AgentExecutionRequest`. That question is now answered by committed
      maintainer documentation -- see "Resolved semantic question" below.
      Do not re-ask it.

    Neither predecessor Run is to be resumed, replayed, or relaunched by
    this Commission. Both remain untouched, exactly as WFC left them.

    ### Resolved semantic question (read before Mandate step 2)

    Commit `36089fbf00778d20d7a42428362d62f909ae1527`
    ("docs(architecture): generalize provider-containment disclaimer;
    clarify self-development Commission authoring") resolves predecessor
    Run `RUN-878fbc45e9454cef93cccea7423475ee`'s `human_question` directly:
    `docs/architecture.md` now states that WFC's present core
    responsibility is repository-acceptance integrity -- its own post-Hop
    Git/filesystem/scope observation -- which is distinct from
    execution-environment containment; that WFC does not require a
    provider sandbox to preventively enforce a phase's `authorized_scope`;
    and that the Coordinator's own post-Hop observation is the
    authoritative enforcement of that scope. Treat this as settled,
    committed authority, not an open question: a corrected
    `ClaudeCliAdapter` write-scope-equivalent setting bounded at the
    resolved repository root (`request.repository`, the only path field
    the adapter already receives) is an acceptable provider-side
    boundary, exactly matching the existing `sandbox.filesystem.allowRead`
    grant's own scope. WFC's separate, unchanged post-Hop Git/scope
    observation remains the authoritative check that the Commission's own
    (narrower) `authorized_scope` was actually respected; the provider
    setting only needs to make the authorized operation possible, never to
    define or widen what WFC itself will later accept. A WFC-owned,
    provider-independent execution-isolation layer (a possible future
    bubblewrap-based layer; see
    `docs/backlog/FTR-WFC-EXECUTION-TRUST-BOUNDARIES.adoc`) is explicitly
    **not current V1 functionality and not part of this Commission's
    repair** -- do not design, implement, or gesture toward it.

    ### Note on provider invocation

    This Commission's normal WFC-managed dispatch of the `worker` and
    `independent_reviewer` roles as authenticated Codex CLI invocations,
    under the maintainer's separately authorized `prepare`/`launch`, is
    expected and is exactly what this Commission exists to have executed
    -- it is not prohibited by anything below. What is prohibited
    everywhere below is a *nested or independently initiated* live,
    authenticated provider invocation that an agent triggers on its own
    from inside a Hop -- in particular, opening a real authenticated
    `claude` (or any other provider) session to probe permission behavior
    against real content or "test" the fix, outside WFC's own dispatch
    mechanics. Every later reference in this task to "no authenticated
    Claude/Codex CLI invocation" means exactly that nested/independent
    case, never the Worker's or reviewer's own ordinary operation as the
    WFC-dispatched Codex invocation executing this Commission.

    ### Note on CLI introspection

    Distinct from the prohibition above, this Commission explicitly
    authorizes running the already-installed `claude` executable's own
    self-describing, side-effect-free surface as ordinary investigation
    evidence -- for example `claude --version` and `claude --help` (and
    any subcommand's `--help` text) -- to check the adapter's assumed flag
    and environment-variable contract against what the installed CLI
    itself documents. This never opens a session, never reads or writes
    repository or user content, never authenticates, and never exercises
    the permission engine against real content. Network access is not
    authorized in this Hop's sandbox; if `--help`/`--version` output and
    the already-cited accepted design sources do not suffice to confirm
    official documented behavior, say so explicitly in the durable review
    artifact rather than fetching external documentation.

    ### Required reading

    Read, in full, before changing anything:

    - `docs/backlog/BUG-WFC-CLAUDE-ADAPTER-WRITE-PERMISSION-MISMATCH.adoc`
      in its entirety. Do not re-derive what it already records as
      verified fact; do verify its two mechanism hypotheses independently
      rather than assuming either.
    - `src/workflow_coordinator/claude_adapter.py` in full -- `argv`
      (`--restricted --safe-mode --strict-mcp-config`, `--permission-mode
      acceptEdits --permission-prompts none`), `_settings`
      (`sandbox.filesystem.allowRead`/`denyRead`, `permissions.deny`,
      `blockReadsOutsideWorkingDirectories`, and the absence of any
      write-scope-equivalent field), and `execute`
      (`CLAUDE_CODE_SUBPROCESS_ENV_SCRUB=1` in the child environment).
    - `src/workflow_coordinator/adapter.py` (`AgentExecutionRequest`,
      `AgentExecutionOutcome`, `AgentExecutionPort`) -- read-only context;
      not in this Commission's scope. `AgentExecutionRequest` carries only
      `repository` (the whole checkout root), never an explicit per-phase
      authorized-path list; per "Resolved semantic question" above, this
      is accepted, not a gap to close.
    - `tests/unit/test_claude_adapter_conformance.py` in full -- it is
      exclusively a deterministic fake-executable suite; no test in it
      invokes a real `claude` binary.
    - `governance/commissions/wfc-simple-v1-maintainer-principles-001/profile.yaml`
      and `work-item.yaml`, to see the exact `authorized_scope`/
      `authorized_actions` grant the live attempt's denial contradicted.
    - `governance/commissions/wfc-claude-adapter-write-permissions-001/`
      and `governance/commissions/wfc-claude-adapter-write-permissions-002/`
      (`intent.yaml`, `work-item.yaml`, `profile.yaml`) -- both
      predecessor Commissions' exact mandates and their H001 stops, as
      summarized above.
    - `docs/architecture.md`'s generalized containment-disclaimer
      paragraph and `docs/self-development.adoc`'s "Commission authoring:
      Runtime authority, Development payload, and enforcement layer"
      section (both added by commit `36089fbf00778d20d7a42428362d62f909ae1527`).
    - `docs/warm_storage/concepts/workflow_coordinator_claude_code_adapter_design_2026-11-01.adoc`,
      sections 3 ("Permissions and filesystem"), 4.1, 6, and 9 (decision
      3: widening the provider-side capability request requires
      maintainer approval, "do not solve it with ambient allow rules,
      `excludedCommands`, or an unsandboxed retry") -- the accepted design
      this correction must stay inside.
    - `docs/warm_storage/concepts/workflow_coordinator_claude_code_adapter_implementation_continuation_2026-11-01_broad_review.adoc`,
      which independently accepted the current implementation while
      explicitly noting no authenticated provider was invoked.
    - `docs/technical_model/workflow_program_architecture.adoc` in full,
      and its classification (`draft`/`exploratory`, non-authorizing) in
      `docs/README.adoc`'s authority index, before adding the new section
      described in Mandate step 6.

    ### Mandate

    1. Establish the actual causal mechanism before writing any fix, using
       code-level inspection, the installed `claude` executable's own
       `--version`/`--help` introspection (see "Note on CLI introspection"
       above), and deterministic testing. Distinguish, with concrete
       reasoning or a reproducing deterministic test: (a) whether
       `CLAUDE_CODE_SUBPROCESS_ENV_SCRUB=1` causes the CLI to fall back to
       its interactive-default permission mode despite `--permission-mode
       acceptEdits`, as the first qualification attempt's own warning
       text ("Permission mode forced to default —
       CLAUDE_CODE_SUBPROCESS_ENV_SCRUB is set") literally reported, and
       whether `--permission-prompts none` then converts every resulting
       ask into an outright denial for both `Write` and `Bash`; and (b)
       whether the generated settings JSON's complete absence of any
       write-scope/`allowWrite`-equivalent field is an independent gap
       regardless of permission mode. Record which mechanism(s) are
       confirmed, which are ruled out, and the evidence for each. Do not
       merely restate the bug record's hypotheses as a conclusion.
    2. Per "Resolved semantic question" above, implement the correction
       entirely inside `claude_adapter.py`'s own `argv`/`_settings`/
       environment construction, scoping any new write-permission grant
       to `request.repository` (never narrower, never wider -- the adapter
       has no narrower phase-scope information to grant, and repository
       root is now the settled, documented boundary). Do not add a
       per-phase authorized-path field to `AgentExecutionRequest` and do
       not touch `operator.py`; if investigation nonetheless concludes
       this is genuinely unavoidable, stop and escalate per
       `escalation_default` instead of implementing it.
    3. Implement the narrowest correction the investigation in (1)-(2)
       actually establishes, exclusively within
       `src/workflow_coordinator/claude_adapter.py`. The correction must
       preserve every security invariant
       `BUG-WFC-CLAUDE-ADAPTER-WRITE-PERMISSION-MISMATCH.adoc`'s own
       "Security invariant" section lists verbatim: no
       `--dangerously-skip-permissions`, `--permission-mode
       bypassPermissions`, or other blanket bypass; no widening of
       `sandbox.filesystem.allowRead` beyond the resolved repository root,
       and no `allowWrite`-equivalent broader than the resolved repository
       root; no removing `CLAUDE_CODE_SUBPROCESS_ENV_SCRUB=1` without the
       investigation in (1) having actually established that doing so is
       the correct and sufficient mechanism, and without separately
       reconfirming the scrubbed-environment authentication behavior the
       accepted design already required (design section 4.1); and no
       falling back to Codex's coarser `--sandbox workspace-write` model.
    4. Do not nest or independently trigger an authenticated `claude` CLI
       process (or any other provider process) from inside a Hop. This
       does not concern, and does not prohibit, (i) the Worker's or
       reviewer's own ordinary operation as the normal WFC-dispatched
       Codex invocation executing this Commission, or (ii) the
       side-effect-free `claude --version`/`--help` introspection this
       Commission separately authorizes above.
    5. Add focused, deterministic fake-executable regression tests to
       `tests/unit/test_claude_adapter_conformance.py` for exactly the
       diagnosed mechanism, at minimum: the resulting `argv` and generated
       settings JSON after correction, proving the specific
       permission-mode/prompts/settings/environment combination that
       fixes the denial and that no unrelated flag, scope, or sandbox
       setting was widened; and a negative case proving the corrected
       configuration still does not grant `allowRead`/write access, or any
       flag, beyond the resolved repository root. Extend, do not replace,
       the existing positive/negative cases -- every one of them must
       still pass unmodified in intent.
    6. Only after (1)-(5) are complete and the full evidence command
       passes, correct
       `docs/backlog/BUG-WFC-CLAUDE-ADAPTER-WRITE-PERMISSION-MISMATCH.adoc`'s
       misleading scope wording. Specifically: its "Classification" and
       "Acceptance criteria" sections currently read as though no
       correction for this bug may ever be considered acceptable without
       a prior real, authenticated Claude Code integration test. Correct
       this to name the enforcement layer explicitly, per
       `self-development.adoc`'s new Commission-authoring requirement:
       state plainly that WFC's own post-Hop Git/scope observation is the
       authoritative, Coordinator-verified boundary, that the provider's
       permission layer is an operational safeguard against accidental
       denial of authorized operations (not a Coordinator-verified
       security perimeter), and that a bounded, evidence-based correction
       (code inspection, CLI introspection, deterministic tests) is
       independently acceptable now -- as this very Commission
       demonstrates -- while a separately authorized, maintainer-run real
       authenticated Claude Code integration test remains a valuable,
       non-blocking confirmation step before the live issue is described
       anywhere as *conclusively* resolved. Update the record's "Status"
       and "Lifecycle" sections to state that a bounded correction has
       been committed under `WI-WFC-CLAUDE-ADAPTER-WRITE-PERMISSIONS-003`,
       citing this Commission and its outcome; do not close or mark the
       bug itself resolved if the live authenticated confirmation remains
       outstanding -- say exactly what is and is not established. Do not
       weaken, remove, or relax any substantive security invariant listed
       in that section; only correct the acceptance-gating wording and
       the status/lifecycle facts.
    7. Only after (6), add a new section to
       `docs/technical_model/workflow_program_architecture.adoc`
       documenting the Claude adapter's actual effective-permission
       behavior and this investigation's findings: the diagnosed
       mechanism from (1), the correction from (2)-(3), the resolved
       enforcement-layer question from "Resolved semantic question" above
       (citing `docs/architecture.md` and `docs/self-development.adoc`),
       and the qualification boundary from Mandate step 5 (what the
       deterministic tests prove and do not prove). Add this as its own
       numbered or titled section consistent with the document's existing
       structure (do not rewrite or renumber existing sections); do not
       change the document's `draft`/`exploratory` classification in
       `docs/README.adoc`'s authority index, and do not edit
       `docs/README.adoc` itself. State explicitly in the new section that
       it documents current, verified adapter behavior and a closed
       investigation, distinct from the document's own open architectural
       questions elsewhere.

    ### Scope

    - `src/workflow_coordinator/claude_adapter.py`: the only production
      source file this correction may change. Do not touch
      `codex_adapter.py`, `adapter.py`, `operator.py`, `serialization.py`,
      `model.py`, `reducer.py`, or `scripts/wfc_op.py` -- if the
      investigation concludes any of these must change, stop and escalate
      instead (see `escalation_default`).
    - `tests/unit/test_claude_adapter_conformance.py`: add focused,
      deterministic regression tests for the diagnosed mechanism; do not
      weaken or remove any existing assertion.
    - `docs/backlog/BUG-WFC-CLAUDE-ADAPTER-WRITE-PERMISSION-MISMATCH.adoc`:
      correct only the acceptance-gating wording and the status/lifecycle
      facts, per Mandate step 6; do not touch any other section's
      substance.
    - `docs/technical_model/workflow_program_architecture.adoc`: add one
      new section per Mandate step 7; do not change any existing section
      or the document's authority classification.
    - The two durable review artifacts this Commission's rendered
      `robust@v1` profile designates for `broad_review` and
      `focused_review`, newly named and distinct from either predecessor
      Commission's review artifacts.

    Do not change any file outside this list. In particular, do not
    pre-create `docs/developer_guide/` or otherwise work around the
    symptom outside the adapter; do not disable sandboxing globally; do
    not permit unsandboxed command execution; do not weaken WFC's own
    trusted Git/scope validation; do not introduce a generic
    provider-capability or permissions framework; and do not design or
    implement any part of a WFC-owned bubblewrap execution-isolation
    layer (`FTR-WFC-EXECUTION-TRUST-BOUNDARIES.adoc`) -- that remains
    future, non-current, and entirely outside this Commission.

    ### Required semantics

    - Every existing Claude structured-output, transport, and
      error-handling behavior (`_candidate_from_wrapper`, timeout
      handling, nonzero-exit handling, diagnostics) is preserved unchanged
      in intent; only the permission-mode/prompts/settings/environment
      construction that causes the diagnosed denial may change.
    - `sandbox.enabled`, `failIfUnavailable`, `allowUnsandboxedCommands:
      false`, the empty `network.allowedDomains`, and the `~/`-read deny
      rule are unchanged unless the established mechanism specifically
      requires a narrowly scoped change to one of them -- in which case
      the Worker must explicitly justify that specific change against this
      exact invariant in its `commit_intent` rationale and the durable
      review artifact, not merely make it silently.
    - `Invocation`/`AgentExecutionRequest`/`AgentExecutionOutcome` and
      `validated_result`'s exact correlation and semantic-validation
      behavior are unchanged for both providers.
    - The Codex adapter and its existing conformance/smoke tests are
      untouched and must still pass unmodified in intent -- this
      correction is Claude-adapter-only.

    ### Required tests and qualification boundary

    Per the bug record's own "Explicit limitation" section, the
    deterministic fake-executable tests from Mandate step 5, and this
    Commission's own unauthenticated `claude --help`/`--version`
    introspection, can only prove what configuration `ClaudeCliAdapter`
    now generates and what the installed CLI documents about itself;
    neither can by itself prove that a real, authenticated Claude Code CLI
    process actually grants the authorized write and directory-creation
    operations, or that it still correctly denies operations outside the
    authorized repository root. State this boundary explicitly in the
    durable review artifact and in the BUG-record correction from Mandate
    step 6, distinguishing deterministic implementation acceptance (this
    Commission's own deliverable) from the separately authorized,
    maintainer-run real-Claude smoke that remains valuable future
    confirmation and is explicitly **not authorized by this Commission**:
    do not claim the live issue is conclusively resolved in either the
    review artifact's or the BUG record's own wording.

    ### Independent review mandate

    A fresh independent reviewer must assess the complete corrected
    `claude_adapter.py` and its tests, the BUG-record correction, and the
    new Technical Model section for: whether the Worker actually
    established the causal mechanism with concrete evidence rather than
    merely asserting a plausible-sounding one; whether the chosen
    correction is the narrowest one the established mechanism supports and
    stays scoped to the resolved repository root; whether every named
    security invariant from the bug record still holds; whether the
    deterministic tests actually exercise the diagnosed mechanism rather
    than being tautological; whether any CLI introspection used stayed
    strictly within the side-effect-free, unauthenticated surface this
    Commission authorizes; whether the BUG-record correction actually
    names the enforcement layer and removes the misleading acceptance
    gating without weakening any substantive security invariant or
    falsely claiming conclusive resolution; and whether the new Technical
    Model section accurately documents the investigation without
    changing the document's authority classification. Use normal Robust
    correction and rereview routing; disposition any Finding using only
    the authority this Commission's rendered profile actually grants. A
    successful broad review may accept directly; focused review is needed
    only if that phase is reached.

  acceptance: |
    The durable review artifact(s) record a concrete, evidence-based
    causal diagnosis of the write-permission denial -- not a restatement
    of the bug record's unconfirmed hypotheses as fact, and not a repeat
    of either predecessor Commission's prerequisite or semantic-authority
    stop -- distinguishing which of the two recorded mechanisms (or
    another independently found) is actually responsible, using code
    inspection, the installed CLI's own `--help`/`--version` introspection,
    and/or deterministic tests. `src/workflow_coordinator/claude_adapter.py`
    is the only production source file changed, and the change is the
    narrowest one the established diagnosis supports, scoped to the
    resolved repository root per "Resolved semantic question." Every
    security invariant named in
    `BUG-WFC-CLAUDE-ADAPTER-WRITE-PERMISSION-MISMATCH.adoc`'s "Security
    invariant" section holds. `AgentExecutionRequest`, `operator.py`,
    `model.py`, `reducer.py`, and the workflow-program/profile schema are
    all unchanged -- unless the Worker instead stopped and escalated per
    `escalation_default` because a cross-layer change was genuinely
    required, in which case this Commission's acceptance is that clean,
    well-reasoned escalation, not an implementation.
    `tests/unit/test_claude_adapter_conformance.py` contains new
    deterministic regression tests that exercise the diagnosed mechanism
    and prove no unintended widening, and every existing test in that file
    and in the Codex conformance/smoke suites still passes unmodified in
    intent. `docs/backlog/BUG-WFC-CLAUDE-ADAPTER-WRITE-PERMISSION-MISMATCH.adoc`
    no longer states or implies that a correction for this bug requires a
    prior real authenticated Claude Code integration test, correctly names
    the enforcement layer for its security invariants, and accurately
