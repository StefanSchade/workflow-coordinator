task:
  title: Extract reusable parsed admission with unchanged preflight behavior
  body: 'Implement only BP2a from docs/backlog/beta1_execution_plan.adoc and docs/backlog/beta1_productization.adoc.
    Inspect the complete current operator._preflight, its inputs, side effects, ordering and all helper dependencies,
    the existing operator tests and docs/backlog/BUG-WFC-SELF-DEVELOPMENT-GATE-FINDING-AUTHORITY.adoc before changing
    code. The latter is a profile-level Finding-authority issue: do not alter completion guards or claim it fixed.


    Extract the existing admission logic to a separately callable `operator.admit_parsed` entry so later BP2b can
    reuse the actual parsed-input admission rather than duplicate it. Keep the diff minimal and the function boundaries
    practical; no framework or new schema. `_preflight` must continue accepting and rejecting the same inputs and
    return the same results, perform all security checks in the same observable order, maintain error messages/classification
    and existing side effects, and preserve pinned governing input/path provenance, repository/HEAD/clean-tree/state-root
    checks, role and binding validation, normalized scope, policy/action ceiling, artifact and component authority,
    A1, evidence disposition, evidence command preparation, environment and timeout semantics. Preserve the existing
    operator''s public invocation and callers. A new reusable function must have a truthful, explicit input contract
    for already parsed inputs and the required contextual data; it must not be represented as authorizing inputs
    or provenance it did not check. Avoid reordering checks across parsing or hidden weakening when calling through
    `_preflight`. No compiler, execution binding redesign, new policy semantics, provider, reducer, archive, runtime
    or Workflow Program changes.


    Before any implementation edits, run `python3 scripts/wfc_test_inputs.py exec --profile cp313-linux-x86_64 --bundle
    build/wfc/offline-p2-staged -- .venv/bin/python -m pytest --wfc-partial tests/unit/test_operator.py -q -rA`
    if available in the worker environment, or the same selected test suite with documented verified offline inputs
    and interpreter. The operator independently ran that exact selection before Commission creation at Development
    `13ab1a5d79358c9ada1b0b4bc6b1c5407e8f00be` on 2026-11-18: exit 0; 106 PASSED test node IDs, no failures or skips;
    its full log SHA-256 `264563e068262e49c7b8fc437e0e1f27a799896d70c67bc246efc3e6d96c9f2b`. The committed `baseline-test-operator.txt`
    in this Commission lists the 106 node IDs. That observation is operator-supplied baseline evidence, not a Coordinator
    task-check and not a replacement for your own comparable checks. If the worker''s execution sandbox cannot run
    a case, document the exact failure and proceed with other checks without changing the normal full-suite guard;
    do not invent results.


    After extraction, run the same existing operator tests with the same selection and inputs; compare pass/fail/skip
    by test node ID with the committed baseline and report both before/after findings, not just overall counts.
    Keep all pre-existing operator tests and their assertions unchanged. Add only necessary focused tests for the
    new entry in a separate scoped test module, including direct reuse of parsed admission, validation ordering
    and failure propagation where the existing suite does not establish them. Do not modify baseline tests to make
    them pass. Coordinator separately runs the full required task-check after publication. Use existing verified
    offline bundle where available; no package-index access, weakening or deselection of required suite. If a genuine
    missing prerequisite prevents the baseline comparison, report exactly what could not be established; do not
    manufacture acceptance.


    Update the epic''s BP2a implementation milestone only if useful and only to the extent actually reached; do
    not mark independent acceptance or product closure on the worker''s claim. Do not start BP2b. CommitIntent lists
    exactly changed repository-relative leaf paths and uses a Conventional Commit subject with WI-WFC-BETA1-BP2-ADMISSION-EXTRACTION-001
    and the actual Hop ID as distinct tokens; no agent-owned Git writes. Review artifact paths are reserved to review
    phases.


    The fresh independent broad reviewer checks actual before/after source and complete relevant control flow, not
    just candidate summary: verify unchanged order, exceptions, messages, validation/authority, path/policy/evidence/preflight
    side effects and return semantics; inspect real parsed entry contract and ensure it admits no unsupported trust
    claim. Compare all existing test_operator.py node IDs and outcomes against the committed before baseline and
    run/inspect comparable post-extraction evidence, examine focused tests for real gaps, ensure no original test
    assertions removed, no unrelated abstraction or BP2b work, no changes to completion/Finding authority. Observe
    Coordinator task-check independently. Report only material evidence-backed blocking Findings; route corrections
    and focused review normally under robust@v1. `gpt-6.1-terra:high` for both roles is an explicit maintainer choice,
    not a reduction of review standards.'
  acceptance: A minimal reusable operator.admit_parsed extraction with unchanged _preflight admission order, outputs,
    rejection semantics, error classification and side effects; all 106 existing operator regression cases compared
    before/after with equivalent passing results; necessary direct-entry tests; independent broad review accepted
    without blocking Findings and Coordinator full task-check passed. No BP2b or semantic change.
  withheld_authority: No compiler, schema, execution-binding redesign, provider, adapter, reducer, archive, runtime,
    program or governance changes; no weakening or deletion of existing operator tests; no BP2b, additional Commission,
    live provider qualification, push, merge, rebase, Runtime promotion or agent Git writes. Review artifacts reserved
    to review phases.
  escalation_default: Escalate only a real scope/authority conflict or missing prerequisite; incomplete work alone
    is not blocked.
