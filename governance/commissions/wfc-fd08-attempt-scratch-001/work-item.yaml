authority_source: 'Maintainer directly authorizes, by explicit 2026-11-05 interactive
  instruction given outside ordinary WFC execution, Commission authoring, rendering,
  committing, `commission check`, preparation, and launch of the bounded implementation
  of FD-08 ("Launcher Scratch Management"). This instruction explicitly authorizes
  launch (not merely authoring/commit, as prior self-development Commissions in this
  repository have sometimes been scoped), subject to all required preflight and authority
  checks passing; if any hard preflight or authority condition fails, preparation/launch
  stops and the blocker is reported rather than bypassed.

  Controlling design baseline: the accepted FD-08 investigation, docs/cold_storage/backlog/pre-0.1.0b1/front-door/workflow_coordinator_fd08_scratch_investigation_2026-10-30.adoc
  (status: "Investigation and bounded implementation recommendation only"; static
  source inspection at commit 5c558452dd1c2f9811cc2e35ebc7dabda352d860). Its own investigation
  Commission, governance/commissions/wfc-fd08-scratch-investigation-001, explicitly
  withheld implementation authority ("Preparing or launching the resulting Attempt,
  invoking a provider, and implementing FD-08 are not authorized by this Commission
  and remain reserved to a separate, explicit maintainer decision"). This Commission
  is that separate, explicit maintainer decision. FD-08 itself remains recorded only
  as a candidate requirement in the Front Door Level 0 plan (docs/warm_storage/concepts/workflow_coordinator_front_door_priority_and_profile_commission_boundary_plan_2026-10-26.adoc,
  §9, "FD-08 is recorded here only as a candidate requirement; nothing in this section
  authorizes its implementation") until this Commission''s authorization.

  Motivating incident: the 2026-10-28/29 `/tmp` tmpfs-exhaustion incident (docs/cold_storage/backlog/pre-0.1.0b1/infrastructure-and-incidents/2026-10-28_tmpfs_exhaustion.adoc),
  which interrupted Run `RUN-c358b544417c4a33a0d040a0d8c38656` at its sixth Hop: `git_facts.observe_repository()`''s
  default `tempfile.mkstemp()` index copy received `ENOSPC` because the ambient `/tmp`
  tmpfs was full (5.7 GiB tmpfs, 528,603 files in retained pytest session directories),
  while the persistent root filesystem had over 400 GiB free. The Run correctly stopped
  `reconcile_required`; that fail-closed behavior is not itself a defect and is not
  reopened by this Commission. The distinct, test-infrastructure-side `BUG-WFC-PYTEST-TEMP-RESOURCE-EXHAUSTION`
  (docs/backlog/BUG-WFC-PYTEST-TEMP-RESOURCE-EXHAUSTION.adoc, disposition LATER) remains
  open and explicitly out of this Commission''s scope; FD-08 addresses only where
  the Harness/Coordinator/agent/evidence chain stages scratch, never pytest retention,
  fixture behavior, or any cleanup of historical `/tmp` material.

  Hop-ceiling note: `max_autonomous_hops: 10` is set directly at the `repository-standard@v1`
  policy basis''s own ceiling (no override attempted or required), consistent with
  both the maintainer''s current standing guidance (docs/self-development.adoc, "Commission
  Hop budget") to prefer a generous provisional ceiling over the happy-path estimate,
  and this Commission''s own explicit instruction to use the standard bounded 10-Hop
  budget.

  Operational precaution recorded, not authorized as FD-08 implementation itself:
  before preparing/launching this Commission''s own Attempt, the operator inspected
  `/tmp` (tmpfs, 12 GiB, ~20% used, ample free inodes) and the persistent filesystem
  backing `$HOME` (`/dev/sda1`, 468 GB, ~8% used, 412 GB free) and found no immediate
  exhaustion risk, but the pre-FD-08 `wfc-op` launcher cannot yet guarantee that an
  exported `TMPDIR`/`TMP`/`TEMP` in the preparing shell reaches `launch.sh`''s descendants
  other than by ordinary process-environment inheritance through `subprocess.run(("bash",
  str(launch_sh)))` (no `env=` override currently exists in `cmd_launch()`). Where
  such an ambient-inheritance workaround is used for this Attempt''s own preparation/launch,
  it is recorded as a narrow operational workaround in this Attempt''s own records,
  never represented as the FD-08 implementation this WorkItem produces.'
