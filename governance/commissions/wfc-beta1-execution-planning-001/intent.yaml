task:
  title: Produce an independently reviewed, implementation-ready Beta-1 execution plan
  body: 'Produce docs/backlog/beta1_execution_plan.adoc and minimally link it from docs/backlog/_open.adoc and docs/backlog/beta1_productization.adoc.
    Planning and documentation only. _open remains sole current priority/readiness authority; the epic remains the
    BP1–BP9 source map. The plan recommends Commissions and grants no future execution authority.


    Read docs/backlog/README.adoc, _open.adoc, beta1_productization.adoc and its three referenced Beta-1 reviews;
    the complete docs/operator_manual/operator_manual.adoc with included chapters; relevant architecture, Commission
    contracts and controlling BUG/FTRs. Inspect real source, tests, packaging and the existing sibling workflow-coordinator-run-evidence
    archiver read-only as needed for feasible work packages. Distinguish actual evidence, accepted work, proposals
    and remaining integration. No exhaustive historical inventory. Treat the 2026-11-18 maintainer decisions in
    the epic and execution-boundary FTR and Claude BUG as controlling, including simple@v1 and robust@v1 only; frozen
    common repository guidance; separate business Commission and execution bindings; practical preservation without
    full recovery; nullable provider usage preference; separate Git Evidence default with local option; Claude operational
    evidence and remaining specific positive qualification; provider-independent preventive boundary integration/qualification
    post Beta 1; no mandatory comprehensive supervisor/subreaper. Do not invent repeated Claude qualifications.


    Define a concrete ordered set of independently reviewable implementation Commissions using BP1–BP9, not a new
    feasibility phase. For each give stable ID, title, BP, goal and deliverable, likely modules/paths, excluded
    scope, prerequisites and predecessor IDs, controlling BUG/FTR where applicable, measurable acceptance and relevant
    tests/evidence, risks and real decision gates. Use existing work and tests; do not recommission accepted fixes.
    State critical path, parallel work, integration points, actual release gates and explicit post-Beta items. Group
    into sequential batches of approximately three with starting prerequisites, internal order, expected state,
    objective autonomous-continuation conditions and concrete stops for genuine maintainer decisions; no batch grants
    new authority or automatically promotes Runtime/pushes. Decisions needing a maintainer must include alternatives,
    recommendation and latest decision point. Make bounded technical recommendations where supported. Include release
    acceptance and definition of done, accounting for required independent review, Coordinator evidence, archive
    and distinct maintainer product acceptance. Later orchestrators should be able to author each WFC Commission
    with little additional design. Keep introductory prose short; avoid speculative gates, artificially narrow scopes,
    impossible evidence, circular prerequisites or required successor chains.


    Inspect and cite the existing archive implementation and tests, state what is verified versus inaccessible,
    and avoid making access to outside sources a hidden prerequisite. Report material uncertainties honestly; do
    not stop simply because some later implementation details are open if an actionable bounded recommendation is
    possible. No implementation, live provider tests, runtime modification or additional Commissions. Check AsciiDoc
    rendering and relevant links as available, and diff hygiene; report limitations. Do not run full suite merely
    for prose; Coordinator task-check is separate. CommitIntent lists actual changed repository-relative leaves
    only, once each, with a Conventional Commit subject containing WI-WFC-BETA1-EXECUTION-PLANNING-001 and the actual
    Hop ID as separate tokens. Do not make Git commits. Review artifact paths are reserved to review phases.


    Fresh independent broad reviewer inspects the actual complete plan, source and representative code/tests and
    archive, not just worker claims. Check practical decomposition and ordering, concrete acceptance and testability,
    every BP coverage, batch continuation/stops, provenance of existing accepted work, true release gates vs preferences,
    current Claude and post-Beta boundary decisions, preserved authority separation and no artificial governance
    chain. Check plan''s first three executable Commissions and actionable genuine decision deadlines. Open blocking
    Findings only for material gaps; corrections and focused review follow the configured robust program, then fresh
    broad review. Do not invent blocking requirements or merely polish prose.'
  acceptance: A source-grounded implementation-ready Beta-1 execution plan with concrete Commission specifications,
    dependencies, pragmatic batches and release acceptance, linked from the backlog and epic; independently accepted
    broad review with no open blocking Findings and passing Coordinator task-check. No product implementation.
  withheld_authority: No product code, tests, scripts, runtime, program, policy or adapter changes; no live provider
    tests beyond this Run, additional Commission, successor, promotion, push, branch merge or agent Git writes.
    No edits outside scoped backlog plan/navigation and designated review artifacts. No change to historic reviews,
    Evidence repository or operator manual.
  escalation_default: Escalate only a concrete authority conflict or genuinely necessary maintainer decision; incomplete
    work alone is not blocked.
