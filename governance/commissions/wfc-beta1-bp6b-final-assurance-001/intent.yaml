task:
  title: Verify and independently accept the BP6b evidence-retention candidate
  body: |
    This is one new robust@v1 Commission; it does not resume or mutate historical RUN-18a6ae0575fd4641ba89e30bf468f7ec (awaiting_human at Hop 5, Evidence 78ab3a3). That Run stopped mechanically (`invalid_finding_delta`: a Worker reported a Finding `resolve` operation, which only an independent reviewer may perform) after its Worker had corrected the last open documentation Finding F003 in commit 5465890. The candidate on HEAD is the product of BP6b: commits 9bd356f (implementation), bbad81f (correction of F001/F002), 5465890 (F003 documentation) on top of the baseline 9ebb6d5. The historical reviews (e3bba06 broad, fb30678 focused) are evidence leads, not acceptance credit: do not claim a trusted predecessor acceptance. Do not implement BP6b from scratch.

    Governing text for the product: the BP6b Commission task and acceptance of the historical Run (governance/commissions/wfc-beta1-bp6b-evidence-retention-001/intent.yaml, its 15 acceptance cases and hard rules), BP6 in docs/backlog/beta1_execution_plan.adoc and docs/backlog/beta1_productization.adoc, and the BP5/BP6a limitations records. Recorded decisions: raw retention `local` (default) | `commit` | `discard`; `raw_retention=None` keeps today's bytes and behavior exactly; one commit per Attempt containing audit.json; no push, no remote; the Evidence target is a configurable archive destination, never a second Run-state store.

    Worker: independently inspect the ENTIRE resulting BP6b product diff `git diff 9ebb6d5..HEAD -- src tests docs/developer_guide docs/warm_storage/concepts/wfc_beta1_bp6b_evidence_retention_001_limitations.adoc`, run the BP6b and neighbouring tests and the full suite, and re-verify with real Git in disposable repositories: for each retention mode what `git ls-files` and the complete object history (`git rev-list --objects --all`, every blob) contain, absence of the known private strings in `local` and `discard` history, one commit per Attempt, idempotent re-archive, crash resume per mode, tamper refusal, missing/insufficient `.gitignore` refusal in `local`, `raw_retention=None` byte-identical to the baseline, `wfc init` Evidence-repository creation (no remote, one initial commit, reuse of a valid repository, refusal of a foreign directory, payload modified only by the Consumer Config), config defaults/validation, `wfc report <attempt-dir>` exit 3 on a guard refusal and the fixed next-choice line for every RunStatus and lifecycle classification. Never use the real Evidence repository (use disposable ones); never weaken a test. Correct only a demonstrable material defect inside the authorized BP6b scope; do not add features.

    Create the worker-verification artifact `docs/warm_storage/concepts/wfc_beta1_bp6b_final_assurance_001_worker_verification.adoc` recording the actual commands and results, the diff basis, the per-mode Git evidence, limitations, and whether any change was necessary. It is technical evidence for the independent review, never a claim of acceptance; it also gives the Coordinator a real, narrowly scoped trusted CommitIntent even if no product byte needs to change. Exact CommitIntent lists every actual modified/added/deleted leaf, never directories; avoid rename-shaped changes; no Git writes by the agent. Subject must contain WI-WFC-BETA1-BP6B-FINAL-ASSURANCE-001 and the actual Hop ID. A Worker NEVER reports a Finding operation (`resolve` or any other Finding delta that closes a Finding): only the independent reviewer opens and resolves Findings; a correction Hop reports what it changed and nothing else about Finding state.

    Independent Opus reviewer evaluates the ENTIRE resulting BP6b product against 9ebb6d5 and the acceptance cases, not just the fresh Worker diff or its verification report: reproduce each retention and privacy property with real Git, check one commit per Attempt, idempotency, crash resume, legacy `None` behavior, the limitations record (including the explicit statement that nothing is pushed), and that no file outside the authorized scope changed. A reproduced explicit acceptance violation, privacy/retention violation or crash on a plausible input is blocking; exotic inputs outside the acceptance list are non-blocking observations. `finding_authority: [resolve]` does not authorize residual transitions: report non-blocking observations in the review artifact and summary only. Follow robust correction, focused and fresh broad review where necessary. Coordinator full task-check is mandatory; worker completion or an accepting review alone never establishes Run acceptance.
  acceptance: Coordinator trusted commit for the substantive worker-verification artifact; the whole BP6b product independently reviewed against 9ebb6d5 with no blocking Findings (the 15 acceptance cases of the historical BP6b Commission re-established by tests and independent reproduction); Coordinator full task-check pass; completed Run.
  withheld_authority: No lifecycle, run or resume wiring, no change to journal.py, lifecycle.py, preservation.py or git_facts.py, no change to the audit field list or schema, no engine change, no change to reducer, Finding, review, routing, adapter or admission, no repository-local destination, no push or remote, no operator-manual or backlog edits, no test weakening, no historical Run or Evidence edit, no extra Commission, Runtime promotion, push, merge or rebase.
  escalation_default: Escalate a genuine need for new authority or design, any need to change the audit schema or lifecycle behavior, and inability to establish full BP6b acceptance; do not invent a successful Candidate.
