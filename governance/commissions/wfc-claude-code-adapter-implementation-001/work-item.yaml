authority_source: 'Maintainer directly authorizes, by explicit 2026-11-01 interactive
  instruction given outside ordinary WFC execution, Commission authoring (render +
  commit + `commission check` only, no launch) of the single coherent vertical-slice
  implementation of the accepted Claude Code CLI adapter design, docs/warm_storage/concepts/workflow_coordinator_claude_code_adapter_design_2026-11-01.adoc,
  whose independent acceptance is recorded in docs/warm_storage/concepts/workflow_coordinator_claude_code_adapter_design_closure_2026-11-01_broad_review.adoc
  (outcome accept, Run `RUN-8286350f443a425e9f848913ca62f7c9`, Invocation `INV-5293b336b01041709f4872af9cb46ee8`,
  closure HEAD `4c16884e5b2e747bd0f90e60660d7f74d02ef943`). The accepted design is
  this Commission''s controlling implementation specification; the predecessor design-review
  artifacts it cites are historical context only, not new implementation requirements.
  This Commission does not authorize launch, Runtime promotion, Evidence mutation,
  a push, or any provider invocation; it authorizes only authoring, rendering, and
  committing the governing bundle and validating it with `commission check`.

  Hop-ceiling note: the authorizing interactive instruction specified `max_autonomous_hops:
  16`, explicitly framed as deliberately exceeding the `repository-standard@v1` policy
  ceiling, with the ten-Hop figure characterized as "an emergency ceiling, not a target."
  Before rendering, this was mechanically tested against the actual deterministic
  compiler (`render_commission` in `src/workflow_coordinator/commissioning.py`), which
  unconditionally refuses any Commission Intent whose `max_autonomous_hops` exceeds
  its pinned policy basis''s own `max_autonomous_hops` (commissioning.py:412); `robust@v1`
  accepts only `repository-standard@v1` as its policy basis (commissioning.py:341-342),
  and that policy''s own `max_autonomous_hops` is fixed at `10` (governance/policy-bases/repository-standard-v1.yaml;
  commissioning.py:323). A probe render with `max_autonomous_hops: 16` against the
  real compiler was refused: "Intent hop limit exceeds the policy-basis ceiling."
  No field in the Commission Intent vocabulary overrides a policy basis''s ceiling,
  and widening that ceiling would require authoring a new policy-basis revision --
  a separate governance change with its own safety implications, out of scope for
  Commission authoring and not authorized here. Presented with this conflict, the
  maintainer confirmed rendering at the actual policy ceiling rather than modifying
  governance or compiler code to force the higher figure through. This Intent therefore
  sets `max_autonomous_hops: 10`, the maximum the current policy basis permits, not
  `16`.'
