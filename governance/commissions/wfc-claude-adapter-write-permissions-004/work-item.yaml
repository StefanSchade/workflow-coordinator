authority_source: 'Operator-session maintainer authorization (direct chat instruction)
  to author, commit, prepare, and launch one bounded `robust@v1` correction Commission
  for `docs/backlog/BUG-WFC-CLAUDE-ADAPTER-WRITE-PERMISSION-MISMATCH.adoc`, with role
  bindings `worker=codex_cli:gpt-6.1-terra:high` and `independent_reviewer=codex_cli:gpt-6.1-sol:high`
  (both verified present in the local Codex model catalog, `~/.codex/models_cache.json`).
  `max_autonomous_hops: 10` stays within the unchanged hard Coordinator ceiling of
  20 (`DEC-WFC-007`/`DEC-WFC-008`) and is not itself a governance change. This authorization
  covers Commission authoring, deterministic preparation through `prepare`, and `launch`;
  it is not authorization to implement the repair directly outside a WFC-dispatched
  Hop, to resume or relaunch any predecessor Run, to perform a nested authenticated
  Claude or Codex invocation, to change any governance limit, to promote Runtime,
  or to push.

  Baseline verified against Git immediately before writing this Intent: Development
  `HEAD` is `a6bcabba24ae07f1a2f0390a891c068ed658f2e9` ("docs(backlog): stop deterministic
  acceptance from re-requiring the withheld smoke"); the working tree is clean. Runtime
  (`workflow-coordinator-runtime`) `HEAD` is `5cf0fe1a3687e74834586e27fb9473ad543f80f9`,
  detached, clean, unchanged since the bug''s discovery. Evidence (`workflow-coordinator-run-evidence`)
  `HEAD` is `061f399949662f6e1423bbdc735ad1a3a25bce4c`, clean. Every `source_commit`
  below pins this Development HEAD.

  Three predecessor Commissions (`wfc-claude-adapter-write-permissions-001`, `-002`,
  `-003`) were already authored and launched against this exact bug record; each stopped
  `awaiting_human` at Hop 1 with zero Git change, in every case on a variant of demanding
  proof or authority that this Commission''s own granted means cannot supply while
  the one decisive instrument -- a live authenticated Claude CLI invocation -- remains
  deliberately withheld. This is now a documented, named anti-pattern (`docs/wfc_operator_manual.adoc`
  §§22.5-22.6''s "Unsatisfiable prerequisite" and "Constraint accumulation across
  successor Commissions" rows, and `docs/self-development.adoc`''s Commission-authoring
  section), using those three Attempts as its own worked case; the bug record''s own
  "Correction attempts" section already carries their full provenance. This Intent
  is authored directly against that documented guidance and the bug record''s current
  (already-corrected) two-stage acceptance criteria -- not against any predecessor
  Commission''s text as a template -- and deliberately does not restate predecessor
  provenance, mechanism hypotheses, or security-invariant text already recorded there
  in full; doing so again would itself be the "constraint accumulation" anti-pattern
  §22.5 names, under which Attempt text grew from 16.4KB to 28.1KB across the three
  predecessors while the actual deadlock went untouched.'
