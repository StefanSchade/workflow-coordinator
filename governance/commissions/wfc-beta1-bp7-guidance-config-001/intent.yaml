task:
  title: Commit the self-development Consumer Config and the repository-policy guidance document
  body: |
    Implement C1 of docs/backlog/beta1_bp7_cutover_plan.adoc (read sections `config-recommendation`, `gap-analysis` (guidance row), `sequence` C1 and `open-decisions` first). Deliver exactly:

    1. `.wfc/config.yaml` at the repository root, schema exactly as accepted by `frontdoor/config.py:consumer_config_from_yaml`: `schema_version: 1`, `repository_name: workflow-coordinator`, `governance_dir: .wfc/governance`, `work_item_scope_ceiling: [src, tests, scripts, docs]`, `max_autonomous_hops: 10`, `evidence: {repository: ../workflow-coordinator-run-evidence, raw: commit}` and, per the maintainer's decision, `default_execution` with exactly the bindings used for self-development today: role `worker` = adapter `claude_cli`, model `claude-sonnet-5`, reasoning `high`; role `independent_reviewer` = adapter `claude_cli`, model `claude-opus-5`, reasoning `high` (verify the accepted value syntax, role names and adapter names in config.py and use exactly what the parser accepts). No absolute home path anywhere.
    2. A new small committed `repository_policy` guidance document at `.wfc/governance/repository-policy.md` (maintainer decision: adapt it from the conventions that already exist in the Operator Manual, the Developer Guide, CLAUDE.md/docs/ai_info and the Commission conventions; invent no new standards). Content: concise, normative-for-Workers statements of existing practice only (small reviewable changes, tests accompany behavior changes and fail without the change, no test weakening, scope discipline, no agent Git writes, commit/CommitIntent rules, Finding authority basics, documentation upkeep, no secrets/absolute home paths in committed artifacts). Cite the source document of each rule by path. Keep it short (about one to two pages).
    3. A new focused unit test `tests/unit/test_self_development_consumer_config.py`: the committed `.wfc/config.yaml` parses with `consumer_config_from_yaml`; `resolve_evidence(config, repository_root)` resolves to `repository_root.parent / "workflow-coordinator-run-evidence"` with `raw == "commit"` (pure function, no Evidence filesystem access); `default_execution` carries both role bindings; the guidance file exists and is non-empty; the config text contains no absolute path (test that it has no `/home/` or leading-slash path value). Mutation-sensitive: each assertion must fail if the corresponding value changes.
    4. A short note in docs/operator_manual/ch05_self_development/01_topology_budget.adoc recording that the self-development Consumer Config `.wfc/config.yaml` and the guidance exist, that the Evidence repository stays the sibling repository (raw commit), and that the Harness remains the regular path until BP7 retirement. Do not rewrite other manual text.

    Hard rules: documentation, configuration and one new unit test only; no product code change, no `src/` edit, no change to scripts/, governance/self-development, existing tests or Commission records; no second archive path, no `.wfc/` content beyond the two files; no Run state movement. CommitIntent names every new/changed leaf individually, never directories; subject contains WI-WFC-BETA1-BP7-GUIDANCE-CONFIG-001 and the actual Hop ID. No agent Git writes. A Worker NEVER reports ANY Finding operation (`resolve`, `residual` or any other delta): only the independent reviewer opens and resolves Findings. Deliver ONE complete candidate in the first Worker Hop. Run only the new test file with the offline-input arguments the repository documents for a partial run; no full suite from the Worker (the Coordinator task-check is independent).

    Reviewer (fresh, adversarial): verify the config against the real parser and `resolve_evidence`, that no value is invented or absolute, that the guidance cites existing sources and invents no new standard, that the test is mutation-sensitive, that no product code or other file changed and that the manual note is accurate. Blocking = a violated explicit requirement, a value the parser rejects, a rule in the guidance without an existing source, or an insensitive test. `finding_authority: [resolve]` does not authorize residual transitions: report non-blocking observations only in the review artifact.
  acceptance: .wfc/config.yaml parses and resolves as specified with the two default_execution bindings; the guidance document exists, is short and source-grounded; the new test passes and is mutation-sensitive; the manual note is accurate; independently accepted with no blocking Findings and Coordinator task-check passed.
  withheld_authority: No product code, existing test, script, governance/self-development, policy or program change, no extra .wfc content, no historical Run or Evidence edit, no extra Commission, Runtime promotion, push, merge, rebase or tag.
  escalation_default: Escalate only a real scope/authority conflict or a value the parser cannot express; incomplete work alone is not blocked.
