  title: Implement P1 Codex ordinary outbound configuration
  body: 'Implement only P1 of docs/backlog/FTR-WFC-AGENT-PUBLIC-INTERNET-CAPABILITY.adoc. Inspect that record, src/workflow_coordinator/codex_adapter.py,
    relevant Codex conformance and smoke tests, adapter contracts and architecture tests, accepted Runtime and Development
    source. The November 9 product decision treats ordinary public internet as a regular development-agent capability
    without an unjustified blanket restriction. Preserve existing authority and trust boundaries.


    First identify the executable and version actually selected by the prepared Attempt, inspect its offline help
    and version-compatible installed documentation, configuration schema, implementation or other credible version-specific
    evidence. Establish that the installed CLI recognizes sandbox_workspace_write.network_access, the supported
    -c override syntax and placement in the actual invocation. The operator observed /home/stefan/.nvm/versions/node/v22.23.2/bin/codex
    version 0.167.0 and its exec help documents dotted -c overrides; generic syntax and fake-executable acceptance
    alone do not establish recognition of the specific key. Current vendor documentation is a lead, not version-specific
    proof. No authenticated network experiment, private/internal/localhost qualification, provider upgrade or managed-configuration
    changes. If version-specific interface compatibility cannot be established, report the precise blocker and do
    not guess or publish an unsupported implementation.


    Make the smallest supported adapter correction, expected -c sandbox_workspace_write.network_access=true, emitted
    exactly once. Preserve --sandbox workspace-write, --ask-for-approval never, explicit model and reasoning binding,
    ephemeral execution, cwd, input/output/result correlation, environment passing, Git and Coordinator evidence
    boundaries. Do not add schemas, permissions, proxies, host networking or new authorization paths. This is a
    configuration request, not proof of live network connectivity.


    Extend relevant existing conformance/fake-transport tests to check exact unique syntax and placement, sandbox
    and approval, model/reasoning, cwd and input/output, existing environment discipline and successful and failed
    results. Run affected Codex tests and relevant architecture regressions without live network. In the existing
    FTR and only if needed _open.adoc record actual implementation and precise version-specific compatibility evidence
    at the publication point; do not anticipate review or Coordinator task-check, and state that P3 effective internet
    qualification remains separately authorized. Distinguish changed Development from the accepted executing Runtime;
    do not imply promotion. Render changed AsciiDoc and verify links and diff hygiene. Agent-local diagnostics are
    not Coordinator evidence.


    No agent-owned Git writes. CommitIntent must list each actually changed exact leaf once, no unchanged files;
    Conventional Commit subject includes WI-WFC-AGENT-PUBLIC-INTERNET-CODEX-P1-001 and actual Hop ID as separate
    bounded tokens. Review artifacts reserved to their review phases.


    The fresh independent broad reviewer must examine actual complete candidate and source, installed CLI compatibility
    evidence, tests and exact diff independently. Check supported and unique configuration, sandbox and approval
    boundaries, model/cwd/environment/result and Coordinator behavior, deterministic tests and real CLI interface
    evidence, absence of P2/P3 or scope expansion, and explicit distinction between recognized configuration and
    demonstrated internet. Block material defects only; apply normal robust correction/focused review and renewed
    broad review if needed.'
  acceptance: Supported version-specific Codex override emitted exactly once while preserving workspace-write and
    existing boundaries; relevant deterministic tests and source-grounded FTR updated; independent broad review
    without blocking Findings and Coordinator trusted task-check pass. Effective internet remains unqualified.
  withheld_authority: No Claude adapter, provider-neutral schemas, Workflow Programs, repository policy, Runtime,
    host firewall, shell configuration, credentials, Project Memory or persisted evidence changes. No provider upgrade,
    live authenticated public-network experiment, private/internal/localhost qualification, P2/P3, agent Git writes,
    extra Commission, push or Runtime promotion.
  escalation_default: Escalate on concrete unresolved CLI compatibility, environmental prerequisite or authority
    mismatch. Do not guess the configuration, substitute a provider, or treat downstream evidence as already passed.
