schema_version: 3
policy_id: repository-standard
revision: v1
scope:
- workflow-coordinator
governance_paths:
- governance
work_item_scope_ceiling:
- scripts/wfc_test_inputs.py
- tests/conftest.py
- tests/fixtures/offline-test-inputs
- tests/unit/test_wfc_test_inputs.py
- docs/developer_guide
- docs/warm_storage/concepts/wfc_offline_test_inputs_p2_handoff.adoc
- docs/warm_storage/concepts/wfc_offline_test_inputs_p2_001_broad_review.adoc
- docs/warm_storage/concepts/wfc_offline_test_inputs_p2_001_focused_review.adoc
max_autonomous_hops: 10
actions:
- edit
- commit
- review
