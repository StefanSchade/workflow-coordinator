schema_version: 3
policy_id: repository-standard
revision: v2
scope:
- workflow-coordinator
governance_paths:
- governance
work_item_scope_ceiling:
- scripts/wfc_doc_catalog.py
- tests/unit/test_wfc_doc_catalog.py
- Makefile
- docs/ai_info/doc_conventions.adoc
- docs/ai_info/_ai_info.adoc
- docs/README.adoc
- docs/cold_storage/README.adoc
- docs/project_memory.adoc
- docs/backlog/FTR-WFC-KNOWLEDGE-CATALOG-PILOT.adoc
- docs/warm_storage/concepts/wfc_knowledge_catalog_k1_001_broad_review.adoc
- docs/warm_storage/concepts/wfc_knowledge_catalog_k1_001_focused_review.adoc
