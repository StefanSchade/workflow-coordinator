  title: 'Implement FTR05: fold the self-development specialization'
  body: 'Implement only FTR05 as one complete Worker candidate. Read fully as read-only task references the series charter docs/backlog/operator-manual-consolidation/FTR-WFC-OPERATOR-MANUAL-CONSOLIDATION.adoc and FTR05 docs/backlog/operator-manual-consolidation/FTR-WFC-OPERATOR-MANUAL-05-SELF-DEVELOPMENT.adoc at accepted planning commit e01a4084595ff0923f4a6dbebf056e76267f2d1c, and accepted FTR04 implementation and final broad review at c9590c8144b1e56741e497c4ef897938f1fdd7e7. Follow FTR05 and all applicable charter allocation, quality, metadata, invariants, shared validation and review rules. Inspect pinned sources with read-only git show.


    Create exactly docs/operator_manual/ch05_self_development/_chapter.adoc, docs/operator_manual/ch05_self_development/01_topology_budget.adoc and docs/operator_manual/ch05_self_development/02_promotion.adoc. Modify exactly docs/self-development.adoc, docs/operator_guide/ch08_self_development.adoc, docs/wfc_operator_manual.adoc, docs/operator_guide/operator_guide.adoc, docs/operator_manual/operator_manual.adoc and docs/README.adoc. Reviewer artifacts are reserved to their phases. Preserve ch01–ch04 byte-identically, unassigned source bodies and withheld files.


    Fold topology, preparation specialization, Hop-budget guidance, enforcement-layer Commission authoring and ownership into 01_topology_budget. Fold Development salvage/promotion distinction and complete Runtime promotion runbook into 02_promotion. Merge guide summaries and OM section 15 into these canonical owners, retaining examples and all promotion target, mechanism, preconditions, postconditions and normal lifecycle. Both section files carry normative authority for the same facts as self-development; clearly label this as a specialization, not the generic consumer path. Preserve absolute Runtime executable selection, separate object stores, controlled evidence PATH, no legacy durable-artifact flag, exact accepted implementation identity and detached/clean/push-disabled pre/postconditions. Do not promote Runtime or present provider security intent as Coordinator enforcement. General budget mechanics remain in ch02; provisional self-development recommendation belongs in ch05, with no
    conflicting numeric default.


    Only after complete handover replace self-development and guide ch08 in place with navigation/compatibility-anchor-only stubs retaining all inbound anchors. Replace ch08 include in guide entry with a link; guide includes neither old chapter stub. Redirect OM section 15 preserving heading/anchor; add ch05 to entry, only extant ch01–ch05. Update authority-index and moved-path rows for both stubs atomically and remove stale ownership claims. Generic preparation and recovery reach existing owners including compatibility stubs; no future chapter target or competing canonical home.


    Re-verify topology/preparation against scripts/wfc_op.py pin_runtime, prepare_development_environment and write_launch_sh; budget against model.py and operator.py and tests/unit/test_operator.py. Promotion remains a maintainer procedure, not a Harness command. Help-only checks: do not perform prepare, launch, promotion, archive or other mutation operations. Record exact duplicate merges, corrections and actual checks/limits.


    Apply charter shared validation: snapshot predecessor headings, anchors and substance; compare assigned bodies, warnings/examples, all promotion conditions, unassigned bodies and withheld files byte-for-byte; render entry/current wrappers standalone and assembled and changed sections standalone, metadata and heading levels; resolve includes and relative links/xrefs including rendered fragments, duplicate IDs and inbound legacy anchors throughout repository text; check stub content, help/code, exact dirty leaves, no deletion/rename and committed-range diff hygiene. Scratch/output outside repository. No downloads, providers or Git writes. Local checks do not claim Coordinator evidence or reviewer acceptance.


    CommitIntent lists each actual changed normalized repository-relative leaf exactly, no directory or unchanged file; reconcile with actual dirty set. Subject is a single Conventional Commit line with WI-WFC-OPERATOR-MANUAL-SELF-DEVELOPMENT-001 and actual Hop ID as separate bounded tokens. Incomplete work alone is not blocked; blocked carries no CommitIntent.


    Independent reviewer: independently check all FTR05 and charter criteria, complete substance, all promotion conditions and specialization/security distinctions against code/tests, exact scope and preserved ch01–ch04/unassigned bodies, old anchors, links, renders, stubs and committed-range diff hygiene. Only the declared review artifact may change; append rounds for repeated review and propose leaf-exact CommitIntent with actual identities. Open blocking Findings for material defects or failed mandatory checks, not editorial preference. Follow robust correction, focused re-review and renewed fresh broad review; final acceptance requires fresh broad review without open blocking Findings. Worker and reviewer use the same model in separate fresh invocations.'
  acceptance: '1. Exactly three specified new leaves and six modified leaves; no deletion or rename; ch01–ch04 byte-identical. All 12 self-development and four guide-ch08 headings are accounted for once.

    2. Full promotion target, mechanism, preconditions, postconditions and normal lifecycle survive; both whole-document stubs have no operating procedure and old anchors resolve. No actual promotion.

    3. Guide entry includes neither legacy chapter; navigation and historical inbound anchors work. Entry includes only extant ch01–ch05; generic preparation and recovery links reach existing owners.

    4. Preserve normative specialization and all required topology/security boundaries. Budget mechanics refer to ch02; provisional self-development recommendation lives only in ch05 without a conflicting numeric default.

    5. All applicable FTR05 and charter shared validation pass: assigned substance, warnings/examples, standalone/assembled renders, metadata, includes, links and inbound fragments, preserved anchors/files, stubs, exact dirty leaves and committed-range diff hygiene; report actual checks and limits.

    6. Only declared scope changes; Coordinator trusted task-check passes and fresh independent broad review accepts without open blocking Findings.'
  withheld_authority: No FTR06–10, changes to ch01–ch04, other implementation leaves, product semantics changes, deletion or rename, source code, scripts, tests, governance, backlog FTRs, project memory, historical records, Runtime or Evidence mutations, Runtime promotion or archive operations by agents, agent Git writes, provider calls outside WFC, downloads, push, successor or extra Commission. Review artifacts belong only to their configured review phases.
  escalation_default: Escalate only for a concrete obstacle requiring authority or unresolved normative contradiction not settled by source and code. Incomplete work alone is not a blocker; continue authorized work within this invocation and report actual operational limits truthfully.
