    findings for material defects or failed mandatory checks. Follow existing robust correction, focused rereview and renewed
    fresh broad review. Acceptance requires Coordinator trusted evidence and fresh broad review without open blocking findings.
    Worker and independent reviewer use the same model in separate fresh invocations.'
