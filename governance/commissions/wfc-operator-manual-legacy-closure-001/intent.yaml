    inspection, no operational provider calls, prepare, launch, archive or recovery by agents, no downloads. Agent-local checks
    do not replace Coordinator trusted evidence.


    CommitIntent lists every actual changed normalized repository-relative leaf exactly, no directory or unchanged file; reconcile
    with actual dirty set. Subject is one Conventional Commit line with WI-WFC-OPERATOR-MANUAL-LEGACY-CLOSURE-001 and actual
    Hop ID as separate bounded tokens. Incomplete work alone is not blocked; continue authorized work within the invocation.
