task:
  title: Close BUG-WFC-PROVIDER-TRANSPORT-CANDIDATE-ACCEPTANCE and BUG-WFC-COMMISSION-SELECTED-COMPONENT-PROVENANCE
  body: |
    Both BUG records below were opened as source-inspected prerequisites for
    `simple@v1` implementation and are now resolved by the independently
    accepted `WI-WFC-SIMPLE-V1-IMPLEMENTATION-001` (Run
    `RUN-db5e75585299482d94af21df22b36eb4`, final Development HEAD
    `dd0eab2ee1ae6ed21d266438c0aa6812e8824c4f`). Close their bookkeeping only.

    Required reading before changing anything, to independently re-confirm
    the resolution rather than merely trust this task's assertion of it:

    * `docs/backlog/BUG-WFC-PROVIDER-TRANSPORT-CANDIDATE-ACCEPTANCE.adoc` and
      `docs/backlog/BUG-WFC-COMMISSION-SELECTED-COMPONENT-PROVENANCE.adoc` in
      full, as they currently stand.
    * `docs/warm_storage/concepts/workflow_coordinator_simple_v1_implementation_001_broad_review_2026-10-31.adoc`
      (the final accepted broad rereview, H005/`dd0eab2e`), especially
      section 4's implementation ledger items 2 and 4.
    * `docs/warm_storage/concepts/workflow_coordinator_simple_v1_implementation_001_focused_review_2026-10-31.adoc`
      (H004 focused rereview, `83ec2b10`).
    * The actual current production source: `src/workflow_coordinator/vertical.py`'s
      `run_one_hop` (the early `outcome.returncode`/`outcome.timed_out` guard
      immediately after `adapter.execute`, before `candidate_result` is read)
      and `src/workflow_coordinator/commissioning.py`'s `render_commission`
      selected-component comprehension (the ordered `role`, `modifiers`,
      `repository_policy` traversal feeding `sources.selected_components`).
    * The actual current committed negative regression tests naming each
      fix: `tests/unit/test_slice4.py` and `tests/unit/test_slice3_vertical.py`
      (nonzero-return-code and `timed_out=True` transport cases with a valid
      correlated candidate) and `tests/unit/test_commissioning.py` (the
      modifier-byte provenance mismatch case). Confirm these exist and pass;
      do not merely cite the review's claim that they do.

    Then, for each BUG record, in place at its existing path (do not rename
    or move the file):

    1. Update its `Status::` header line from "open (documentation only; no
       correction commissioned or implemented)" to a closed/resolved status
       consistent with this repository's existing closed-BUG convention
       (compare e.g. `docs/cold_storage/backlog/done/BUG-WFC-PROFILE-DURABLE-ARTIFACT-INSTANCE-COUPLING.adoc`'s
       `Status:: closed (accepted fix)` header and its closing
       `== Closure and accepted resolution` section for the expected shape
       and heading), adapted to this record's own facts.
    2. Add a `== Closure and accepted resolution` section (placed after the
       existing `== Lifecycle` section, which must remain) stating: the
       implementation commits (H001 `fb460bbff8fdebc52e76a3646a425fd98e1bb95b`;
       H003 correction `5ad06d424571379f4ff600d322f29dd989ea6552`) that fixed
       it; the independent acceptances (H002 broad review opening Finding F001
       `c92a50ff5c2c09b0eb0ec8ddd912e48316df9fe8`; H004 focused-rereview accept
       `83ec2b10966392af281dcd22b2cc8a25109d4880`; H005 final broad-rereview
       accept `dd0eab2ee1ae6ed21d266438c0aa6812e8824c4f`), all under
       `WI-WFC-SIMPLE-V1-IMPLEMENTATION-001` / Run
       `RUN-db5e75585299482d94af21df22b36eb4`; the exact file(s) and test(s)
       that resolve this specific record (name the actual function/test paths
       you independently confirmed above, not a generic reference); and that
       the required negative test(s) from this record's own "Required
       negative test(s)" section now exist and pass.
    3. Update the existing `== Lifecycle` section's own closing sentence
       (currently a conditional such as "It must not be marked resolved
       until a correction is designed, reviewed, implemented, and the
       negative test(s) above pass.") to state that this condition has now
       been met, with a pointer to the new closure section. Do not delete or
       rewrite any other sentence of `== Lifecycle`, or any other section
       (`== What this is not`, `== Observed current behavior`, `== Why this
       is undesirable`, `== Proposed correction`, `== Required negative
       test(s)`, `== Non-scope`, `== Evidence / provenance`): those describe
       the record's original discovery and analysis and must be preserved
       verbatim as historical investigation, not rewritten as if the fix had
       existed when they were written.

    Then update `docs/backlog/_open.adoc`, following its own existing
    conventions exactly (match the surrounding entries' field names and
    style; do not invent new fields or section shapes):

    4. Remove the two `=== BUG-WFC-PROVIDER-TRANSPORT-CANDIDATE-ACCEPTANCE`
       and `=== BUG-WFC-COMMISSION-SELECTED-COMPONENT-PROVENANCE` card
       entries from the "Current records" list: this manifest is the sole
       *active*-work view, and both are now closed, not open, work. Do not
       touch any other card in that list.
    5. In the "Level-0 MVP planning family" table's `` `simple` workflow
       capability -- MUST-HAVE for Level-0 MVP `` row, correct the now-stale
       claim "neither is resolved" (both BUG links in the "Problem and
       outcome" cell) and the "Next action and prerequisite" cell's
       "Prerequisite: the two BUG records above are resolved (or explicitly
       waived by the maintainer) and the governance-admission staging in the
       handoff note is followed" to instead state, with the concrete Run/HEAD
       reference, that both prerequisite BUGs are now resolved. Keep every
       other word of that row unchanged, including its continuing "No
       Commission is authorized by this row" caveat and its remaining
       `simple` MVP design-work scope: this task closes only the two BUG
       records' own bookkeeping, it does not authorize or claim completion
       of the `simple` MVP capability row's own remaining design/scheduling
       work.

  acceptance: |
    Both `docs/backlog/BUG-WFC-PROVIDER-TRANSPORT-CANDIDATE-ACCEPTANCE.adoc`
    and `docs/backlog/BUG-WFC-COMMISSION-SELECTED-COMPONENT-PROVENANCE.adoc`
    remain at their existing paths, carry a closed/resolved status, and each
    has a new closure section citing the actual implementation commits,
    independent-acceptance commits, and the specific existing test(s) that
    satisfy that record's own "Required negative test(s)" section, verified
    by you to actually exist and pass rather than merely asserted. Every
    other section of both records is byte-for-byte unchanged from before this
    task. `docs/backlog/_open.adoc` no longer lists either BUG as an open
    card, and its `simple` workflow capability row accurately states both
    prerequisites are resolved with the concrete Run/HEAD reference, with no
    other change to that row or any other card. `git diff --check` passes.
    The full repository test suite (Coordinator-owned `task-check`) passes
    unchanged, since no source or test file is touched.

  withheld_authority: |
    No edit to any file other than the three named above:
    `docs/backlog/BUG-WFC-PROVIDER-TRANSPORT-CANDIDATE-ACCEPTANCE.adoc`,
    `docs/backlog/BUG-WFC-COMMISSION-SELECTED-COMPONENT-PROVENANCE.adoc`, and
    `docs/backlog/_open.adoc`. No rename, move, or relocation of either BUG
    record (in particular, do not relocate either file to
    `docs/cold_storage/backlog/done/`; that housekeeping step, if ever
    wanted, is for a separately authorized Commission, not this one). No
    rewriting, deleting, or reinterpreting any existing sentence of either
    record's historical investigation sections. No edit to any other
    `docs/backlog/_open.adoc` card or table row beyond the two named in this
    task. No source, test, governance, Runtime, or Evidence change. No claim
    that the `simple` MVP workflow-capability row's own remaining
    design/scheduling work is complete, authorized, or scheduled by this
    task. No new Commission, WorkItem, Profile, or Policy authored or
    implied for any successor work.

  escalation_default: |
    Stop and report `outcome: blocked` or `outcome: failed` (do not guess or
    proceed) if: the cited implementation or review commits do not exist, or
    their content does not actually show what this task asserts; the named
    regression tests do not exist, do not pass, or do not actually exercise
    the specific defect; `docs/backlog/_open.adoc`'s existing conventions
    cannot be followed without inventing a new field or section shape; or
    closing either record would require touching any file outside this
    Commission's three-file scope.

