schema_version: 3
policy_id: repository-standard
revision: v1
scope:
- workflow-coordinator
governance_paths:
- governance
work_item_scope_ceiling:
- docs/backlog/BUG-WFC-PROVIDER-TRANSPORT-CANDIDATE-ACCEPTANCE.adoc
- docs/backlog/BUG-WFC-COMMISSION-SELECTED-COMPONENT-PROVENANCE.adoc
- docs/backlog/_open.adoc
max_autonomous_hops: 10
actions:
- edit
- commit
- review
evidence_commands:
  task-check:
    argv:
    - python
    - -m
    - pytest
    - -q
    timeout_seconds: 900
