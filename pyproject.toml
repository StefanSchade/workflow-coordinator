[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "workflow-coordinator"
version = "0.1.0"
description = "Bounded repository-native agent workflow coordination."
readme = "README.md"
requires-python = ">=3.10"
license = { file = "LICENSE" }
authors = [{ name = "Stefan Schade" }]
dependencies = ["PyYAML>=6"]

[project.optional-dependencies]
dev = ["build>=1.2", "pytest>=8.2", "pytest-cov>=5", "ruff>=0.6"]

[project.scripts]
wfc = "workflow_coordinator.operator:main"

[project.urls]
Repository = "https://github.com/StefanSchade/workflow-coordinator"
Issues = "https://github.com/StefanSchade/workflow-coordinator/issues"

[tool.setuptools]
package-dir = { "" = "src" }
include-package-data = false

[tool.setuptools.packages.find]
where = ["src"]
include = ["workflow_coordinator*"]

[tool.setuptools.package-data]
workflow_coordinator = ["resources/*.txt"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
pythonpath = ["src", "."]
markers = [
  "ftr(id): associate an imported acceptance invariant with its historical feature ticket",
  "guardrail: architecture, dependency, or semantic drift guard",
]

[tool.coverage.run]
branch = true
source = ["src/workflow_coordinator"]
omit = ["*/__init__.py"]

[tool.coverage.report]
show_missing = true
skip_covered = true

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
# Apply repository-wide correctness checks.  Style cleanup is intentionally
# bounded to the developer-ergonomics implementation until the existing
# baseline is formatted in a dedicated change.
select = ["F"]
